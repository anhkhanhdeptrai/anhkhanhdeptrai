<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:#07080d;
    color:white;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{

    position:sticky;

    top:0;

    z-index:1000;

    padding:10px 14px;

    background:rgba(7,8,13,.94);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.07);
}

.header{

    width:100%;

    max-width:1450px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:14px;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:max-content;
}


/* =========================================================
   LOGO CSS
========================================================= */

.logo{

    position:relative;

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3cff,
            #e83cff 45%,
            #ff3864
        );

    box-shadow:
        0 0 20px rgba(155,70,255,.35);

    overflow:hidden;
}


/*
    HÌNH TV TRONG LOGO
*/

.logo::before{

    content:"";

    width:20px;
    height:15px;

    border:3px solid white;

    border-radius:5px;

    position:absolute;
}


/*
    CHÂN TV
*/

.logo::after{

    content:"";

    width:10px;
    height:3px;

    background:white;

    border-radius:10px;

    position:absolute;

    bottom:7px;
}


/* =========================================================
   BRAND TEXT
========================================================= */

.brand-text{

    font-size:20px;

    font-weight:900;

    letter-spacing:.5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a970ff,
            #ff55b8,
            #ffffff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleGradient 5s linear infinite;
}

@keyframes titleGradient{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:250% center;
    }

}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{

    flex:1;

    position:relative;
}

.search-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#85899a;

    font-size:17px;

    pointer-events:none;
}

.search{

    width:100%;

    height:43px;

    padding:
        0 16px 0 44px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:14px;

    outline:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    color:white;

    font-size:14px;

    transition:.2s;
}

.search::placeholder{
    color:#737788;
}

.search:focus{

    border-color:
        rgba(151,91,255,.75);

    box-shadow:
        0 0 0 3px rgba(126,67,255,.10),
        0 0 25px rgba(126,67,255,.12);
}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:100%;

    max-width:1450px;

    margin:auto;

    padding:15px;
}


/* =========================================================
   PLAYER
========================================================= */

.player-box{

    width:100%;

    background:#000;

    border-radius:17px;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    margin-bottom:14px;
}

.video-area{

    position:relative;

    width:100%;

    background:#000;

    aspect-ratio:16 / 9;

    overflow:hidden;
}

video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;
}


/*
    ẨN CONTROL VIDEO GỐC
*/

video::-webkit-media-controls{
    display:none !important;
}

video::-webkit-media-controls-enclosure{
    display:none !important;
}


/* =========================================================
   LOADING
========================================================= */

.loading-player{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.55);

    z-index:15;

    font-size:14px;

    color:white;
}

.hidden{
    display:none !important;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info{

    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:14px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );

    opacity:0;

    transition:.25s;

    z-index:5;
}

.video-area.controls-visible
.player-info{

    opacity:1;
}

.live-title{

    font-size:14px;

    font-weight:800;

    max-width:70%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.live-badge{

    display:flex;

    align-items:center;

    gap:6px;

    padding:5px 9px;

    border-radius:20px;

    background:
        rgba(255,35,80,.18);

    border:
        1px solid rgba(255,60,100,.35);

    color:#ff6b89;

    font-size:11px;

    font-weight:800;
}

.live-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff315b;

    box-shadow:
        0 0 10px #ff315b;
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{

    position:absolute;

    width:40px;
    height:40px;

    border:0;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    background:
        rgba(15,15,20,.72);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    cursor:pointer;

    font-size:21px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s,
        transform .2s,
        background .2s;

    z-index:20;

    right:12px;
    bottom:12px;
}

.fullscreen-btn:hover{

    background:
        rgba(110,70,255,.75);

    transform:scale(1.05);
}

.video-area.controls-visible
.fullscreen-btn{

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{

    min-height:54px;

    padding:12px 15px;

    display:flex;

    align-items:center;

    gap:10px;

    background:
        linear-gradient(
            90deg,
            rgba(115,65,255,.12),
            rgba(255,50,150,.05)
        );

    border-top:
        1px solid rgba(255,255,255,.06);
}

.now-dot{

    width:8px;
    height:8px;

    flex:0 0 auto;

    border-radius:50%;

    background:#7655ff;

    box-shadow:
        0 0 12px #7655ff;
}

.now-text{

    min-width:0;

    font-size:14px;

    font-weight:800;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    display:flex;

    align-items:center;

    gap:8px;

    margin:
        5px 2px 13px;

    color:#8f94a6;

    font-size:13px;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#45e6a1;

    box-shadow:
        0 0 10px rgba(69,230,161,.7);

    flex:0 0 auto;
}


/* =========================================================
   SOURCE BOX
========================================================= */

.source-box{

    margin:
        -5px 0 14px;

    display:none;
}

.source-box select{

    width:100%;

    height:42px;

    padding:
        0 12px;

    border-radius:12px;

    background:#14141b;

    color:white;

    border:
        1px solid rgba(255,255,255,.08);

    outline:none;

    font-size:13px;
}


/* =========================================================
   CHANNEL COUNT
========================================================= */

.channel-count{

    margin:
        5px 3px 10px;

    color:#85899a;

    font-size:13px;
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap:11px;
}


/* =========================================================
   CHANNEL CARD
========================================================= */

.channel{

    min-width:0;

    padding:9px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:15px;

    cursor:pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;
}

.channel:hover{

    transform:translateY(-2px);

    border-color:
        rgba(130,85,255,.65);

    box-shadow:
        0 10px 25px rgba(0,0,0,.22);
}

.channel.active{

    border-color:#8155ff;

    background:
        linear-gradient(
            145deg,
            rgba(125,75,255,.16),
            rgba(255,60,160,.06)
        );

    box-shadow:
        0 0 20px rgba(126,77,255,.15);
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo{

    width:100%;

    height:78px;

    object-fit:contain;

    display:block;

    border-radius:10px;

    background:#0b0c11;

    margin-bottom:9px;
}

.channel-name{

    font-size:13px;

    font-weight:750;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-quality{

    color:#777c8d;

    font-size:10px;

    margin-top:4px;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading,
.error,
.empty{

    grid-column:1 / -1;

    text-align:center;

    padding:45px 20px;

    color:#85899a;
}

.error{
    color:#ff7187;
}


/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.fullscreen-viewer{

    position:fixed;

    inset:0;

    width:100vw;

    height:100dvh;

    background:#000;

    z-index:999999;

    display:none;

    overflow:hidden;

    touch-action:manipulation;
}

.fullscreen-viewer.active{
    display:block;
}

.fullscreen-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}

.fullscreen-video::-webkit-media-controls{
    display:none !important;
}

.fullscreen-video::-webkit-media-controls-enclosure{
    display:none !important;
}


/* =========================================================
   FULLSCREEN TOP
========================================================= */

.fullscreen-top{

    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:15px;

    z-index:10;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            transparent
        );

    opacity:1;

    transition:opacity .3s;

    pointer-events:none;
}

.close-fullscreen{

    width:40px;
    height:40px;

    border:0;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    background:
        rgba(15,15,20,.72);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    cursor:pointer;

    font-size:26px;

    pointer-events:auto;

    opacity:1;

    transition:.2s;
}

.close-fullscreen:hover{

    background:
        rgba(110,70,255,.75);

    transform:scale(1.05);
}

.fullscreen-viewer.controls-hidden
.fullscreen-top{

    opacity:0;

    pointer-events:none;
}

.fullscreen-viewer.controls-hidden
.close-fullscreen{

    pointer-events:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:9px 10px;
    }

    .header{
        gap:9px;
    }

    .logo{

        width:38px;
        height:38px;

        border-radius:11px;
    }

    .brand-text{
        font-size:17px;
    }

    .search{
        height:40px;

        border-radius:12px;

        padding-left:40px;

        font-size:13px;
    }

    .container{
        padding:10px;
    }

    .player-box{
        border-radius:14px;
    }

    .video-area{
        aspect-ratio:16 / 9;
    }

    .channels{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }

    .channel{

        padding:7px;

        border-radius:12px;
    }

    .channel-logo{
        height:62px;
    }

    .channel-name{
        font-size:12px;
    }

}


/* =========================================================
   FULLSCREEN PORTRAIT
========================================================= */

@media(orientation:portrait){

    .fullscreen-viewer{

        width:100vw;
        height:100dvh;
    }

    .fullscreen-video{

        width:100vw;
        height:100dvh;

        object-fit:contain;
    }

}


/* =========================================================
   FULLSCREEN LANDSCAPE
========================================================= */

@media(orientation:landscape){

    .fullscreen-viewer{

        width:100vw;
        height:100dvh;
    }

    .fullscreen-video{

        width:100vw;
        height:100dvh;

        object-fit:contain;
    }

    .fullscreen-top{

        padding:
            max(12px,env(safe-area-inset-top))
            max(12px,env(safe-area-inset-right))
            12px
            max(12px,env(safe-area-inset-left));
    }

}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:env(safe-area-inset-top)){

    .fullscreen-viewer{

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }

}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header">

        <div class="brand">

            <!-- LOGO CŨ - KHÔNG DÙNG ICON -->

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


    <!-- PLAYER -->

    <div class="player-box">

        <div
            id="videoArea"
            class="video-area"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>


            <div
                id="loadingPlayer"
                class="loading-player hidden"
            >
                Đang kết nối nguồn...
            </div>


            <!-- PLAYER INFO -->

            <div class="player-info">

                <div
                    id="playerTitle"
                    class="live-title"
                >
                    KHANH TV
                </div>


                <div class="live-badge">

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>


            <!-- FULLSCREEN -->

            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

        </div>


        <!-- NOW PLAYING -->

        <div class="now-playing">

            <span class="now-dot"></span>

            <span
                id="nowPlaying"
                class="now-text"
            >
                Chưa chọn kênh
            </span>

        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Sẵn sàng
        </span>

    </div>


    <!-- SOURCE SELECT -->

    <div
        id="sourceBox"
        class="source-box"
    >

        <select
            id="sourceSelect"
        ></select>

    </div>


    <!-- COUNT -->

    <div
        id="count"
        class="channel-count"
    >
        Đang tải danh sách...
    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải danh sách kênh...
        </div>

    </div>

</main>



<!-- =======================================================
     FULLSCREEN VIEWER
======================================================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="live-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
            aria-label="Đóng"
        >
            ×
        </button>

    </div>

</div>



<script>


/* =========================================================
   CẤU HÌNH
========================================================= */

const M3U_URL =
    "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/vn.m3u";


const LOGO_BASE =
    "https://raw.githubusercontent.com/iptv-org/iptv/master/logos/tv/";


const DEFAULT_LOGO =
    "https://dummyimage.com/300x150/111/fff&text=TV";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const fullscreenVideo =
    document.getElementById("fullscreenVideo");

const videoArea =
    document.getElementById("videoArea");

const fullscreenViewer =
    document.getElementById("fullscreenViewer");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeFullscreen =
    document.getElementById("closeFullscreen");

const channelsEl =
    document.getElementById("channels");

const countEl =
    document.getElementById("count");

const statusEl =
    document.getElementById("status");

const searchEl =
    document.getElementById("search");

const loadingPlayer =
    document.getElementById("loadingPlayer");

const sourceBox =
    document.getElementById("sourceBox");

const sourceSelect =
    document.getElementById("sourceSelect");

const nowPlaying =
    document.getElementById("nowPlaying");

const playerTitle =
    document.getElementById("playerTitle");

const fullscreenTitle =
    document.getElementById("fullscreenTitle");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let currentSourceIndex = 0;

let hls = null;

let fullscreenHls = null;

let loadTimer = null;

let errorCount = 0;

let switching = false;

let controlsTimer = null;

let fullscreenControlsTimer = null;

let wakeLock = null;


/* =========================================================
   LOGO
========================================================= */

function getLogo(tvgId){

    if(!tvgId)
        return DEFAULT_LOGO;

    let id =
        tvgId
        .replace("@HD","")
        .replace("@SD","")
        .trim();

    return LOGO_BASE + id + ".png";
}


/* =========================================================
   LOAD M3U
========================================================= */

async function loadM3U(){

    try{

        setStatus(
            "📡 Đang tải danh sách kênh..."
        );

        const response =
            await fetch(
                M3U_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        if(
            !text.includes("#EXTM3U") &&
            !text.includes("#EXTINF")
        ){

            throw new Error(
                "Dữ liệu M3U không hợp lệ"
            );

        }


        parseM3U(text);


    }catch(error){

        console.error(error);


        channelsEl.innerHTML = `

            <div class="error">

                ❌ Không tải được danh sách kênh

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        countEl.textContent =
            "Không tải được danh sách";


        setStatus(
            "Không thể tải playlist"
        );

    }

}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text){

    const lines =
        text
        .replace(/\r/g,"")
        .split("\n");


    const map =
        new Map();


    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(!line)
            continue;


        if(
            line.startsWith("#EXTINF:")
        ){

            info =
                parseExtinf(line);

            continue;

        }


        if(
            info &&
            (
                line.startsWith("http://") ||
                line.startsWith("https://")
            )
        ){

            const id =
                info.tvgId ||
                normalizeName(
                    info.name
                );


            if(!map.has(id)){

                map.set(
                    id,
                    {

                        id:id,

                        tvgId:
                            info.tvgId,

                        name:
                            cleanName(
                                info.name
                            ),

                        logo:
                            getLogo(
                                info.tvgId
                            ),

                        sources:[]

                    }
                );

            }


            const channel =
                map.get(id);


            /*
            Không thêm URL trùng
            */

            if(
                !channel.sources.some(
                    s =>
                        s.url === line
                )
            ){

                channel.sources.push({

                    url:line,

                    name:
                        info.name,

                    quality:
                        getQuality(
                            info.name
                        )

                });

            }


            info = null;

        }

    }


    channels =
        Array.from(
            map.values()
        );


    /*
    VTV lên đầu
    */

    channels.sort(
        (a,b)=>{

            const av =
                /^VTV\d+/i
                .test(a.name);

            const bv =
                /^VTV\d+/i
                .test(b.name);


            if(av && !bv)
                return -1;

            if(!av && bv)
                return 1;


            return a.name.localeCompare(
                b.name,
                "vi"
            );

        }
    );


    countEl.textContent =
        `${channels.length} kênh`;


    renderChannels(
        channels
    );


    setStatus(
        `Đã tải ${channels.length} kênh`
    );

}


/* =========================================================
   PARSE EXTINF
========================================================= */

function parseExtinf(line){

    const tvgMatch =
        line.match(
            /tvg-id="([^"]*)"/i
        );


    const tvgId =
        tvgMatch
        ? tvgMatch[1]
        : "";


    const comma =
        line.indexOf(",");


    const name =
        comma >= 0
        ? line.substring(
            comma + 1
        ).trim()
        : line;


    return {

        tvgId:tvgId,

        name:name

    };

}


/* =========================================================
   CLEAN NAME
========================================================= */

function cleanName(name){

    return name

        .replace(
            /\s*\[Geo-blocked\]/gi,
            ""
        )

        .replace(
            /\s*\[Not 24\/7\]/gi,
            ""
        )

        .trim();

}


function normalizeName(name){

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\([^)]*\)/g,
            ""
        )

        .trim();

}


function getQuality(name){

    const m =
        name.match(
            /\((\d+p)\)/i
        );


    return m
        ? m[1]
        : "";

}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list){

    channelsEl.innerHTML = "";


    if(!list.length){

        channelsEl.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;

    }


    list.forEach(
        channel => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.dataset.id =
                channel.id;


            if(
                currentChannel &&
                currentChannel.id ===
                    channel.id
            ){

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <img

                    class="channel-logo"

                    src="${escapeAttr(
                        channel.logo
                    )}"

                    loading="lazy"

                    onerror="
                        this.onerror=null;
                        this.src='${DEFAULT_LOGO}'
                    "

                >


                <div
                    class="channel-name"
                >

                    ${escapeHtml(
                        channel.name
                    )}

                </div>


                <div
                    class="channel-quality"
                >

                    ${channel.sources.length}
                    nguồn

                </div>

            `;


            item.addEventListener(
                "click",
                () =>
                    playChannel(
                        channel
                    )
            );


            channelsEl.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel){

    currentChannel =
        channel;


    currentSourceIndex =
        0;


    errorCount =
        0;


    switching =
        false;


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(
            el => {

                el.classList.toggle(
                    "active",
                    el.dataset.id ===
                        channel.id
                );

            }
        );


    nowPlaying.textContent =
        channel.name;


    playerTitle.textContent =
        channel.name;


    fullscreenTitle.textContent =
        channel.name;


    updateSourceSelect();


    playCurrentSource();

}


/* =========================================================
   PLAY CURRENT SOURCE
========================================================= */

function playCurrentSource(){

    if(!currentChannel)
        return;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;


        setStatus(
            "❌ Tất cả nguồn hiện tại đều lỗi"
        );


        hideLoading();

        return;

    }


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    switching = true;

    errorCount = 0;


    showLoading();


    setStatus(
        `🔄 Đang thử nguồn ${
            currentSourceIndex + 1
        }/${currentChannel.sources.length}`
    );


    destroyNormalHls();


    clearTimeout(
        loadTimer
    );


    try{
        video.pause();
    }catch(e){}


    video.removeAttribute(
        "src"
    );

    video.load();


    /*
    ========================================================
       NATIVE HLS
    ========================================================
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            source.url;


        video.onloadedmetadata =
            () => {

                switching =
                    false;


                hideLoading();


                clearTimeout(
                    loadTimer
                );


                setStatus(
                    `🟢 Đang phát nguồn ${
                        currentSourceIndex + 1
                    }/${currentChannel.sources.length}`
                );


                video.play()
                    .catch(
                        () => {}
                    );

            };


        video.onerror =
            () => {

                console.warn(
                    "Native HLS lỗi"
                );

                switchToNextSource();

            };


        loadTimer =
            setTimeout(
                () => {

                    if(switching){

                        switchToNextSource();

                    }

                },
                8000
            );


        return;

    }


    /*
    ========================================================
       HLS.JS
    ========================================================
    */

    if(!Hls.isSupported()){

        setStatus(
            "❌ Trình duyệt không hỗ trợ HLS"
        );

        hideLoading();

        return;

    }


    hls =
        new Hls({

            enableWorker:true,

            lowLatencyMode:true,

            backBufferLength:30,

            maxBufferLength:20,

            maxMaxBufferLength:30,

            manifestLoadingMaxRetry:1,

            levelLoadingMaxRetry:1,

            fragLoadingMaxRetry:1,

            startLevel:-1

        });


    hls.loadSource(
        source.url
    );


    hls.attachMedia(
        video
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        () => {

            switching =
                false;


            hideLoading();


            clearTimeout(
                loadTimer
            );


            setStatus(
                `🟢 Đang phát nguồn ${
                    currentSourceIndex + 1
                }/${currentChannel.sources.length}`
            );


            video.play()
                .catch(
                    () => {}
                );

        }
    );


    hls.on(
        Hls.Events.ERROR,
        function(
            event,
            data
        ){

            console.warn(
                "HLS ERROR:",
                data
            );


            if(data.fatal){

                switchToNextSource();

                return;

            }


            if(
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ){

                errorCount++;


                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }


            if(
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ){

                errorCount++;


                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }

        }
    );


    video.onerror =
        () => {

            switchToNextSource();

        };


    loadTimer =
        setTimeout(
            () => {

                if(switching){

                    switchToNextSource();

                }

            },
            10000
        );

}


/* =========================================================
   SWITCH SOURCE
========================================================= */

function switchToNextSource(){

    if(!currentChannel)
        return;


    if(!switching){

        switching = true;

    }


    clearTimeout(
        loadTimer
    );


    currentSourceIndex++;


    if(
        currentSourceIndex <
        currentChannel.sources.length
    ){

        setStatus(
            `⚠️ Nguồn lỗi → chuyển sang nguồn ${
                currentSourceIndex + 1
            }`
        );


        setTimeout(
            () => {

                switching =
                    false;

                playCurrentSource();

            },
            500
        );


        return;

    }


    switching =
        false;


    hideLoading();


    setStatus(
        "❌ Tất cả nguồn của kênh đều không phát được"
    );

}


/* =========================================================
   NEXT SOURCE
========================================================= */

function nextSource(){

    if(!currentChannel)
        return;


    currentSourceIndex++;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

    }


    switching =
        false;


    playCurrentSource();

}


/* =========================================================
   SOURCE SELECT
========================================================= */

function updateSourceSelect(){

    if(
        !currentChannel ||
        currentChannel.sources.length <= 1
    ){

        sourceBox.style.display =
            "none";

        return;

    }


    sourceBox.style.display =
        "block";


    sourceSelect.innerHTML =
        "";


    currentChannel.sources
        .forEach(
            (source,index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    index;


                option.textContent =
                    `Nguồn ${index + 1}${
                        source.quality
                        ? " • " +
                          source.quality
                        : ""
                    }`;


                sourceSelect.appendChild(
                    option
                );

            }
        );


    sourceSelect.value =
        currentSourceIndex;


    sourceSelect.onchange =
        function(){

            currentSourceIndex =
                Number(
                    this.value
                );


            switching =
                false;


            playCurrentSource();

        };

}


/* =========================================================
   SEARCH
========================================================= */

searchEl.addEventListener(
    "input",
    function(){

        const keyword =
            this.value
                .toLowerCase()
                .trim();


        if(!keyword){

            renderChannels(
                channels
            );


            countEl.textContent =
                `${channels.length} kênh`;

            return;

        }


        const filtered =
            channels.filter(
                channel =>
                    channel.name
                        .toLowerCase()
                        .includes(
                            keyword
                        )
            );


        renderChannels(
            filtered
        );


        countEl.textContent =
            `${filtered.length} kênh`;

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function(e){

        e.preventDefault();

        e.stopPropagation();


        if(!currentChannel)
            return;


        await openFullscreen();

    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen(){

    if(!currentChannel)
        return;


    video.pause();


    destroyFullscreenHls();


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenTitle.textContent =
        currentChannel.name;


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    if(!source)
        return;


    /*
    Không phát 2 video song song.
    */


    if(
        isHLS(source.url) &&
        Hls.isSupported()
    ){

        fullscreenHls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:20

            });


        fullscreenHls.loadSource(
            source.url
        );


        fullscreenHls.attachMedia(
            fullscreenVideo
        );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                fullscreenVideo
                    .play()
                    .catch(
                        () => {}
                    );

            }
        );

    }

    else{

        fullscreenVideo.src =
            source.url;


        fullscreenVideo.load();


        fullscreenVideo
            .play()
            .catch(
                () => {}
            );

    }


    await requestWakeLock();


    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch(e){}


    showFullscreenControls();

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    async function(e){

        e.preventDefault();

        e.stopPropagation();

        await closeFullscreenViewer();

    }
);


async function closeFullscreenViewer(){

    fullscreenViewer
        .classList
        .remove(
            "active"
        );


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo.removeAttribute(
        "src"
    );


    fullscreenVideo.load();


    releaseWakeLock();


    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }
    catch(e){}


    /*
    Chạy lại video chính
    */

    if(currentChannel){

        video.play()
            .catch(
                () => {}
            );

    }

}


/* =========================================================
   HLS CHECK
========================================================= */

function isHLS(url){

    return(
        url.includes(".m3u8") ||
        url.includes("m3u8?")
    );

}


/* =========================================================
   DESTROY HLS
========================================================= */

function destroyNormalHls(){

    if(hls){

        try{
            hls.destroy();
        }
        catch(e){}

        hls = null;

    }

}


function destroyFullscreenHls(){

    if(fullscreenHls){

        try{
            fullscreenHls.destroy();
        }
        catch(e){}

        fullscreenHls = null;

    }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

    loadingPlayer
        .classList
        .remove(
            "hidden"
        );

}


function hideLoading(){

    loadingPlayer
        .classList
        .add(
            "hidden"
        );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    statusEl.innerHTML = `

        <span class="status-dot"></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;

}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            if(wakeLock)
                return;


            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );


            wakeLock.addEventListener(
                "release",
                () => {

                    wakeLock = null;

                }
            );

        }

    }
    catch(e){

        console.log(
            "Wake Lock:",
            e
        );

    }

}


function releaseWakeLock(){

    if(wakeLock){

        try{

            wakeLock.release();

        }
        catch(e){}

        wakeLock = null;

    }

}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if(
            document.visibilityState ===
            "visible" &&

            fullscreenViewer
                .classList
                .contains("active")
        ){

            await requestWakeLock();

        }

    }
);


/* =========================================================
   PLAYER CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function(){

        videoArea
            .classList
            .add(
                "controls-visible"
            );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                () => {

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );

    }
);


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function(){

        showFullscreenControls();

    }
);


function showFullscreenControls(){

    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            () => {

                fullscreenViewer
                    .classList
                    .add(
                        "controls-hidden"
                    );

            },
            3000
        );

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Escape" &&
            fullscreenViewer
                .classList
                .contains("active")
        ){

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        if(
            fullscreenViewer
                .classList
                .contains("active")
        ){

            fullscreenViewer.style.width =
                window.innerWidth +
                "px";


            fullscreenViewer.style.height =
                window.innerHeight +
                "px";

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(str){

    return String(str)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(str){

    return escapeHtml(str);

}


/* =========================================================
   START
========================================================= */

loadM3U();

</script>
