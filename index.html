<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(86, 71, 255, .15),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 0%,
            rgba(0, 153, 255, .10),
            transparent 30%
        ),
        #08090d;

    color: #fff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

header {
    position: sticky;
    top: 0;

    z-index: 1000;

    background:
        rgba(8, 9, 13, .86);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.header {
    width: min(1450px, 100%);

    margin: auto;

    min-height: 68px;

    padding:
        10px 18px;

    display: flex;

    align-items: center;

    gap: 18px;
}


/* =====================================================
   KHANH TV LOGO
===================================================== */

.brand {
    display: flex;

    align-items: center;

    gap: 11px;

    min-width: max-content;
}


/* LOGO ICON */

.logo-symbol {
    position: relative;

    width: 44px;
    height: 44px;

    border-radius: 13px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #7267ff,
            #4236d8
        );

    box-shadow:
        0 8px 25px rgba(83,72,255,.30);

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.18);
}


/* Chữ K */

.logo-k {
    position: relative;

    z-index: 2;

    font-size: 24px;

    font-weight: 950;

    font-style: italic;

    letter-spacing: -2px;

    color: white;

    text-shadow:
        0 2px 8px rgba(0,0,0,.25);
}


/* Vòng sóng */

.logo-wave {
    position: absolute;

    right: -8px;

    width: 27px;
    height: 27px;

    border:
        2px solid rgba(255,255,255,.55);

    border-left-color:
        transparent;

    border-bottom-color:
        transparent;

    border-radius: 50%;

    transform:
        rotate(45deg);
}

.logo-wave.two {
    right: -14px;

    width: 38px;
    height: 38px;

    border-color:
        rgba(255,255,255,.25);

    border-left-color:
        transparent;

    border-bottom-color:
        transparent;
}


/* LOGO TEXT */

.brand-text {
    display: flex;

    flex-direction: column;

    line-height: 1;
}

.brand-name {
    font-size: 21px;

    font-weight: 950;

    letter-spacing: 1px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a8adff
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}

.brand-sub {
    margin-top: 5px;

    font-size: 8px;

    font-weight: 700;

    letter-spacing: 3px;

    color: #74798c;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {
    position: relative;

    flex: 1;

    max-width: 620px;

    margin-left: auto;
}

.search {
    width: 100%;

    height: 44px;

    padding:
        0 45px 0 44px;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius: 14px;

    outline: none;

    color: white;

    font-size: 14px;

    background:
        rgba(255,255,255,.055);

    transition: .25s;
}

.search::placeholder {
    color: #777c8d;
}

.search:focus {
    border-color:
        rgba(112,105,255,.8);

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 0 3px
        rgba(95,85,255,.10);
}


/* SEARCH ICON */

.search-icon {
    position: absolute;

    left: 15px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 16px;
    height: 16px;

    border:
        2px solid #777d91;

    border-radius: 50%;

    pointer-events: none;
}

.search-icon::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 2px;

    background: #777d91;

    right: -5px;
    bottom: -3px;

    transform: rotate(45deg);

    border-radius: 2px;
}


/* CLEAR */

.clear-search {
    position: absolute;

    right: 10px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 25px;
    height: 25px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,.08);

    color: #aaa;

    cursor: pointer;

    display: none;

    font-size: 17px;

    line-height: 25px;
}

.clear-search:hover {
    color: white;

    background:
        rgba(255,255,255,.16);
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    width: min(1450px, 100%);

    margin: auto;

    padding: 18px;
}


/* =====================================================
   PLAYER
===================================================== */

.player-box {
    position: sticky;

    top: 86px;

    z-index: 500;

    background: #000;

    overflow: hidden;

    border-radius: 17px;

    border:
        1px solid rgba(255,255,255,.10);

    margin-bottom: 18px;

    box-shadow:
        0 18px 50px rgba(0,0,0,.35);
}

.video-wrapper {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;
}

video {
    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}


/* NOW PLAYING */

.now-playing {
    min-height: 52px;

    padding:
        13px 16px;

    display: flex;

    align-items: center;

    background:
        linear-gradient(
            90deg,
            #12131a,
            #0d0e13
        );

    border-top:
        1px solid rgba(255,255,255,.07);

    font-size: 15px;

    font-weight: 700;
}


/* =====================================================
   STATUS
===================================================== */

.status-row {
    margin:
        3px 0 14px;

    display: flex;

    align-items: center;
}

.status {
    color: #858b9d;

    font-size: 13px;
}

.live-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #39e58b;

    box-shadow:
        0 0 10px #39e58b;
}


/* =====================================================
   CHANNELS
===================================================== */

.channels {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );

    gap: 12px;
}


/* CHANNEL */

.channel {
    position: relative;

    padding: 10px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.08);

    cursor: pointer;

    overflow: hidden;

    transition:
        .2s;
}

.channel:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(112,105,255,.7);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.25);
}

.channel.active {
    border-color:
        #716aff;

    box-shadow:
        0 0 0 1px
        rgba(113,106,255,.18),

        0 0 25px
        rgba(93,83,255,.18);
}


/* ACTIVE LABEL */

.channel.active::after {
    content:
        "ĐANG XEM";

    position: absolute;

    top: 8px;
    right: 8px;

    padding:
        4px 7px;

    border-radius: 6px;

    background:
        #655cff;

    color: white;

    font-size: 8px;

    font-weight: 800;
}


/* CHANNEL LOGO */

.channel-logo {
    width: 100%;
    height: 82px;

    display: block;

    object-fit: contain;

    background:
        radial-gradient(
            circle,
            #191b24,
            #0b0c10
        );

    border-radius: 10px;

    margin-bottom: 10px;
}

.channel-logo-placeholder {
    width: 100%;
    height: 82px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    margin-bottom: 10px;

    background:
        linear-gradient(
            135deg,
            #151722,
            #0b0c11
        );

    color: #555b6e;

    font-size: 28px;
}


/* NAME */

.channel-name {
    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #e9eaf0;
}

.channel-quality {
    margin-top: 5px;

    color: #707586;

    font-size: 10px;
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 45px 20px;

    color: #777c8d;
}

.spinner {
    width: 28px;
    height: 28px;

    margin:
        0 auto 12px;

    border-radius: 50%;

    border:
        3px solid rgba(255,255,255,.1);

    border-top-color:
        #7068ff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   FULLSCREEN
===================================================== */

.video-wrapper:fullscreen {
    width: 100vw;
    height: 100vh;

    background: #000;
}

.video-wrapper:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    background: #000;
}

video:fullscreen {
    background: #000;
}

video:-webkit-full-screen {
    background: #000;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .header {
        min-height: auto;

        padding:
            9px 11px;

        gap: 9px;

        flex-wrap: wrap;
    }

    .brand {
        gap: 9px;
    }

    .logo-symbol {
        width: 38px;
        height: 38px;

        border-radius: 11px;
    }

    .logo-k {
        font-size: 21px;
    }

    .brand-name {
        font-size: 18px;
    }

    .brand-sub {
        font-size: 7px;

        letter-spacing: 2.2px;
    }

    .search-box {
        order: 3;

        width: 100%;

        max-width: none;

        margin: 0;
    }

    .search {
        height: 42px;
    }

    .container {
        padding: 10px;
    }

    .player-box {
        top: 106px;

        border-radius: 13px;

        margin-bottom: 14px;
    }

    .video-wrapper {
        aspect-ratio: 16 / 9;
    }

    .now-playing {
        min-height: 47px;

        padding:
            11px 12px;

        font-size: 13px;
    }

    .channels {
        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap: 8px;
    }

    .channel {
        padding: 7px;

        border-radius: 12px;
    }

    .channel-logo,
    .channel-logo-placeholder {
        height: 65px;

        margin-bottom: 7px;
    }

    .channel-name {
        font-size: 11px;
    }

    .channel-quality {
        font-size: 9px;
    }

    .channel.active::after {
        top: 6px;
        right: 6px;

        font-size: 7px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 380px) {

    .brand-name {
        font-size: 16px;
    }

    .brand-sub {
        font-size: 6px;
    }

    .channels {
        gap: 6px;
    }

    .channel-logo,
    .channel-logo-placeholder {
        height: 58px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header">


        <!-- KHANH TV -->

        <div class="brand">

            <div class="logo-symbol">

                <span class="logo-k">
                    K
                </span>

                <span class="logo-wave"></span>

                <span class="logo-wave two"></span>

            </div>


            <div class="brand-text">

                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    LIVE TELEVISION
                </div>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <span class="search-icon"></span>

            <input
                id="search"
                class="search"
                type="search"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button">
                ×
            </button>

        </div>


    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- PLAYER -->

    <div
        class="player-box"
        id="playerBox">


        <div
            class="video-wrapper"
            id="videoWrapper">


            <video
                id="video"
                controls
                playsinline
                preload="metadata">
            </video>


        </div>


        <div
            class="now-playing"
            id="nowPlaying">

            Chưa chọn kênh

        </div>


    </div>



    <!-- STATUS -->

    <div class="status-row">

        <div
            class="status"
            id="status">

            <span class="live-dot"></span>

            Đang tải danh sách kênh...

        </div>

    </div>



    <!-- CHANNEL LIST -->

    <div
        id="channels"
        class="channels">


        <div class="loading">

            <div class="spinner"></div>

            Đang tải danh sách kênh...

        </div>


    </div>


</main>



<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const videoWrapper =
    document.getElementById("videoWrapper");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");

const clearSearch =
    document.getElementById("clearSearch");


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];

let hls = null;

let currentChannel = null;

let wakeLock = null;


/* =====================================================
   WAKE LOCK
===================================================== */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator &&
            !wakeLock
        ) {

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

            wakeLock.addEventListener(
                "release",
                () => {

                    wakeLock = null;

                }
            );

        }

    } catch (error) {

        console.log(
            "Wake Lock:",
            error
        );

    }

}


async function releaseWakeLock() {

    try {

        if (wakeLock) {

            await wakeLock.release();

            wakeLock = null;

        }

    } catch (error) {

        console.log(error);

    }

}


/* =====================================================
   VIDEO EVENTS
===================================================== */

video.addEventListener(
    "play",
    () => {

        requestWakeLock();

    }
);


video.addEventListener(
    "pause",
    () => {

        releaseWakeLock();

    }
);


video.addEventListener(
    "ended",
    () => {

        releaseWakeLock();

    }
);


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible" &&
            !video.paused
        ) {

            requestWakeLock();

        }

    }
);


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist() {

    try {

        statusText.innerHTML =
            '<span class="live-dot"></span>' +
            'Đang tải danh sách kênh...';


        const response =
            await fetch(PLAYLIST);


        if (!response.ok) {

            throw new Error(
                "Không tải được playlist"
            );

        }


        const text =
            await response.text();


        channels =
            parseM3U(text);


        /*
         * Đưa toàn bộ VTV lên đầu
         */

        channels.sort(
            (a,b) => {

                const aVTV =
                    isVTV(a) ? 0 : 1;

                const bVTV =
                    isVTV(b) ? 0 : 1;

                return aVTV - bVTV;

            }
        );


        statusText.innerHTML =
            '<span class="live-dot"></span>' +
            `Đã tải ${channels.length} kênh`;


        renderChannels(
            channels
        );


    } catch (error) {

        console.error(error);


        statusText.innerHTML =
            "Không thể tải danh sách kênh";


        channelsBox.innerHTML = `

            <div class="empty">

                Không tải được playlist IPTV.

                <br><br>

                Kiểm tra kết nối Internet.

            </div>

        `;

    }

}


/* =====================================================
   VTV CHECK
===================================================== */

function isVTV(channel) {

    return (

        channel.name
            .toLowerCase()
            .includes("vtv")

        ||

        channel.id
            .toLowerCase()
            .includes("vtv")

    );

}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith("#EXTINF")
        ) {


            const nameMatch =
                line.match(/,(.*)$/);


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : "",

                id:
                    idMatch
                    ? idMatch[1]
                    : "",

                group:
                    groupMatch
                    ? groupMatch[1]
                    : ""

            };


        } else if (

            info &&
            line &&
            !line.startsWith("#")

        ) {


            result.push({

                name: info.name,

                logo: info.logo,

                id: info.id,

                group: info.group,

                url: line

            });


            info = null;

        }

    }


    return result;

}


/* =====================================================
   RENDER
===================================================== */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (
        list.length === 0
    ) {

        channelsBox.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh

            </div>

        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    list.forEach(
        channel => {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            if (
                currentChannel &&
                currentChannel.url ===
                channel.url
            ) {

                item.classList.add(
                    "active"
                );

            }


            let logoHTML;


            if (
                channel.logo
            ) {

                logoHTML = `

                    <img
                        class="channel-logo"
                        src="${escapeHtml(channel.logo)}"
                        loading="lazy"
                        onerror="
                            this.onerror=null;
                            this.style.display='none';
                        "
                    >

                `;

            } else {

                logoHTML = `

                    <div class="channel-logo-placeholder">
                        K
                    </div>

                `;

            }


            item.innerHTML = `

                ${logoHTML}

                <div class="channel-name">

                    ${escapeHtml(
                        channel.name
                    )}

                </div>

                <div class="channel-quality">

                    ${
                        channel.group
                        ?
                        escapeHtml(
                            channel.group
                        )
                        :
                        "LIVE"
                    }

                </div>

            `;


            item.onclick = () => {

                playChannel(
                    channel
                );

            };


            fragment.appendChild(
                item
            );

        }
    );


    channelsBox.appendChild(
        fragment
    );

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    /*
     * Hủy HLS cũ
     */

    if (hls) {

        try {

            hls.destroy();

        } catch (e) {}

        hls = null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    const url =
        channel.url;


    /* =================================================
       HLS.JS
    ================================================= */

    if (

        url.toLowerCase()
            .includes(".m3u8") &&

        Hls.isSupported()

    ) {


        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: true,

                backBufferLength: 30,

                maxBufferLength: 30,

                maxMaxBufferLength: 60

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .then(
                        () => {

                            requestWakeLock();

                        }
                    )
                    .catch(
                        () => {}
                    );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {


                console.log(
                    "HLS:",
                    data
                );


                if (
                    data.fatal
                ) {


                    if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ) {

                        hls.startLoad();

                    }


                    else if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ) {

                        hls.recoverMediaError();

                    }


                    else {

                        hls.destroy();

                    }

                }

            }
        );


    }


    /* =================================================
       NATIVE HLS
    ================================================= */

    else if (

        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )

    ) {


        video.src =
            url;


        video.play()
            .then(
                () => {

                    requestWakeLock();

                }
            )
            .catch(
                () => {}
            );

    }


    /* =================================================
       OTHER
    ================================================= */

    else {


        video.src =
            url;


        video.play()
            .then(
                () => {

                    requestWakeLock();

                }
            )
            .catch(
                () => {}
            );

    }


    /*
     * Chỉ render lại trạng thái active.
     *
     * KHÔNG scrollIntoView.
     */

    renderChannels(
        filterChannels()
    );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    () => {


        const keyword =
            searchInput.value.trim();


        clearSearch.style.display =
            keyword
            ? "block"
            : "none";


        renderChannels(
            filterChannels()
        );


    }
);


/* =====================================================
   CLEAR SEARCH
===================================================== */

clearSearch.addEventListener(
    "click",
    () => {


        searchInput.value =
            "";


        clearSearch.style.display =
            "none";


        renderChannels(
            channels
        );


        searchInput.focus();

    }
);


/* =====================================================
   FILTER
===================================================== */

function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;

    }


    return channels.filter(
        channel => {


            return (

                channel.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.id
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.group
                    .toLowerCase()
                    .includes(
                        keyword
                    )

            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadPlaylist();

</script>
