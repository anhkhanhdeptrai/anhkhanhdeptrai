<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(110,70,255,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(255,50,160,.08),
            transparent 30%
        ),
        #06070c;

    color: #fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

header {

    position: sticky;

    top: 0;

    z-index: 1000;

    padding:
        9px 12px;

    background:
        rgba(6,7,12,.88);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.20);
}


.header {

    width: 100%;

    max-width: 1450px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 12px;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 9px;

    flex: 0 0 auto;

    min-width: max-content;
}


.logo {

    position: relative;

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #693cff,
            #b83cff 48%,
            #ff3970
        );

    box-shadow:
        0 0 25px
        rgba(133,67,255,.35);

    overflow: hidden;
}


.logo::before {

    content: "";

    width: 21px;
    height: 15px;

    border:
        3px solid white;

    border-radius: 5px;

    position: absolute;
}


.logo::after {

    content: "";

    width: 10px;
    height: 3px;

    background: white;

    border-radius: 10px;

    position: absolute;

    bottom: 7px;
}


.brand-text {

    font-size: 19px;

    font-weight: 900;

    letter-spacing: .5px;

    white-space: nowrap;

    background:
        linear-gradient(
            90deg,
            #fff,
            #a978ff,
            #ff5eb8,
            #fff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        titleGradient 5s
        linear infinite;
}


@keyframes titleGradient {

    0% {
        background-position:
            0% center;
    }

    100% {
        background-position:
            250% center;
    }
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap {

    position: relative;

    flex: 1;

    min-width: 0;
}


.search-icon {

    position: absolute;

    left: 14px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #9095aa;

    font-size: 18px;

    pointer-events: none;

    z-index: 2;
}


.search {

    width: 100%;

    height: 43px;

    padding:
        0 15px 0 42px;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    color: white;

    font-size: 14px;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.04);

    transition:
        .25s;
}


.search::placeholder {
    color: #777c90;
}


.search:focus {

    border-color:
        rgba(145,91,255,.8);

    background:
        rgba(20,16,32,.85);

    box-shadow:
        0 0 0 3px
        rgba(126,67,255,.12),

        0 0 30px
        rgba(126,67,255,.13);
}


/* =========================================================
   MAIN
========================================================= */

.container {

    width: 100%;

    max-width: 1450px;

    margin: auto;

    padding:
        14px;
}


/* =========================================================
   PLAYER STICKY
========================================================= */

/*
   QUAN TRỌNG:

   Player được sticky.

   Khi vuốt danh sách kênh,
   player vẫn đứng yên phía trên.
*/

.player-box {

    position: sticky;

    top: 67px;

    z-index: 500;

    width: 100%;

    background:
        rgba(5,5,8,.96);

    border-radius: 18px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 18px 55px
        rgba(0,0,0,.48);

    margin-bottom: 13px;
}


/* =========================================================
   VIDEO
========================================================= */

.video-area {

    position: relative;

    width: 100%;

    background: #000;

    aspect-ratio: 16 / 9;

    overflow: hidden;
}


video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}


/* HIDE DEFAULT CONTROLS */

video::-webkit-media-controls {
    display: none !important;
}

video::-webkit-media-controls-enclosure {
    display: none !important;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info {

    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    padding: 14px;

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );

    opacity: 0;

    transition:
        .25s;

    z-index: 5;
}


.video-area.controls-visible
.player-info {

    opacity: 1;
}


.live-title {

    font-size: 14px;

    font-weight: 800;

    max-width: 70%;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


.live-badge {

    display: flex;

    align-items: center;

    gap: 6px;

    padding:
        5px 9px;

    border-radius: 20px;

    background:
        rgba(255,35,80,.18);

    border:
        1px solid
        rgba(255,60,100,.35);

    color: #ff7190;

    font-size: 10px;

    font-weight: 900;
}


.live-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff315b;

    box-shadow:
        0 0 10px
        #ff315b;
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn,
.close-fullscreen {

    position: absolute;

    width: 41px;
    height: 41px;

    border: 0;

    border-radius: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(15,15,22,.75);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    cursor: pointer;

    transition:
        .2s;

    z-index: 20;
}


.fullscreen-btn {

    right: 12px;

    bottom: 12px;

    font-size: 21px;

    opacity: 0;

    pointer-events: none;
}


.video-area.controls-visible
.fullscreen-btn {

    opacity: 1;

    pointer-events: auto;
}


.fullscreen-btn:hover,
.close-fullscreen:hover {

    background:
        rgba(110,70,255,.8);

    transform:
        scale(1.05);
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing {

    min-height: 52px;

    padding:
        11px 14px;

    display: flex;

    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            90deg,
            rgba(110,65,255,.16),
            rgba(255,50,160,.07)
        );

    border-top:
        1px solid
        rgba(255,255,255,.06);
}


.now-dot {

    width: 8px;
    height: 8px;

    flex: 0 0 auto;

    border-radius: 50%;

    background:
        #795aff;

    box-shadow:
        0 0 13px
        #795aff;
}


.now-text {

    min-width: 0;

    font-size: 14px;

    font-weight: 800;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: flex;

    align-items: center;

    gap: 8px;

    margin:
        5px 2px 12px;

    color: #8e94a7;

    font-size: 13px;
}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #45e6a1;

    box-shadow:
        0 0 10px
        rgba(69,230,161,.7);
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap: 11px;

    /*
       Cho danh sách tiếp tục
       cuộn bình thường.
    */
}


.channel {

    min-width: 0;

    padding: 9px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius: 15px;

    cursor: pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);
}


.channel:hover {

    transform:
        translateY(-2px);

    border-color:
        rgba(130,85,255,.65);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.28);
}


.channel.active {

    border-color:
        #8155ff;

    background:
        linear-gradient(
            145deg,
            rgba(125,75,255,.20),
            rgba(255,60,160,.07)
        );

    box-shadow:
        0 0 22px
        rgba(126,77,255,.17);
}


.channel-logo {

    width: 100%;

    height: 78px;

    object-fit: contain;

    display: block;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            #0b0d14,
            #08090e
        );

    margin-bottom: 9px;
}


.channel-name {

    font-size: 13px;

    font-weight: 750;

    line-height: 1.3;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.channel-quality {

    color: #777c8d;

    font-size: 10px;

    margin-top: 4px;
}


/* =========================================================
   LOADING
========================================================= */

.loading,
.empty {

    grid-column:
        1 / -1;

    text-align: center;

    padding:
        45px 20px;

    color: #85899a;
}


/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.fullscreen-viewer {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100dvh;

    background: #000;

    z-index: 999999;

    display: none;

    overflow: hidden;

    touch-action: manipulation;
}


.fullscreen-viewer.active {

    display: block;
}


.fullscreen-video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}


.fullscreen-video::-webkit-media-controls {
    display: none !important;
}

.fullscreen-video::-webkit-media-controls-enclosure {
    display: none !important;
}


/* =========================================================
   FULLSCREEN TOP
========================================================= */

.fullscreen-top {

    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    padding: 15px;

    z-index: 10;

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            transparent
        );

    opacity: 1;

    transition:
        opacity .3s;

    pointer-events: none;
}


.fullscreen-top
.live-title {

    pointer-events: none;
}


.close-fullscreen {

    position: relative;

    top: auto;
    right: auto;

    pointer-events: auto;

    opacity: 1;

    font-size: 26px;
}


.fullscreen-viewer.controls-hidden
.fullscreen-top {

    opacity: 0;

    pointer-events: none;
}


.fullscreen-viewer.controls-hidden
.close-fullscreen {

    pointer-events: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    header {

        padding:
            8px 9px;
    }


    .header {

        gap: 8px;
    }


    .brand {

        min-width: max-content;

        gap: 7px;
    }


    .logo {

        width: 36px;
        height: 36px;

        flex-basis: 36px;

        border-radius: 11px;
    }


    .brand-text {

        font-size: 15px;

        letter-spacing: .2px;
    }


    .search {

        height: 39px;

        border-radius: 12px;

        padding-left: 39px;

        font-size: 13px;
    }


    .search-icon {

        left: 13px;

        font-size: 16px;
    }


    .container {

        padding:
            9px;
    }


    /*
       PLAYER CỐ ĐỊNH TRÊN MOBILE
    */

    .player-box {

        top: 53px;

        border-radius: 14px;

        margin-bottom: 12px;
    }


    .video-area {

        aspect-ratio:
            16 / 9;
    }


    .channels {

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap: 8px;
    }


    .channel {

        padding: 7px;

        border-radius: 12px;
    }


    .channel-logo {

        height: 62px;

        border-radius: 9px;

        margin-bottom: 7px;
    }


    .channel-name {

        font-size: 12px;
    }


    .channel-quality {

        font-size: 9px;
    }


    .now-playing {

        min-height: 48px;

        padding:
            9px 11px;
    }


    .now-text {

        font-size: 12px;
    }


    .status {

        font-size: 12px;
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media(max-width:370px) {

    .brand-text {

        font-size: 14px;
    }


    .logo {

        width: 34px;
        height: 34px;

        flex-basis: 34px;
    }


    .search {

        font-size: 12px;
    }
}


/* =========================================================
   FULLSCREEN PORTRAIT
========================================================= */

@media(orientation:portrait) {

    .fullscreen-viewer {

        width: 100vw;

        height: 100dvh;
    }


    .fullscreen-video {

        width: 100vw;

        height: 100dvh;

        object-fit: contain;
    }
}


/* =========================================================
   FULLSCREEN LANDSCAPE
========================================================= */

@media(orientation:landscape) {

    .fullscreen-viewer {

        width: 100vw;

        height: 100dvh;
    }


    .fullscreen-video {

        width: 100vw;

        height: 100dvh;

        object-fit: contain;
    }


    .fullscreen-top {

        padding:
            max(
                12px,
                env(safe-area-inset-top)
            )
            max(
                12px,
                env(safe-area-inset-right)
            )
            12px
            max(
                12px,
                env(safe-area-inset-left)
            );
    }
}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(
    padding:env(safe-area-inset-top)
) {

    .fullscreen-viewer {

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }
}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


    <!-- PLAYER -->

    <div class="player-box">

        <div
            id="videoArea"
            class="video-area"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>


            <div class="player-info">

                <div
                    id="playerTitle"
                    class="live-title"
                >
                    KHANH TV
                </div>


                <div class="live-badge">

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>


            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

        </div>


        <div class="now-playing">

            <span class="now-dot"></span>

            <span
                id="nowPlaying"
                class="now-text"
            >
                Chưa chọn kênh
            </span>

        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Đang tải danh sách...
        </span>

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>


<!-- =========================================================
     FULLSCREEN
========================================================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="live-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
            aria-label="Đóng"
        >
            ×
        </button>

    </div>

</div>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const fullscreenVideo =
    document.getElementById(
        "fullscreenVideo"
    );

const videoArea =
    document.getElementById(
        "videoArea"
    );

const fullscreenViewer =
    document.getElementById(
        "fullscreenViewer"
    );

const fullscreenBtn =
    document.getElementById(
        "fullscreenBtn"
    );

const closeFullscreen =
    document.getElementById(
        "closeFullscreen"
    );

const channelsBox =
    document.getElementById(
        "channels"
    );

const statusText =
    document.getElementById(
        "status"
    );

const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );

const playerTitle =
    document.getElementById(
        "playerTitle"
    );

const fullscreenTitle =
    document.getElementById(
        "fullscreenTitle"
    );

const searchInput =
    document.getElementById(
        "search"
    );


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let hls = null;

let fullscreenHls = null;

let wakeLock = null;

let controlsTimer = null;

let fullscreenControlsTimer = null;


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(
                PLAYLIST,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const text =
            await response.text();


        channels =
            parseM3U(text);


        /* VTV LÊN ĐẦU */

        channels.sort(
            (a,b) => {

                const av =
                    /^VTV\d+/i
                    .test(a.name);

                const bv =
                    /^VTV\d+/i
                    .test(b.name);


                if (av && !bv)
                    return -1;

                if (!av && bv)
                    return 1;

                return 0;
            }
        );


        setStatus(
            "Đã tải " +
            channels.length +
            " kênh"
        );


        renderChannels(
            channels
        );


    }
    catch(error) {

        console.error(error);


        setStatus(
            "Không thể tải danh sách kênh"
        );


        channelsBox.innerHTML = `

            <div class="empty">

                ❌ Không tải được playlist IPTV.

                <br><br>

                Hãy kiểm tra kết nối mạng.

            </div>

        `;
    }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusText.innerHTML = `

        <span class="status-dot"></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;
}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith(
                "#EXTINF"
            )
        ) {

            const nameMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : "",

                group:
                    groupMatch
                    ? groupMatch[1]
                    : "",

                id:
                    idMatch
                    ? idMatch[1]
                    : ""
            };

        }


        else if (

            info &&
            line &&
            !line.startsWith("#")

        ) {

            result.push({

                name:
                    info.name,

                logo:
                    info.logo,

                group:
                    info.group,

                id:
                    info.id,

                url:
                    line

            });


            info = null;
        }
    }


    return result;
}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (!list.length) {

        channelsBox.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;
    }


    list.forEach(
        channel => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            if (

                currentChannel &&

                currentChannel.url ===
                channel.url

            ) {

                item.classList.add(
                    "active"
                );
            }


            const logoHTML =
                channel.logo

                ?

                `

                <img
                    class="channel-logo"
                    src="${escapeAttribute(
                        channel.logo
                    )}"
                    loading="lazy"
                    onerror="
                        this.style.display='none'
                    "
                >

                `

                :

                `

                <div
                    class="channel-logo"
                ></div>

                `;


            item.innerHTML = `

                ${logoHTML}

                <div
                    class="channel-name"
                >
                    ${escapeHtml(
                        channel.name
                    )}
                </div>

                <div
                    class="channel-quality"
                >
                    ${
                        channel.group ||
                        "IPTV"
                    }
                </div>

            `;


            item.addEventListener(
                "click",
                () =>
                    playChannel(
                        channel
                    )
            );


            channelsBox.appendChild(
                item
            );

        }
    );
}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    playerTitle.innerText =
        channel.name;


    fullscreenTitle.innerText =
        channel.name;


    destroyNormalHls();


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    const url =
        channel.url;


    if (

        isHLS(url) &&

        Hls.isSupported()

    ) {

        hls =
            new Hls({

                enableWorker:
                    true,

                lowLatencyMode:
                    false,

                backBufferLength:
                    30,

                maxBufferLength:
                    20

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events
                .MANIFEST_PARSED,

            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );

            }
        );


        hls.on(
            Hls.Events.ERROR,

            (event,data) => {

                console.log(
                    "HLS:",
                    data
                );

            }
        );

    }


    else if (

        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )

    ) {

        video.src =
            url;

        video.play()
            .catch(
                () => {}
            );

    }


    else {

        video.src =
            url;

        video.play()
            .catch(
                () => {}
            );

    }


    renderChannels(
        filterChannels()
    );
}


/* =========================================================
   HLS
========================================================= */

function isHLS(url) {

    return (

        url.includes(".m3u8") ||

        url.includes("m3u8?")

    );
}


/* =========================================================
   DESTROY NORMAL HLS
========================================================= */

function destroyNormalHls() {

    if (hls) {

        try {

            hls.destroy();

        }
        catch(e) {}

        hls = null;
    }
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (!currentChannel)
            return;


        await openFullscreen();

    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen() {

    if (!currentChannel)
        return;


    video.pause();


    destroyFullscreenHls();


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenTitle.innerText =
        currentChannel.name;


    const url =
        currentChannel.url;


    if (

        isHLS(url) &&

        Hls.isSupported()

    ) {

        fullscreenHls =
            new Hls({

                enableWorker:
                    true,

                lowLatencyMode:
                    false,

                backBufferLength:
                    30,

                maxBufferLength:
                    20

            });


        fullscreenHls
            .loadSource(url);


        fullscreenHls
            .attachMedia(
                fullscreenVideo
            );


        fullscreenHls.on(
            Hls.Events
                .MANIFEST_PARSED,

            () => {

                fullscreenVideo
                    .play()
                    .catch(
                        () => {}
                    );

            }
        );

    }


    else {

        fullscreenVideo.src =
            url;

        fullscreenVideo.load();

        fullscreenVideo.play()
            .catch(
                () => {}
            );
    }


    await requestWakeLock();


    try {

        if (

            screen.orientation &&

            screen.orientation.lock

        ) {

            await screen.orientation
                .lock(
                    "landscape"
                );
        }

    }
    catch(e) {

        console.log(
            "Orientation lock không được hỗ trợ"
        );
    }


    showFullscreenControls();
}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();

        await closeFullscreenViewer();

    }
);


/* =========================================================
   CLOSE FUNCTION
========================================================= */

async function closeFullscreenViewer() {

    fullscreenViewer
        .classList
        .remove("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo
        .removeAttribute(
            "src"
        );


    fullscreenVideo.load();


    releaseWakeLock();


    try {

        if (

            screen.orientation &&

            screen.orientation.unlock

        ) {

            screen.orientation.unlock();

        }

    }
    catch(e) {}


    if (currentChannel) {

        video.play()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   DESTROY FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls() {

    if (fullscreenHls) {

        try {

            fullscreenHls.destroy();

        }
        catch(e) {}

        fullscreenHls = null;
    }
}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator
        ) {

            wakeLock =
                await navigator
                    .wakeLock
                    .request(
                        "screen"
                    );


            wakeLock.addEventListener(
                "release",
                () => {

                    console.log(
                        "Wake Lock released"
                    );

                }
            );
        }

    }
    catch(error) {

        console.log(
            "Wake Lock:",
            error
        );
    }
}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (

            document.visibilityState ===
            "visible" &&

            fullscreenViewer
                .classList
                .contains("active")

        ) {

            await requestWakeLock();
        }

    }
);


/* =========================================================
   RELEASE WAKE LOCK
========================================================= */

function releaseWakeLock() {

    if (wakeLock) {

        try {

            wakeLock.release();

        }
        catch(e) {}

        wakeLock = null;
    }
}


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function() {

        showFullscreenControls();

    }
);


function showFullscreenControls() {

    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            () => {

                fullscreenViewer
                    .classList
                    .add(
                        "controls-hidden"
                    );

            },
            3000
        );
}


/* =========================================================
   PLAYER CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function() {

        videoArea
            .classList
            .add(
                "controls-visible"
            );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                () => {

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;

    }


    return channels.filter(
        channel => {

            return (

                channel.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.group
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.id
                    .toLowerCase()
                    .includes(
                        keyword
                    )

            );

        }
    );
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(value) {

    return escapeHtml(value);
}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (

            e.key === "Escape" &&

            fullscreenViewer
                .classList
                .contains("active")

        ) {

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (

            fullscreenViewer
                .classList
                .contains("active")

        ) {

            fullscreenViewer.style.width =
                window.innerWidth +
                "px";


            fullscreenViewer.style.height =
                window.innerHeight +
                "px";
        }

    }
);


/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>
