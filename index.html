<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #07080d;
    color: #fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* =====================================================
   HEADER
===================================================== */

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 68px;

    z-index: 1000;

    background:
        linear-gradient(
            135deg,
            rgba(10,11,20,.97),
            rgba(22,12,35,.97)
        );

    border-bottom:
        1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.header-inner {
    height: 100%;
    max-width: 1450px;
    margin: auto;

    padding: 0 18px;

    display: flex;
    align-items: center;

    gap: 18px;
}

/* =====================================================
   KHANH TV LOGO
===================================================== */

.brand {
    display: flex;
    align-items: center;

    gap: 11px;

    min-width: max-content;
}

/* Logo */

.brand-logo {
    width: 43px;
    height: 43px;

    border-radius: 14px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #6d5dfc,
            #9b5cff,
            #e84cff,
            #ff4f91,
            #6d5dfc
        );

    background-size: 300% 300%;

    animation:
        logoGradient 5s ease infinite,
        logoGlow 2.5s ease-in-out infinite;

    box-shadow:
        0 0 15px rgba(124,92,255,.45),
        0 0 35px rgba(236,72,153,.18);

    overflow: hidden;
}

/* Ánh sáng chạy qua logo */

.brand-logo::before {
    content: "";

    position: absolute;

    width: 70px;
    height: 8px;

    left: -70px;
    top: 50%;

    transform:
        translateY(-50%)
        rotate(-35deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    filter: blur(2px);

    animation:
        logoShine 3s ease-in-out infinite;

    z-index: 2;
}

/* Màn hình TV */

.brand-logo::after {
    content: "";

    width: 22px;
    height: 16px;

    border:
        2px solid #fff;

    border-radius: 5px;

    position: absolute;

    top: 12px;
    left: 10px;

    box-shadow:
        0 0 8px rgba(255,255,255,.55);

    z-index: 3;
}

/* Chấm sáng */

.brand-logo span {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px #fff;

    z-index: 5;
}


/* =====================================================
   KHANH TV TEXT
===================================================== */

.brand-name {
    font-size: 21px;

    font-weight: 950;

    letter-spacing: .7px;

    position: relative;

    background:
        linear-gradient(
            90deg,
            #fff,
            #a78bfa,
            #d946ef,
            #f472b6,
            #fff
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGradient 5s linear infinite;

    filter:
        drop-shadow(
            0 0 7px
            rgba(168,85,247,.3)
        );
}


/* LIVE TV */

.brand-name::after {
    content: "LIVE TV";

    display: block;

    font-size: 7px;

    letter-spacing: 2.5px;

    margin-top: -1px;

    font-weight: 700;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #ec4899,
            #8b5cf6
        );

    background-size: 200% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        smallGradient 3s linear infinite;
}


/* =====================================================
   LOGO ANIMATION
===================================================== */

@keyframes logoGradient {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes titleGradient {

    0% {
        background-position: 0% center;
    }

    50% {
        background-position: 100% center;
    }

    100% {
        background-position: 0% center;
    }
}

@keyframes smallGradient {

    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 200% center;
    }
}

@keyframes logoShine {

    0% {
        left: -80px;
    }

    55%,
    100% {
        left: 90px;
    }
}

@keyframes logoGlow {

    0%,
    100% {
        box-shadow:
            0 0 13px rgba(124,92,255,.35),
            0 0 28px rgba(236,72,153,.12);
    }

    50% {
        box-shadow:
            0 0 20px rgba(124,92,255,.65),
            0 0 42px rgba(236,72,153,.25);
    }
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {
    flex: 1;

    max-width: 600px;

    margin-left: auto;

    position: relative;
}

.search-icon {
    position: absolute;

    left: 15px;
    top: 50%;

    transform:
        translateY(-50%);

    color: #9293a7;

    font-size: 18px;

    pointer-events: none;
}

.search {
    width: 100%;
    height: 43px;

    padding:
        0 16px 0 43px;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius: 13px;

    outline: none;

    background:
        rgba(255,255,255,.06);

    color: #fff;

    font-size: 14px;

    transition: .2s;
}

.search::placeholder {
    color: #858696;
}

.search:focus {
    border-color:
        rgba(139,92,246,.8);

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 0 3px
        rgba(124,92,255,.12);
}


/* =====================================================
   MAIN
===================================================== */

.main {
    position: fixed;

    top: 68px;
    left: 0;
    right: 0;
    bottom: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =====================================================
   PLAYER
===================================================== */

.player-section {
    flex-shrink: 0;

    background: #000;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    position: relative;

    z-index: 50;
}

.player {
    width: 100%;
    max-width: 1450px;

    margin: auto;

    position: relative;

    background: #000;

    overflow: hidden;

    aspect-ratio: 16 / 9;

    max-height:
        calc(100vh - 150px);
}


/* VIDEO */

video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    outline: none;
}


/* =====================================================
   CUSTOM BUTTONS
===================================================== */

.custom-controls {
    position: absolute;

    top: 15px;
    right: 15px;

    display: flex;

    gap: 8px;

    z-index: 100;

    opacity: 1;

    transition:
        opacity .3s,
        transform .3s;
}

.custom-controls.hidden {
    opacity: 0;

    pointer-events: none;

    transform:
        translateY(-8px);
}

.control-btn {
    width: 42px;
    height: 42px;

    border:
        1px solid rgba(255,255,255,.16);

    border-radius: 12px;

    background:
        rgba(10,10,16,.7);

    color: #fff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;

    cursor: pointer;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transition: .2s;
}

.control-btn:hover {
    background:
        rgba(124,92,255,.8);

    transform:
        scale(1.05);
}

.control-btn:active {
    transform:
        scale(.94);
}


/* =====================================================
   NOW PLAYING
===================================================== */

.now-playing {
    max-width: 1450px;

    margin: auto;

    min-height: 54px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background:
        linear-gradient(
            90deg,
            #10111a,
            #151225
        );
}

.now-content {
    min-width: 0;
}

.now-label {
    font-size: 10px;

    color: #8e8fa5;

    text-transform: uppercase;

    letter-spacing: 1.2px;

    margin-bottom: 3px;
}

.live-dot {
    width: 7px;
    height: 7px;

    display: inline-block;

    border-radius: 50%;

    background: #22c55e;

    margin-right: 7px;

    box-shadow:
        0 0 10px #22c55e;
}

.now-title {
    font-size: 15px;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   CHANNEL AREA
===================================================== */

.channel-area {
    flex: 1;

    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        16px 18px 40px;

    overscroll-behavior: contain;

    scrollbar-width: thin;

    scrollbar-color:
        #363747
        transparent;
}

.channel-inner {
    max-width: 1450px;

    margin: auto;
}

.status {
    margin-bottom: 13px;

    color: #9293a4;

    font-size: 13px;
}


/* =====================================================
   CHANNEL GRID
===================================================== */

.channels {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px, 1fr)
        );

    gap: 12px;
}

.channel {
    position: relative;

    background:
        linear-gradient(
            145deg,
            #12131b,
            #0e0f16
        );

    border:
        1px solid rgba(255,255,255,.07);

    border-radius: 15px;

    padding: 9px;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;
}

.channel:hover {
    transform:
        translateY(-2px);

    border-color:
        rgba(139,92,246,.65);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);
}

.channel.active {
    border-color:
        #8b5cf6;

    box-shadow:
        0 0 0 1px #8b5cf6,
        0 8px 30px
        rgba(124,92,255,.2);
}

.channel-logo {
    width: 100%;
    height: 82px;

    display: block;

    object-fit: contain;

    border-radius: 10px;

    background: #090a0f;

    margin-bottom: 9px;
}

.no-logo {
    width: 100%;
    height: 82px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #171827,
            #0b0c12
        );

    color: #77798b;

    font-size: 24px;
}

.channel-name {
    font-size: 13px;

    font-weight: 750;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    padding:
        2px 3px 4px;
}

.channel-quality {
    color: #77798b;

    font-size: 10px;

    padding: 0 3px;
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty {
    padding: 50px 20px;

    text-align: center;

    color: #858696;
}

.loading::before {
    content: "";

    width: 24px;
    height: 24px;

    display: block;

    margin:
        0 auto 12px;

    border:
        3px solid #292a37;

    border-top-color:
        #8b5cf6;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =====================================================
   FULLSCREEN
===================================================== */

.player:fullscreen {
    width: 100vw;
    height: 100vh;

    max-width: none;
    max-height: none;

    aspect-ratio: auto;

    background: #000;
}

.player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    max-width: none;
    max-height: none;

    aspect-ratio: auto;

    background: #000;
}

.player:fullscreen video,
.player:-webkit-full-screen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.player:fullscreen .custom-controls,
.player:-webkit-full-screen .custom-controls {
    position: fixed;

    top: 15px;
    right: 15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:700px) {

    header {
        height: 60px;
    }

    .header-inner {
        padding: 0 10px;

        gap: 9px;
    }

    .brand-logo {
        width: 39px;
        height: 39px;

        border-radius: 12px;
    }

    .brand-logo::after {
        width: 20px;
        height: 14px;

        top: 11px;
        left: 9px;
    }

    .brand-name {
        font-size: 18px;
    }

    .brand-name::after {
        font-size: 6px;

        letter-spacing: 2px;
    }

    .search {
        height: 39px;

        font-size: 13px;

        padding-left: 38px;
    }

    .main {
        top: 60px;
    }

    .player {
        aspect-ratio: 16 / 9;

        max-height: none;
    }

    .now-playing {
        min-height: 48px;

        padding: 0 12px;
    }

    .now-title {
        font-size: 14px;
    }

    .channel-area {
        padding: 10px;
    }

    .channels {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .channel {
        padding: 7px;

        border-radius: 12px;
    }

    .channel-logo,
    .no-logo {
        height: 65px;

        border-radius: 8px;
    }

    .channel-name {
        font-size: 12px;
    }

    .custom-controls {
        top: 9px;
        right: 9px;
    }

    .control-btn {
        width: 38px;
        height: 38px;

        border-radius: 10px;

        font-size: 19px;
    }
}


/* =====================================================
   LANDSCAPE PHONE
===================================================== */

@media (orientation: landscape) and (max-height:600px) {

    .player:fullscreen,
    .player:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
    }

    .player:fullscreen video,
    .player:-webkit-full-screen video {
        width: 100vw;
        height: 100vh;

        object-fit: contain;
    }
}
</style>
</head>


<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header-inner">

        <div class="brand">

            <div class="brand-logo">
                <span></span>
            </div>

            <div class="brand-name">
                KHANH TV
            </div>

        </div>


        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Tìm kiếm kênh..."
                autocomplete="off"
            >

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- =================================================
         PLAYER
    ================================================== -->

    <section class="player-section">

        <div
            class="player"
            id="player"
        >

            <!-- Không có controls -->
            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="metadata"
            ></video>


            <!-- CHỈ 2 NÚT TỰ THIẾT KẾ -->

            <div
                class="custom-controls"
                id="customControls"
            >

                <button
                    class="control-btn"
                    id="fullscreenBtn"
                    type="button"
                    aria-label="Toàn màn hình"
                >
                    ⛶
                </button>


                <button
                    class="control-btn"
                    id="exitFullscreenBtn"
                    type="button"
                    aria-label="Thoát toàn màn hình"
                    style="display:none"
                >
                    ×
                </button>

            </div>

        </div>


        <!-- ĐANG PHÁT -->

        <div class="now-playing">

            <div class="now-content">

                <div class="now-label">

                    <span class="live-dot"></span>

                    ĐANG PHÁT

                </div>

                <div
                    class="now-title"
                    id="nowPlaying"
                >
                    Chưa chọn kênh
                </div>

            </div>

        </div>

    </section>


    <!-- =================================================
         CHANNEL LIST
    ================================================== -->

    <section class="channel-area">

        <div class="channel-inner">

            <div
                class="status"
                id="status"
            >
                Đang tải danh sách kênh...
            </div>


            <div
                id="channels"
                class="channels"
            >

                <div class="loading">
                    Đang tải...
                </div>

            </div>

        </div>

    </section>

</main>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const player =
    document.getElementById("player");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");

const customControls =
    document.getElementById("customControls");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const exitFullscreenBtn =
    document.getElementById("exitFullscreenBtn");


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];

let hls = null;

let currentChannel = null;

let controlsTimer = null;

let wakeLock = null;


/* =====================================================
   WAKE LOCK
   GIỮ MÀN HÌNH SÁNG
===================================================== */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator &&
            document.visibilityState ===
            "visible"
        ) {

            if (wakeLock) {
                return;
            }

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

            console.log(
                "Wake Lock: ON"
            );

            wakeLock.addEventListener(
                "release",
                () => {

                    wakeLock = null;

                }
            );
        }

    } catch (error) {

        console.log(
            "Wake Lock:",
            error
        );
    }
}


/* =====================================================
   KHI QUAY LẠI APP
===================================================== */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                !video.paused &&
                video.src
            ) {

                await requestWakeLock();

            }

        }

    }
);


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist() {

    try {

        const response =
            await fetch(PLAYLIST);

        if (!response.ok) {

            throw new Error(
                "Playlist error"
            );
        }


        const text =
            await response.text();


        channels =
            parseM3U(text);


        /*
         * ĐƯA VTV LÊN ĐẦU
         */

        channels.sort(
            (a, b) => {

                const av =
                    /^VTV/i.test(
                        a.name
                    );

                const bv =
                    /^VTV/i.test(
                        b.name
                    );

                if (
                    av &&
                    !bv
                ) {
                    return -1;
                }

                if (
                    !av &&
                    bv
                ) {
                    return 1;
                }

                return 0;

            }
        );


        statusText.innerText =
            `Đã tải ${channels.length} kênh`;


        renderChannels(
            channels
        );


    } catch (error) {

        console.error(error);


        statusText.innerText =
            "❌ Không thể tải danh sách kênh";


        channelsBox.innerHTML = `

            <div class="empty">
                Không tải được playlist IPTV.
            </div>

        `;
    }
}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith(
                "#EXTINF"
            )
        ) {

            const nameMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""

            };


        } else if (

            info &&
            line &&
            !line.startsWith("#")

        ) {

            result.push({

                name:
                    info.name,

                logo:
                    info.logo,

                id:
                    info.id,

                url:
                    line

            });


            info = null;
        }
    }


    return result;
}


/* =====================================================
   RENDER
===================================================== */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (!list.length) {

        channelsBox.innerHTML = `

            <div class="empty">
                Không tìm thấy kênh
            </div>

        `;

        return;
    }


    const fragment =
        document.createDocumentFragment();


    list.forEach(
        channel => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            if (
                currentChannel &&
                currentChannel.url ===
                channel.url
            ) {

                item.classList.add(
                    "active"
                );
            }


            let logoHTML;


            if (channel.logo) {

                logoHTML = `

                    <img
                        class="channel-logo"
                        src="${escapeHtml(channel.logo)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                        "
                    >

                `;

            } else {

                logoHTML = `

                    <div class="no-logo">
                        TV
                    </div>

                `;
            }


            item.innerHTML = `

                ${logoHTML}

                <div class="channel-name">
                    ${escapeHtml(channel.name)}
                </div>

                <div class="channel-quality">
                    LIVE
                </div>

            `;


            item.addEventListener(
                "click",
                () => {

                    playChannel(
                        channel
                    );

                }
            );


            fragment.appendChild(
                item
            );

        }
    );


    channelsBox.appendChild(
        fragment
    );
}


/* =====================================================
   PLAY CHANNEL
===================================================== */

async function playChannel(
    channel
) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    /*
     * Destroy HLS cũ
     */

    if (hls) {

        try {
            hls.destroy();
        } catch (e) {}

        hls = null;
    }


    /*
     * Dừng video cũ
     */

    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    const url =
        channel.url;


    /*
     * HLS.JS
     */

    if (
        url.includes(".m3u8") &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 20,

                maxMaxBufferLength: 30

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                try {

                    await video.play();

                    await requestWakeLock();

                } catch (error) {

                    console.log(
                        "Autoplay:",
                        error
                    );

                }

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.log(
                    "HLS:",
                    data
                );


                if (
                    data.fatal
                ) {

                    if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ) {

                        hls.startLoad();

                    } else if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ) {

                        hls.recoverMediaError();

                    }

                }

            }
        );


    }

    /*
     * Native HLS
     */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            async function onLoaded() {

                video.removeEventListener(
                    "loadedmetadata",
                    onLoaded
                );


                try {

                    await video.play();

                    await requestWakeLock();

                } catch (error) {}

            }
        );


    }

    /*
     * Other
     */

    else {

        video.src =
            url;


        try {

            await video.play();

            await requestWakeLock();

        } catch (error) {}

    }


    renderChannels(
        filterChannels()
    );


    showControls();
}


/* =====================================================
   CUSTOM CONTROLS
===================================================== */

function showControls() {

    customControls.classList.remove(
        "hidden"
    );


    clearTimeout(
        controlsTimer
    );


    controlsTimer =
        setTimeout(
            () => {

                customControls.classList.add(
                    "hidden"
                );

            },
            3000
        );
}


/* =====================================================
   CLICK PLAYER
===================================================== */

player.addEventListener(
    "click",
    function(event) {

        if (
            event.target.closest(
                ".control-btn"
            )
        ) {

            return;
        }


        showControls();

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

async function enterFullscreen() {

    showControls();


    try {

        if (
            player.requestFullscreen
        ) {

            await player.requestFullscreen();

        } else if (
            player.webkitRequestFullscreen
        ) {

            player.webkitRequestFullscreen();

        }

    } catch (error) {

        console.log(
            "Fullscreen:",
            error
        );
    }


    /*
     * Không bắt buộc khóa xoay.
     * Điện thoại có thể quay ngang/dọc.
     */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    } catch (error) {}


    /*
     * Giữ sáng màn hình
     */

    await requestWakeLock();


    updateFullscreenButtons();
}


async function exitFullscreen() {

    try {

        if (
            document.exitFullscreen
        ) {

            await document.exitFullscreen();

        } else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

    } catch (error) {}


    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    } catch (error) {}


    if (!video.paused) {

        await requestWakeLock();

    }


    updateFullscreenButtons();
}


/* =====================================================
   BUTTONS
===================================================== */

fullscreenBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        enterFullscreen();

    }
);


exitFullscreenBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        exitFullscreen();

    }
);


/* =====================================================
   FULLSCREEN STATE
===================================================== */

function isFullscreen() {

    return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement
    );
}


function updateFullscreenButtons() {

    if (
        isFullscreen()
    ) {

        fullscreenBtn.style.display =
            "none";

        exitFullscreenBtn.style.display =
            "flex";

    } else {

        fullscreenBtn.style.display =
            "flex";

        exitFullscreenBtn.style.display =
            "none";
    }


    showControls();
}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenButtons
);


document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButtons
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;

    }


    return channels.filter(
        channel =>
            channel.name
                .toLowerCase()
                .includes(keyword)
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   START
===================================================== */

loadPlaylist();

</script>
