 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietnam TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #111116;
    padding: 14px;
    border-bottom: 1px solid #292932;
}

.header {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

.search {
    flex: 1;
    background: #1c1c24;
    border: 1px solid #33333e;
    border-radius: 12px;
    padding: 12px 15px;
    color: white;
    outline: none;
    font-size: 15px;
}

.search:focus {
    border-color: #7777ff;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 18px;
}

.player-box {
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #292929;
    margin-bottom: 20px;
}

video {
    width: 100%;
    height: auto;
    min-height: 250px;
    max-height: 75vh;
    display: block;
    background: #000;
}

.now-playing {
    background: #15151b;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
}

.status {
    color: #aaa;
    margin-bottom: 15px;
}

.channels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}

.channel {
    background: #15151b;
    border: 1px solid #292932;
    border-radius: 13px;
    padding: 12px;
    cursor: pointer;
    transition: .2s;
}

.channel:hover {
    transform: translateY(-2px);
    border-color: #6666ff;
    background: #1b1b24;
}

.channel.active {
    border-color: #7777ff;
    box-shadow: 0 0 15px rgba(100,100,255,.25);
}

.channel-logo {
    width: 100%;
    height: 80px;
    object-fit: contain;
    background: #0d0d11;
    border-radius: 9px;
    margin-bottom: 10px;
}

.channel-name {
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #888;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #aaa;
}

@media(max-width:600px) {
    .header {
        flex-wrap: wrap;
    }

    .logo {
        width: 100%;
    }

    .container {
        padding: 10px;
    }

    video {
        min-height: 210px;
    }

    .channels {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .channel {
        padding: 8px;
    }

    .channel-logo {
        height: 65px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <div class="logo">📺 Vietnam TV</div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔎 Tìm kiếm kênh..."
        >
    </div>
</header>

<div class="container">

    <div class="player-box">
        <video id="video" controls playsinline></video>
        <div class="now-playing" id="nowPlaying">
            Chưa chọn kênh
        </div>
    </div>

    <div class="status" id="status">
        Đang tải danh sách kênh...
    </div>

    <div id="channels" class="channels">
        <div class="loading">Đang tải...</div>
    </div>

</div>

<script>

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";

const video = document.getElementById("video");
const channelsBox = document.getElementById("channels");
const statusText = document.getElementById("status");
const nowPlaying = document.getElementById("nowPlaying");
const searchInput = document.getElementById("search");

let channels = [];
let hls = null;
let currentChannel = null;


/* =========================
   LOAD M3U
========================= */

async function loadPlaylist() {

    try {

        const response = await fetch(PLAYLIST);

        if (!response.ok) {
            throw new Error("Không thể tải playlist");
        }

        const text = await response.text();

        channels = parseM3U(text);

        statusText.innerText =
            `Đã tải ${channels.length} kênh`;

        renderChannels(channels);

    } catch (error) {

        console.error(error);

        statusText.innerText =
            "❌ Không thể tải danh sách kênh";

        channelsBox.innerHTML = `
            <div class="empty">
                Không tải được playlist IPTV.
            </div>
        `;
    }
}


/* =========================
   PARSE M3U
========================= */

function parseM3U(text) {

    const lines = text.split(/\r?\n/);

    const result = [];

    let info = null;

    for (let i = 0; i < lines.length; i++) {

        const line = lines[i].trim();

        if (line.startsWith("#EXTINF")) {

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(/tvg-logo="([^"]*)"/);

            info = {
                name: nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo: logoMatch
                    ? logoMatch[1]
                    : ""
            };

        } else if (
            info &&
            line &&
            !line.startsWith("#")
        ) {

            result.push({
                name: info.name,
                logo: info.logo,
                url: line
            });

            info = null;
        }
    }

    return result;
}


/* =========================
   DISPLAY CHANNELS
========================= */

function renderChannels(list) {

    channelsBox.innerHTML = "";

    if (list.length === 0) {

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh
            </div>
        `;

        return;
    }

    list.forEach(channel => {

        const item =
            document.createElement("div");

        item.className = "channel";

        if (
            currentChannel &&
            currentChannel.url === channel.url
        ) {
            item.classList.add("active");
        }

        item.innerHTML = `

            ${
                channel.logo
                ?
                `<img
                    class="channel-logo"
                    src="${escapeHtml(channel.logo)}"
                    loading="lazy"
                    onerror="this.style.display='none'"
                >`
                :
                `<div class="channel-logo"></div>`
            }

            <div class="channel-name">
                ${escapeHtml(channel.name)}
            </div>
        `;

        item.onclick = () => {
            playChannel(channel);
        };

        channelsBox.appendChild(item);
    });
}


/* =========================
   PLAY CHANNEL
========================= */

function playChannel(channel) {

    currentChannel = channel;

    nowPlaying.innerText =
        "📺 " + channel.name;

    const url = channel.url;

    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();

    /*
     * HLS.js
     */

    if (
        url.includes(".m3u8") &&
        Hls.isSupported()
    ) {

        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
        });

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {

            video.play().catch(() => {});

        });

        hls.on(
            Hls.Events.ERROR,
            function(event, data) {

                console.log(
                    "HLS error:",
                    data
                );

            }
        );

    }

    /*
     * Native HLS
     * Safari / iPhone
     */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = url;

        video.play().catch(() => {});

    }

    /*
     * Other stream
     */

    else {

        video.src = url;

        video.play().catch(() => {});
    }

    renderChannels(
        filterChannels()
    );
}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    function() {

        const list =
            filterChannels();

        renderChannels(list);
    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();

    if (!keyword) {
        return channels;
    }

    return channels.filter(channel =>
        channel.name
            .toLowerCase()
            .includes(keyword)
    );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

loadPlaylist();

</script>

</body>
</html>
