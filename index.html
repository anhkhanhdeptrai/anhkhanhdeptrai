<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#080910">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 0% 0%,
            #21183d 0,
            #0b0c14 38%,
            #05060a 100%
        );

    color: #fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* =====================================================
   HEADER
===================================================== */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    padding: 11px 15px;

    background:
        rgba(7,8,14,.88);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.header-inner {
    width: 100%;
    max-width: 1450px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 18px;
}

/* =====================================================
   LOGO
===================================================== */

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    flex-shrink: 0;
}

.brand-logo {
    position: relative;

    width: 43px;
    height: 43px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #6957ff,
            #9b4dff 48%,
            #ff4e9a
        );

    box-shadow:
        0 7px 25px rgba(123,82,255,.3);
}

/* TV screen */

.brand-logo::before {
    content: "";

    position: absolute;

    left: 10px;
    top: 11px;

    width: 23px;
    height: 16px;

    border:
        2px solid #fff;

    border-radius: 4px;
}

/* TV stand */

.brand-logo::after {
    content: "";

    position: absolute;

    left: 15px;
    bottom: 9px;

    width: 13px;
    height: 2px;

    background: #fff;

    border-radius: 10px;
}

.brand-name {
    font-size: 20px;
    font-weight: 900;

    letter-spacing: -.6px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #cfc4ff,
            #ff79b3
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.brand-sub {
    margin-top: 1px;

    color: #888b9d;

    font-size: 8px;

    letter-spacing: 2px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-wrap {
    position: relative;

    flex: 1;

    max-width: 650px;

    margin-left: auto;
}

.search-icon {
    position: absolute;

    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: #9295a7;

    font-size: 20px;

    pointer-events: none;
}

.search {
    width: 100%;
    height: 44px;

    padding: 0 16px 0 43px;

    border-radius: 14px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.055);

    color: white;

    outline: none;

    font-size: 14px;

    transition: .2s;
}

.search::placeholder {
    color: #777a8b;
}

.search:focus {
    border-color:
        rgba(139,92,246,.75);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.09);
}

/* =====================================================
   MAIN
===================================================== */

.container {
    width: 100%;
    max-width: 1450px;

    margin: auto;

    padding: 18px 15px 40px;
}

/* =====================================================
   PLAYER
===================================================== */

.player-box {
    position: relative;

    width: 100%;

    max-width: 1100px;

    margin:
        0 auto 16px;

    background: #000;

    border-radius: 18px;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);

    transition: none;
}

/* =====================================================
   VIDEO
===================================================== */

.video-area {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}

video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: block;

    outline: none;
}

/* =====================================================
   CUSTOM FULLSCREEN
===================================================== */

.player-box.fullscreen {

    position: fixed;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    width: 100vw;
    height: 100vh;

    max-width: none;

    margin: 0;

    border: 0;

    border-radius: 0;

    z-index: 999999;

    background: #000;

    display: block;
}

.player-box.fullscreen .video-area {

    position: absolute;

    inset: 0;

    width: 100vw;
    height: 100vh;

    aspect-ratio: auto;

    background: #000;
}

.player-box.fullscreen video {

    position: absolute;

    inset: 0;

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: #000;
}

/* =====================================================
   NOW PLAYING
===================================================== */

.now-playing {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 20;

    padding:
        40px 16px 13px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            rgba(0,0,0,.45),
            transparent
        );

    font-size: 14px;

    font-weight: 700;

    pointer-events: none;

    transition: opacity .25s;
}

.player-box.fullscreen .now-playing {
    opacity: 0;
}

.player-box.ui-visible .now-playing {
    opacity: 1;
}

/* =====================================================
   CUSTOM BUTTONS
===================================================== */

.player-buttons {
    position: absolute;

    right: 13px;
    bottom: 52px;

    z-index: 50;

    display: flex;

    gap: 7px;

    opacity: 0;

    transform: translateY(5px);

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.player-box.ui-visible .player-buttons {

    opacity: 1;

    transform: translateY(0);

    pointer-events: auto;
}

.player-button {
    width: 42px;
    height: 42px;

    border: 1px solid
        rgba(255,255,255,.16);

    border-radius: 12px;

    background:
        rgba(10,10,15,.78);

    color: #fff;

    font-size: 21px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.3);
}

.player-button:active {
    transform: scale(.92);
}

.player-button:hover {
    background:
        rgba(112,86,255,.85);
}

/* =====================================================
   STATUS
===================================================== */

.status {
    display: flex;

    align-items: center;

    gap: 8px;

    margin:
        8px 2px 15px;

    color: #9295a8;

    font-size: 13px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #48e58c;

    box-shadow:
        0 0 10px
        rgba(72,229,140,.75);
}

/* =====================================================
   CHANNELS
===================================================== */

.channels {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );

    gap: 12px;
}

.channel {
    position: relative;

    padding: 9px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,.075);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .18s,
        border .18s,
        box-shadow .18s;
}

.channel:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(139,92,246,.6);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.25);
}

.channel:active {
    transform: scale(.98);
}

.channel.active {

    border-color:
        #8b6cff;

    box-shadow:
        0 0 0 1px
        rgba(139,108,255,.2),

        0 8px 30px
        rgba(116,87,255,.18);
}

.channel-logo {

    width: 100%;
    height: 82px;

    display: block;

    object-fit: contain;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            #101119,
            #08090e
        );

    margin-bottom: 9px;
}

.channel-name {

    font-size: 13px;

    font-weight: 700;

    line-height: 18px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.empty,
.loading {

    grid-column: 1 / -1;

    text-align: center;

    padding: 45px 20px;

    color: #777b8e;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width:700px) {

    header {
        padding: 9px 10px;
    }

    .header-inner {

        gap: 9px;

        flex-wrap: wrap;
    }

    .brand-logo {
        width: 38px;
        height: 38px;
    }

    .brand-logo::before {
        left: 9px;
        top: 10px;
    }

    .brand-name {
        font-size: 18px;
    }

    .brand-sub {
        font-size: 7px;
    }

    .search-wrap {

        order: 3;

        width: 100%;

        max-width: none;
    }

    .search {
        height: 42px;
    }

    .container {
        padding:
            10px 9px 30px;
    }

    .player-box {
        border-radius: 13px;
    }

    .video-area {
        aspect-ratio: 16 / 9;
    }

    .channels {

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap: 8px;
    }

    .channel {
        padding: 7px;
        border-radius: 12px;
    }

    .channel-logo {
        height: 65px;
        border-radius: 8px;
        margin-bottom: 7px;
    }

    .channel-name {
        font-size: 12px;
        line-height: 17px;
    }

    .player-button {
        width: 38px;
        height: 38px;
    }
}

/* =====================================================
   MOBILE LANDSCAPE
   TỰ FULL MÀN HÌNH
===================================================== */

@media
(max-width:900px)
and (orientation:landscape) {

    body {
        overflow: hidden;
        background: #000;
    }

    header,
    .container {
        display: none !important;
    }

    .player-box {

        position: fixed !important;

        inset: 0 !important;

        width: 100vw !important;
        height: 100vh !important;

        max-width: none !important;

        margin: 0 !important;

        border: 0 !important;

        border-radius: 0 !important;

        z-index: 999999 !important;

        background: #000 !important;
    }

    .video-area {

        position: absolute !important;

        inset: 0 !important;

        width: 100vw !important;
        height: 100vh !important;

        aspect-ratio: auto !important;
    }

    video {

        position: absolute !important;

        inset: 0 !important;

        width: 100vw !important;
        height: 100vh !important;

        object-fit: contain !important;
    }

    .player-buttons {
        bottom: 25px;
    }
}

</style>
</head>


<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header-inner">

        <div class="brand">

            <div class="brand-logo"></div>

            <div>

                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    LIVE TELEVISION
                </div>

            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="search"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

    <div
        id="playerBox"
        class="player-box"
    >

        <div class="video-area">

            <!--
                QUAN TRỌNG:
                Không dùng controls để tránh
                nút fullscreen thứ 2.
            -->

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="metadata"
            ></video>


            <!-- CUSTOM BUTTON -->

            <div
                id="playerButtons"
                class="player-buttons"
            >

                <button
                    id="fullscreenBtn"
                    class="player-button"
                    type="button"
                    aria-label="Toàn màn hình"
                >
                    ⛶
                </button>

                <button
                    id="exitBtn"
                    class="player-button"
                    type="button"
                    aria-label="Thoát toàn màn hình"
                    style="display:none"
                >
                    ×
                </button>

            </div>


            <div
                id="nowPlaying"
                class="now-playing"
            >
                Chưa chọn kênh
            </div>

        </div>

    </div>


    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Đang tải danh sách kênh...
        </span>

    </div>


    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>


<script>

/* =====================================================
   CONFIG
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const playerBox =
    document.getElementById("playerBox");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const exitBtn =
    document.getElementById("exitBtn");

const playerButtons =
    document.getElementById("playerButtons");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];

let currentChannel = null;

let hls = null;

let wakeLock = null;

let hideTimer = null;


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist() {

    try {

        const response =
            await fetch(
                PLAYLIST,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "Playlist error"
            );
        }

        const text =
            await response.text();

        channels =
            parseM3U(text);


        /*
         * Đưa toàn bộ VTV lên đầu.
         */

        channels.sort(
            function(a,b) {

                const aVTV =
                    /^VTV\d+/i.test(
                        a.name
                    );

                const bVTV =
                    /^VTV\d+/i.test(
                        b.name
                    );

                if (
                    aVTV &&
                    !bVTV
                ) {
                    return -1;
                }

                if (
                    !aVTV &&
                    bVTV
                ) {
                    return 1;
                }

                return 0;
            }
        );


        statusText.innerHTML = `
            <span class="status-dot"></span>
            <span>
                Đã tải ${channels.length} kênh
            </span>
        `;


        renderChannels(channels);

    }

    catch(error) {

        console.error(error);

        statusText.innerHTML = `
            <span style="
                color:#ff5368;
            ">●</span>

            <span>
                Không thể tải danh sách kênh
            </span>
        `;

        channelsBox.innerHTML = `
            <div class="empty">
                Không tải được playlist IPTV.
            </div>
        `;
    }
}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith(
                "#EXTINF"
            )
        ) {

            const nameMatch =
                line.match(
                    /,(.*)$/
                );

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""
            };
        }


        else if (
            info &&
            line &&
            !line.startsWith("#")
        ) {

            result.push({

                name: info.name,

                logo: info.logo,

                id: info.id,

                url: line
            });

            info = null;
        }
    }


    return result;
}


/* =====================================================
   RENDER
===================================================== */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (!list.length) {

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh.
            </div>
        `;

        return;
    }


    list.forEach(
        function(channel) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "channel";


            if (
                currentChannel &&
                currentChannel.url ===
                channel.url
            ) {

                item.classList.add(
                    "active"
                );
            }


            const logo =
                document.createElement(
                    "img"
                );

            logo.className =
                "channel-logo";

            logo.loading =
                "lazy";

            logo.alt =
                channel.name;


            if (channel.logo) {

                logo.src =
                    channel.logo;

            }

            else {

                logo.style.display =
                    "none";
            }


            logo.onerror =
                function() {

                    this.style.display =
                        "none";
                };


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "channel-name";

            name.textContent =
                channel.name;


            item.appendChild(logo);

            item.appendChild(name);


            item.onclick =
                function() {

                    playChannel(channel);
                };


            channelsBox.appendChild(item);

        }
    );
}


/* =====================================================
   PLAY
===================================================== */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.textContent =
        "●  " + channel.name;


    requestWakeLock();


    if (hls) {

        try {
            hls.destroy();
        }
        catch(e) {}

        hls = null;
    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    const url =
        channel.url;


    /*
     * HLS.JS
     */

    if (
        url.includes(".m3u8")
        &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 30

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                video.play()
                    .catch(
                        function() {}
                    );
            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ) {

                console.log(
                    "HLS error:",
                    data
                );


                if (
                    data.fatal
                    &&
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    setTimeout(
                        function() {

                            try {
                                hls.startLoad();
                            }
                            catch(e) {}

                        },
                        1000
                    );
                }

            }
        );
    }


    /*
     * Native HLS
     */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;

        video.play()
            .catch(
                function() {}
            );
    }


    /*
     * Other
     */

    else {

        video.src =
            url;

        video.play()
            .catch(
                function() {}
            );
    }


    renderChannels(
        filterChannels()
    );


    /*
     * Nếu đang xem bình thường,
     * đưa player về đầu.
     */

    if (
        !playerBox.classList.contains(
            "fullscreen"
        )
    ) {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    showUI();
}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {
        return channels;
    }


    return channels.filter(
        function(channel) {

            return channel.name
                .toLowerCase()
                .includes(keyword);
        }
    );
}


/* =====================================================
   WAKE LOCK
===================================================== */

async function requestWakeLock() {

    try {

        if (
            !("wakeLock" in navigator)
        ) {
            return;
        }


        if (
            wakeLock &&
            !wakeLock.released
        ) {
            return;
        }


        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        wakeLock.addEventListener(
            "release",
            function() {

                wakeLock = null;
            }
        );

    }

    catch(error) {

        console.log(
            "WakeLock:",
            error
        );
    }
}


/* =====================================================
   RE-REQUEST WAKELOCK
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
            &&
            currentChannel
        ) {

            requestWakeLock();
        }
    }
);


/* =====================================================
   FULLSCREEN CSS
===================================================== */

function enterFullscreen() {

    if (!currentChannel) {
        return;
    }


    requestWakeLock();


    playerBox.classList.add(
        "fullscreen"
    );


    document.body.style.overflow =
        "hidden";


    fullscreenBtn.style.display =
        "none";

    exitBtn.style.display =
        "flex";


    showUI();


    /*
     * KHÔNG dùng requestFullscreen().
     *
     * Đây là điểm quan trọng giúp
     * tránh lỗi màn đen khi xoay ngang.
     */

}


/* =====================================================
   EXIT FULLSCREEN
===================================================== */

function exitFullscreen() {

    playerBox.classList.remove(
        "fullscreen"
    );


    document.body.style.overflow =
        "";


    fullscreenBtn.style.display =
        "flex";

    exitBtn.style.display =
        "none";


    requestWakeLock();


    showUI();
}


/* =====================================================
   BUTTON FULLSCREEN
===================================================== */

fullscreenBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        enterFullscreen();

    }
);


/* =====================================================
   BUTTON EXIT
===================================================== */

exitBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        exitFullscreen();

    }
);


/* =====================================================
   SHOW / HIDE BUTTONS
===================================================== */

function showUI() {

    playerBox.classList.add(
        "ui-visible"
    );


    clearTimeout(
        hideTimer
    );


    hideTimer =
        setTimeout(
            function() {

                playerBox.classList.remove(
                    "ui-visible"
                );

            },
            2000
        );
}


/* =====================================================
   CLICK PLAYER
===================================================== */

playerBox.addEventListener(
    "click",
    function(e) {

        if (
            e.target.closest(
                ".player-button"
            )
        ) {
            return;
        }


        if (
            playerBox.classList.contains(
                "fullscreen"
            )
        ) {

            if (
                playerBox.classList.contains(
                    "ui-visible"
                )
            ) {

                playerBox.classList.remove(
                    "ui-visible"
                );

            }

            else {

                showUI();
            }

        }

        else {

            showUI();
        }
    }
);


/* =====================================================
   TOUCH
===================================================== */

playerBox.addEventListener(
    "touchstart",
    function() {

        if (
            playerBox.classList.contains(
                "fullscreen"
            )
        ) {

            showUI();
        }

    },
    {
        passive: true
    }
);


/* =====================================================
   VIDEO PLAY
===================================================== */

video.addEventListener(
    "play",
    function() {

        requestWakeLock();

    }
);


/* =====================================================
   ORIENTATION
===================================================== */

function handleOrientation() {

    const isMobile =
        window.innerWidth <= 900;

    const isLandscape =
        window.innerWidth >
        window.innerHeight;


    /*
     * ĐIỆN THOẠI QUAY NGANG
     */

    if (
        isMobile &&
        isLandscape &&
        currentChannel
    ) {

        playerBox.classList.add(
            "fullscreen"
        );

        document.body.style.overflow =
            "hidden";


        fullscreenBtn.style.display =
            "none";

        exitBtn.style.display =
            "flex";


        requestWakeLock();

        showUI();
    }


    /*
     * ĐIỆN THOẠI QUAY DỌC
     */

    else if (
        isMobile &&
        !isLandscape
    ) {

        playerBox.classList.remove(
            "fullscreen"
        );

        document.body.style.overflow =
            "";


        fullscreenBtn.style.display =
            "flex";

        exitBtn.style.display =
            "none";
    }
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        handleOrientation();


        if (currentChannel) {

            setTimeout(
                requestWakeLock,
                300
            );
        }
    }
);


/* =====================================================
   ORIENTATION CHANGE
===================================================== */

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            function() {

                handleOrientation();

                requestWakeLock();

            },
            400
        );

    }
);


/* =====================================================
   START
===================================================== */

fullscreenBtn.style.display =
    "flex";

exitBtn.style.display =
    "none";

loadPlaylist();

</script>

</body>
</html>
