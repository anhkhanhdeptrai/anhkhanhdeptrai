<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">

<title>KHANH TV 📺</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#09090b;
    --card:#111114;
    --border:#292930;
    --text:#fff;
    --muted:#92929b;
    --accent:#6d5dfc;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at top,
            #17152b 0,
            #09090b 40%
        );
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

.top-header{
    position:relative;
    z-index:1000;
    width:100%;
    height:64px;

    background:
        linear-gradient(
            180deg,
            rgba(18,18,23,.98),
            rgba(10,10,13,.97)
        );

    border-bottom:
        1px solid rgba(255,255,255,.07);

    box-shadow:
        0 5px 25px rgba(0,0,0,.25);
}

.top-bar{
    width:100%;
    max-width:1450px;
    height:100%;
    margin:auto;

    padding:0 20px;

    display:flex;
    align-items:center;
    gap:22px;
}


/* =====================================================
   BRAND
===================================================== */

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    flex-shrink:0;
    user-select:none;
}

.brand-icon{
    width:40px;
    height:40px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #7868ff,
            #5140dc
        );

    box-shadow:
        0 5px 20px
        rgba(108,91,255,.35);

    position:relative;
    overflow:hidden;
}

.brand-icon::after{
    content:"";

    position:absolute;

    width:25px;
    height:25px;

    border-radius:50%;

    background:
        rgba(255,255,255,.12);

    top:-10px;
    right:-8px;
}

.brand-icon span{
    position:relative;
    z-index:2;

    font-size:21px;

    filter:
        drop-shadow(
            0 2px 5px
            rgba(0,0,0,.3)
        );
}

.brand-text{
    display:flex;
    flex-direction:column;
    line-height:1;
}

.brand-name{
    font-size:18px;
    font-weight:900;
    letter-spacing:.3px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c8c3ff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.brand-sub{
    margin-top:5px;

    font-size:7px;
    letter-spacing:1.2px;

    color:#777782;
    font-weight:700;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box{
    position:relative;

    width:100%;
    max-width:560px;

    margin-left:auto;
}

.search-box::before{
    content:"";

    position:absolute;
    inset:-1px;

    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            rgba(108,91,255,0),
            rgba(108,91,255,.18),
            rgba(108,91,255,0)
        );

    opacity:0;

    transition:.25s;

    pointer-events:none;
}

.search-box:focus-within::before{
    opacity:1;
}

.search{
    width:100%;
    height:42px;

    padding:
        0 43px
        0 43px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:
        rgba(255,255,255,.055);

    color:#fff;

    font-size:13px;

    transition:.2s ease;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);
}

.search::placeholder{
    color:#696970;
}

.search:hover{
    background:
        rgba(255,255,255,.07);

    border-color:
        rgba(255,255,255,.12);
}

.search:focus{
    background:
        rgba(255,255,255,.075);

    border-color:
        rgba(108,91,255,.65);

    box-shadow:
        0 0 0 3px
        rgba(108,91,255,.10),
        0 5px 25px
        rgba(0,0,0,.2);
}


/* SEARCH ICON */

.search-box .search-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    width:18px;
    height:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777780;

    pointer-events:none;

    transition:.2s;
}

.search-box:focus-within
.search-icon{
    color:#8d82ff;
}


/* CLEAR */

.clear-search{
    position:absolute;

    right:8px;
    top:50%;

    transform:
        translateY(-50%);

    width:27px;
    height:27px;

    border:0;

    border-radius:8px;

    background:transparent;

    color:#777780;

    font-size:20px;
    line-height:1;

    cursor:pointer;

    display:none;

    align-items:center;
    justify-content:center;

    transition:.15s;
}

.clear-search:hover{
    background:
        rgba(255,255,255,.08);

    color:#fff;
}

.clear-search.show{
    display:flex;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:calc(100vh - 64px);

    display:flex;
    overflow:hidden;
}


/* =====================================================
   PLAYER
===================================================== */

.player-area{
    flex:1;
    min-width:0;
    height:100%;

    overflow:hidden;

    padding:20px;
}

.player-box{
    width:100%;
    max-width:1100px;

    margin:0 auto;

    background:#000;

    border:
        1px solid #252529;

    border-radius:17px;

    overflow:hidden;

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.35);
}

.video-wrap{
    position:relative;

    width:100%;

    aspect-ratio:16/9;

    background:#000;
}

video{
    width:100%;
    height:100%;

    display:block;

    object-fit:contain;

    background:#000;
}

.video-placeholder{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:10px;

    color:#666;

    pointer-events:none;
}

.video-placeholder span{
    font-size:42px;
}

.video-placeholder small{
    font-size:13px;
}


/* NOW PLAYING */

.now-playing{
    min-height:65px;

    padding:12px 15px;

    background:#111114;

    border-top:
        1px solid #202024;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;
}

.now-title{
    min-width:0;
}

.now-label{
    color:#777780;

    font-size:10px;

    margin-bottom:4px;

    text-transform:uppercase;

    letter-spacing:.6px;
}

.now-name{
    font-size:15px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.live{
    flex-shrink:0;

    display:flex;
    align-items:center;

    gap:6px;

    padding:6px 9px;

    border-radius:8px;

    background:
        rgba(255,55,75,.1);

    color:#ff6574;

    font-size:10px;

    font-weight:800;
}

.live-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff5264;

    box-shadow:
        0 0 8px #ff5264;
}


/* =====================================================
   CHANNEL PANEL
===================================================== */

.channels-panel{
    width:360px;

    height:100%;

    flex-shrink:0;

    display:flex;
    flex-direction:column;

    background:
        rgba(13,13,16,.96);

    border-left:
        1px solid var(--border);
}

.panel-header{
    flex-shrink:0;

    padding:15px 17px;

    border-bottom:
        1px solid var(--border);
}

.panel-title{
    font-size:15px;

    font-weight:800;

    margin-bottom:5px;
}

.panel-status{
    color:var(--muted);

    font-size:11px;
}


/* =====================================================
   CHANNEL LIST
===================================================== */

.channels{
    flex:1;

    overflow-y:auto;

    padding:12px;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    align-content:start;

    gap:9px;

    scrollbar-width:thin;

    scrollbar-color:
        #34343d
        transparent;

    -webkit-overflow-scrolling:touch;
}

.channels::-webkit-scrollbar{
    width:5px;
}

.channels::-webkit-scrollbar-track{
    background:transparent;
}

.channels::-webkit-scrollbar-thumb{
    background:#34343d;
    border-radius:10px;
}

.vtv-section{
    grid-column:1/-1;

    padding:4px 2px 1px;

    color:#aaa2ff;

    font-size:11px;

    font-weight:800;

    letter-spacing:.5px;
}


/* CHANNEL */

.channel{
    position:relative;

    min-width:0;

    background:
        linear-gradient(
            145deg,
            #17171b,
            #101013
        );

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:7px;

    cursor:pointer;

    transition:.18s;
}

.channel:hover{
    border-color:#4d46a5;

    transform:
        translateY(-1px);

    background:#1a1a20;
}

.channel:active{
    transform:scale(.97);
}

.channel.active{
    border-color:
        var(--accent);

    box-shadow:
        0 0 0 1px
        var(--accent);

    background:
        rgba(109,93,252,.08);
}

.channel-logo-wrap{
    position:relative;

    width:100%;
    height:65px;

    border-radius:8px;

    background:#0b0b0e;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;
}

.channel-logo{
    width:100%;
    height:100%;

    padding:6px;

    object-fit:contain;
}

.channel-fallback{
    font-size:24px;

    opacity:.4;
}

.channel-name{
    padding:7px 2px 2px;

    font-size:11px;

    font-weight:650;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-live{
    position:absolute;

    top:7px;
    left:7px;

    padding:2px 5px;

    border-radius:4px;

    font-size:7px;

    font-weight:800;

    background:#ef4050;

    color:#fff;
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty{
    grid-column:1/-1;

    text-align:center;

    color:#777780;

    padding:40px 15px;
}

.empty-icon{
    font-size:32px;

    margin-bottom:8px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .top-header{
        height:58px;
    }

    .top-bar{
        padding:0 9px;

        gap:9px;
    }

    .brand{
        gap:7px;
    }

    .brand-icon{
        width:35px;
        height:35px;

        border-radius:10px;
    }

    .brand-icon span{
        font-size:18px;
    }

    .brand-text{
        display:none;
    }

    .search-box{
        flex:1;

        max-width:none;

        margin:0;
    }

    .search{
        height:39px;

        border-radius:12px;

        font-size:12px;

        padding-left:40px;
    }

    .search-box .search-icon{
        left:13px;
    }

    .app{
        height:calc(100vh - 58px);

        display:flex;

        flex-direction:column;

        overflow:hidden;
    }

    .player-area{
        flex:none;

        width:100%;

        height:auto;

        padding:0;

        overflow:hidden;
    }

    .player-box{
        width:100%;

        max-width:none;

        margin:0;

        border:0;

        border-radius:0;

        box-shadow:none;
    }

    .video-wrap{
        width:100%;

        aspect-ratio:16/9;
    }

    .now-playing{
        min-height:52px;

        padding:8px 11px;
    }

    .now-label{
        font-size:9px;
    }

    .now-name{
        font-size:13px;
    }

    .live{
        font-size:9px;

        padding:5px 7px;
    }

    .channels-panel{
        width:100%;

        height:auto;

        min-height:0;

        flex:1;

        border-left:0;

        border-top:
            1px solid var(--border);
    }

    .panel-header{
        padding:9px 12px;
    }

    .panel-title{
        font-size:14px;

        margin-bottom:2px;
    }

    .panel-status{
        font-size:10px;
    }

    .channels{
        width:100%;

        flex:1;

        overflow-y:auto;

        padding:9px;

        grid-template-columns:
            repeat(3,minmax(0,1fr));

        gap:7px;

        align-content:start;
    }

    .channel{
        padding:5px;

        border-radius:9px;
    }

    .channel-logo-wrap{
        height:53px;

        border-radius:6px;
    }

    .channel-logo{
        padding:5px;
    }

    .channel-name{
        font-size:10px;

        padding:6px 1px 1px;
    }

    .channel-live{
        top:5px;
        left:5px;

        font-size:6px;

        padding:2px 4px;
    }
}

@media(max-width:380px){

    .channels{
        grid-template-columns:
            repeat(3,minmax(0,1fr));

        gap:6px;

        padding:7px;
    }

    .channel-logo-wrap{
        height:48px;
    }

    .channel-name{
        font-size:9px;
    }
}

@media(min-width:1500px){

    .channels-panel{
        width:390px;
    }

    .channels{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }
}
</style>
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="top-bar">

        <!-- LOGO -->

        <div class="brand">

            <div class="brand-icon">
                <span>📺</span>
            </div>

            <div class="brand-text">

                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    TRUYỀN HÌNH TRỰC TUYẾN
                </div>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <span class="search-icon">

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <circle
                        cx="11"
                        cy="11"
                        r="7">
                    </circle>

                    <line
                        x1="16.65"
                        y1="16.65"
                        x2="21"
                        y2="21">
                    </line>

                </svg>

            </span>


            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >


            <button
                id="clearSearch"
                class="clear-search"
                type="button">

                ×

            </button>

        </div>

    </div>

</header>


<!-- =====================================================
     APP
===================================================== -->

<div class="app">


    <!-- =================================================
         PLAYER
    ================================================== -->

    <section class="player-area">

        <div class="player-box">

            <div class="video-wrap">

                <video
                    id="video"
                    controls
                    playsinline
                    preload="metadata">
                </video>


                <div
                    id="placeholder"
                    class="video-placeholder">

                    <span>📺</span>

                    <small>
                        Chọn một kênh để xem
                    </small>

                </div>

            </div>


            <div class="now-playing">

                <div class="now-title">

                    <div class="now-label">
                        Đang phát
                    </div>

                    <div
                        id="nowPlaying"
                        class="now-name">

                        Chưa chọn kênh

                    </div>

                </div>


                <div class="live">

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>

        </div>

    </section>


    <!-- =================================================
         CHANNEL PANEL
    ================================================== -->

    <aside class="channels-panel">

        <div class="panel-header">

            <div class="panel-title">
                📡 Kênh truyền hình
            </div>

            <div
                id="status"
                class="panel-status">

                Đang tải danh sách...

            </div>

        </div>


        <div
            id="channels"
            class="channels">

            <div class="loading">
                Đang tải...
            </div>

        </div>

    </aside>

</div>


<script>


/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");

const placeholder =
    document.getElementById("placeholder");

const clearSearch =
    document.getElementById("clearSearch");


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];

let hls = null;

let currentChannel = null;

let wakeLock = null;


/* =====================================================
   WAKE LOCK
   GIỮ MÀN HÌNH SÁNG KHI XEM
===================================================== */

async function requestWakeLock(){

    if(
        !("wakeLock" in navigator)
    ){

        console.log(
            "Wake Lock không được hỗ trợ."
        );

        return;

    }


    try{

        if(
            wakeLock &&
            !wakeLock.released
        ){

            return;

        }


        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        console.log(
            "🔆 Màn hình được giữ sáng"
        );


        wakeLock.addEventListener(
            "release",
            function(){

                wakeLock = null;

            }
        );

    }

    catch(error){

        console.log(
            "Wake Lock:",
            error
        );

    }

}


/* =====================================================
   RELEASE WAKE LOCK
===================================================== */

async function releaseWakeLock(){

    if(!wakeLock){

        return;

    }


    try{

        await wakeLock.release();

    }

    catch(error){

        console.log(error);

    }


    wakeLock = null;

}


/* =====================================================
   VIDEO EVENTS
===================================================== */

video.addEventListener(
    "play",
    function(){

        requestWakeLock();

    }
);


video.addEventListener(
    "pause",
    function(){

        releaseWakeLock();

    }
);


video.addEventListener(
    "ended",
    function(){

        releaseWakeLock();

    }
);


/* =====================================================
   KHI QUAY LẠI APP
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            if(
                !video.paused &&
                !video.ended
            ){

                requestWakeLock();

            }

        }

    }
);


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist(){

    try{

        const response =
            await fetch(
                PLAYLIST
            );


        if(!response.ok){

            throw new Error(
                "Playlist error"
            );

        }


        const text =
            await response.text();


        channels =
            parseM3U(text);


        channels =
            sortChannels(channels);


        statusText.innerText =
            `Đã tải ${channels.length} kênh`;


        renderChannels(
            channels
        );

    }

    catch(error){

        console.error(error);


        statusText.innerText =
            "❌ Không thể tải danh sách";


        channelsBox.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                Không tải được playlist IPTV

            </div>

        `;

    }

}


/* =====================================================
   ĐƯA VTV LÊN ĐẦU
===================================================== */

function sortChannels(list){

    const vtv = [];

    const others = [];


    list.forEach(channel => {

        const name =
            channel.name
                .toLowerCase()
                .trim();


        const match =
            name.match(
                /^vtv\s*(\d+)/
            );


        if(match){

            const number =
                parseInt(
                    match[1]
                );


            if(
                number >= 1 &&
                number <= 10
            ){

                vtv.push({

                    ...channel,

                    vtvNumber:
                        number

                });

                return;

            }

        }


        if(
            name.includes(
                "vtv5 tây"
            ) ||
            name.includes(
                "vtv5 tay"
            )
        ){

            vtv.push({

                ...channel,

                vtvNumber:5.5

            });

            return;

        }


        others.push(
            channel
        );

    });


    vtv.sort(
        (a,b) =>
            a.vtvNumber -
            b.vtvNumber
    );


    return [
        ...vtv,
        ...others
    ];

}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text){

    const lines =
        text.split(
            /\r?\n/
        );


    const result = [];

    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(
            line.startsWith(
                "#EXTINF"
            )
        ){

            const nameMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    ""

            };

        }

        else if(
            info &&
            line &&
            !line.startsWith("#")
        ){

            result.push({

                name:
                    info.name,

                logo:
                    info.logo,

                url:
                    line

            });


            info = null;

        }

    }


    return result;

}


/* =====================================================
   RENDER CHANNELS
===================================================== */

function renderChannels(list){

    channelsBox.innerHTML = "";


    if(
        list.length === 0
    ){

        channelsBox.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                Không tìm thấy kênh

            </div>

        `;

        return;

    }


    const hasVTV =
        list.some(
            channel =>
                channel.vtvNumber !==
                undefined
        );


    if(hasVTV){

        const title =
            document.createElement(
                "div"
            );


        title.className =
            "vtv-section";


        title.innerText =
            "⭐ KÊNH VTV";


        channelsBox.appendChild(
            title
        );

    }


    list.forEach(
        function(channel){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            if(
                currentChannel &&
                currentChannel.url ===
                channel.url
            ){

                item.classList.add(
                    "active"
                );

            }


            let logoHTML;


            if(channel.logo){

                logoHTML = `

                    <img
                        class="channel-logo"

                        src="${escapeHtml(
                            channel.logo
                        )}"

                        loading="lazy"

                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span
                        class="channel-fallback"
                        style="display:none">

                        📺

                    </span>

                `;

            }

            else{

                logoHTML = `

                    <span
                        class="channel-fallback">

                        📺

                    </span>

                `;

            }


            item.innerHTML = `

                <div class="channel-logo-wrap">

                    ${logoHTML}

                    <span class="channel-live">
                        LIVE
                    </span>

                </div>


                <div class="channel-name">

                    ${escapeHtml(
                        channel.name
                    )}

                </div>

            `;


            item.onclick =
                function(){

                    playChannel(
                        channel
                    );

                };


            channelsBox.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel){

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    placeholder.style.display =
        "none";


    /*
     * LƯU VỊ TRÍ DANH SÁCH
     */

    const oldScroll =
        channelsBox.scrollTop;


    /*
     * HỦY HLS CŨ
     */

    if(hls){

        hls.destroy();

        hls = null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    const url =
        channel.url;


    /* =================================================
       HLS.JS
    ================================================= */

    if(
        Hls.isSupported() &&
        (
            url.includes(
                ".m3u8"
            ) ||
            url.includes(
                "m3u8"
            )
        )
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.play()
                    .catch(
                        () => {}
                    );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                console.log(
                    "HLS ERROR:",
                    data
                );


                if(
                    data.fatal
                ){

                    if(
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ){

                        hls.startLoad();

                    }

                    else if(
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ){

                        hls.recoverMediaError();

                    }

                }

            }
        );

    }


    /* =================================================
       NATIVE HLS
    ================================================= */

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;


        video.play()
            .catch(
                () => {}
            );

    }


    /* =================================================
       STREAM KHÁC
    ================================================= */

    else{

        video.src =
            url;


        video.play()
            .catch(
                () => {}
            );

    }


    /*
     * Render lại danh sách
     */

    renderChannels(
        filterChannels()
    );


    /*
     * KHÔNG ĐỂ SCROLL NHẢY
     */

    channelsBox.scrollTop =
        oldScroll;


    requestAnimationFrame(
        function(){

            channelsBox.scrollTop =
                oldScroll;

        }
    );


    /*
     * GIỮ MÀN HÌNH SÁNG
     */

    requestWakeLock();

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        if(
            searchInput.value.trim()
        ){

            clearSearch.classList.add(
                "show"
            );

        }
        else{

            clearSearch.classList.remove(
                "show"
            );

        }


        renderChannels(
            filterChannels()
        );

    }
);


/* =====================================================
   CLEAR SEARCH
===================================================== */

clearSearch.addEventListener(
    "click",
    function(){

        searchInput.value = "";


        clearSearch.classList.remove(
            "show"
        );


        renderChannels(
            filterChannels()
        );


        searchInput.focus();

    }
);


/* =====================================================
   FILTER
===================================================== */

function filterChannels(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if(!keyword){

        return channels;

    }


    return channels.filter(
        channel =>

            channel.name
                .toLowerCase()
                .includes(
                    keyword
                )

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadPlaylist();

</script>
