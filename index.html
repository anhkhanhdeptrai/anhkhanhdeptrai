<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:#07080d;
    color:#fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{

    position:sticky;
    top:0;

    z-index:1000;

    padding:10px 14px;

    background:rgba(7,8,13,.94);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.07);
}

.header{

    width:100%;
    max-width:1450px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:14px;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:max-content;
}


.logo{

    position:relative;

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3cff,
            #e83cff 45%,
            #ff3864
        );

    box-shadow:
        0 0 20px rgba(155,70,255,.35);

    overflow:hidden;
}


/* Logo TV CSS */
.logo::before{

    content:"";

    width:20px;
    height:15px;

    border:3px solid white;

    border-radius:5px;

    position:absolute;
}


.logo::after{

    content:"";

    width:10px;
    height:3px;

    background:white;

    border-radius:10px;

    position:absolute;

    bottom:7px;
}


.brand-text{

    font-size:20px;

    font-weight:900;

    letter-spacing:.5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a970ff,
            #ff55b8,
            #ffffff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleGradient 5s linear infinite;
}


@keyframes titleGradient{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:250% center;
    }

}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{

    flex:1;

    position:relative;
}


.search-icon{

    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#85899a;

    font-size:18px;

    pointer-events:none;

    z-index:2;
}


.search{

    width:100%;

    height:43px;

    padding:
        0 16px
        0 44px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:14px;

    outline:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    color:white;

    font-size:14px;

    transition:.2s;
}


.search::placeholder{
    color:#737788;
}


.search:focus{

    border-color:
        rgba(151,91,255,.75);

    box-shadow:
        0 0 0 3px rgba(126,67,255,.10),
        0 0 25px rgba(126,67,255,.12);
}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:100%;
    max-width:1450px;

    margin:auto;

    padding:15px;
}


/* =========================================================
   STICKY WATCH AREA
========================================================= */

.watch-sticky{

    position:sticky;

    top:64px;

    z-index:500;

    padding-bottom:12px;

    background:
        linear-gradient(
            to bottom,
            #07080d 82%,
            rgba(7,8,13,0)
        );
}


/* =========================================================
   PLAYER
========================================================= */

.player-box{

    width:100%;

    background:#000;

    border-radius:17px;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px rgba(0,0,0,.42);

    position:relative;
}


.video-area{

    position:relative;

    width:100%;

    background:#000;

    aspect-ratio:16/9;

    overflow:hidden;
}


.video-area::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 100%,
            rgba(115,65,255,.08),
            transparent 55%
        );

    opacity:.8;
}


video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;
}


/* =========================================================
   HIDE DEFAULT VIDEO CONTROLS
========================================================= */

.video-area video::-webkit-media-controls{
    display:none !important;
}

.video-area video::-webkit-media-controls-enclosure{
    display:none !important;
}


/* =========================================================
   PLAYER TOP INFO
========================================================= */

.player-info-overlay{

    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:14px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );

    opacity:0;

    transition:.25s;

    z-index:5;
}


.video-area.controls-visible
.player-info-overlay{

    opacity:1;
}


.live-title{

    font-size:14px;

    font-weight:800;

    max-width:70%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


.live-badge{

    display:flex;

    align-items:center;

    gap:6px;

    padding:5px 9px;

    border-radius:20px;

    background:
        rgba(255,35,80,.18);

    border:
        1px solid rgba(255,60,100,.35);

    color:#ff6b89;

    font-size:11px;

    font-weight:800;
}


.live-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff315b;

    box-shadow:
        0 0 10px #ff315b;

    animation:
        livePulse 1.4s infinite;
}


@keyframes livePulse{

    0%,
    100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.45;
        transform:scale(.7);
    }

}


/* =========================================================
   CUSTOM FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{

    position:absolute;

    width:42px;
    height:42px;

    right:12px;
    bottom:12px;

    border:0;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    background:
        rgba(15,15,20,.75);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    cursor:pointer;

    font-size:22px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s,
        transform .2s,
        background .2s;

    z-index:20;
}


.video-area.controls-visible
.fullscreen-btn{

    opacity:1;

    pointer-events:auto;
}


.fullscreen-btn:hover{

    background:
        rgba(110,70,255,.8);

    transform:scale(1.05);
}


/* =========================================================
   LOADING
========================================================= */

.loading-player{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(100,60,255,.12),
            rgba(0,0,0,.82)
        );

    z-index:10;

    font-size:14px;

    color:#ddd;

    gap:12px;
}


.loading-player.hidden{
    display:none;
}


.loader{

    width:34px;
    height:34px;

    border-radius:50%;

    border:
        3px solid rgba(255,255,255,.15);

    border-top-color:#9a65ff;

    animation:
        spin .8s linear infinite;

    box-shadow:
        0 0 20px rgba(140,80,255,.25);
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{

    min-height:54px;

    padding:12px 15px;

    display:flex;

    align-items:center;

    gap:10px;

    background:
        linear-gradient(
            90deg,
            rgba(115,65,255,.12),
            rgba(255,50,150,.05)
        );

    border-top:
        1px solid rgba(255,255,255,.06);
}


.now-dot{

    width:8px;
    height:8px;

    flex:0 0 auto;

    border-radius:50%;

    background:#7655ff;

    box-shadow:
        0 0 12px #7655ff;

    animation:
        nowPulse 1.5s infinite;
}


@keyframes nowPulse{

    0%,
    100%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }

}


.now-text{

    min-width:0;

    font-size:14px;

    font-weight:800;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   PLAYER INFO BOX
========================================================= */

.info-box{

    margin-top:10px;

    padding:13px 15px;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.07);

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);
}


.status{

    display:flex;

    align-items:center;

    gap:8px;

    color:#8f94a6;

    font-size:13px;
}


.status-dot{

    width:7px;
    height:7px;

    flex:0 0 auto;

    border-radius:50%;

    background:#45e6a1;

    box-shadow:
        0 0 10px rgba(69,230,161,.7);
}


.controls{

    display:flex;

    gap:8px;

    margin-top:10px;

    flex-wrap:wrap;
}


.control-btn{

    border:1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.03)
        );

    color:#fff;

    border-radius:11px;

    padding:9px 13px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}


.control-btn:hover{

    background:
        rgba(120,75,255,.25);

    border-color:
        rgba(135,85,255,.55);

    transform:translateY(-1px);
}


.control-btn:active{
    transform:scale(.97);
}


/* =========================================================
   SOURCE SELECT
========================================================= */

.source-box{

    margin-top:10px;

    display:none;
}


.source-box select{

    width:100%;

    padding:10px 12px;

    border-radius:11px;

    background:#17171e;

    color:#fff;

    border:
        1px solid rgba(255,255,255,.08);

    outline:none;
}


/* =========================================================
   CHANNEL COUNT
========================================================= */

.channel-count{

    margin:
        17px 3px
        10px;

    color:#8f94a6;

    font-size:13px;

    display:flex;

    align-items:center;

    gap:7px;
}


.channel-count::before{

    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#45e6a1;

    box-shadow:
        0 0 9px rgba(69,230,161,.7);
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap:11px;
}


/* =========================================================
   CHANNEL
========================================================= */

.channel{

    min-width:0;

    padding:9px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:15px;

    cursor:pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;

    position:relative;

    overflow:hidden;
}


.channel::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(150,90,255,.5),
            transparent
        );

    opacity:0;

    transition:.2s;
}


.channel:hover{

    transform:translateY(-2px);

    border-color:
        rgba(130,85,255,.65);

    box-shadow:
        0 10px 25px rgba(0,0,0,.22);
}


.channel:hover::before{
    opacity:1;
}


.channel.active{

    border-color:#8155ff;

    background:
        linear-gradient(
            145deg,
            rgba(125,75,255,.16),
            rgba(255,60,160,.06)
        );

    box-shadow:
        0 0 20px rgba(126,77,255,.15);
}


.channel.active::after{

    content:"ĐANG XEM";

    position:absolute;

    top:7px;
    right:7px;

    padding:4px 6px;

    border-radius:7px;

    font-size:8px;

    font-weight:900;

    color:#fff;

    background:
        rgba(116,72,255,.85);

    box-shadow:
        0 0 12px rgba(120,70,255,.35);
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo{

    width:100%;
    height:78px;

    object-fit:contain;

    display:block;

    border-radius:10px;

    background:#0b0c11;

    margin-bottom:9px;
}


.channel-name{

    font-size:13px;

    font-weight:750;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.channel-quality{

    color:#777c8d;

    font-size:10px;

    margin-top:4px;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading,
.empty,
.error{

    grid-column:1/-1;

    text-align:center;

    padding:45px 20px;

    color:#85899a;
}


.error{
    color:#ff7187;
}


/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.fullscreen-viewer{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    background:#000;

    z-index:999999;

    display:none;

    overflow:hidden;

    touch-action:manipulation;
}


.fullscreen-viewer.active{
    display:block;
}


.fullscreen-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}


.fullscreen-video::-webkit-media-controls{
    display:none !important;
}

.fullscreen-video::-webkit-media-controls-enclosure{
    display:none !important;
}


/* =========================================================
   FULLSCREEN TOP
========================================================= */

.fullscreen-top{

    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:
        15px;

    z-index:10;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent
        );

    opacity:1;

    transition:.3s;

    pointer-events:none;
}


.fullscreen-title{

    font-size:15px;

    font-weight:800;

    max-width:75%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


.close-fullscreen{

    width:42px;
    height:42px;

    border:0;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        rgba(15,15,20,.72);

    backdrop-filter:blur(10px);

    font-size:27px;

    cursor:pointer;

    pointer-events:auto;

    transition:.2s;
}


.close-fullscreen:hover{

    background:
        rgba(110,70,255,.8);

    transform:scale(1.05);
}


/* =========================================================
   FULLSCREEN LOADING
========================================================= */

.fullscreen-loading{

    position:absolute;

    inset:0;

    z-index:5;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:12px;

    color:#ddd;

    background:
        rgba(0,0,0,.35);
}


.fullscreen-loading.active{
    display:flex;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:9px 10px;
    }


    .header{
        gap:9px;
    }


    .logo{

        width:38px;
        height:38px;

        border-radius:11px;
    }


    .brand-text{
        font-size:17px;
    }


    .search{
        height:40px;

        border-radius:12px;

        padding-left:40px;

        font-size:13px;
    }


    .container{
        padding:10px;
    }


    /*
    Header khoảng 56px
    */

    .watch-sticky{
        top:56px;
    }


    .player-box{
        border-radius:14px;
    }


    .channels{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }


    .channel{

        padding:7px;

        border-radius:12px;
    }


    .channel-logo{
        height:62px;
    }


    .channel-name{
        font-size:12px;
    }


    .channel-quality{
        font-size:9px;
    }


    .info-box{
        padding:11px;
    }


    .control-btn{
        font-size:12px;

        padding:
            8px 10px;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:380px){

    .brand-text{
        font-size:15px;
    }


    .logo{
        width:36px;
        height:36px;
    }


    .channels{
        gap:6px;
    }


    .channel{
        padding:6px;
    }


    .channel-logo{
        height:56px;
    }

}


/* =========================================================
   LANDSCAPE FULLSCREEN
========================================================= */

@media(orientation:landscape){

    .fullscreen-viewer{
        width:100vw;
        height:100dvh;
    }


    .fullscreen-video{

        width:100vw;
        height:100dvh;

        object-fit:contain;
    }


    .fullscreen-top{

        padding:
            max(12px,env(safe-area-inset-top))
            max(12px,env(safe-area-inset-right))
            12px
            max(12px,env(safe-area-inset-left));
    }

}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:env(safe-area-inset-top)){

    .fullscreen-viewer{

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


    <!-- ===================================================
         STICKY WATCH AREA
    =================================================== -->

    <div class="watch-sticky">


        <div class="player-box">


            <div
                id="videoArea"
                class="video-area"
            >


                <video
                    id="video"
                    playsinline
                    webkit-playsinline
                    preload="auto"
                ></video>


                <!-- TOP INFO -->

                <div
                    class="player-info-overlay"
                >

                    <div
                        id="playerTitle"
                        class="live-title"
                    >
                        KHANH TV
                    </div>


                    <div class="live-badge">

                        <span
                            class="live-dot"
                        ></span>

                        LIVE

                    </div>

                </div>


                <!-- LOADING -->

                <div
                    id="loadingPlayer"
                    class="loading-player hidden"
                >

                    <div class="loader"></div>

                    <span>
                        Đang kết nối nguồn...
                    </span>

                </div>


                <!-- FULLSCREEN -->

                <button
                    id="fullscreenBtn"
                    class="fullscreen-btn"
                    type="button"
                    aria-label="Toàn màn hình"
                >
                    ⛶
                </button>

            </div>


            <!-- NOW PLAYING -->

            <div class="now-playing">

                <span
                    class="now-dot"
                ></span>

                <span
                    id="nowPlaying"
                    class="now-text"
                >
                    Chưa chọn kênh
                </span>

            </div>

        </div>


        <!-- INFO -->

        <div class="info-box">


            <div
                id="status"
                class="status"
            >

                <span
                    class="status-dot"
                ></span>

                <span>
                    Sẵn sàng
                </span>

            </div>


            <div class="controls">

                <button
                    id="nextSourceBtn"
                    class="control-btn"
                    type="button"
                >
                    🔄 Đổi nguồn
                </button>


                <button
                    id="fullscreenInfoBtn"
                    class="control-btn"
                    type="button"
                >
                    ⛶ Toàn màn hình
                </button>

            </div>


            <div
                id="sourceBox"
                class="source-box"
            >

                <select
                    id="sourceSelect"
                ></select>

            </div>

        </div>

    </div>


    <!-- ===================================================
         CHANNEL COUNT
    =================================================== -->

    <div
        id="count"
        class="channel-count"
    >
        Đang tải danh sách...
    </div>


    <!-- ===================================================
         CHANNELS
    =================================================== -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            📡 Đang tải danh sách kênh...
        </div>

    </div>

</main>



<!-- =======================================================
     FULLSCREEN VIEWER
======================================================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>


    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div
        id="fullscreenLoading"
        class="fullscreen-loading"
    >

        <div class="loader"></div>

        <span>
            Đang mở kênh...
        </span>

    </div>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="fullscreen-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
        >
            ×
        </button>

    </div>

</div>



<script>

/* =========================================================
   CONFIG
========================================================= */

const M3U_URL =
"https://raw.githubusercontent.com/iptv-org/iptv/master/streams/vn.m3u";


const LOGO_BASE =
"https://raw.githubusercontent.com/iptv-org/iptv/master/logos/tv/";


const DEFAULT_LOGO =
"https://dummyimage.com/300x150/111/fff&text=TV";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
document.getElementById("video");

const fullscreenVideo =
document.getElementById("fullscreenVideo");

const channelsEl =
document.getElementById("channels");

const countEl =
document.getElementById("count");

const nowPlaying =
document.getElementById("nowPlaying");

const playerTitle =
document.getElementById("playerTitle");

const fullscreenTitle =
document.getElementById("fullscreenTitle");

const statusEl =
document.getElementById("status");

const searchEl =
document.getElementById("search");

const loadingPlayer =
document.getElementById("loadingPlayer");

const fullscreenLoading =
document.getElementById("fullscreenLoading");

const sourceBox =
document.getElementById("sourceBox");

const sourceSelect =
document.getElementById("sourceSelect");

const videoArea =
document.getElementById("videoArea");

const fullscreenViewer =
document.getElementById("fullscreenViewer");

const fullscreenBtn =
document.getElementById("fullscreenBtn");

const fullscreenInfoBtn =
document.getElementById("fullscreenInfoBtn");

const closeFullscreen =
document.getElementById("closeFullscreen");

const nextSourceBtn =
document.getElementById("nextSourceBtn");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let currentSourceIndex = 0;

let hls = null;

let fullscreenHls = null;

let loadTimer = null;

let fullscreenTimer = null;

let errorCount = 0;

let switching = false;

let controlsTimer = null;

let wakeLock = null;


/* =========================================================
   LOGO
========================================================= */

function getLogo(tvgId){

    if(!tvgId)
        return DEFAULT_LOGO;

    let id =
        tvgId
        .replace(/@HD/gi,"")
        .replace(/@SD/gi,"")
        .trim();

    return LOGO_BASE +
        encodeURIComponent(id) +
        ".png";
}


/* =========================================================
   LOAD M3U
========================================================= */

async function loadM3U(){

    try{

        setStatus(
            "📡 Đang tải danh sách kênh..."
        );

        const response =
            await fetch(
                M3U_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        if(
            !text.includes("#EXTM3U") &&
            !text.includes("#EXTINF")
        ){

            throw new Error(
                "Dữ liệu M3U không hợp lệ"
            );

        }


        parseM3U(text);


    }catch(error){

        console.error(error);


        channelsEl.innerHTML = `

            <div class="error">

                ❌ Không tải được danh sách kênh

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        countEl.textContent =
            "Không tải được danh sách";

    }

}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text){

    const lines =
        text
        .replace(/\r/g,"")
        .split("\n");


    const map =
        new Map();


    let info = null;


    for(
        let i=0;
        i<lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(!line)
            continue;


        if(
            line.startsWith(
                "#EXTINF:"
            )
        ){

            info =
                parseExtinf(line);

            continue;

        }


        if(
            info &&
            (
                line.startsWith(
                    "http://"
                )
                ||
                line.startsWith(
                    "https://"
                )
            )
        ){

            const id =
                info.tvgId ||
                normalizeName(
                    info.name
                );


            if(!map.has(id)){

                map.set(
                    id,
                    {

                        id:id,

                        tvgId:
                            info.tvgId,

                        name:
                            cleanName(
                                info.name
                            ),

                        logo:
                            getLogo(
                                info.tvgId
                            ),

                        sources:[]

                    }
                );

            }


            const channel =
                map.get(id);


            if(
                !channel.sources.some(
                    source =>
                        source.url === line
                )
            ){

                channel.sources.push({

                    url:line,

                    name:
                        info.name,

                    quality:
                        getQuality(
                            info.name
                        )

                });

            }


            info = null;

        }

    }


    channels =
        Array.from(
            map.values()
        );


    /* =====================================================
       SẮP XẾP VTV CHUẨN 1 → 10
    ===================================================== */

    channels.sort(
        compareChannels
    );


    countEl.textContent =
        channels.length +
        " kênh";


    renderChannels(
        channels
    );


    setStatus(
        "🟢 Đã tải " +
        channels.length +
        " kênh"
    );

}


/* =========================================================
   SORT CHANNELS
========================================================= */

function getVTVNumber(name){

    const match =
        cleanName(name)
        .match(
            /^VTV\s*(\d+)/i
        );

    if(!match)
        return null;

    return Number(
        match[1]
    );

}


function compareChannels(a,b){

    const av =
        getVTVNumber(a.name);

    const bv =
        getVTVNumber(b.name);


    /*
    VTV1 → VTV10
    */

    if(av !== null && bv !== null){

        return av - bv;

    }


    /*
    VTV luôn nằm trước
    */

    if(av !== null)
        return -1;

    if(bv !== null)
        return 1;


    /*
    Các kênh còn lại
    */

    return a.name.localeCompare(
        b.name,
        "vi",
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}


/* =========================================================
   EXTINF
========================================================= */

function parseExtinf(line){

    const tvgMatch =
        line.match(
            /tvg-id="([^"]*)"/i
        );


    const tvgId =
        tvgMatch
        ? tvgMatch[1]
        : "";


    const comma =
        line.indexOf(",");


    const name =
        comma >= 0
        ? line
            .substring(
                comma + 1
            )
            .trim()
        : line;


    return {

        tvgId:tvgId,

        name:name

    };

}


/* =========================================================
   CLEAN NAME
========================================================= */

function cleanName(name){

    return String(name)

        .replace(
            /\s*\[Geo-blocked\]/gi,
            ""
        )

        .replace(
            /\s*\[Not 24\/7\]/gi,
            ""
        )

        .trim();

}


function normalizeName(name){

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\([^)]*\)/g,
            ""
        )

        .trim();

}


function getQuality(name){

    const m =
        String(name).match(
            /\((\d+p)\)/i
        );

    return m
        ? m[1]
        : "";

}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list){

    channelsEl.innerHTML = "";


    if(!list.length){

        channelsEl.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;

    }


    list.forEach(
        channel => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.dataset.id =
                channel.id;


            if(
                currentChannel &&
                currentChannel.id ===
                channel.id
            ){

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <img

                    class="channel-logo"

                    src="${escapeAttr(
                        channel.logo
                    )}"

                    loading="lazy"

                    onerror="
                        this.onerror=null;
                        this.src='${DEFAULT_LOGO}';
                    "

                >


                <div
                    class="channel-name"
                >

                    ${escapeHtml(
                        channel.name
                    )}

                </div>


                <div
                    class="channel-quality"
                >

                    ${channel.sources.length}
                    nguồn

                </div>

            `;


            item.addEventListener(
                "click",
                () =>
                    playChannel(
                        channel
                    )
            );


            channelsEl.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel){

    currentChannel =
        channel;


    currentSourceIndex =
        0;


    errorCount =
        0;


    switching =
        false;


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(
            el => {

                el.classList.toggle(
                    "active",
                    el.dataset.id ===
                    channel.id
                );

            }
        );


    nowPlaying.textContent =
        channel.name;


    playerTitle.textContent =
        channel.name;


    fullscreenTitle.textContent =
        channel.name;


    updateSourceSelect();


    playCurrentSource();

}


/* =========================================================
   PLAY CURRENT SOURCE
========================================================= */

function playCurrentSource(){

    if(!currentChannel)
        return;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

        switching = false;

        hideLoading();


        setStatus(
            "❌ Tất cả nguồn hiện tại đều lỗi"
        );

        return;

    }


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    switching = true;

    errorCount = 0;


    showLoading();


    setStatus(

        "🔄 Đang thử nguồn " +

        (
            currentSourceIndex + 1
        ) +

        "/" +

        currentChannel.sources.length

    );


    destroyHls();


    clearTimeout(
        loadTimer
    );


    video.pause();


    video.removeAttribute(
        "src"
    );


    video.load();


    /*
    =======================================================
    NATIVE HLS
    =======================================================
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            source.url;


        video.onloadedmetadata =
            function(){

                if(
                    !currentChannel
                )
                    return;


                switching = false;

                clearTimeout(
                    loadTimer
                );

                hideLoading();


                setStatus(

                    "🟢 Đang phát nguồn " +

                    (
                        currentSourceIndex + 1
                    ) +

                    "/" +

                    currentChannel.sources.length

                );


                video.play()
                    .catch(
                        error => {

                            console.warn(
                                "Autoplay:",
                                error
                            );

                        }
                    );

            };


        video.onerror =
            function(){

                if(switching){

                    switchToNextSource();

                }

            };


        loadTimer =
            setTimeout(
                function(){

                    if(switching){

                        switchToNextSource();

                    }

                },
                10000
            );


        return;

    }


    /*
    =======================================================
    HLS.JS
    =======================================================
    */

    if(
        !Hls.isSupported()
    ){

        hideLoading();

        switching = false;

        setStatus(
            "❌ Trình duyệt không hỗ trợ HLS"
        );

        return;

    }


    hls =
        new Hls({

            enableWorker:true,

            lowLatencyMode:false,

            backBufferLength:30,

            maxBufferLength:20,

            maxMaxBufferLength:30,

            manifestLoadingMaxRetry:1,

            levelLoadingMaxRetry:1,

            fragLoadingMaxRetry:1,

            startLevel:-1

        });


    hls.loadSource(
        source.url
    );


    hls.attachMedia(
        video
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function(){

            if(!hls)
                return;


            switching = false;


            clearTimeout(
                loadTimer
            );


            hideLoading();


            setStatus(

                "🟢 Đang phát nguồn " +

                (
                    currentSourceIndex + 1
                ) +

                "/" +

                currentChannel.sources.length

            );


            video.play()
                .catch(
                    error => {

                        console.warn(
                            "Play:",
                            error
                        );

                    }
                );

        }
    );


    hls.on(
        Hls.Events.ERROR,
        function(
            event,
            data
        ){

            console.warn(
                "HLS:",
                data
            );


            if(
                data.fatal
            ){

                switchToNextSource();

                return;

            }


            if(
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ){

                errorCount++;

                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }


            if(
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ){

                errorCount++;

                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }

        }
    );


    video.onerror =
        function(){

            if(switching){

                switchToNextSource();

            }

        };


    loadTimer =
        setTimeout(
            function(){

                if(switching){

                    switchToNextSource();

                }

            },
            12000
        );

}


/* =========================================================
   NEXT SOURCE
========================================================= */

function switchToNextSource(){

    if(!currentChannel)
        return;


    if(!switching){

        switching = true;

    }


    clearTimeout(
        loadTimer
    );


    currentSourceIndex++;


    if(
        currentSourceIndex <
        currentChannel.sources.length
    ){

        setStatus(

            "⚠️ Nguồn lỗi → chuyển sang nguồn " +

            (
                currentSourceIndex + 1
            )

        );


        setTimeout(
            function(){

                switching = false;

                playCurrentSource();

            },
            450
        );


        return;

    }


    switching = false;

    hideLoading();


    setStatus(
        "❌ Tất cả nguồn của kênh đều không phát được"
    );

}


/* =========================================================
   MANUAL NEXT SOURCE
========================================================= */

function nextSource(){

    if(!currentChannel)
        return;


    currentSourceIndex++;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

    }


    switching = false;


    playCurrentSource();

}


/* =========================================================
   SOURCE SELECT
========================================================= */

function updateSourceSelect(){

    if(
        !currentChannel ||
        currentChannel.sources.length <= 1
    ){

        sourceBox.style.display =
            "none";

        return;

    }


    sourceBox.style.display =
        "block";


    sourceSelect.innerHTML =
        "";


    currentChannel.sources
        .forEach(
            (
                source,
                index
            ) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    index;


                option.textContent =

                    "Nguồn " +

                    (
                        index + 1
                    ) +

                    (
                        source.quality
                        ? " • " +
                          source.quality
                        : ""
                    );


                sourceSelect.appendChild(
                    option
                );

            }
        );


    sourceSelect.value =
        currentSourceIndex;


    sourceSelect.onchange =
        function(){

            currentSourceIndex =
                Number(
                    this.value
                );


            switching = false;


            playCurrentSource();

        };

}


/* =========================================================
   DESTROY NORMAL HLS
========================================================= */

function destroyHls(){

    if(hls){

        try{
            hls.destroy();
        }
        catch(e){}

        hls = null;

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        e.stopPropagation();

        openFullscreen();

    }
);


fullscreenInfoBtn.addEventListener(
    "click",
    function(){

        openFullscreen();

    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen(){

    if(
        !currentChannel
    ){

        return;

    }


    /*
    Quan trọng:
    dừng player nhỏ trước khi mở
    */

    video.pause();


    destroyHls();


    clearTimeout(
        loadTimer
    );


    fullscreenViewer
        .classList
        .add("active");


    fullscreenTitle.textContent =
        currentChannel.name;


    fullscreenLoading
        .classList
        .add("active");


    const source =
        currentChannel.sources[
            currentSourceIndex
        ];


    if(!source){

        fullscreenLoading
            .classList
            .remove("active");

        return;

    }


    /*
    =======================================================
    NATIVE HLS FULLSCREEN
    =======================================================
    */

    if(
        fullscreenVideo.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        fullscreenVideo.src =
            source.url;


        fullscreenVideo.onloadedmetadata =
            function(){

                fullscreenLoading
                    .classList
                    .remove("active");


                fullscreenVideo.play()
                    .catch(
                        error => {

                            console.warn(
                                "Fullscreen play:",
                                error
                            );

                        }
                    );

            };


        fullscreenVideo.onerror =
            function(){

                fullscreenLoading
                    .classList
                    .remove("active");

            };


        fullscreenVideo.load();

    }

    /*
    =======================================================
    HLS.JS FULLSCREEN
    =======================================================
    */

    else if(
        Hls.isSupported()
    ){

        fullscreenHls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20,

                maxMaxBufferLength:30

            });


        fullscreenHls.attachMedia(
            fullscreenVideo
        );


        fullscreenHls.loadSource(
            source.url
        );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                fullscreenLoading
                    .classList
                    .remove("active");


                fullscreenVideo
                    .play()
                    .catch(
                        error => {

                            console.warn(
                                "Fullscreen play:",
                                error
                            );

                        }
                    );

            }
        );


        fullscreenHls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                console.warn(
                    "Fullscreen HLS:",
                    data
                );


                if(
                    data.fatal
                ){

                    fullscreenLoading
                        .classList
                        .remove(
                            "active"
                        );

                }

            }
        );

    }

    else{

        fullscreenVideo.src =
            source.url;

        fullscreenVideo.load();

        fullscreenVideo.play()
            .catch(
                error => {

                    console.warn(
                        error
                    );

                }
            );

        fullscreenLoading
            .classList
            .remove("active");

    }


    /*
    =======================================================
    WAKE LOCK
    =======================================================
    */

    await requestWakeLock();


    /*
    =======================================================
    CỐ GẮNG XOAY NGANG
    =======================================================
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch(e){

        console.log(
            "Không hỗ trợ orientation lock"
        );

    }

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        e.stopPropagation();

        closeFullscreenViewer();

    }
);


async function closeFullscreenViewer(){

    fullscreenViewer
        .classList
        .remove("active");


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo.removeAttribute(
        "src"
    );


    fullscreenVideo.load();


    fullscreenVideo.onloadedmetadata =
        null;

    fullscreenVideo.onerror =
        null;


    fullscreenLoading
        .classList
        .remove("active");


    releaseWakeLock();


    /*
    Unlock orientation
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }
    catch(e){}


    /*
    =======================================================
    QUAN TRỌNG:
    Khôi phục player chính.
    Không gọi video.play() đơn thuần,
    vì HLS instance đã bị destroy.
    =======================================================
    */

    if(currentChannel){

        switching = false;

        playCurrentSource();

    }

}


/* =========================================================
   DESTROY FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls(){

    if(fullscreenHls){

        try{

            fullscreenHls.destroy();

        }
        catch(e){}

        fullscreenHls = null;

    }

}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            if(wakeLock){

                try{
                    await wakeLock.release();
                }
                catch(e){}

                wakeLock = null;

            }


            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

        }

    }
    catch(error){

        console.log(
            "WakeLock:",
            error
        );

    }

}


/* =========================================================
   RELEASE WAKE LOCK
========================================================= */

function releaseWakeLock(){

    if(wakeLock){

        try{

            wakeLock.release();

        }
        catch(e){}

        wakeLock = null;

    }

}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function(){

        if(
            document.visibilityState ===
            "visible" &&
            fullscreenViewer
                .classList
                .contains("active")
        ){

            await requestWakeLock();

        }

    }
);


/* =========================================================
   PLAYER CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function(){

        videoArea
            .classList
            .add(
                "controls-visible"
            );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                function(){

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );

    }
);


/* =========================================================
   FULLSCREEN TAP
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            closeFullscreen
        ){

            return;

        }

        showFullscreenControls();

    }
);


function showFullscreenControls(){

    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );

}


/* =========================================================
   SEARCH
========================================================= */

searchEl.addEventListener(
    "input",
    function(){

        const keyword =
            this.value
            .toLowerCase()
            .trim();


        if(!keyword){

            countEl.textContent =
                channels.length +
                " kênh";

            renderChannels(
                channels
            );

            return;

        }


        const filtered =
            channels.filter(
                channel =>

                    channel.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                    ||

                    channel.tvgId
                    .toLowerCase()
                    .includes(
                        keyword
                    )

            );


        countEl.textContent =
            filtered.length +
            " kênh";


        renderChannels(
            filtered
        );

    }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    statusEl.innerHTML = `

        <span
            class="status-dot"
        ></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

    loadingPlayer
        .classList
        .remove(
            "hidden"
        );

}


function hideLoading(){

    loadingPlayer
        .classList
        .add(
            "hidden"
        );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(str){

    return String(str)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(str){

    return escapeHtml(str);

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Escape" &&
            fullscreenViewer
                .classList
                .contains("active")
        ){

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   BACK / RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        if(
            fullscreenViewer
                .classList
                .contains("active")
        ){

            fullscreenViewer.style.width =
                window.innerWidth +
                "px";

            fullscreenViewer.style.height =
                window.innerHeight +
                "px";

        }

    }
);


/* =========================================================
   START
========================================================= */

loadM3U();
