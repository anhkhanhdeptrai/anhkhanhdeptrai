<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>KHANH TV 📺</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#0b0b0f;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(12,12,18,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #222;
    padding:12px;
}

.header-row{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-title{
    font-size:22px;
    font-weight:bold;
    white-space:nowrap;
}

.search{
    flex:1;
    min-width:0;
}

.search input{
    width:100%;
    padding:11px 15px;
    border-radius:12px;
    border:1px solid #333;
    outline:none;
    background:#17171d;
    color:#fff;
    font-size:15px;
}

.search input:focus{
    border-color:#777;
}

.container{
    width:min(1200px,100%);
    margin:auto;
    padding:12px;
}

.player-box{
    background:#000;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    aspect-ratio:16/9;
    box-shadow:0 0 25px rgba(0,0,0,.5);
}

video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    object-fit:contain;
}

.player-info{
    margin-top:10px;
    background:#141419;
    border-radius:13px;
    padding:12px;
}

.now-title{
    font-size:18px;
    font-weight:bold;
}

.status{
    margin-top:6px;
    color:#aaa;
    font-size:13px;
}

.controls{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

button{
    border:0;
    background:#24242b;
    color:white;
    border-radius:10px;
    padding:9px 13px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.channel-count{
    margin:15px 3px 10px;
    color:#aaa;
    font-size:14px;
}

.channels{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
}

.channel{
    background:#15151b;
    border:1px solid #25252c;
    border-radius:14px;
    padding:10px;
    cursor:pointer;
    transition:.15s;
    min-width:0;
}

.channel:hover{
    background:#1d1d24;
    transform:translateY(-1px);
}

.channel.active{
    border-color:#fff;
    background:#202027;
}

.channel-logo{
    width:100%;
    height:75px;
    object-fit:contain;
    display:block;
    margin:auto;
    background:#0c0c10;
    border-radius:10px;
}

.channel-name{
    margin-top:8px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel-quality{
    color:#888;
    font-size:11px;
    margin-top:4px;
}

.loading{
    text-align:center;
    padding:40px 10px;
    color:#aaa;
}

.error{
    color:#ff6b6b;
    text-align:center;
    padding:30px 10px;
}

.source-box{
    margin-top:10px;
    display:none;
}

.source-box select{
    width:100%;
    padding:10px;
    border-radius:10px;
    background:#202027;
    color:white;
    border:1px solid #333;
}

.fullscreen-player{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
}

.fullscreen-player video{
    width:100%;
    height:100%;
}

.close-full{
    position:absolute;
    right:15px;
    top:15px;
    z-index:10001;
    background:rgba(0,0,0,.65);
    font-size:24px;
    width:45px;
    height:45px;
    border-radius:50%;
}

.loading-player{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.55);
    z-index:5;
    font-size:15px;
}

.hidden{
    display:none!important;
}

@media(max-width:600px){

    .header-row{
        flex-wrap:wrap;
    }

    .logo-title{
        width:100%;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
    }

    .channel-logo{
        height:65px;
    }

    .player-info{
        border-radius:12px;
    }

    .now-title{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-row">

        <div class="logo-title">
            KHANH TV 📺
        </div>

        <div class="search">
            <input
                id="search"
                type="text"
                placeholder="🔎 Tìm kênh..."
                autocomplete="off">
        </div>

    </div>
</header>

<div class="container">

    <div class="player-box">

        <video
            id="video"
            controls
            playsinline
            preload="auto">
        </video>

        <div id="loadingPlayer" class="loading-player hidden">
            Đang kết nối nguồn...
        </div>

    </div>

    <div class="player-info">

        <div id="nowTitle" class="now-title">
            Chưa chọn kênh
        </div>

        <div id="status" class="status">
            Sẵn sàng
        </div>

        <div class="controls">

            <button onclick="nextSource()">
                🔄 Đổi nguồn
            </button>

            <button onclick="openFullscreen()">
                ⛶ Toàn màn hình
            </button>

        </div>

        <div id="sourceBox" class="source-box">
            <select id="sourceSelect"></select>
        </div>

    </div>

    <div id="count" class="channel-count">
        Đang tải danh sách...
    </div>

    <div id="channels" class="channels">
        <div class="loading">
            📡 Đang tải danh sách kênh...
        </div>
    </div>

</div>

<div id="fullscreenPlayer" class="fullscreen-player">

    <button class="close-full" onclick="closeFullscreen()">
        ×
    </button>

    <video
        id="fullscreenVideo"
        controls
        playsinline>
    </video>

</div>

<script>

/*
========================================================
CẤU HÌNH
========================================================
*/

const M3U_URL =
"https://raw.githubusercontent.com/iptv-org/iptv/master/streams/vn.m3u";

/*
Logo của iptv-org.
Logo được tạo từ tvg-id.

Ví dụ:

VTV1.vn@HD
→ VTV1.vn.png

Nếu không có logo thì dùng logo mặc định.
*/

const LOGO_BASE =
"https://raw.githubusercontent.com/iptv-org/iptv/master/logos/tv/";

const DEFAULT_LOGO =
"https://dummyimage.com/300x150/111/fff&text=TV";


/*
========================================================
BIẾN
========================================================
*/

let channels = [];

let currentChannel = null;

let currentSourceIndex = 0;

let hls = null;

let loadTimer = null;

let errorCount = 0;

let switching = false;


/*
========================================================
ELEMENT
========================================================
*/

const video =
document.getElementById("video");

const fullscreenVideo =
document.getElementById("fullscreenVideo");

const channelsEl =
document.getElementById("channels");

const countEl =
document.getElementById("count");

const nowTitle =
document.getElementById("nowTitle");

const statusEl =
document.getElementById("status");

const searchEl =
document.getElementById("search");

const loadingPlayer =
document.getElementById("loadingPlayer");

const sourceBox =
document.getElementById("sourceBox");

const sourceSelect =
document.getElementById("sourceSelect");


/*
========================================================
LOGO
========================================================
*/

function getLogo(tvgId){

    if(!tvgId)
        return DEFAULT_LOGO;

    /*
    Loại phần @HD / @SD
    */

    let id =
        tvgId
        .replace("@HD","")
        .replace("@SD","")
        .trim();

    /*
    Logo của iptv-org có thể có
    tên khác với tvg-id.

    Thử trực tiếp trước.
    */

    return LOGO_BASE + id + ".png";
}


/*
========================================================
LOAD M3U
========================================================
*/

async function loadM3U(){

    try{

        setStatus("📡 Đang tải danh sách kênh...");

        const response =
            await fetch(
                M3U_URL + "?t=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const text =
            await response.text();

        if(!text.includes("#EXTM3U") &&
           !text.includes("#EXTINF")){

            throw new Error(
                "Dữ liệu M3U không hợp lệ"
            );

        }

        parseM3U(text);

    }catch(error){

        console.error(error);

        channelsEl.innerHTML = `
            <div class="error">
                ❌ Không tải được danh sách kênh<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        countEl.textContent =
            "Không tải được danh sách";

    }

}


/*
========================================================
PARSE M3U
========================================================

ĐIỂM QUAN TRỌNG:

Các dòng:

VTV1
URL A

VTV1
URL B

VTV1
URL C

sẽ được gom thành:

VTV1
  ├── URL A
  ├── URL B
  └── URL C

Chỉ hiển thị 1 VTV1.
*/

function parseM3U(text){

    const lines =
        text
        .replace(/\r/g,"")
        .split("\n");

    const map =
        new Map();

    let info = null;

    for(let i = 0; i < lines.length; i++){

        const line =
            lines[i].trim();

        if(!line)
            continue;


        /*
        EXTINF
        */

        if(line.startsWith("#EXTINF:")){

            info = parseExtinf(line);

            continue;
        }


        /*
        URL
        */

        if(
            info &&
            (
                line.startsWith("http://") ||
                line.startsWith("https://")
            )
        ){

            const id =
                info.tvgId ||
                normalizeName(info.name);

            if(!map.has(id)){

                map.set(id,{

                    id:id,

                    tvgId:info.tvgId,

                    name:cleanName(info.name),

                    logo:getLogo(info.tvgId),

                    sources:[]

                });

            }


            const channel =
                map.get(id);


            /*
            Không thêm URL trùng
            */

            if(
                !channel.sources
                .some(
                    s => s.url === line
                )
            ){

                channel.sources.push({

                    url:line,

                    name:info.name,

                    quality:getQuality(info.name)

                });

            }

            info = null;
        }

    }


    channels =
        Array.from(map.values());


    /*
    Ưu tiên VTV lên đầu
    */

    channels.sort(
        (a,b)=>{

            const av =
                /^VTV\d+/i.test(a.name);

            const bv =
                /^VTV\d+/i.test(b.name);

            if(av && !bv)
                return -1;

            if(!av && bv)
                return 1;

            return a.name.localeCompare(
                b.name,
                "vi"
            );

        }
    );


    countEl.textContent =
        `${channels.length} kênh`;

    renderChannels(channels);

}


/*
========================================================
PARSE EXTINF
========================================================
*/

function parseExtinf(line){

    const tvgMatch =
        line.match(
            /tvg-id="([^"]*)"/i
        );

    const tvgId =
        tvgMatch
        ? tvgMatch[1]
        : "";


    /*
    Lấy phần sau dấu phẩy
    */

    const comma =
        line.indexOf(",");

    let name =
        comma >= 0
        ? line.substring(comma + 1).trim()
        : line;


    return {

        tvgId:tvgId,

        name:name

    };

}


/*
========================================================
LÀM SẠCH TÊN
========================================================
*/

function cleanName(name){

    return name
        .replace(/\s*\[Geo-blocked\]/gi,"")
        .replace(/\s*\[Not 24\/7\]/gi,"")
        .trim();

}


function normalizeName(name){

    return cleanName(name)
        .toLowerCase()
        .replace(/\([^)]*\)/g,"")
        .trim();

}


function getQuality(name){

    const m =
        name.match(
            /\((\d+p)\)/i
        );

    return m
        ? m[1]
        : "";

}


/*
========================================================
RENDER
========================================================
*/

function renderChannels(list){

    channelsEl.innerHTML = "";

    if(!list.length){

        channelsEl.innerHTML =
            `<div class="loading">
                Không tìm thấy kênh
             </div>`;

        return;
    }


    list.forEach(channel=>{

        const item =
            document.createElement("div");

        item.className =
            "channel";

        item.dataset.id =
            channel.id;


        item.innerHTML = `

            <img
                class="channel-logo"
                src="${escapeAttr(channel.logo)}"
                loading="lazy"
                onerror="this.onerror=null;this.src='${DEFAULT_LOGO}'">

            <div class="channel-name">
                ${escapeHtml(channel.name)}
            </div>

            <div class="channel-quality">
                ${channel.sources.length}
                nguồn
            </div>

        `;


        item.onclick = () => {

            playChannel(channel);

        };


        channelsEl.appendChild(item);

    });

}


/*
========================================================
PHÁT KÊNH
========================================================
*/

function playChannel(channel){

    currentChannel =
        channel;

    currentSourceIndex =
        0;

    errorCount =
        0;

    switching =
        false;


    /*
    Active UI
    */

    document
        .querySelectorAll(".channel")
        .forEach(el=>{

            el.classList.toggle(
                "active",
                el.dataset.id === channel.id
            );

        });


    nowTitle.textContent =
        channel.name;


    /*
    Hiển thị danh sách nguồn
    */

    updateSourceSelect();


    /*
    Bắt đầu nguồn đầu tiên
    */

    playCurrentSource();

}


/*
========================================================
PHÁT SOURCE HIỆN TẠI
========================================================
*/

function playCurrentSource(){

    if(!currentChannel)
        return;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

        setStatus(
            "❌ Tất cả nguồn hiện tại đều lỗi"
        );

        hideLoading();

        return;

    }


    const source =
        currentChannel
        .sources[currentSourceIndex];


    switching =
        true;

    errorCount =
        0;


    showLoading();


    setStatus(
        `🔄 Đang thử nguồn ${currentSourceIndex + 1}/${currentChannel.sources.length}`
    );


    /*
    Hủy HLS cũ
    */

    if(hls){

        try{
            hls.destroy();
        }catch(e){}

        hls = null;

    }


    /*
    Hủy timer cũ
    */

    clearTimeout(loadTimer);


    /*
    Reset video
    */

    try{
        video.pause();
    }catch(e){}


    video.removeAttribute("src");

    video.load();


    /*
    ================================================
    NATIVE HLS
    ================================================
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            source.url;


        video.onloadedmetadata = ()=>{

            switching = false;

            hideLoading();

            setStatus(
                `🟢 Đang phát nguồn ${currentSourceIndex + 1}/${currentChannel.sources.length}`
            );

            video.play()
                .catch(()=>{});

        };


        video.onerror = ()=>{

            console.warn(
                "Native HLS lỗi:",
                source.url
            );

            switchToNextSource();

        };


        /*
        Nếu quá lâu không tải được
        */

        loadTimer =
            setTimeout(()=>{

                if(switching){

                    console.warn(
                        "Timeout source"
                    );

                    switchToNextSource();

                }

            },8000);


        return;
    }


    /*
    ================================================
    HLS.JS
    ================================================
    */

    if(!Hls.isSupported()){

        setStatus(
            "❌ Trình duyệt không hỗ trợ HLS"
        );

        hideLoading();

        return;

    }


    hls =
        new Hls({

            enableWorker:true,

            lowLatencyMode:true,

            backBufferLength:30,

            maxBufferLength:20,

            maxMaxBufferLength:30,

            manifestLoadingMaxRetry:1,

            levelLoadingMaxRetry:1,

            fragLoadingMaxRetry:1,

            startLevel:-1

        });


    hls.loadSource(
        source.url
    );

    hls.attachMedia(
        video
    );


    /*
    Manifest đã tải được
    */

    hls.on(
        Hls.Events.MANIFEST_PARSED,
        ()=>{

            switching = false;

            hideLoading();

            clearTimeout(loadTimer);

            setStatus(
                `🟢 Đang phát nguồn ${currentSourceIndex + 1}/${currentChannel.sources.length}`
            );


            video.play()
                .catch(()=>{});

        }
    );


    /*
    HLS ERROR
    */

    hls.on(
        Hls.Events.ERROR,
        function(event,data){

            console.warn(
                "HLS ERROR:",
                data
            );


            /*
            Lỗi fatal
            */

            if(data.fatal){

                switchToNextSource();

                return;

            }


            /*
            Lỗi network nhiều lần
            */

            if(
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ){

                errorCount++;

                if(errorCount >= 2){

                    switchToNextSource();

                }

            }


            /*
            Lỗi media
            */

            if(
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ){

                errorCount++;

                if(errorCount >= 2){

                    switchToNextSource();

                }

            }

        }
    );


    /*
    Video lỗi
    */

    video.onerror = ()=>{

        switchToNextSource();

    };


    /*
    Timeout tải manifest
    */

    loadTimer =
        setTimeout(()=>{

            if(switching){

                console.warn(
                    "HLS timeout:",
                    source.url
                );

                switchToNextSource();

            }

        },10000);

}


/*
========================================================
CHUYỂN SANG SOURCE TIẾP
========================================================
*/

function switchToNextSource(){

    if(!currentChannel)
        return;


    /*
    Chống gọi nhiều lần cùng lúc
    */

    if(!switching){

        switching = true;

    }


    clearTimeout(loadTimer);


    currentSourceIndex++;


    /*
    Nếu còn nguồn
    */

    if(
        currentSourceIndex <
        currentChannel.sources.length
    ){

        setStatus(
            `⚠️ Nguồn lỗi → chuyển sang nguồn ${currentSourceIndex + 1}`
        );


        /*
        Delay nhỏ để tránh reload liên tục
        */

        setTimeout(()=>{

            switching = false;

            playCurrentSource();

        },500);

        return;

    }


    /*
    Hết nguồn
    */

    switching = false;

    hideLoading();

    setStatus(
        "❌ Tất cả nguồn của kênh đều không phát được"
    );

}


/*
========================================================
NÚT ĐỔI NGUỒN
========================================================
*/

function nextSource(){

    if(!currentChannel)
        return;


    currentSourceIndex++;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

    }


    switching = false;

    playCurrentSource();

}


/*
========================================================
SOURCE SELECT
========================================================
*/

function updateSourceSelect(){

    if(
        !currentChannel ||
        currentChannel.sources.length <= 1
    ){

        sourceBox.style.display =
            "none";

        return;

    }


    sourceBox.style.display =
        "block";


    sourceSelect.innerHTML =
        "";


    currentChannel.sources
        .forEach(
            (source,index)=>{

                const option =
                    document.createElement("option");

                option.value =
                    index;

                option.textContent =
                    `Nguồn ${index+1} ${source.quality ? "• "+source.quality : ""}`;

                sourceSelect.appendChild(
                    option
                );

            }
        );


    sourceSelect.value =
        currentSourceIndex;


    sourceSelect.onchange =
        function(){

            currentSourceIndex =
                Number(this.value);

            switching = false;

            playCurrentSource();

        };

}


/*
========================================================
SEARCH
========================================================
*/

searchEl.addEventListener(
    "input",
    function(){

        const keyword =
            this.value
            .toLowerCase()
            .trim();


        if(!keyword){

            renderChannels(channels);

            return;

        }


        const filtered =
            channels.filter(
                channel =>
                    channel.name
                    .toLowerCase()
                    .includes(keyword)
            );


        renderChannels(filtered);

        countEl.textContent =
            `${filtered.length} kênh`;

    }
);


/*
========================================================
FULLSCREEN
========================================================
*/

function openFullscreen(){

    const box =
        document.getElementById(
            "fullscreenPlayer"
        );


    box.style.display =
        "flex";


    /*
    Dùng lại source hiện tại
    */

    if(currentChannel){

        const source =
            currentChannel
            .sources[currentSourceIndex];


        fullscreenVideo.src =
            source.url;


        fullscreenVideo.play()
            .catch(()=>{});

    }

}


function closeFullscreen(){

    const box =
        document.getElementById(
            "fullscreenPlayer"
        );


    box.style.display =
        "none";


    fullscreenVideo.pause();

    fullscreenVideo.removeAttribute(
        "src"
    );

    fullscreenVideo.load();

}


/*
========================================================
STATUS
========================================================
*/

function setStatus(text){

    statusEl.textContent =
        text;

}


function showLoading(){

    loadingPlayer.classList.remove(
        "hidden"
    );

}


function hideLoading(){

    loadingPlayer.classList.add(
        "hidden"
    );

}


/*
========================================================
ESCAPE HTML
========================================================
*/

function escapeHtml(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(str){

    return escapeHtml(str);

}
