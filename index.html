<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#070910;
    color:#fff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,9,16,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.header{
    width:min(1450px,100%);
    margin:auto;
    padding:13px 18px;
    display:flex;
    align-items:center;
    gap:18px;
}

/* LOGO */

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:max-content;
}

.logo-mark{
    width:42px;
    height:42px;
    position:relative;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(135deg,#7c3cff,#00c8ff);
    box-shadow:
        0 0 25px rgba(89,74,255,.35);
}

.logo-mark:before{
    content:"";
    width:18px;
    height:18px;
    border:3px solid #fff;
    border-radius:50%;
    opacity:.95;
}

.logo-mark:after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:#fff;
    border-radius:50%;
}

.brand-text{
    line-height:1;
}

.brand-name{
    font-size:20px;
    font-weight:900;
    letter-spacing:.5px;
    background:
        linear-gradient(
            90deg,
            #fff,
            #a68cff,
            #39d8ff
        );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand-sub{
    font-size:9px;
    margin-top:5px;
    color:#7d8294;
    letter-spacing:2px;
    font-weight:700;
}

/* SEARCH */

.search-wrap{
    flex:1;
    max-width:620px;
    margin-left:auto;
    position:relative;
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#777d90;
    font-size:17px;
    pointer-events:none;
}

.search{
    width:100%;
    height:46px;
    border:none;
    outline:none;
    color:white;
    background:#111520;
    border:1px solid #252b3a;
    border-radius:15px;
    padding:0 18px 0 45px;
    font-size:14px;
    transition:.2s;
}

.search::placeholder{
    color:#676d80;
}

.search:focus{
    border-color:#705cff;
    box-shadow:0 0 0 3px rgba(112,92,255,.12);
}

/* =========================
   MAIN
========================= */

.container{
    width:min(1450px,100%);
    margin:auto;
    padding:18px;
}

/* =========================
   PLAYER
========================= */

.player-area{
    position:sticky;
    top:73px;
    z-index:500;
    margin-bottom:20px;
}

.player-box{
    position:relative;
    overflow:hidden;
    background:#000;
    border:1px solid #252936;
    border-radius:18px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.35);
}

/* VIDEO */

.video-wrap{
    position:relative;
    width:100%;
    background:#000;
    aspect-ratio:16/9;
}

video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    object-fit:contain;
}

/* =========================
   PLAYER BUTTONS
========================= */

.player-buttons{
    position:absolute;
    right:12px;
    bottom:12px;
    display:flex;
    gap:8px;
    opacity:1;
    transition:.3s;
    z-index:20;
}

.player-box.controls-hidden .player-buttons{
    opacity:0;
    pointer-events:none;
}

.player-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;
    color:#fff;
    background:rgba(12,14,22,.75);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.player-btn:hover{
    background:#6d5cff;
    transform:scale(1.05);
}

.player-btn.close{
    display:none;
}

/* =========================
   NOW PLAYING
========================= */

.now-playing{
    min-height:66px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:
        linear-gradient(
            90deg,
            #10131d,
            #0d1018
        );
    border-top:1px solid #202531;
}

.now-info{
    min-width:0;
}

.now-label{
    display:flex;
    align-items:center;
    gap:7px;
    color:#777e92;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.4px;
    margin-bottom:5px;
}

.live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#20e68a;
    box-shadow:0 0 10px #20e68a;
}

.now-title{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.status-live{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border-radius:9px;
    background:rgba(32,230,138,.08);
    color:#35e79a;
    border:1px solid rgba(32,230,138,.18);
    font-size:10px;
    font-weight:900;
}

/* =========================
   STATUS
========================= */

.status{
    display:flex;
    align-items:center;
    gap:8px;
    margin:5px 0 15px;
    color:#777e90;
    font-size:13px;
}

.status-count{
    color:#b5bac8;
    font-weight:700;
}

/* =========================
   CHANNEL GRID
========================= */

.channels{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(185px,1fr));
    gap:13px;
}

.channel{
    position:relative;
    overflow:hidden;
    background:#10131c;
    border:1px solid #222735;
    border-radius:15px;
    padding:10px;
    cursor:pointer;
    transition:
        transform .2s,
        border-color .2s,
        background .2s,
        box-shadow .2s;
}

.channel:hover{
    transform:translateY(-3px);
    border-color:#6255e9;
    background:#151925;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.channel.active{
    border-color:#7667ff;
    box-shadow:
        0 0 0 1px rgba(118,103,255,.25),
        0 8px 30px rgba(80,70,220,.18);
}

.channel-logo{
    width:100%;
    height:92px;
    object-fit:contain;
    display:block;
    background:#090b11;
    border-radius:10px;
    margin-bottom:10px;
}

.channel-no-logo{
    width:100%;
    height:92px;
    border-radius:10px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at center,
            #222746,
            #0b0d14 65%
        );
    color:#747b91;
    font-size:22px;
    font-weight:900;
}

.channel-name{
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel-quality{
    margin-top:6px;
    color:#686f82;
    font-size:10px;
}

/* VTV */

.channel.vtv{
    border-color:rgba(111,93,255,.28);
}

.channel.vtv:before{
    content:"VTV";
    position:absolute;
    top:16px;
    left:16px;
    padding:4px 7px;
    border-radius:6px;
    background:#6556ef;
    color:white;
    font-size:8px;
    font-weight:900;
    letter-spacing:.5px;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty,
.loading{
    grid-column:1/-1;
    text-align:center;
    padding:45px 15px;
    color:#70778a;
}

/* =========================
   FULLSCREEN
========================= */

.player-box:fullscreen{
    width:100vw;
    height:100vh;
    border:none;
    border-radius:0;
    background:#000;
}

.player-box:fullscreen .video-wrap{
    width:100vw;
    height:100vh;
    aspect-ratio:auto;
}

.player-box:fullscreen video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.player-box:-webkit-full-screen{
    width:100vw;
    height:100vh;
    border:none;
    border-radius:0;
    background:#000;
}

.player-box:-webkit-full-screen .video-wrap{
    width:100vw;
    height:100vh;
    aspect-ratio:auto;
}

.player-box:-webkit-full-screen video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.player-box:fullscreen .now-playing,
.player-box:-webkit-full-screen .now-playing{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:15;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );
    border:none;
    padding-top:45px;
    opacity:0;
    transition:.3s;
}

.player-box:fullscreen.show-ui .now-playing,
.player-box:-webkit-full-screen.show-ui .now-playing{
    opacity:1;
}

.player-box:fullscreen .player-btn.close,
.player-box:-webkit-full-screen .player-btn.close{
    display:flex;
}

.player-box:fullscreen .player-btn.fullscreen,
.player-box:-webkit-full-screen .player-btn.fullscreen{
    display:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        position:sticky;
        top:0;
    }

    .header{
        padding:10px;
        gap:10px;
        flex-wrap:wrap;
    }

    .brand{
        flex:1;
    }

    .logo-mark{
        width:38px;
        height:38px;
        border-radius:11px;
    }

    .brand-name{
        font-size:18px;
    }

    .brand-sub{
        font-size:8px;
    }

    .search-wrap{
        order:3;
        flex-basis:100%;
        max-width:none;
    }

    .search{
        height:43px;
    }

    .container{
        padding:10px;
    }

    .player-area{
        top:111px;
        margin-left:-10px;
        margin-right:-10px;
    }

    .player-box{
        border-radius:0;
        border-left:none;
        border-right:none;
    }

    .video-wrap{
        aspect-ratio:16/9;
    }

    .now-playing{
        min-height:61px;
        padding:10px 12px;
    }

    .now-title{
        font-size:14px;
    }

    .status-live{
        padding:6px 8px;
        font-size:9px;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .channel{
        padding:8px;
        border-radius:12px;
    }

    .channel-logo,
    .channel-no-logo{
        height:65px;
        border-radius:8px;
        margin-bottom:8px;
    }

    .channel-name{
        font-size:12px;
    }

    .channel-quality{
        font-size:9px;
    }
}

/* LANDSCAPE PHONE */

@media(max-height:600px) and (orientation:landscape){

    .player-box:fullscreen .video-wrap,
    .player-box:-webkit-full-screen .video-wrap{
        width:100vw;
        height:100vh;
    }

    .player-box:fullscreen video,
    .player-box:-webkit-full-screen video{
        width:100vw;
        height:100vh;
        object-fit:contain;
    }
}

/* Hide browser-ish overflow while fullscreen */

html.fullscreen-active,
body.fullscreen-active{
    overflow:hidden !important;
}
</style>
</head>

<body>

<header>

    <div class="header">

        <div class="brand">

            <div class="logo-mark"></div>

            <div class="brand-text">
                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    VIETNAM LIVE TV
                </div>
            </div>

        </div>

        <div class="search-wrap">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                class="search"
                type="search"
                placeholder="Tìm kiếm kênh..."
                autocomplete="off"
            >

        </div>

    </div>

</header>


<main class="container">

    <!-- PLAYER -->

    <div class="player-area">

        <div
            class="player-box"
            id="playerBox"
        >

            <div
                class="video-wrap"
                id="videoWrap"
            >

                <video
                    id="video"
                    controls
                    playsinline
                    webkit-playsinline
                    preload="metadata"
                ></video>


                <!-- CUSTOM BUTTONS -->

                <div
                    class="player-buttons"
                    id="playerButtons"
                >

                    <button
                        class="player-btn fullscreen"
                        id="fullscreenBtn"
                        title="Toàn màn hình"
                    >⛶</button>

                    <button
                        class="player-btn close"
                        id="closeFullscreenBtn"
                        title="Thoát toàn màn hình"
                    >×</button>

                </div>

            </div>


            <!-- NOW PLAYING -->

            <div class="now-playing">

                <div class="now-info">

                    <div class="now-label">

                        <span class="live-dot"></span>

                        ĐANG PHÁT

                    </div>

                    <div
                        class="now-title"
                        id="nowPlaying"
                    >
                        Chưa chọn kênh
                    </div>

                </div>

                <div
                    class="status-live"
                    id="liveStatus"
                >
                    ● LIVE
                </div>

            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >
        <span>Đang tải danh sách...</span>
    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const playerBox =
    document.getElementById("playerBox");

const videoWrap =
    document.getElementById("videoWrap");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeFullscreenBtn =
    document.getElementById("closeFullscreenBtn");


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];
let hls = null;
let currentChannel = null;
let controlsTimer = null;
let wakeLock = null;


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist(){

    try{

        const response =
            await fetch(PLAYLIST);

        if(!response.ok){

            throw new Error(
                "Playlist error"
            );

        }

        const text =
            await response.text();

        channels =
            parseM3U(text);

        /*
         * Đưa toàn bộ VTV lên đầu
         */

        channels.sort((a,b)=>{

            const avtv =
                /^VTV/i.test(a.name);

            const btv =
                /^VTV/i.test(b.name);

            if(avtv && !btv) return -1;

            if(!avtv && btv) return 1;

            return 0;

        });

        statusText.innerHTML =
            `<span>Danh sách kênh</span>
             <span class="status-count">
             ${channels.length} kênh
             </span>`;

        renderChannels(channels);

    }catch(error){

        console.error(error);

        statusText.innerHTML =
            "❌ Không thể tải danh sách kênh";

        channelsBox.innerHTML =
            `<div class="empty">
                Không tải được playlist IPTV.
            </div>`;

    }

}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text){

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;

    for(let i=0;i<lines.length;i++){

        const line =
            lines[i].trim();

        if(
            line.startsWith("#EXTINF")
        ){

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );

            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""

            };

        }

        else if(
            info &&
            line &&
            !line.startsWith("#")
        ){

            result.push({

                name:info.name,

                logo:info.logo,

                id:info.id,

                url:line

            });

            info=null;

        }

    }

    return result;
}


/* =====================================================
   RENDER CHANNELS
===================================================== */

function renderChannels(list){

    channelsBox.innerHTML = "";

    if(!list.length){

        channelsBox.innerHTML =
            `<div class="empty">
                Không tìm thấy kênh
            </div>`;

        return;
    }

    list.forEach(channel=>{

        const item =
            document.createElement("div");

        const isVTV =
            /^VTV/i.test(channel.name);

        item.className =
            "channel" +
            (isVTV ? " vtv" : "");

        if(
            currentChannel &&
            currentChannel.url === channel.url
        ){

            item.classList.add("active");

        }


        let logoHTML = "";

        if(channel.logo){

            logoHTML = `
                <img
                    class="channel-logo"
                    src="${escapeHtml(channel.logo)}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >
                <div
                    class="channel-no-logo"
                    style="display:none"
                >
                    TV
                </div>
            `;

        }else{

            logoHTML = `
                <div class="channel-no-logo">
                    TV
                </div>
            `;

        }


        item.innerHTML = `

            ${logoHTML}

            <div class="channel-name">
                ${escapeHtml(channel.name)}
            </div>

            <div class="channel-quality">
                ${isVTV ? "VTV • " : ""}
                LIVE STREAM
            </div>

        `;


        item.addEventListener(
            "click",
            ()=>playChannel(channel)
        );


        channelsBox.appendChild(item);

    });

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel){

    currentChannel =
        channel;

    nowPlaying.innerText =
        cleanChannelName(channel.name);


    if(hls){

        hls.destroy();
        hls=null;

    }

    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url;


    /*
     * HLS.JS
     */

    if(
        url.includes(".m3u8") &&
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:30,

                maxMaxBufferLength:60

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{
                video.play()
                    .catch(()=>{});
            }
        );


        hls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                console.log(
                    "HLS:",
                    data
                );

                if(
                    data.fatal
                ){

                    setTimeout(
                        ()=>{
                            if(
                                currentChannel &&
                                currentChannel.url===channel.url
                            ){
                                retryStream();
                            }
                        },
                        1500
                    );

                }

            }
        );

    }


    /*
     * Native HLS
     */

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src=url;

        video.play()
            .catch(()=>{});

    }


    /*
     * Other
     */

    else{

        video.src=url;

        video.play()
            .catch(()=>{});

    }


    renderChannels(
        filterChannels()
    );

}


/* =====================================================
   RETRY
===================================================== */

function retryStream(){

    if(!currentChannel)
        return;

    const channel =
        currentChannel;

    playChannel(channel);

}


/* =====================================================
   CLEAN CHANNEL NAME
===================================================== */

function cleanChannelName(name){

    return name
        .replace(/\s*\[[^\]]*\]/g,"")
        .replace(/\s*\(\d+p\)/gi,"")
        .trim();

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    ()=>{

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();

    if(!keyword)
        return channels;

    return channels.filter(
        channel =>
            channel.name
                .toLowerCase()
                .includes(keyword)
    );

}


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenBtn.addEventListener(
    "click",
    async ()=>{
        await enterFullscreen();
    }
);


closeFullscreenBtn.addEventListener(
    "click",
    async ()=>{
        await exitFullscreen();
    }
);


async function enterFullscreen(){

    try{

        /*
         * Wake Lock trước fullscreen
         */

        await requestWakeLock();


        /*
         * Fullscreen player
         */

        if(
            playerBox.requestFullscreen
        ){

            await playerBox.requestFullscreen();

        }

        else if(
            playerBox.webkitRequestFullscreen
        ){

            playerBox.webkitRequestFullscreen();

        }


        document.documentElement
            .classList.add(
                "fullscreen-active"
            );

        document.body
            .classList.add(
                "fullscreen-active"
            );


        showPlayerControls();

    }catch(error){

        console.log(
            "Fullscreen:",
            error
        );

    }

}


/* =====================================================
   EXIT FULLSCREEN
===================================================== */

async function exitFullscreen(){

    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }

        else if(
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   FULLSCREEN CHANGE
===================================================== */

document.addEventListener(
    "fullscreenchange",
    handleFullscreenChange
);

document.addEventListener(
    "webkitfullscreenchange",
    handleFullscreenChange
);


function handleFullscreenChange(){

    const active =
        document.fullscreenElement === playerBox ||
        document.webkitFullscreenElement === playerBox;


    if(active){

        document.documentElement
            .classList.add(
                "fullscreen-active"
            );

        document.body
            .classList.add(
                "fullscreen-active"
            );

        requestWakeLock();

        showPlayerControls();

    }else{

        document.documentElement
            .classList.remove(
                "fullscreen-active"
            );

        document.body
            .classList.remove(
                "fullscreen-active"
            );

        releaseWakeLock();

        showPlayerControls();

    }

}


/* =====================================================
   SCREEN WAKE LOCK
===================================================== */

async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

            wakeLock.addEventListener(
                "release",
                ()=>{
                    wakeLock=null;
                }
            );

        }

    }catch(error){

        console.log(
            "Wake Lock:",
            error
        );

    }

}


/* =====================================================
   RE-ACQUIRE WAKE LOCK
   AFTER PHONE TAB RETURNS
===================================================== */

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(
            document.visibilityState === "visible" &&
            (
                document.fullscreenElement === playerBox ||
                document.webkitFullscreenElement === playerBox
            )
        ){

            requestWakeLock();

        }

    }
);


/* =====================================================
   RELEASE WAKE LOCK
===================================================== */

async function releaseWakeLock(){

    if(wakeLock){

        try{

            await wakeLock.release();

        }catch(e){}

        wakeLock=null;

    }

}


/* =====================================================
   PLAYER CONTROLS AUTO HIDE
===================================================== */

function showPlayerControls(){

    playerBox.classList.remove(
        "controls-hidden"
    );

    clearTimeout(
        controlsTimer
    );

    controlsTimer =
        setTimeout(
            ()=>{
                if(
                    document.fullscreenElement === playerBox ||
                    document.webkitFullscreenElement === playerBox
                ){

                    playerBox.classList.add(
                        "controls-hidden"
                    );

                }

            },
            3000
        );

}


/* =====================================================
   TAP VIDEO = SHOW BUTTONS
===================================================== */

videoWrap.addEventListener(
    "click",
    ()=>{
        showPlayerControls();
    }
);


/* =====================================================
   MOUSE MOVE
===================================================== */

videoWrap.addEventListener(
    "mousemove",
    ()=>{
        if(
            document.fullscreenElement === playerBox ||
            document.webkitFullscreenElement === playerBox
        ){

            showPlayerControls();

        }

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

loadPlaylist();

</script>
