<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07080d;
    color: #fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 68px;
    z-index: 1000;

    background:
        linear-gradient(
            135deg,
            rgba(12,14,25,.97),
            rgba(18,12,30,.97)
        );

    border-bottom: 1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.header-inner {
    height: 100%;
    max-width: 1450px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 18px;

    padding: 0 18px;
}

/* =========================
   KHANH TV LOGO
========================= */

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: max-content;
}

.brand-logo {
    width: 42px;
    height: 42px;

    border-radius: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #6c5cff,
            #a855f7 50%,
            #ec4899
        );

    box-shadow:
        0 7px 25px rgba(124,92,255,.35);

    position: relative;
}

.brand-logo::before {
    content: "";

    width: 20px;
    height: 15px;

    border: 2px solid white;
    border-radius: 5px;

    position: absolute;
}

.brand-logo::after {
    content: "";

    width: 7px;
    height: 7px;

    border-left: 2px solid white;
    border-bottom: 2px solid white;

    transform: rotate(-45deg);

    position: absolute;
    left: 18px;
    top: 16px;
}

.brand-name {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #a78bfa,
            #f472b6
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* =========================
   SEARCH
========================= */

.search-box {
    flex: 1;
    max-width: 600px;
    margin-left: auto;

    position: relative;
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: #8e8fa3;
    font-size: 16px;

    pointer-events: none;
}

.search {
    width: 100%;
    height: 43px;

    padding: 0 16px 0 43px;

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 13px;

    outline: none;

    background: rgba(255,255,255,.06);

    color: white;
    font-size: 14px;

    transition: .2s;
}

.search::placeholder {
    color: #858696;
}

.search:focus {
    border-color: rgba(139,92,246,.8);

    background: rgba(255,255,255,.08);

    box-shadow:
        0 0 0 3px rgba(124,92,255,.12);
}

/* =========================
   MAIN
========================= */

.main {
    position: fixed;

    top: 68px;
    left: 0;
    right: 0;
    bottom: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* =========================
   PLAYER
========================= */

.player-section {
    flex-shrink: 0;

    background: #000;

    border-bottom: 1px solid rgba(255,255,255,.08);

    position: relative;

    z-index: 50;
}

.player {
    width: 100%;
    max-width: 1450px;

    margin: auto;

    position: relative;

    background: #000;

    overflow: hidden;

    aspect-ratio: 16 / 9;
    max-height: calc(100vh - 150px);
}

video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    /* KHÔNG dùng controls */
    outline: none;
}

/* =========================
   CUSTOM CONTROLS
========================= */

.custom-controls {
    position: absolute;

    top: 15px;
    right: 15px;

    display: flex;
    gap: 8px;

    z-index: 100;

    opacity: 1;

    transition:
        opacity .3s,
        transform .3s;
}

.custom-controls.hidden {
    opacity: 0;
    pointer-events: none;

    transform: translateY(-8px);
}

.control-btn {
    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,.16);

    border-radius: 12px;

    background: rgba(10,10,16,.7);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;

    cursor: pointer;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transition: .2s;
}

.control-btn:hover {
    background: rgba(124,92,255,.8);

    transform: scale(1.05);
}

.control-btn:active {
    transform: scale(.94);
}

/* =========================
   PLAY INFO
========================= */

.now-playing {
    max-width: 1450px;
    margin: auto;

    min-height: 54px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background:
        linear-gradient(
            90deg,
            #10111a,
            #151225
        );
}

.now-content {
    min-width: 0;
}

.now-label {
    font-size: 10px;
    color: #8e8fa5;

    text-transform: uppercase;

    letter-spacing: 1.2px;

    margin-bottom: 3px;
}

.now-title {
    font-size: 15px;
    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.live-dot {
    width: 7px;
    height: 7px;

    display: inline-block;

    border-radius: 50%;

    background: #22c55e;

    margin-right: 7px;

    box-shadow:
        0 0 10px #22c55e;
}

/* =========================
   CHANNEL AREA
========================= */

.channel-area {
    flex: 1;

    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 16px 18px 40px;

    overscroll-behavior: contain;

    scrollbar-width: thin;
    scrollbar-color: #363747 transparent;
}

.channel-inner {
    max-width: 1450px;
    margin: auto;
}

.status {
    margin-bottom: 13px;

    color: #9293a4;

    font-size: 13px;
}

/* =========================
   CHANNEL GRID
========================= */

.channels {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px, 1fr)
        );

    gap: 12px;
}

.channel {
    position: relative;

    background:
        linear-gradient(
            145deg,
            #12131b,
            #0e0f16
        );

    border: 1px solid rgba(255,255,255,.07);

    border-radius: 15px;

    padding: 9px;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;
}

.channel:hover {
    transform: translateY(-2px);

    border-color:
        rgba(139,92,246,.65);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.channel.active {
    border-color: #8b5cf6;

    box-shadow:
        0 0 0 1px #8b5cf6,
        0 8px 30px rgba(124,92,255,.2);
}

.channel-logo {
    width: 100%;
    height: 82px;

    display: block;

    object-fit: contain;

    border-radius: 10px;

    background: #090a0f;

    margin-bottom: 9px;
}

.no-logo {
    width: 100%;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #171827,
            #0b0c12
        );

    color: #77798b;

    font-size: 24px;
}

.channel-name {
    font-size: 13px;
    font-weight: 750;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    padding: 2px 3px 4px;
}

.channel-quality {
    color: #77798b;

    font-size: 10px;

    padding: 0 3px;
}

/* =========================
   EMPTY / LOADING
========================= */

.loading,
.empty {
    padding: 50px 20px;

    text-align: center;

    color: #858696;
}

.loading::before {
    content: "";

    width: 24px;
    height: 24px;

    display: block;

    margin: 0 auto 12px;

    border: 3px solid #292a37;
    border-top-color: #8b5cf6;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   FULLSCREEN
========================= */

.player:fullscreen {
    width: 100vw;
    height: 100vh;

    max-width: none;
    max-height: none;

    aspect-ratio: auto;

    background: #000;
}

.player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    max-width: none;
    max-height: none;

    aspect-ratio: auto;

    background: #000;
}

.player:fullscreen video,
.player:-webkit-full-screen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

/* Fullscreen controls */
.player:fullscreen .custom-controls,
.player:-webkit-full-screen .custom-controls {
    position: fixed;

    top: 15px;
    right: 15px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    header {
        height: 60px;
    }

    .header-inner {
        padding: 0 10px;
        gap: 9px;
    }

    .brand-logo {
        width: 38px;
        height: 38px;

        border-radius: 11px;
    }

    .brand-name {
        font-size: 17px;
    }

    .search {
        height: 39px;
        font-size: 13px;
        padding-left: 38px;
    }

    .main {
        top: 60px;
    }

    .player {
        aspect-ratio: 16 / 9;

        max-height: none;
    }

    .now-playing {
        min-height: 48px;

        padding: 0 12px;
    }

    .now-title {
        font-size: 14px;
    }

    .channel-area {
        padding: 10px;
    }

    .channels {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .channel {
        padding: 7px;

        border-radius: 12px;
    }

    .channel-logo,
    .no-logo {
        height: 65px;

        border-radius: 8px;
    }

    .channel-name {
        font-size: 12px;
    }

    .custom-controls {
        top: 9px;
        right: 9px;
    }

    .control-btn {
        width: 38px;
        height: 38px;

        border-radius: 10px;

        font-size: 19px;
    }
}

/* =========================
   LANDSCAPE PHONE
========================= */

@media (orientation: landscape) and (max-height: 600px) {

    .player:fullscreen,
    .player:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
    }

    .player:fullscreen video,
    .player:-webkit-full-screen video {
        width: 100vw;
        height: 100vh;

        object-fit: contain;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="brand">

            <div class="brand-logo"></div>

            <div class="brand-name">
                KHANH TV
            </div>

        </div>

        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Tìm kiếm kênh..."
                autocomplete="off"
            >

        </div>

    </div>
</header>


<main class="main">

    <!-- =====================
         PLAYER
    ====================== -->

    <section class="player-section">

        <div
            class="player"
            id="player"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="metadata"
            ></video>


            <!-- CHỈ 2 NÚT TỰ THIẾT KẾ -->

            <div
                class="custom-controls"
                id="customControls"
            >

                <button
                    class="control-btn"
                    id="fullscreenBtn"
                    type="button"
                    aria-label="Toàn màn hình"
                >
                    ⛶
                </button>

                <button
                    class="control-btn"
                    id="exitFullscreenBtn"
                    type="button"
                    aria-label="Thoát toàn màn hình"
                    style="display:none"
                >
                    ×
                </button>

            </div>

        </div>


        <div class="now-playing">

            <div class="now-content">

                <div class="now-label">
                    <span class="live-dot"></span>
                    ĐANG PHÁT
                </div>

                <div
                    class="now-title"
                    id="nowPlaying"
                >
                    Chưa chọn kênh
                </div>

            </div>

        </div>

    </section>


    <!-- =====================
         CHANNEL LIST
    ====================== -->

    <section class="channel-area">

        <div class="channel-inner">

            <div
                class="status"
                id="status"
            >
                Đang tải danh sách kênh...
            </div>

            <div
                id="channels"
                class="channels"
            >

                <div class="loading">
                    Đang tải...
                </div>

            </div>

        </div>

    </section>

</main>


<script>

/* =====================================================
   CONFIG
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


const video =
    document.getElementById("video");

const player =
    document.getElementById("player");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");

const customControls =
    document.getElementById("customControls");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const exitFullscreenBtn =
    document.getElementById("exitFullscreenBtn");


let channels = [];

let hls = null;

let currentChannel = null;

let controlsTimer = null;


/* =====================================================
   WAKE LOCK
   Giữ màn hình sáng khi đang xem
===================================================== */

let wakeLock = null;

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator &&
            document.visibilityState === "visible"
        ) {

            wakeLock =
                await navigator.wakeLock.request("screen");

            console.log(
                "Wake Lock: ON"
            );

        }

    } catch (error) {

        console.log(
            "Wake Lock không được hỗ trợ:",
            error
        );
    }
}


async function releaseWakeLock() {

    try {

        if (wakeLock) {

            await wakeLock.release();

            wakeLock = null;
        }

    } catch (error) {}

}


/* Khi quay lại ứng dụng */
document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible" &&
            !video.paused
        ) {

            await requestWakeLock();

        }

    }
);


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist() {

    try {

        const response =
            await fetch(PLAYLIST);

        if (!response.ok) {

            throw new Error(
                "Không thể tải playlist"
            );
        }

        const text =
            await response.text();

        channels =
            parseM3U(text);

        /*
         * ĐƯA TẤT CẢ VTV LÊN ĐẦU
         */

        channels.sort((a, b) => {

            const av =
                /^VTV/i.test(a.name);

            const bv =
                /^VTV/i.test(b.name);

            if (av && !bv) return -1;

            if (!av && bv) return 1;

            return 0;
        });


        statusText.innerText =
            `Đã tải ${channels.length} kênh`;

        renderChannels(channels);

    } catch (error) {

        console.error(error);

        statusText.innerText =
            "❌ Không thể tải danh sách kênh";

        channelsBox.innerHTML = `
            <div class="empty">
                Không tải được playlist IPTV.
            </div>
        `;
    }
}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith("#EXTINF")
        ) {

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""
            };


        } else if (

            info &&
            line &&
            !line.startsWith("#")

        ) {

            result.push({

                name: info.name,

                logo: info.logo,

                id: info.id,

                url: line

            });

            info = null;
        }
    }

    return result;
}


/* =====================================================
   RENDER CHANNELS
===================================================== */

function renderChannels(list) {

    channelsBox.innerHTML = "";

    if (!list.length) {

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh
            </div>
        `;

        return;
    }


    const fragment =
        document.createDocumentFragment();


    list.forEach(channel => {

        const item =
            document.createElement("div");

        item.className =
            "channel";


        if (
            currentChannel &&
            currentChannel.url === channel.url
        ) {

            item.classList.add(
                "active"
            );
        }


        let logoHTML = "";

        if (channel.logo) {

            logoHTML = `
                <img
                    class="channel-logo"
                    src="${escapeHtml(channel.logo)}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                    "
                >
            `;

        } else {

            logoHTML = `
                <div class="no-logo">
                    TV
                </div>
            `;
        }


        item.innerHTML = `

            ${logoHTML}

            <div class="channel-name">
                ${escapeHtml(channel.name)}
            </div>

            <div class="channel-quality">
                LIVE
            </div>

        `;


        item.addEventListener(
            "click",
            () => {

                playChannel(channel);

            }
        );


        fragment.appendChild(item);

    });


    channelsBox.appendChild(fragment);
}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    if (hls) {

        try {
            hls.destroy();
        } catch (e) {}

        hls = null;
    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url;


    /*
     * HLS.JS
     */

    if (
        url.includes(".m3u8") &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 20,

                maxMaxBufferLength: 30

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                try {

                    await video.play();

                    await requestWakeLock();

                } catch (error) {

                    console.log(
                        "Autoplay:",
                        error
                    );
                }

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.log(
                    "HLS:",
                    data
                );


                if (
                    data.fatal
                ) {

                    switch (
                        data.type
                    ) {

                        case Hls.ErrorTypes.NETWORK_ERROR:

                            hls.startLoad();

                            break;


                        case Hls.ErrorTypes.MEDIA_ERROR:

                            hls.recoverMediaError();

                            break;
                        }
                }

            }
        );


    }

    /*
     * Safari / iOS native HLS
     */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = url;


        video.addEventListener(
            "loadedmetadata",
            async function onLoaded() {

                video.removeEventListener(
                    "loadedmetadata",
                    onLoaded
                );


                try {

                    await video.play();

                    await requestWakeLock();

                } catch (error) {}

            }
        );


    }

    /*
     * Other
     */

    else {

        video.src = url;

        video.play()
            .then(() => {

                requestWakeLock();

            })
            .catch(() => {});

    }


    renderChannels(
        filterChannels()
    );


    showControls();

}


/* =====================================================
   CUSTOM CONTROLS
===================================================== */

function showControls() {

    customControls.classList.remove(
        "hidden"
    );


    clearTimeout(
        controlsTimer
    );


    controlsTimer =
        setTimeout(
            () => {

                customControls.classList.add(
                    "hidden"
                );

            },
            3000
        );
}


/*
 * Chạm vào video
 * -> hiện nút
 */

player.addEventListener(
    "click",
    function(e) {

        if (
            e.target.closest(
                ".control-btn"
            )
        ) {

            return;
        }


        showControls();

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

async function enterFullscreen() {

    showControls();


    try {

        if (
            player.requestFullscreen
        ) {

            await player.requestFullscreen();

        } else if (
            player.webkitRequestFullscreen
        ) {

            player.webkitRequestFullscreen();

        }

    } catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

    }


    /*
     * Cố gắng khóa xoay ngang
     * nếu trình duyệt hỗ trợ.
     */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    } catch (error) {}


    /*
     * QUAN TRỌNG:
     * xin Wake Lock sau fullscreen
     */

    await requestWakeLock();


    updateFullscreenButtons();
}


async function exitFullscreen() {

    try {

        if (
            document.exitFullscreen
        ) {

            await document.exitFullscreen();

        } else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

    } catch (error) {}


    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    } catch (error) {}


    await requestWakeLock();

    updateFullscreenButtons();
}


fullscreenBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        enterFullscreen();

    }
);


exitFullscreenBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        exitFullscreen();

    }
);


/* =====================================================
   FULLSCREEN STATE
===================================================== */

function isFullscreen() {

    return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement
    );
}


function updateFullscreenButtons() {

    if (isFullscreen()) {

        fullscreenBtn.style.display =
            "none";

        exitFullscreenBtn.style.display =
            "flex";

    } else {

        fullscreenBtn.style.display =
            "flex";

        exitFullscreenBtn.style.display =
            "none";
    }

    showControls();
}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenButtons
);


document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButtons
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;

    }


    return channels.filter(
        channel =>
            channel.name
                .toLowerCase()
                .includes(keyword)
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   START
===================================================== */

loadPlaylist();
