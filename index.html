<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML → APK</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#252044,#08080b 60%);
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    background:#121217;
    border:1px solid #30303a;
    border-radius:22px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    width:65px;
    height:65px;
    margin:0 auto 12px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:linear-gradient(135deg,#796bff,#5141d9);
}

h1{
    text-align:center;
    margin:0;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#9999a3;
    font-size:13px;
    margin:8px 0 22px;
}

label{
    display:block;
    color:#bbb;
    font-size:13px;
    margin:14px 0 7px;
}

input,
textarea{
    width:100%;
    border:1px solid #34343e;
    border-radius:11px;
    background:#0d0d11;
    color:#fff;
    outline:none;
    font-size:14px;
}

input{
    height:45px;
    padding:0 13px;
}

textarea{
    min-height:330px;
    padding:13px;
    resize:vertical;
    font-family:
        Consolas,
        Monaco,
        monospace;
    line-height:1.5;
}

input:focus,
textarea:focus{
    border-color:#7165ff;
    box-shadow:
        0 0 0 3px
        rgba(113,101,255,.12);
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.button{
    width:100%;
    height:48px;
    margin-top:18px;
    border:0;
    border-radius:12px;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:
        linear-gradient(
            135deg,
            #796bff,
            #5141d9
        );
}

.button:active{
    transform:scale(.98);
}

.button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.preview{
    margin-top:15px;
    width:100%;
    height:300px;
    border:1px solid #30303a;
    border-radius:12px;
    background:#fff;
}

.progress{
    display:none;
    margin-top:20px;
}

.progress-bar{
    width:100%;
    height:7px;
    border-radius:10px;
    overflow:hidden;
    background:#292930;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#7165ff;
    transition:.3s;
}

.status{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:8px;
}

.result{
    display:none;
    margin-top:20px;
    padding:16px;
    border-radius:12px;
    background:#101016;
    border:1px solid #30303a;
    text-align:center;
}

.download{
    display:inline-block;
    margin-top:10px;
    padding:11px 20px;
    border-radius:10px;
    background:#25a55b;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

.clear{
    background:#292930;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .container{
        padding:17px;
        border-radius:18px;
    }

    .options{
        grid-template-columns:1fr;
        gap:0;
    }

    textarea{
        min-height:280px;
        font-size:12px;
    }

    .preview{
        height:250px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        📦
    </div>

    <h1>
        HTML → APK
    </h1>

    <div class="subtitle">
        Dán mã HTML và đóng gói thành ứng dụng Android
    </div>


    <div class="options">

        <div>

            <label>
                Tên ứng dụng
            </label>

            <input
                id="appName"
                value="KHANH TV"
                placeholder="Tên ứng dụng"
            >

        </div>


        <div>

            <label>
                Package Name
            </label>

            <input
                id="packageName"
                value="com.khanhtv.app"
                placeholder="com.example.app"
            >

        </div>

    </div>


    <label>
        Mã HTML
    </label>

    <textarea
        id="htmlCode"
        spellcheck="false"
        placeholder="Dán toàn bộ mã HTML của bạn vào đây..."></textarea>


    <button
        class="button"
        onclick="previewHTML()">

        👁️ Xem trước

    </button>


    <iframe
        id="preview"
        class="preview"
        sandbox="allow-scripts allow-forms allow-same-origin"
        style="display:none">
    </iframe>


    <button
        id="buildButton"
        class="button"
        onclick="buildAPK()">

        🚀 BUILD APK

    </button>


    <button
        class="button clear"
        onclick="clearCode()">

        🗑️ Xóa mã

    </button>


    <div
        id="progress"
        class="progress">

        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill">
            </div>

        </div>

        <div
            id="status"
            class="status">

            Đang chuẩn bị...

        </div>

    </div>


    <div
        id="result"
        class="result">

        <div>
            ✅ Build APK thành công
        </div>

        <a
            id="download"
            class="download"
            href="#">

            📥 Tải APK

        </a>

    </div>

</div>


<script>

/* =========================
   XEM TRƯỚC HTML
========================= */

function previewHTML(){

    const code =
        document.getElementById(
            "htmlCode"
        ).value;

    if(!code.trim()){

        alert(
            "Hãy dán mã HTML trước!"
        );

        return;
    }

    const preview =
        document.getElementById(
            "preview"
        );

    preview.style.display =
        "block";

    preview.srcdoc =
        code;
}


/* =========================
   XÓA
========================= */

function clearCode(){

    document.getElementById(
        "htmlCode"
    ).value = "";

    document.getElementById(
        "preview"
    ).style.display =
        "none";

    document.getElementById(
        "result"
    ).style.display =
        "none";

}


/* =========================
   BUILD APK
========================= */

async function buildAPK(){

    const code =
        document.getElementById(
            "htmlCode"
        ).value;

    const appName =
        document.getElementById(
            "appName"
        ).value.trim();

    const packageName =
        document.getElementById(
            "packageName"
        ).value.trim();


    if(!code.trim()){

        alert(
            "Bạn chưa dán mã HTML!"
        );

        return;
    }


    if(!appName){

        alert(
            "Hãy nhập tên ứng dụng!"
        );

        return;
    }


    if(
        !/^[a-zA-Z0-9_]+(\.[a-zA-Z0-9_]+)+$/
        .test(packageName)
    ){

        alert(
            "Package Name không hợp lệ!"
        );

        return;
    }


    const button =
        document.getElementById(
            "buildButton"
        );

    const progress =
        document.getElementById(
            "progress"
        );

    const fill =
        document.getElementById(
            "progressFill"
        );

    const status =
        document.getElementById(
            "status"
        );

    const result =
        document.getElementById(
            "result"
        );


    button.disabled =
        true;

    progress.style.display =
        "block";

    result.style.display =
        "none";


    /*
     * Gửi mã HTML tới backend
     */

    const formData =
        new FormData();

    formData.append(
        "html",
        code
    );

    formData.append(
        "appName",
        appName
    );

    formData.append(
        "packageName",
        packageName
    );


    try{

        fill.style.width =
            "20%";

        status.innerText =
            "Đang gửi mã HTML...";


        /*
         * API BUILD
         *
         * Backend của bạn cần có:
         *
         * POST /api/build
         *
         */

        const response =
            await fetch(
                "/api/build",
                {
                    method:"POST",
                    body:formData
                }
            );


        fill.style.width =
            "60%";

        status.innerText =
            "Đang build APK...";


        if(!response.ok){

            throw new Error(
                "Build thất bại"
            );

        }


        const data =
            await response.json();


        fill.style.width =
            "100%";


        status.innerText =
            "Build hoàn tất!";


        if(data.apk){

            document.getElementById(
                "download"
            ).href =
                data.apk;


            result.style.display =
                "block";

        }
        else{

            throw new Error(
                "Server không trả về APK"
            );

        }

    }

    catch(error){

        console.error(error);

        status.innerText =
            "❌ Không thể build APK";


        alert(
            "Chưa kết nối server build APK.\n\n"
            +
            "Cần backend Android SDK/Gradle "
            +
            "để tạo file APK thật."
        );

    }

    finally{

        button.disabled =
            false;

    }

}

</script>

</body>
</html>
