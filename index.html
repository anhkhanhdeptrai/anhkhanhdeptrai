<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07080d;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(7,8,13,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.header{
    max-width:1450px;
    margin:auto;
    min-height:70px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:18px;
}

/* LOGO */

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logo-mark{
    width:43px;
    height:43px;
    position:relative;
    border-radius:13px;
    background:linear-gradient(
        135deg,
        #6c5ce7,
        #00c6ff,
        #ff3cac
    );
    background-size:250% 250%;
    animation:logoGradient 6s ease infinite;
    box-shadow:
        0 0 20px rgba(0,198,255,.22),
        0 0 35px rgba(255,60,172,.12);
}

.logo-mark:before{
    content:"";
    position:absolute;
    width:22px;
    height:16px;
    left:10px;
    top:12px;
    border:3px solid white;
    border-radius:5px;
}

.logo-mark:after{
    content:"";
    position:absolute;
    width:8px;
    height:3px;
    background:white;
    border-radius:5px;
    left:17px;
    bottom:7px;
}

.logo-text{
    font-size:21px;
    font-weight:900;
    letter-spacing:.5px;

    background:linear-gradient(
        90deg,
        #fff,
        #73e8ff,
        #9c7cff,
        #ff6acb,
        #fff
    );

    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:titleGradient 5s linear infinite;
}

@keyframes logoGradient{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

@keyframes titleGradient{
    0%{background-position:0%}
    100%{background-position:300%}
}

/* SEARCH */

.search-wrap{
    flex:1;
    max-width:650px;
    margin-left:auto;
    position:relative;
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    opacity:.65;
    font-size:17px;
    pointer-events:none;
}

.search{
    width:100%;
    height:44px;
    padding:0 18px 0 44px;

    color:white;
    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.09);
    border-radius:14px;

    outline:none;
    font-size:14px;

    transition:.25s;
}

.search::placeholder{
    color:#777b8a;
}

.search:focus{
    border-color:#7c6cff;
    background:rgba(255,255,255,.075);
    box-shadow:
        0 0 0 3px rgba(124,108,255,.10),
        0 0 25px rgba(124,108,255,.08);
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1450px;
    margin:auto;
    padding:18px;
}

/* =========================
   PLAYER
========================= */

.player-section{
    position:sticky;
    top:71px;
    z-index:50;
    background:#07080d;
    padding-bottom:16px;
}

.player-box{
    position:relative;
    width:100%;
    background:#000;
    border-radius:18px;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 15px 50px rgba(0,0,0,.45);
}

.video-area{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
}

video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;
}

/*
   Tắt giao diện mặc định của video.
   Điều khiển được tạo bằng JS/CSS.
*/
video::-webkit-media-controls{
    display:none !important;
}

video::-webkit-media-controls-enclosure{
    display:none !important;
}

video::-webkit-media-controls-panel{
    display:none !important;
}

/* LOADING */

.video-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    transition:.2s;
    background:rgba(0,0,0,.18);
}

.video-loading.show{
    opacity:1;
}

.spinner{
    width:42px;
    height:42px;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:#7c6cff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* PLAYER BUTTONS */

.player-action{
    position:absolute;
    top:15px;
    right:15px;

    display:flex;
    gap:8px;

    z-index:20;

    opacity:0;
    transform:translateY(-5px);
    pointer-events:none;

    transition:.25s;
}

.video-area:hover .player-action,
.video-area.show-controls .player-action,
.player-action:focus-within{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.player-btn{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;

    background:rgba(10,10,15,.72);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    color:white;
    font-size:22px;

    cursor:pointer;

    transition:.2s;
}

.player-btn:hover{
    background:rgba(124,108,255,.8);
    transform:scale(1.05);
}

.player-btn:active{
    transform:scale(.95);
}

/* INFO */

.now-playing{
    min-height:58px;
    padding:12px 16px;

    display:flex;
    align-items:center;
    gap:10px;

    background:
        linear-gradient(
            90deg,
            rgba(124,108,255,.12),
            rgba(0,198,255,.06),
            transparent
        );

    border-top:1px solid rgba(255,255,255,.06);
}

.live-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#39ff88;
    box-shadow:0 0 10px #39ff88;
    flex:none;
}

.now-name{
    font-size:15px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.now-status{
    margin-left:auto;
    color:#858a9c;
    font-size:12px;
    white-space:nowrap;
}

/* =========================
   STATUS
========================= */

.status{
    margin:4px 0 14px;

    color:#8d92a3;
    font-size:13px;
}

/* =========================
   CHANNELS
========================= */

.channels{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:12px;
}

.channel{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.07);

    border-radius:15px;
    padding:10px;

    cursor:pointer;

    transition:
        transform .2s,
        border-color .2s,
        background .2s,
        box-shadow .2s;

    overflow:hidden;
}

.channel:hover{
    transform:translateY(-3px);

    border-color:rgba(124,108,255,.6);

    background:
        linear-gradient(
            145deg,
            rgba(124,108,255,.13),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

.channel.active{
    border-color:#7c6cff;

    box-shadow:
        0 0 0 1px rgba(124,108,255,.2),
        0 0 25px rgba(124,108,255,.12);
}

.channel-logo{
    width:100%;
    height:82px;

    object-fit:contain;

    background:#0b0c12;

    border-radius:10px;

    display:block;
}

.channel-name{
    margin-top:10px;

    font-size:13px;
    font-weight:750;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel-quality{
    margin-top:5px;

    color:#777c8d;
    font-size:11px;
}

/* EMPTY */

.empty{
    grid-column:1/-1;

    text-align:center;
    padding:50px 20px;

    color:#777c8d;
}

.loading-list{
    grid-column:1/-1;

    text-align:center;
    padding:45px;

    color:#888d9e;
}

/* =========================
   CUSTOM FULLSCREEN
========================= */

#fullscreenPlayer{
    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    width:100dvw;
    height:100dvh;

    z-index:999999;

    background:#000;

    display:none;

    overflow:hidden;

    touch-action:none;
}

#fullscreenPlayer.active{
    display:block;
}

#fullscreenVideo{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}

/*
   Nút riêng của fullscreen
*/

.fs-buttons{
    position:absolute;

    top:
        max(14px, env(safe-area-inset-top));

    right:
        max(14px, env(safe-area-inset-right));

    display:flex;
    gap:8px;

    z-index:20;

    opacity:0;

    transition:.3s;

    pointer-events:none;
}

#fullscreenPlayer.show-ui .fs-buttons{
    opacity:1;
    pointer-events:auto;
}

.fs-btn{
    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.18);

    border-radius:13px;

    background:rgba(10,10,15,.72);

    color:#fff;

    font-size:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    cursor:pointer;
}

/* fullscreen title */

.fs-title{
    position:absolute;

    left:
        max(14px, env(safe-area-inset-left));

    top:
        max(14px, env(safe-area-inset-top));

    max-width:60%;

    padding:10px 14px;

    border-radius:12px;

    background:rgba(10,10,15,.65);

    backdrop-filter:blur(10px);

    color:#fff;

    font-size:14px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    z-index:20;

    opacity:0;
    transition:.3s;
}

#fullscreenPlayer.show-ui .fs-title{
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        min-height:64px;
        padding:9px 11px;
        gap:10px;
    }

    .logo-mark{
        width:38px;
        height:38px;
        border-radius:11px;
    }

    .logo-text{
        font-size:18px;
    }

    .search-wrap{
        max-width:none;
    }

    .search{
        height:40px;
        border-radius:12px;
        font-size:13px;
    }

    .container{
        padding:10px;
    }

    .player-section{
        top:63px;
        padding-bottom:10px;
    }

    .player-box{
        border-radius:14px;
    }

    .video-area{
        aspect-ratio:16/9;
    }

    .now-playing{
        min-height:51px;
        padding:9px 11px;
    }

    .now-name{
        font-size:13px;
    }

    .now-status{
        font-size:10px;
    }

    .channels{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }

    .channel{
        padding:7px;
        border-radius:12px;
    }

    .channel-logo{
        height:65px;
        border-radius:8px;
    }

    .channel-name{
        font-size:12px;
        margin-top:7px;
    }

    .channel-quality{
        font-size:10px;
    }

    .player-btn{
        width:39px;
        height:39px;
    }
}

/* =========================
   LANDSCAPE
========================= */

@media(max-height:600px) and (orientation:landscape){

    #fullscreenPlayer.active{
        display:block;
    }

    #fullscreenVideo{
        width:100vw;
        height:100vh;
        width:100dvw;
        height:100dvh;

        object-fit:contain;
    }
}

/* =========================
   FULLSCREEN DEVICE
========================= */

:fullscreen #fullscreenPlayer{
    width:100vw;
    height:100vh;
}

:-webkit-full-screen #fullscreenPlayer{
    width:100vw;
    height:100vh;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:7px;
}

::-webkit-scrollbar-track{
    background:#08090d;
}

::-webkit-scrollbar-thumb{
    background:#292b38;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#474a5c;
}
</style>
</head>

<body>

<header>

    <div class="header">

        <div class="brand">

            <div class="logo-mark"></div>

            <div class="logo-text">
                KHANH TV
            </div>

        </div>

        <div class="search-wrap">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<div class="container">

    <!-- PLAYER -->

    <section class="player-section">

        <div class="player-box">

            <div
                class="video-area"
                id="videoArea"
            >

                <video
                    id="video"
                    playsinline
                    webkit-playsinline
                    preload="metadata"
                ></video>

                <div
                    class="video-loading"
                    id="videoLoading"
                >
                    <div class="spinner"></div>
                </div>

                <!-- CHỈ CÓ 2 NÚT RIÊNG -->

                <div class="player-action">

                    <button
                        class="player-btn"
                        id="fullscreenBtn"
                        type="button"
                        title="Toàn màn hình"
                    >
                        ⛶
                    </button>

                    <button
                        class="player-btn"
                        id="closeBtn"
                        type="button"
                        title="Thoát toàn màn hình"
                        style="display:none"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="now-playing">

                <span class="live-dot"></span>

                <span
                    class="now-name"
                    id="nowPlaying"
                >
                    Chưa chọn kênh
                </span>

                <span
                    class="now-status"
                    id="playStatus"
                >
                    Sẵn sàng
                </span>

            </div>

        </div>

    </section>


    <div
        class="status"
        id="status"
    >
        Đang tải danh sách kênh...
    </div>


    <div
        id="channels"
        class="channels"
    >
        <div class="loading-list">
            Đang tải...
        </div>
    </div>

</div>


<!-- =========================
     FULLSCREEN PLAYER RIÊNG
========================= -->

<div
    id="fullscreenPlayer"
    aria-hidden="true"
>

    <video
        id="fullscreenVideo"
        playsinline
        webkit-playsinline
    ></video>

    <div
        class="fs-title"
        id="fsTitle"
    >
        KHANH TV
    </div>

    <div class="fs-buttons">

        <button
            class="fs-btn"
            id="fsFullscreen"
            type="button"
        >
            ⛶
        </button>

        <button
            class="fs-btn"
            id="fsClose"
            type="button"
        >
            ×
        </button>

    </div>

</div>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const videoArea =
    document.getElementById("videoArea");

const fullscreenPlayer =
    document.getElementById("fullscreenPlayer");

const fullscreenVideo =
    document.getElementById("fullscreenVideo");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeBtn =
    document.getElementById("closeBtn");

const fsFullscreen =
    document.getElementById("fsFullscreen");

const fsClose =
    document.getElementById("fsClose");

const fsTitle =
    document.getElementById("fsTitle");

const videoLoading =
    document.getElementById("videoLoading");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const playStatus =
    document.getElementById("playStatus");

const searchInput =
    document.getElementById("search");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let hls = null;

let fullscreenHls = null;

let wakeLock = null;

let fullscreenActive = false;

let hideUITimer = null;


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist(){

    try{

        statusText.textContent =
            "Đang tải danh sách kênh...";

        const response =
            await fetch(PLAYLIST, {
                cache:"no-store"
            });

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        channels =
            parseM3U(text);

        /*
         * ĐƯA TOÀN BỘ VTV LÊN ĐẦU
         */

        channels.sort((a,b)=>{

            const aVTV =
                a.name
                    .toUpperCase()
                    .startsWith("VTV");

            const bVTV =
                b.name
                    .toUpperCase()
                    .startsWith("VTV");

            if(aVTV && !bVTV) return -1;

            if(!aVTV && bVTV) return 1;

            return 0;

        });

        statusText.textContent =
            `Đã tải ${channels.length} kênh`;

        renderChannels(channels);

    }catch(error){

        console.error(error);

        statusText.textContent =
            "❌ Không thể tải danh sách kênh";

        channelsBox.innerHTML = `
            <div class="empty">
                Không tải được playlist IPTV.
            </div>
        `;
    }
}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text){

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;

    for(let i=0;i<lines.length;i++){

        const line =
            lines[i].trim();

        if(line.startsWith("#EXTINF")){

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(/tvg-logo="([^"]*)"/);

            const idMatch =
                line.match(/tvg-id="([^"]*)"/);

            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : "",

                id:
                    idMatch
                    ? idMatch[1]
                    : ""

            };

        }

        else if(
            info &&
            line &&
            !line.startsWith("#")
        ){

            result.push({

                name:info.name,

                logo:info.logo,

                id:info.id,

                url:line

            });

            info=null;
        }
    }

    return result;
}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list){

    channelsBox.innerHTML="";

    if(!list.length){

        channelsBox.innerHTML=`
            <div class="empty">
                Không tìm thấy kênh
            </div>
        `;

        return;
    }

    const fragment =
        document.createDocumentFragment();

    list.forEach(channel=>{

        const item =
            document.createElement("div");

        item.className="channel";

        if(
            currentChannel &&
            currentChannel.url === channel.url
        ){
            item.classList.add("active");
        }

        const img =
            document.createElement("img");

        img.className="channel-logo";

        img.loading="lazy";

        if(channel.logo){

            img.src=channel.logo;

            img.onerror=()=>{
                img.style.visibility="hidden";
            };

        }

        const name =
            document.createElement("div");

        name.className="channel-name";

        name.textContent =
            channel.name;

        const quality =
            document.createElement("div");

        quality.className="channel-quality";

        const match =
            channel.name.match(
                /\(([^)]+)\)/
            );

        quality.textContent =
            match
            ? match[1]
            : "Live";

        item.appendChild(img);

        item.appendChild(name);

        item.appendChild(quality);

        item.addEventListener(
            "click",
            ()=>{
                playChannel(channel);
            }
        );

        fragment.appendChild(item);

    });

    channelsBox.appendChild(fragment);
}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel){

    currentChannel=channel;

    nowPlaying.textContent =
        channel.name;

    fsTitle.textContent =
        channel.name;

    playStatus.textContent =
        "Đang kết nối...";

    videoLoading.classList.add("show");

    if(hls){

        hls.destroy();

        hls=null;
    }

    video.pause();

    video.removeAttribute("src");

    const url =
        channel.url.trim();

    if(
        url.includes(".m3u8") &&
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20,

                maxMaxBufferLength:30

            });

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{

                videoLoading.classList.remove(
                    "show"
                );

                playStatus.textContent =
                    "Đang phát";

                video.play().catch(()=>{});

            }
        );

        hls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                console.log(
                    "HLS ERROR",
                    data
                );

                if(data.fatal){

                    playStatus.textContent =
                        "Lỗi phát";

                    videoLoading.classList.remove(
                        "show"
                    );
                }
            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src=url;

        video.addEventListener(
            "loadedmetadata",
            ()=>{
                videoLoading.classList.remove(
                    "show"
                );

                playStatus.textContent =
                    "Đang phát";

                video.play().catch(()=>{});
            },
            {once:true}
        );

    }

    else{

        video.src=url;

        video.play().catch(()=>{});

        videoLoading.classList.remove(
            "show"
        );

        playStatus.textContent =
            "Đang phát";
    }

    renderChannels(
        filterChannels()
    );
}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
    "waiting",
    ()=>{
        videoLoading.classList.add("show");
        playStatus.textContent="Đang tải...";
    }
);

video.addEventListener(
    "playing",
    ()=>{
        videoLoading.classList.remove("show");
        playStatus.textContent="Đang phát";
    }
);

video.addEventListener(
    "pause",
    ()=>{
        if(!fullscreenActive){
            playStatus.textContent="Tạm dừng";
        }
    }
);


/* =========================================================
   CUSTOM FULLSCREEN
========================================================= */

async function openCustomFullscreen(){

    if(!currentChannel){

        alert("Hãy chọn một kênh trước.");

        return;
    }

    fullscreenActive=true;

    fullscreenPlayer.classList.add("active");

    fullscreenPlayer.setAttribute(
        "aria-hidden",
        "false"
    );

    fullscreenPlayer.classList.add(
        "show-ui"
    );

    fullscreenBtn.style.display="none";

    closeBtn.style.display="block";

    /*
     * Dùng stream hiện tại cho fullscreen.
     * Không phụ thuộc vào player cũ.
     */

    if(fullscreenHls){

        fullscreenHls.destroy();

        fullscreenHls=null;
    }

    fullscreenVideo.pause();

    fullscreenVideo.removeAttribute(
        "src"
    );

    const url =
        currentChannel.url;

    if(
        url.includes(".m3u8") &&
        Hls.isSupported()
    ){

        fullscreenHls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20

            });

        fullscreenHls.loadSource(url);

        fullscreenHls.attachMedia(
            fullscreenVideo
        );

        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{
                fullscreenVideo.play()
                    .catch(()=>{});
            }
        );

    }

    else{

        fullscreenVideo.src=url;

        fullscreenVideo.play()
            .catch(()=>{});
    }

    /*
     * BẬT WAKE LOCK
     */

    await requestWakeLock();

    /*
     * Fullscreen API.
     * Nếu trình duyệt không cho phép thì
     * custom fullscreen vẫn hoạt động.
     */

    try{

        if(
            !document.fullscreenElement &&
            fullscreenPlayer.requestFullscreen
        ){

            await fullscreenPlayer
                .requestFullscreen();

        }

    }catch(error){

        console.log(
            "Fullscreen API:",
            error
        );
    }

    /*
     * Xoay ngang nếu thiết bị hỗ trợ.
     */

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }catch(error){

        console.log(
            "Orientation lock:",
            error
        );
    }

    resetFullscreenUI();
}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

async function closeCustomFullscreen(){

    fullscreenActive=false;

    clearTimeout(hideUITimer);

    /*
     * TẮT WAKE LOCK
     */

    await releaseWakeLock();

    /*
     * Mở lại video chính
     */

    if(
        currentChannel &&
        video.paused
    ){

        video.play().catch(()=>{});
    }

    if(fullscreenHls){

        fullscreenHls.destroy();

        fullscreenHls=null;
    }

    fullscreenVideo.pause();

    fullscreenVideo.removeAttribute(
        "src"
    );

    fullscreenPlayer.classList.remove(
        "active"
    );

    fullscreenPlayer.classList.remove(
        "show-ui"
    );

    fullscreenPlayer.setAttribute(
        "aria-hidden",
        "true"
    );

    fullscreenBtn.style.display="flex";

    closeBtn.style.display="none";

    /*
     * Thoát fullscreen API
     */

    try{

        if(document.fullscreenElement){

            await document.exitFullscreen();

        }

    }catch(error){

        console.log(error);
    }

    /*
     * Mở khóa xoay
     */

    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }catch(error){}
}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator &&
            fullscreenActive
        ){

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

            wakeLock.addEventListener(
                "release",
                ()=>{
                    wakeLock=null;
                }
            );

            console.log(
                "Wake Lock: ON"
            );
        }

    }catch(error){

        console.log(
            "Wake Lock không khả dụng:",
            error
        );
    }
}


/* =========================================================
   RELEASE WAKE LOCK
========================================================= */

async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock=null;
        }

    }catch(error){

        console.log(error);

        wakeLock=null;
    }
}


/* =========================================================
   TỰ XIN LẠI WAKE LOCK
   KHI APP QUAY LẠI FOREGROUND
========================================================= */

document.addEventListener(
    "visibilitychange",
    async ()=>{
        if(
            document.visibilityState === "visible" &&
            fullscreenActive
        ){

            await requestWakeLock();

        }
    }
);


/* =========================================================
   TỰ XIN LẠI KHI QUAY MÀN HÌNH
========================================================= */

window.addEventListener(
    "orientationchange",
    async ()=>{

        if(fullscreenActive){

            setTimeout(
                async ()=>{
                    await requestWakeLock();
                },
                300
            );

        }
    }
);


/* =========================================================
   BUTTONS
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    openCustomFullscreen
);

closeBtn.addEventListener(
    "click",
    closeCustomFullscreen
);

fsClose.addEventListener(
    "click",
    closeCustomFullscreen
);

fsFullscreen.addEventListener(
    "click",
    async ()=>{

        /*
         * Nút ⛶ trong fullscreen:
         * bật/tắt Fullscreen API,
         * không làm mất video.
         */

        try{

            if(!document.fullscreenElement){

                await fullscreenPlayer
                    .requestFullscreen();

            }
            else{

                await document.exitFullscreen();

            }

        }catch(error){

            console.log(error);
        }

        await requestWakeLock();

        resetFullscreenUI();
    }
);


/* =========================================================
   FULLSCREEN UI AUTO HIDE
========================================================= */

function resetFullscreenUI(){

    if(!fullscreenActive){
        return;
    }

    fullscreenPlayer.classList.add(
        "show-ui"
    );

    clearTimeout(hideUITimer);

    hideUITimer =
        setTimeout(
            ()=>{
                if(fullscreenActive){

                    fullscreenPlayer
                        .classList.remove(
                            "show-ui"
                        );

                }
            },
            2500
        );
}


/* =========================================================
   TAP FULLSCREEN VIDEO
========================================================= */

fullscreenVideo.addEventListener(
    "click",
    ()=>{
        resetFullscreenUI();
    }
);

fullscreenPlayer.addEventListener(
    "touchstart",
    ()=>{
        resetFullscreenUI();
    },
    {passive:true}
);

fullscreenPlayer.addEventListener(
    "mousemove",
    ()=>{
        resetFullscreenUI();
    }
);


/* =========================================================
   FULLSCREEN CHANGE
========================================================= */

document.addEventListener(
    "fullscreenchange",
    async ()=>{

        if(fullscreenActive){

            await requestWakeLock();

            resetFullscreenUI();

        }

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    ()=>{

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();

    if(!keyword){

        return channels;
    }

    return channels.filter(
        channel =>
            channel.name
                .toLowerCase()
                .includes(keyword)
    );
}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape" &&
            fullscreenActive
        ){

            closeCustomFullscreen();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>
