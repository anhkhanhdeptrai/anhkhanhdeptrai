<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07080d;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:10px 14px;

    background:rgba(7,8,13,.94);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.header{
    width:100%;
    max-width:1450px;
    margin:auto;

    display:flex;
    align-items:center;
    gap:14px;
}

/* =========================================================
   LOGO
========================================================= */

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logo{
    position:relative;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3cff,
            #e83cff 45%,
            #ff3864
        );

    box-shadow:
        0 0 20px rgba(155,70,255,.35);

    overflow:hidden;
}

.logo::before{
    content:"";

    width:20px;
    height:15px;

    border:3px solid white;
    border-radius:5px;

    position:absolute;
}

.logo::after{
    content:"";

    width:10px;
    height:3px;

    background:white;
    border-radius:10px;

    position:absolute;
    bottom:7px;
}

.brand-text{
    font-size:20px;
    font-weight:900;
    letter-spacing:.5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a970ff,
            #ff55b8,
            #ffffff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleGradient 5s linear infinite;
}

@keyframes titleGradient{
    0%{
        background-position:0% center;
    }

    100%{
        background-position:250% center;
    }
}

/* =========================================================
   SEARCH
========================================================= */

.search-wrap{
    flex:1;
    position:relative;
}

.search-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#85899a;
    font-size:17px;

    pointer-events:none;
}

.search{
    width:100%;
    height:43px;

    padding:0 16px 0 44px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;

    outline:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    color:white;

    font-size:14px;

    transition:.2s;
}

.search::placeholder{
    color:#737788;
}

.search:focus{
    border-color:rgba(151,91,255,.75);

    box-shadow:
        0 0 0 3px rgba(126,67,255,.10),
        0 0 25px rgba(126,67,255,.12);
}

/* =========================================================
   MAIN
========================================================= */

.container{
    width:100%;
    max-width:1450px;

    margin:auto;

    padding:15px;
}

/* =========================================================
   PLAYER
========================================================= */

.player-box{
    width:100%;

    background:#000;

    border-radius:17px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    margin-bottom:14px;
}

.video-area{
    position:relative;

    width:100%;

    background:#000;

    aspect-ratio:16 / 9;

    overflow:hidden;
}

#video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;
}

/* =========================================================
   PLAYER INFO
========================================================= */

.player-info{
    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:14px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );

    opacity:0;

    transition:.25s;

    z-index:5;
}

.video-area.controls-visible .player-info{
    opacity:1;
}

.live-title{
    font-size:14px;
    font-weight:800;

    max-width:70%;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.live-badge{
    display:flex;
    align-items:center;
    gap:6px;

    padding:5px 9px;

    border-radius:20px;

    background:rgba(255,35,80,.18);

    border:1px solid rgba(255,60,100,.35);

    color:#ff6b89;

    font-size:11px;
    font-weight:800;
}

.live-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff315b;

    box-shadow:
        0 0 10px #ff315b;
}

/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{
    position:absolute;

    width:40px;
    height:40px;

    right:12px;
    bottom:12px;

    border:0;
    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    background:rgba(15,15,20,.72);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    cursor:pointer;

    font-size:21px;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .25s,
        transform .2s,
        background .2s;

    z-index:20;
}

.fullscreen-btn:hover{
    background:rgba(110,70,255,.75);
    transform:scale(1.05);
}

.video-area.controls-visible .fullscreen-btn{
    opacity:1;
    pointer-events:auto;
}

/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{
    min-height:54px;

    padding:12px 15px;

    display:flex;
    align-items:center;
    gap:10px;

    background:
        linear-gradient(
            90deg,
            rgba(115,65,255,.12),
            rgba(255,50,150,.05)
        );

    border-top:1px solid rgba(255,255,255,.06);
}

.now-dot{
    width:8px;
    height:8px;

    flex:0 0 auto;

    border-radius:50%;

    background:#7655ff;

    box-shadow:
        0 0 12px #7655ff;
}

.now-text{
    min-width:0;

    font-size:14px;
    font-weight:800;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    display:flex;
    align-items:center;
    gap:8px;

    margin:5px 2px 13px;

    color:#8f94a6;

    font-size:13px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#45e6a1;

    box-shadow:
        0 0 10px rgba(69,230,161,.7);
}

/* =========================================================
   SOURCE
========================================================= */

.source-box{
    display:none;

    margin:-5px 2px 13px;
}

.source-select{
    width:100%;

    height:40px;

    padding:0 12px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.08);

    background:#15151c;

    color:white;

    outline:none;
}

/* =========================================================
   CHANNEL COUNT
========================================================= */

.channel-count{
    margin:0 2px 10px;

    color:#8f94a6;

    font-size:13px;
}

/* =========================================================
   CHANNEL GRID
========================================================= */

.channels{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(175px,1fr));

    gap:11px;
}

.channel{
    min-width:0;

    padding:9px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.075);

    border-radius:15px;

    cursor:pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;
}

.channel:hover{
    transform:translateY(-2px);

    border-color:
        rgba(130,85,255,.65);

    box-shadow:
        0 10px 25px rgba(0,0,0,.22);
}

.channel.active{
    border-color:#8155ff;

    background:
        linear-gradient(
            145deg,
            rgba(125,75,255,.16),
            rgba(255,60,160,.06)
        );

    box-shadow:
        0 0 20px rgba(126,77,255,.15);
}

.channel-logo{
    width:100%;
    height:78px;

    object-fit:contain;

    display:block;

    border-radius:10px;

    background:#0b0c11;

    margin-bottom:9px;
}

.channel-name{
    font-size:13px;
    font-weight:750;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-quality{
    color:#777c8d;

    font-size:10px;

    margin-top:4px;
}

/* =========================================================
   LOADING / ERROR
========================================================= */

.loading,
.empty{
    grid-column:1 / -1;

    text-align:center;

    padding:45px 20px;

    color:#85899a;
}

.error{
    grid-column:1 / -1;

    text-align:center;

    padding:45px 20px;

    color:#ff6b89;
}

/* =========================================================
   PLAYER LOADING
========================================================= */

.player-loading{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.45);

    z-index:15;

    font-size:13px;

    pointer-events:none;
}

.player-loading.hidden{
    display:none;
}

/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.fullscreen-viewer{
    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    background:#000;

    z-index:999999;

    display:none;

    overflow:hidden;

    touch-action:manipulation;
}

.fullscreen-viewer.active{
    display:block;
}

.fullscreen-video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}

.fullscreen-video::-webkit-media-controls{
    display:none !important;
}

.fullscreen-video::-webkit-media-controls-enclosure{
    display:none !important;
}

/* =========================================================
   FULLSCREEN TOP
========================================================= */

.fullscreen-top{
    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:15px;

    z-index:10;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent
        );

    opacity:1;

    transition:opacity .3s;

    pointer-events:none;
}

.fullscreen-title{
    font-size:14px;
    font-weight:800;

    max-width:75%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.close-fullscreen{
    width:42px;
    height:42px;

    border:0;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    background:rgba(15,15,20,.72);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    font-size:27px;

    cursor:pointer;

    pointer-events:auto;
}

.close-fullscreen:hover{
    background:rgba(110,70,255,.75);
}

.fullscreen-viewer.controls-hidden .fullscreen-top{
    opacity:0;

    pointer-events:none;
}

.fullscreen-viewer.controls-hidden
.close-fullscreen{
    pointer-events:none;
}

/* =========================================================
   FULLSCREEN LOADING
========================================================= */

.fullscreen-loading{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(0,0,0,.4);

    z-index:8;

    color:white;

    font-size:14px;

    pointer-events:none;
}

.fullscreen-loading.hidden{
    display:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:9px 10px;
    }

    .header{
        gap:9px;
    }

    .logo{
        width:38px;
        height:38px;

        border-radius:11px;
    }

    .brand-text{
        font-size:17px;
    }

    .search{
        height:40px;

        border-radius:12px;

        padding-left:40px;

        font-size:13px;
    }

    .container{
        padding:10px;
    }

    .player-box{
        border-radius:14px;
    }

    .channels{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }

    .channel{
        padding:7px;

        border-radius:12px;
    }

    .channel-logo{
        height:62px;
    }

    .channel-name{
        font-size:12px;
    }
}

/* =========================================================
   LANDSCAPE
========================================================= */

@media(orientation:landscape){

    .fullscreen-viewer{
        width:100vw;
        height:100dvh;
    }

    .fullscreen-video{
        width:100vw;
        height:100dvh;

        object-fit:contain;
    }

    .fullscreen-top{
        padding:
            max(12px,env(safe-area-inset-top))
            max(12px,env(safe-area-inset-right))
            12px
            max(12px,env(safe-area-inset-left));
    }
}

/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:env(safe-area-inset-top)){

    .fullscreen-viewer{
        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }
}
</style>
</head>

<body>

<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header">

        <div class="brand">

            <!-- LOGO CSS GỐC, KHÔNG DÙNG ICON -->

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>

        <div class="search-wrap">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">

    <!-- PLAYER -->

    <div class="player-box">

        <div
            id="videoArea"
            class="video-area"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>


            <!-- LOADING -->

            <div
                id="playerLoading"
                class="player-loading hidden"
            >
                🔄 Đang kết nối nguồn...
            </div>


            <!-- TOP INFO -->

            <div class="player-info">

                <div
                    id="playerTitle"
                    class="live-title"
                >
                    KHANH TV
                </div>

                <div class="live-badge">

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>


            <!-- FULLSCREEN -->

            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

        </div>


        <!-- NOW PLAYING -->

        <div class="now-playing">

            <span class="now-dot"></span>

            <span
                id="nowPlaying"
                class="now-text"
            >
                Chưa chọn kênh
            </span>

        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Đang tải danh sách...
        </span>

    </div>


    <!-- SOURCE -->

    <div
        id="sourceBox"
        class="source-box"
    >

        <select
            id="sourceSelect"
            class="source-select"
        ></select>

    </div>


    <!-- COUNT -->

    <div
        id="count"
        class="channel-count"
    >
        Đang tải danh sách...
    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            📡 Đang tải danh sách kênh...
        </div>

    </div>

</main>


<!-- =======================================================
     FULLSCREEN VIEWER
======================================================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>

    <!--

        QUAN TRỌNG:

        Đây là video RIÊNG cho fullscreen.

        Nó không thay đổi kích thước player chính.

    -->

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div
        id="fullscreenLoading"
        class="fullscreen-loading hidden"
    >
        🔄 Đang kết nối nguồn...
    </div>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="fullscreen-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
            aria-label="Đóng"
        >
            ×
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const M3U_URL =
"https://raw.githubusercontent.com/iptv-org/iptv/master/streams/vn.m3u";


const LOGO_BASE =
"https://raw.githubusercontent.com/iptv-org/iptv/master/logos/tv/";


const DEFAULT_LOGO =
"https://dummyimage.com/300x150/111/fff&text=TV";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
document.getElementById("video");

const fullscreenVideo =
document.getElementById("fullscreenVideo");

const videoArea =
document.getElementById("videoArea");

const fullscreenViewer =
document.getElementById("fullscreenViewer");

const fullscreenBtn =
document.getElementById("fullscreenBtn");

const closeFullscreen =
document.getElementById("closeFullscreen");

const channelsBox =
document.getElementById("channels");

const statusBox =
document.getElementById("status");

const nowPlaying =
document.getElementById("nowPlaying");

const playerTitle =
document.getElementById("playerTitle");

const fullscreenTitle =
document.getElementById("fullscreenTitle");

const searchInput =
document.getElementById("search");

const countBox =
document.getElementById("count");

const sourceBox =
document.getElementById("sourceBox");

const sourceSelect =
document.getElementById("sourceSelect");

const playerLoading =
document.getElementById("playerLoading");

const fullscreenLoading =
document.getElementById("fullscreenLoading");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let currentSourceIndex = 0;

let hls = null;

let fullscreenHls = null;

let loadTimer = null;

let fullscreenTimer = null;

let switching = false;

let errorCount = 0;

let controlsTimer = null;

let fullscreenControlsTimer = null;

let wakeLock = null;


/* =========================================================
   LOAD M3U
========================================================= */

async function loadM3U(){

    try{

        setStatus(
            "📡 Đang tải danh sách kênh..."
        );

        const response =
            await fetch(
                M3U_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        if(
            !text.includes("#EXTINF") &&
            !text.includes("#EXTM3U")
        ){

            throw new Error(
                "Dữ liệu M3U không hợp lệ"
            );

        }


        parseM3U(text);


    }catch(error){

        console.error(error);

        setStatus(
            "❌ Không thể tải playlist"
        );

        countBox.textContent =
            "Không tải được danh sách";


        channelsBox.innerHTML = `

            <div class="error">

                ❌ Không tải được danh sách kênh.

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text){

    const lines =
        text
        .replace(/\r/g,"")
        .split("\n");


    const map =
        new Map();


    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(!line)
            continue;


        if(
            line.startsWith("#EXTINF:")
        ){

            info =
                parseExtinf(line);

            continue;

        }


        if(
            info &&
            (
                line.startsWith("http://") ||
                line.startsWith("https://")
            )
        ){

            const id =
                info.tvgId ||
                normalizeName(
                    info.name
                );


            if(!map.has(id)){

                map.set(
                    id,
                    {

                        id:id,

                        tvgId:
                            info.tvgId,

                        name:
                            cleanName(
                                info.name
                            ),

                        logo:
                            getLogo(
                                info.tvgId
                            ),

                        sources:[]

                    }
                );

            }


            const channel =
                map.get(id);


            if(
                !channel.sources.some(
                    s =>
                        s.url === line
                )
            ){

                channel.sources.push({

                    url:line,

                    name:info.name,

                    quality:
                        getQuality(
                            info.name
                        )

                });

            }


            info = null;

        }

    }


    channels =
        Array.from(
            map.values()
        );


    /* VTV LÊN ĐẦU */

    channels.sort(
        (a,b)=>{

            const av =
                /^VTV\d+/i.test(
                    a.name
                );

            const bv =
                /^VTV\d+/i.test(
                    b.name
                );


            if(av && !bv)
                return -1;

            if(!av && bv)
                return 1;


            return a.name.localeCompare(
                b.name,
                "vi"
            );

        }
    );


    countBox.textContent =
        `${channels.length} kênh`;


    renderChannels(channels);


    setStatus(
        `🟢 Đã tải ${channels.length} kênh`
    );

}


/* =========================================================
   PARSE EXTINF
========================================================= */

function parseExtinf(line){

    const tvgMatch =
        line.match(
            /tvg-id="([^"]*)"/i
        );


    const tvgId =
        tvgMatch
        ? tvgMatch[1]
        : "";


    const comma =
        line.indexOf(",");


    const name =
        comma >= 0
        ? line
            .substring(
                comma + 1
            )
            .trim()
        : line;


    return {

        tvgId:tvgId,

        name:name

    };

}


/* =========================================================
   LOGO
========================================================= */

function getLogo(tvgId){

    if(!tvgId)
        return DEFAULT_LOGO;


    const id =
        tvgId
        .replace(/@HD/gi,"")
        .replace(/@SD/gi,"")
        .trim();


    return LOGO_BASE +
        id +
        ".png";

}


/* =========================================================
   CLEAN NAME
========================================================= */

function cleanName(name){

    return name
        .replace(
            /\s*\[Geo-blocked\]/gi,
            ""
        )
        .replace(
            /\s*\[Not 24\/7\]/gi,
            ""
        )
        .trim();

}


function normalizeName(name){

    return cleanName(name)
        .toLowerCase()
        .replace(
            /\([^)]*\)/g,
            ""
        )
        .trim();

}


function getQuality(name){

    const match =
        name.match(
            /\((\d+p)\)/i
        );


    return match
        ? match[1]
        : "";

}


/* =========================================================
   RENDER
========================================================= */

function renderChannels(list){

    channelsBox.innerHTML = "";


    if(!list.length){

        channelsBox.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;

    }


    list.forEach(
        channel=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.dataset.id =
                channel.id;


            if(
                currentChannel &&
                currentChannel.id ===
                channel.id
            ){

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <img
                    class="channel-logo"

                    src="${escapeAttr(
                        channel.logo
                    )}"

                    loading="lazy"

                    onerror="
                        this.onerror=null;
                        this.src='${DEFAULT_LOGO}'
                    "
                >

                <div class="channel-name">
                    ${escapeHtml(
                        channel.name
                    )}
                </div>

                <div class="channel-quality">

                    ${channel.sources.length}
                    nguồn

                </div>

            `;


            item.addEventListener(
                "click",
                ()=>{
                    playChannel(
                        channel
                    );
                }
            );


            channelsBox.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel){

    currentChannel =
        channel;


    currentSourceIndex =
        0;


    errorCount =
        0;


    switching =
        false;


    nowPlaying.textContent =
        channel.name;


    playerTitle.textContent =
        channel.name;


    fullscreenTitle.textContent =
        channel.name;


    updateActiveChannel();


    updateSourceSelect();


    playCurrentSource();

}


/* =========================================================
   ACTIVE CHANNEL
========================================================= */

function updateActiveChannel(){

    document
        .querySelectorAll(".channel")
        .forEach(
            el=>{

                el.classList.toggle(
                    "active",
                    currentChannel &&
                    el.dataset.id ===
                    currentChannel.id
                );

            }
        );

}


/* =========================================================
   PLAY CURRENT SOURCE
========================================================= */

function playCurrentSource(){

    if(!currentChannel)
        return;


    if(
        !currentChannel.sources.length
    ){

        setStatus(
            "❌ Kênh không có nguồn"
        );

        return;

    }


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;


        switching = false;


        hidePlayerLoading();


        setStatus(
            "❌ Tất cả nguồn đều lỗi"
        );


        return;

    }


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    switching = true;

    errorCount = 0;


    showPlayerLoading();


    clearTimeout(
        loadTimer
    );


    destroyNormalHls();


    try{

        video.pause();

    }catch(e){}


    video.removeAttribute(
        "src"
    );

    video.load();


    setStatus(
        `🔄 Đang thử nguồn ${
            currentSourceIndex + 1
        }/${
            currentChannel.sources.length
        }`
    );


    /* =====================================================
       NATIVE HLS
    ===================================================== */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            source.url;


        video.onloadedmetadata =
            ()=>{

                switching = false;

                clearTimeout(
                    loadTimer
                );

                hidePlayerLoading();


                setStatus(
                    `🟢 Đang phát nguồn ${
                        currentSourceIndex + 1
                    }/${
                        currentChannel.sources.length
                    }`
                );


                video.play()
                    .catch(
                        ()=>{}
                    );

            };


        video.onerror =
            ()=>{

                switchToNextSource();

            };


        loadTimer =
            setTimeout(
                ()=>{

                    if(switching){

                        switchToNextSource();

                    }

                },
                10000
            );


        return;

    }


    /* =====================================================
       HLS.JS
    ===================================================== */

    if(!Hls.isSupported()){

        hidePlayerLoading();


        setStatus(
            "❌ Trình duyệt không hỗ trợ HLS"
        );


        return;

    }


    hls =
        new Hls({

            enableWorker:true,

            lowLatencyMode:false,

            backBufferLength:30,

            maxBufferLength:20,

            maxMaxBufferLength:30,

            manifestLoadingMaxRetry:1,

            levelLoadingMaxRetry:1,

            fragLoadingMaxRetry:1,

            startLevel:-1

        });


    hls.loadSource(
        source.url
    );


    hls.attachMedia(
        video
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        ()=>{

            switching = false;


            clearTimeout(
                loadTimer
            );


            hidePlayerLoading();


            setStatus(
                `🟢 Đang phát nguồn ${
                    currentSourceIndex + 1
                }/${
                    currentChannel.sources.length
                }`
            );


            video.play()
                .catch(
                    ()=>{}
                );

        }
    );


    hls.on(
        Hls.Events.ERROR,
        (event,data)=>{

            console.warn(
                "HLS ERROR:",
                data
            );


            if(data.fatal){

                switchToNextSource();

                return;

            }


            if(
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ){

                errorCount++;


                if(errorCount >= 2){

                    switchToNextSource();

                }

            }


            if(
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ){

                errorCount++;


                if(errorCount >= 2){

                    switchToNextSource();

                }

            }

        }
    );


    video.onerror =
        ()=>{

            switchToNextSource();

        };


    loadTimer =
        setTimeout(
            ()=>{

                if(switching){

                    switchToNextSource();

                }

            },
            10000
        );

}


/* =========================================================
   SWITCH SOURCE
========================================================= */

function switchToNextSource(){

    if(!currentChannel)
        return;


    if(!switching)
        switching = true;


    clearTimeout(
        loadTimer
    );


    currentSourceIndex++;


    if(
        currentSourceIndex <
        currentChannel.sources.length
    ){

        setStatus(
            `⚠️ Nguồn lỗi → chuyển sang nguồn ${
                currentSourceIndex + 1
            }`
        );


        setTimeout(
            ()=>{

                switching = false;

                playCurrentSource();

            },
            500
        );


        return;

    }


    switching = false;


    hidePlayerLoading();


    setStatus(
        "❌ Tất cả nguồn của kênh đều không phát được"
    );

}


/* =========================================================
   NEXT SOURCE
========================================================= */

function nextSource(){

    if(!currentChannel)
        return;


    currentSourceIndex++;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

    }


    switching = false;


    playCurrentSource();

}


/* =========================================================
   SOURCE SELECT
========================================================= */

function updateSourceSelect(){

    if(
        !currentChannel ||
        currentChannel.sources.length <= 1
    ){

        sourceBox.style.display =
            "none";

        return;

    }


    sourceBox.style.display =
        "block";


    sourceSelect.innerHTML =
        "";


    currentChannel.sources
        .forEach(
            (source,index)=>{

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    index;


                option.textContent =
                    `Nguồn ${index + 1}` +
                    (
                        source.quality
                        ? ` • ${source.quality}`
                        : ""
                    );


                sourceSelect.appendChild(
                    option
                );

            }
        );


    sourceSelect.value =
        currentSourceIndex;


    sourceSelect.onchange =
        ()=>{

            currentSourceIndex =
                Number(
                    sourceSelect.value
                );


            switching = false;


            playCurrentSource();

        };

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    ()=>{

        const keyword =
            searchInput.value
            .toLowerCase()
            .trim();


        if(!keyword){

            renderChannels(
                channels
            );


            countBox.textContent =
                `${channels.length} kênh`;


            return;

        }


        const filtered =
            channels.filter(
                channel=>
                    channel.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )
            );


        renderChannels(
            filtered
        );


        countBox.textContent =
            `${filtered.length} kênh`;

    }
);


/* =========================================================
   FULLSCREEN
   FIX QUAN TRỌNG
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async event=>{

        event.preventDefault();

        event.stopPropagation();


        if(!currentChannel)
            return;


        await openFullscreen();

    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen(){

    if(!currentChannel)
        return;


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    if(!source)
        return;


    /*
    ========================================================
    DỪNG VIDEO CHÍNH
    ========================================================

    Player chính vẫn giữ nguyên kích thước.
    Chỉ dừng video để tránh 2 luồng cùng phát.
    */

    try{
        video.pause();
    }catch(e){}


    destroyFullscreenHls();


    fullscreenVideo.pause();

    fullscreenVideo.removeAttribute(
        "src"
    );

    fullscreenVideo.load();


    fullscreenTitle.textContent =
        currentChannel.name;


    fullscreenViewer.classList.add(
        "active"
    );


    fullscreenViewer.classList.remove(
        "controls-hidden"
    );


    showFullscreenLoading();


    /*
    ========================================================
    PHÁT FULLSCREEN BẰNG HLS.JS
    ========================================================

    Đây là phần sửa lỗi chính.

    Không dùng:

        fullscreenVideo.src = m3u8

    một cách đơn giản.

    Thay vào đó HLS.js được attach
    giống player chính.
    */

    if(
        fullscreenVideo.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        fullscreenVideo.src =
            source.url;


        fullscreenVideo.onloadedmetadata =
            ()=>{

                hideFullscreenLoading();


                fullscreenVideo.play()
                    .catch(
                        ()=>{}
                    );

            };


        fullscreenVideo.onerror =
            ()=>{

                hideFullscreenLoading();

                setStatus(
                    "❌ Không phát được fullscreen"
                );

            };

    }

    else if(
        Hls.isSupported()
    ){

        fullscreenHls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20,

                maxMaxBufferLength:30,

                manifestLoadingMaxRetry:1,

                levelLoadingMaxRetry:1,

                fragLoadingMaxRetry:1

            });


        fullscreenHls.loadSource(
            source.url
        );


        fullscreenHls.attachMedia(
            fullscreenVideo
        );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{

                hideFullscreenLoading();


                fullscreenVideo
                    .play()
                    .catch(
                        ()=>{}
                    );

            }
        );


        fullscreenHls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                console.warn(
                    "Fullscreen HLS:",
                    data
                );


                if(data.fatal){

                    hideFullscreenLoading();

                    setStatus(
                        "❌ Nguồn không phát được fullscreen"
                    );

                }

            }
        );

    }

    else{

        hideFullscreenLoading();


        setStatus(
            "❌ Thiết bị không hỗ trợ HLS"
        );

        return;

    }


    /*
    ========================================================
    WAKE LOCK
    ========================================================
    */

    await requestWakeLock();


    /*
    ========================================================
    XOAY NGANG
    ========================================================
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }catch(e){}


    showFullscreenControls();

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    async event=>{

        event.preventDefault();

        event.stopPropagation();


        await closeFullscreenViewer();

    }
);


async function closeFullscreenViewer(){

    fullscreenViewer.classList.remove(
        "active"
    );


    fullscreenViewer.classList.remove(
        "controls-hidden"
    );


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo.removeAttribute(
        "src"
    );


    fullscreenVideo.load();


    hideFullscreenLoading();


    releaseWakeLock();


    /*
    Unlock orientation
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }catch(e){}


    /*
    ========================================================
    QUAY LẠI VIDEO CHÍNH
    ========================================================
    */

    if(currentChannel){

        /*
        Nguồn hiện tại có thể vẫn là nguồn đang chọn.
        Nếu HLS cũ đã bị destroy thì phát lại source.
        */

        switching = false;

        playCurrentSource();

    }

}


/* =========================================================
   DESTROY NORMAL HLS
========================================================= */

function destroyNormalHls(){

    if(hls){

        try{
            hls.destroy();
        }catch(e){}

        hls = null;

    }

}


/* =========================================================
   DESTROY FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls(){

    if(fullscreenHls){

        try{
            fullscreenHls.destroy();
        }catch(e){}

        fullscreenHls = null;

    }

}


/* =========================================================
   PLAYER LOADING
========================================================= */

function showPlayerLoading(){

    playerLoading.classList.remove(
        "hidden"
    );

}


function hidePlayerLoading(){

    playerLoading.classList.add(
        "hidden"
    );

}


/* =========================================================
   FULLSCREEN LOADING
========================================================= */

function showFullscreenLoading(){

    fullscreenLoading.classList.remove(
        "hidden"
    );

}


function hideFullscreenLoading(){

    fullscreenLoading.classList.add(
        "hidden"
    );

}


/* =========================================================
   PLAYER CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    event=>{

        /*
        Nếu click đúng nút fullscreen
        thì không xử lý thêm.
        */

        if(
            event.target ===
            fullscreenBtn
        ){

            return;

        }


        videoArea.classList.add(
            "controls-visible"
        );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                ()=>{

                    videoArea.classList.remove(
                        "controls-visible"
                    );

                },
                3000
            );

    }
);


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    event=>{

        if(
            event.target ===
            closeFullscreen
        ){

            return;

        }


        showFullscreenControls();

    }
);


function showFullscreenControls(){

    fullscreenViewer.classList.remove(
        "controls-hidden"
    );


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            ()=>{

                fullscreenViewer.classList.add(
                    "controls-hidden"
                );

            },
            3000
        );

}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            if(wakeLock)
                return;


            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );


            wakeLock.addEventListener(
                "release",
                ()=>{
                    wakeLock = null;
                }
            );

        }

    }catch(e){

        console.log(
            "WakeLock:",
            e
        );

    }

}


function releaseWakeLock(){

    if(wakeLock){

        try{
            wakeLock.release();
        }catch(e){}

        wakeLock = null;

    }

}


/* =========================================================
   RE-REQUEST WAKE LOCK
========================================================= */

document.addEventListener(
    "visibilitychange",
    async ()=>{

        if(
            document.visibilityState ===
            "visible" &&
            fullscreenViewer.classList.contains(
                "active"
            )
        ){

            await requestWakeLock();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape" &&
            fullscreenViewer.classList.contains(
                "active"
            )
        ){

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(
            fullscreenViewer.classList.contains(
                "active"
            )
        ){

            /*
            Không sửa kích thước player chính.
            Chỉ đảm bảo fullscreen viewer theo viewport.
            */

            fullscreenViewer.style.width =
                window.innerWidth + "px";

            fullscreenViewer.style.height =
                window.innerHeight + "px";

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(value){

    return escapeHtml(value);

}


/* =========================================================
   START
========================================================= */

loadM3U();

</script>
