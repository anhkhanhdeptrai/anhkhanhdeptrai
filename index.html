<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>KHANH TV 📺</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top left, #17172b 0%, transparent 35%),
        radial-gradient(circle at top right, #111c2d 0%, transparent 30%),
        #08090d;
    color: #fff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(8, 9, 13, .88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255,255,255,.08);
}

.header {
    width: min(1450px, 100%);
    margin: auto;

    padding: 12px 18px;

    display: flex;
    align-items: center;
    gap: 18px;
}

/* LOGO */

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    min-width: max-content;
}

.brand-icon {
    width: 43px;
    height: 43px;

    border-radius: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;

    background:
        linear-gradient(135deg,
        #7c3cff,
        #2563eb);

    box-shadow:
        0 0 25px rgba(89, 70, 255, .35);

    border: 1px solid rgba(255,255,255,.15);
}

.brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
}

.brand-name {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: .8px;

    background:
        linear-gradient(90deg,#fff,#9fa9ff);

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.brand-sub {
    margin-top: 5px;

    font-size: 9px;
    letter-spacing: 2.5px;
    color: #777d91;
}

/* SEARCH */

.search-box {
    position: relative;
    flex: 1;

    max-width: 600px;
    margin-left: auto;
}

.search-icon {
    position: absolute;

    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: #85899b;
    font-size: 17px;

    pointer-events: none;
}

.search {
    width: 100%;

    height: 45px;

    padding:
        0 45px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.055);

    color: white;

    outline: none;

    font-size: 14px;

    transition: .25s;
}

.search::placeholder {
    color: #777b8b;
}

.search:focus {
    border-color: rgba(112,105,255,.8);

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 0 3px rgba(88,80,255,.10),
        0 0 25px rgba(88,80,255,.12);
}

.clear-search {
    position: absolute;

    right: 12px;
    top: 50%;

    transform: translateY(-50%);

    width: 26px;
    height: 26px;

    border: 0;
    border-radius: 50%;

    background: rgba(255,255,255,.08);
    color: #aaa;

    cursor: pointer;

    display: none;
}

.clear-search:hover {
    background: rgba(255,255,255,.15);
    color: white;
}

/* =========================
   MAIN
========================= */

.container {
    width: min(1450px, 100%);
    margin: auto;

    padding:
        18px;
}

/* =========================
   PLAYER
========================= */

.player-box {
    position: sticky;

    top: 76px;

    z-index: 500;

    background: #000;

    border-radius: 17px;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.10);

    margin-bottom: 18px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);
}

.video-wrapper {
    position: relative;

    width: 100%;

    background: #000;

    aspect-ratio: 16 / 9;
}

video {
    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}

.now-playing {
    min-height: 53px;

    padding: 14px 16px;

    display: flex;
    align-items: center;

    background:
        linear-gradient(
            90deg,
            #12131a,
            #0e0f14
        );

    border-top:
        1px solid rgba(255,255,255,.07);

    font-size: 15px;
    font-weight: 700;
}

/* =========================
   STATUS
========================= */

.status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin:
        4px 0 14px;
}

.status {
    color: #8c91a2;
    font-size: 13px;
}

.live-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 6px;

    border-radius: 50%;

    background: #36e58b;

    box-shadow:
        0 0 10px #36e58b;
}

/* =========================
   CHANNEL GRID
========================= */

.channels {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 12px;
}

/* CHANNEL */

.channel {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 15px;

    padding: 10px;

    cursor: pointer;

    transition:
        transform .2s,
        border-color .2s,
        background .2s,
        box-shadow .2s;

    overflow: hidden;
}

.channel:hover {
    transform: translateY(-3px);

    border-color:
        rgba(112,105,255,.7);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

.channel.active {
    border-color: #716aff;

    box-shadow:
        0 0 0 1px rgba(113,106,255,.2),
        0 0 25px rgba(93,83,255,.18);
}

.channel.active::after {
    content: "ĐANG XEM";

    position: absolute;

    top: 8px;
    right: 8px;

    padding: 4px 7px;

    border-radius: 7px;

    font-size: 8px;
    font-weight: 800;

    background: #655cff;
    color: white;
}

/* LOGO CHANNEL */

.channel-logo {
    width: 100%;
    height: 82px;

    display: block;

    object-fit: contain;

    background:
        radial-gradient(
            circle,
            #191b24,
            #0b0c10
        );

    border-radius: 10px;

    margin-bottom: 10px;
}

.channel-logo-placeholder {
    width: 100%;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    margin-bottom: 10px;

    background:
        linear-gradient(
            135deg,
            #151722,
            #0b0c11
        );

    color: #5e6375;

    font-size: 25px;
}

/* CHANNEL NAME */

.channel-name {
    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #e9eaf0;
}

/* QUALITY */

.channel-quality {
    margin-top: 5px;

    color: #707586;

    font-size: 10px;
}

/* =========================
   LOADING
========================= */

.loading,
.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 45px 20px;

    color: #777c8d;
}

.spinner {
    width: 28px;
    height: 28px;

    margin:
        0 auto 12px;

    border-radius: 50%;

    border:
        3px solid rgba(255,255,255,.1);

    border-top-color: #7068ff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   FULLSCREEN
========================= */

video:fullscreen {
    background: #000;
}

video:-webkit-full-screen {
    background: #000;
}

.video-wrapper:fullscreen {
    width: 100vw;
    height: 100vh;

    background: #000;
}

.video-wrapper:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    background: #000;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {
        padding:
            10px 11px;

        gap: 10px;

        flex-wrap: wrap;
    }

    .brand {
        width: auto;
    }

    .brand-icon {
        width: 38px;
        height: 38px;

        border-radius: 11px;

        font-size: 20px;
    }

    .brand-name {
        font-size: 18px;
    }

    .brand-sub {
        font-size: 7px;
        letter-spacing: 2px;
    }

    .search-box {
        order: 3;

        width: 100%;
        max-width: none;

        margin: 0;
    }

    .search {
        height: 42px;
    }

    .container {
        padding:
            10px;
    }

    .player-box {
        top: 111px;

        border-radius: 13px;

        margin-bottom: 14px;
    }

    .video-wrapper {
        aspect-ratio: 16 / 9;
    }

    .now-playing {
        min-height: 47px;

        padding: 12px;

        font-size: 13px;
    }

    .channels {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .channel {
        padding: 7px;

        border-radius: 12px;
    }

    .channel-logo,
    .channel-logo-placeholder {
        height: 65px;

        margin-bottom: 7px;
    }

    .channel-name {
        font-size: 11px;
    }

    .channel-quality {
        font-size: 9px;
    }

    .channel.active::after {
        font-size: 7px;

        top: 6px;
        right: 6px;
    }
}

/* =========================
   VERY SMALL PHONE
========================= */

@media (max-width: 380px) {

    .brand-name {
        font-size: 16px;
    }

    .channels {
        gap: 6px;
    }

    .channel-logo,
    .channel-logo-placeholder {
        height: 58px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header">

        <!-- KHANH TV LOGO -->

        <div class="brand">

            <div class="brand-icon">
                📺
            </div>

            <div class="brand-text">

                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    LIVE TELEVISION
                </div>

            </div>

        </div>

        <!-- SEARCH -->

        <div class="search-box">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="search"
                class="search"
                type="search"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button">
                ×
            </button>

        </div>

    </div>

</header>


<main class="container">

    <!-- PLAYER -->

    <div class="player-box" id="playerBox">

        <div class="video-wrapper" id="videoWrapper">

            <video
                id="video"
                controls
                playsinline
                preload="metadata">
            </video>

        </div>

        <div
            class="now-playing"
            id="nowPlaying">

            📺 Chưa chọn kênh

        </div>

    </div>


    <!-- STATUS -->

    <div class="status-row">

        <div
            class="status"
            id="status">

            <span class="live-dot"></span>
            Đang tải danh sách kênh...

        </div>

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels">

        <div class="loading">

            <div class="spinner"></div>

            Đang tải danh sách kênh...

        </div>

    </div>

</main>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const videoWrapper =
    document.getElementById("videoWrapper");

const playerBox =
    document.getElementById("playerBox");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");

const clearSearch =
    document.getElementById("clearSearch");


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];

let hls = null;

let currentChannel = null;


/* =====================================================
   KEEP SCREEN AWAKE
===================================================== */

/*
   Wake Lock API.

   Khi đang phát video sẽ cố giữ màn hình sáng.
*/

let wakeLock = null;


async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator &&
            !wakeLock
        ) {

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

            wakeLock.addEventListener(
                "release",
                () => {
                    wakeLock = null;
                }
            );
        }

    } catch (error) {

        console.log(
            "Wake Lock:",
            error
        );

    }
}


async function releaseWakeLock() {

    try {

        if (wakeLock) {

            await wakeLock.release();

            wakeLock = null;
        }

    } catch (error) {

        console.log(error);

    }
}


/*
   Khi quay lại tab/app,
   xin Wake Lock lại.
*/

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible" &&
            !video.paused
        ) {

            await requestWakeLock();

        }

    }
);


/* =====================================================
   VIDEO EVENTS
===================================================== */

video.addEventListener(
    "play",
    () => {

        requestWakeLock();

    }
);


video.addEventListener(
    "pause",
    () => {

        releaseWakeLock();

    }
);


video.addEventListener(
    "ended",
    () => {

        releaseWakeLock();

    }
);


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist() {

    try {

        statusText.innerHTML =
            '<span class="live-dot"></span>' +
            'Đang tải danh sách kênh...';


        const response =
            await fetch(PLAYLIST);


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const text =
            await response.text();


        channels =
            parseM3U(text);


        /*
           Đưa VTV lên đầu.
           Các kênh khác giữ nguyên thứ tự.
        */

        channels.sort(
            (a, b) => {

                const aVTV =
                    isVTV(a) ? 0 : 1;

                const bVTV =
                    isVTV(b) ? 0 : 1;

                return aVTV - bVTV;

            }
        );


        statusText.innerHTML =
            '<span class="live-dot"></span>' +
            `Đã tải ${channels.length} kênh`;


        renderChannels(channels);


    } catch (error) {

        console.error(error);


        statusText.innerHTML =
            "❌ Không thể tải danh sách kênh";


        channelsBox.innerHTML = `

            <div class="empty">

                ❌ Không tải được playlist IPTV.

                <br><br>

                Hãy kiểm tra kết nối Internet.

            </div>

        `;

    }

}


/* =====================================================
   CHECK VTV
===================================================== */

function isVTV(channel) {

    return (
        channel.name
            .toLowerCase()
            .includes("vtv") ||
        channel.id
            .toLowerCase()
            .includes("vtv")
    );

}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith("#EXTINF")
        ) {

            const nameMatch =
                line.match(/,(.*)$/);


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : "",

                id:
                    idMatch
                    ? idMatch[1]
                    : "",

                group:
                    groupMatch
                    ? groupMatch[1]
                    : ""

            };


        } else if (

            info &&
            line &&
            !line.startsWith("#")

        ) {

            result.push({

                name: info.name,

                logo: info.logo,

                id: info.id,

                group: info.group,

                url: line

            });


            info = null;

        }

    }


    return result;

}


/* =====================================================
   RENDER CHANNELS
===================================================== */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (
        list.length === 0
    ) {

        channelsBox.innerHTML = `

            <div class="empty">

                🔎 Không tìm thấy kênh

            </div>

        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    list.forEach(
        channel => {

            const item =
                document.createElement("div");


            item.className =
                "channel";


            if (
                currentChannel &&
                currentChannel.url ===
                channel.url
            ) {

                item.classList.add(
                    "active"
                );

            }


            let logoHTML;


            if (channel.logo) {

                logoHTML = `

                    <img
                        class="channel-logo"
                        src="${escapeHtml(channel.logo)}"
                        loading="lazy"
                        onerror="
                            this.onerror=null;
                            this.style.display='none';
                        "
                    >

                `;

            } else {

                logoHTML = `

                    <div class="channel-logo-placeholder">
                        📺
                    </div>

                `;

            }


            item.innerHTML = `

                ${logoHTML}

                <div class="channel-name">
                    ${escapeHtml(channel.name)}
                </div>

                ${
                    channel.group
                    ?
                    `<div class="channel-quality">
                        ${escapeHtml(channel.group)}
                    </div>`
                    :
                    `<div class="channel-quality">
                        LIVE
                    </div>`
                }

            `;


            item.onclick = () => {

                playChannel(channel);

            };


            fragment.appendChild(item);

        }
    );


    channelsBox.appendChild(fragment);

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        "📺  " + channel.name;


    /*
       Không scroll xuống danh sách.
       Player đang sticky nên luôn giữ ở trên.
    */


    if (hls) {

        try {

            hls.destroy();

        } catch (e) {}

        hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url;


    /*
       HLS.JS
    */

    if (
        url.toLowerCase().includes(".m3u8") &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: true,

                backBufferLength: 30,

                maxBufferLength: 30,

                maxMaxBufferLength: 60

            });


        hls.loadSource(url);


        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .then(() => {

                        requestWakeLock();

                    })
                    .catch(
                        error => {

                            console.log(
                                "Autoplay:",
                                error
                            );

                        }
                    );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.log(
                    "HLS ERROR:",
                    data
                );


                if (
                    data.fatal
                ) {

                    switch (
                        data.type
                    ) {

                        case Hls.ErrorTypes.NETWORK_ERROR:

                            console.log(
                                "Network error, retry..."
                            );

                            hls.startLoad();

                            break;


                        case Hls.ErrorTypes.MEDIA_ERROR:

                            console.log(
                                "Media error, recover..."
                            );

                            hls.recoverMediaError();

                            break;


                        default:

                            hls.destroy();

                            break;

                        }

                }

            }
        );


    }

    /*
       Native HLS
    */

    else if (

        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )

    ) {

        video.src =
            url;


        video.play()
            .then(() => {

                requestWakeLock();

            })
            .catch(
                () => {}
            );

    }


    /*
       Other stream
    */

    else {

        video.src =
            url;


        video.play()
            .then(() => {

                requestWakeLock();

            })
            .catch(
                () => {}
            );

    }


    /*
       Chỉ cập nhật trạng thái active.
       KHÔNG gọi scrollIntoView.
    */

    renderChannels(
        filterChannels()
    );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        const keyword =
            searchInput.value.trim();


        clearSearch.style.display =
            keyword
            ? "block"
            : "none";


        renderChannels(
            filterChannels()
        );

    }
);


/* =====================================================
   CLEAR SEARCH
===================================================== */

clearSearch.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        clearSearch.style.display =
            "none";

        renderChannels(
            channels
        );

        searchInput.focus();

    }
);


/* =====================================================
   FILTER
===================================================== */

function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;

    }


    return channels.filter(
        channel => {

            return (

                channel.name
                    .toLowerCase()
                    .includes(keyword)

                ||

                channel.id
                    .toLowerCase()
                    .includes(keyword)

                ||

                channel.group
                    .toLowerCase()
                    .includes(keyword)

            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
