<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07080d;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{

    position:sticky;
    top:0;

    z-index:1000;

    padding:10px 14px;

    background:rgba(7,8,13,.94);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.header{

    width:100%;
    max-width:1450px;

    margin:auto;

    display:flex;
    align-items:center;

    gap:14px;
}


/* =========================================================
   LOGO
========================================================= */

.brand{

    display:flex;
    align-items:center;

    gap:10px;

    min-width:max-content;
}

.logo{

    position:relative;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3cff,
            #e83cff 45%,
            #ff3864
        );

    box-shadow:
        0 0 20px rgba(155,70,255,.35);

    overflow:hidden;
}


/*
    LOGO TV
*/

.logo::before{

    content:"";

    width:20px;
    height:15px;

    border:3px solid white;

    border-radius:5px;

    position:absolute;
}

.logo::after{

    content:"";

    width:10px;
    height:3px;

    background:white;

    border-radius:10px;

    position:absolute;

    bottom:7px;
}


.brand-text{

    font-size:20px;

    font-weight:900;

    letter-spacing:.5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #a970ff,
            #ff55b8,
            #fff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleGradient 5s linear infinite;
}

@keyframes titleGradient{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:250% center;
    }

}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{

    flex:1;

    position:relative;
}

.search-icon{

    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#85899a;

    font-size:18px;

    pointer-events:none;
}

.search{

    width:100%;

    height:43px;

    padding:0 16px 0 44px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:14px;

    outline:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    color:white;

    font-size:14px;

    transition:.2s;
}

.search::placeholder{
    color:#737788;
}

.search:focus{

    border-color:rgba(151,91,255,.75);

    box-shadow:
        0 0 0 3px rgba(126,67,255,.10),
        0 0 25px rgba(126,67,255,.12);
}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:100%;
    max-width:1450px;

    margin:auto;

    padding:15px;
}


/* =========================================================
   PLAYER STICKY
========================================================= */

/*
    QUAN TRỌNG:

    Khi kéo danh sách:
    player vẫn đứng ở phía trên.

    top = chiều cao header gần đúng.
*/

.player-sticky{

    position:sticky;

    top:65px;

    z-index:900;

    padding-bottom:12px;

    background:
        linear-gradient(
            to bottom,
            #07080d 0%,
            rgba(7,8,13,.97) 75%,
            rgba(7,8,13,0) 100%
        );
}


/* =========================================================
   PLAYER
========================================================= */

.player-box{

    width:100%;

    background:#000;

    border-radius:17px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    position:relative;
}

.video-area{

    position:relative;

    width:100%;

    background:#000;

    aspect-ratio:16/9;

    overflow:hidden;
}

video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;
}


/* Ẩn control mặc định */

#video::-webkit-media-controls{
    display:none!important;
}

#video::-webkit-media-controls-enclosure{
    display:none!important;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info{

    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:14px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );

    opacity:0;

    transition:.25s;

    z-index:5;
}

.video-area.controls-visible .player-info{
    opacity:1;
}

.live-title{

    font-size:14px;

    font-weight:800;

    max-width:70%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.live-badge{

    display:flex;

    align-items:center;

    gap:6px;

    padding:5px 9px;

    border-radius:20px;

    background:rgba(255,35,80,.18);

    border:1px solid rgba(255,60,100,.35);

    color:#ff6b89;

    font-size:11px;

    font-weight:800;
}

.live-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff315b;

    box-shadow:
        0 0 10px #ff315b;

}


/* =========================================================
   LOADING PLAYER
========================================================= */

.loading-player{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:12px;

    background:
        radial-gradient(
            circle at center,
            rgba(95,50,255,.12),
            rgba(0,0,0,.75)
        );

    z-index:10;

    font-size:14px;

    color:#ddd;
}

.loading-player.hidden{
    display:none!important;
}


/* loading animation */

.loader-ring{

    width:35px;
    height:35px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.12);

    border-top-color:#a46cff;

    border-right-color:#ff4db8;

    animation:
        spin .8s linear infinite;

    box-shadow:
        0 0 25px rgba(150,80,255,.3);
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{

    position:absolute;

    width:42px;
    height:42px;

    right:12px;
    bottom:12px;

    border:0;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    background:rgba(15,15,20,.72);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    cursor:pointer;

    font-size:22px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s,
        transform .2s,
        background .2s;

    z-index:20;
}

.video-area.controls-visible
.fullscreen-btn{

    opacity:1;

    pointer-events:auto;
}

.fullscreen-btn:hover{

    background:rgba(110,70,255,.75);

    transform:scale(1.06);
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{

    min-height:54px;

    padding:12px 15px;

    display:flex;

    align-items:center;

    gap:10px;

    background:
        linear-gradient(
            90deg,
            rgba(115,65,255,.12),
            rgba(255,50,150,.05)
        );

    border-top:1px solid rgba(255,255,255,.06);
}

.now-dot{

    width:8px;
    height:8px;

    flex:0 0 auto;

    border-radius:50%;

    background:#7655ff;

    box-shadow:
        0 0 12px #7655ff;
}

.now-text{

    min-width:0;

    font-size:14px;

    font-weight:800;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    display:flex;

    align-items:center;

    gap:8px;

    margin:2px 2px 13px;

    color:#8f94a6;

    font-size:13px;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#45e6a1;

    box-shadow:
        0 0 10px rgba(69,230,161,.7);

    flex:0 0 auto;
}


/* =========================================================
   SOURCE
========================================================= */

.source-box{

    display:none;

    margin:0 0 13px;
}

.source-box select{

    width:100%;

    height:40px;

    padding:0 12px;

    border-radius:11px;

    background:#15151c;

    color:white;

    border:1px solid rgba(255,255,255,.08);

    outline:none;
}


/* =========================================================
   CHANNEL COUNT
========================================================= */

.channel-count{

    margin:8px 3px 10px;

    color:#85899a;

    font-size:13px;

}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap:11px;
}


/* =========================================================
   CHANNEL CARD
========================================================= */

.channel{

    min-width:0;

    padding:9px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.075);

    border-radius:15px;

    cursor:pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;

    animation:
        cardIn .35s ease both;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

.channel:hover{

    transform:translateY(-2px);

    border-color:
        rgba(130,85,255,.65);

    box-shadow:
        0 10px 25px rgba(0,0,0,.22);
}

.channel.active{

    border-color:#8155ff;

    background:
        linear-gradient(
            145deg,
            rgba(125,75,255,.16),
            rgba(255,60,160,.06)
        );

    box-shadow:
        0 0 20px rgba(126,77,255,.15);
}

.channel-logo{

    width:100%;
    height:78px;

    object-fit:contain;

    display:block;

    border-radius:10px;

    background:#0b0c11;

    margin-bottom:9px;
}

.channel-name{

    font-size:13px;

    font-weight:750;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-quality{

    color:#777c8d;

    font-size:10px;

    margin-top:4px;
}


/* =========================================================
   EMPTY
========================================================= */

.loading,
.empty{

    grid-column:1/-1;

    text-align:center;

    padding:45px 20px;

    color:#85899a;
}

.error{

    grid-column:1/-1;

    text-align:center;

    padding:45px 20px;

    color:#ff7088;
}


/* =========================================================
   FULLSCREEN
========================================================= */

.fullscreen-viewer{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    background:#000;

    z-index:999999;

    display:none;

    overflow:hidden;

    touch-action:manipulation;

    opacity:0;
}

.fullscreen-viewer.active{

    display:block;

    animation:
        fullscreenIn .3s ease forwards;
}

@keyframes fullscreenIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


/* Animated background */

.fullscreen-bg{

    position:absolute;

    inset:-30%;

    background:
        radial-gradient(
            circle at 30% 40%,
            rgba(120,60,255,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 70% 60%,
            rgba(255,50,160,.14),
            transparent 35%
        );

    filter:blur(35px);

    animation:
        bgMove 8s ease-in-out infinite alternate;

    z-index:0;
}

@keyframes bgMove{

    from{
        transform:
            scale(1)
            translate(-2%,-1%);
    }

    to{
        transform:
            scale(1.15)
            translate(2%,1%);
    }

}


.fullscreen-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

    z-index:2;

    animation:
        videoIn .35s ease;
}

@keyframes videoIn{

    from{
        opacity:0;
        transform:scale(.97);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

#fullscreenVideo::-webkit-media-controls{
    display:none!important;
}

#fullscreenVideo::-webkit-media-controls-enclosure{
    display:none!important;
}


/* =========================================================
   FULLSCREEN TOP
========================================================= */

.fullscreen-top{

    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:
        max(15px,env(safe-area-inset-top))
        max(15px,env(safe-area-inset-right))
        15px
        max(15px,env(safe-area-inset-left));

    z-index:10;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );

    transition:
        opacity .3s,
        transform .3s;
}

.fullscreen-viewer.controls-hidden
.fullscreen-top{

    opacity:0;

    transform:translateY(-15px);

    pointer-events:none;
}

.fullscreen-title{

    padding:9px 12px;

    border-radius:11px;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(12px);

    font-size:14px;

    font-weight:800;

    max-width:75%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.close-fullscreen{

    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:50%;

    background:
        rgba(15,15,20,.72);

    color:white;

    font-size:27px;

    line-height:1;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    backdrop-filter:blur(12px);

    box-shadow:
        0 5px 25px rgba(0,0,0,.4);

    transition:
        .2s;

    pointer-events:auto;
}

.close-fullscreen:hover{

    transform:
        rotate(90deg)
        scale(1.08);

    background:
        rgba(110,70,255,.8);
}


/* =========================================================
   FULLSCREEN BOTTOM EFFECT
========================================================= */

.fullscreen-glow{

    position:absolute;

    left:50%;
    bottom:-100px;

    width:300px;
    height:180px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(120,70,255,.35),
            transparent 70%
        );

    filter:blur(30px);

    animation:
        glowPulse 2.5s ease-in-out infinite;

    pointer-events:none;

    z-index:1;
}

@keyframes glowPulse{

    0%,100%{
        opacity:.35;
        transform:
            translateX(-50%)
            scale(.9);
    }

    50%{
        opacity:.75;
        transform:
            translateX(-50%)
            scale(1.15);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:9px 10px;
    }

    .header{
        gap:9px;
    }

    .logo{

        width:38px;
        height:38px;

        border-radius:11px;
    }

    .brand-text{
        font-size:17px;
    }

    .search{
        height:40px;

        border-radius:12px;

        padding-left:40px;

        font-size:13px;
    }

    .container{
        padding:10px;
    }

    /*
       Player sticky trên mobile
    */

    .player-sticky{

        top:58px;

        padding-bottom:9px;
    }

    .player-box{
        border-radius:14px;
    }

    .video-area{
        aspect-ratio:16/9;
    }

    .channels{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }

    .channel{

        padding:7px;

        border-radius:12px;
    }

    .channel-logo{
        height:62px;
    }

    .channel-name{
        font-size:12px;
    }

    .channel-quality{
        font-size:9px;
    }

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:900px){

    .player-sticky{
        top:65px;
    }

}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:env(safe-area-inset-top)){

    .fullscreen-viewer{

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header">

        <div class="brand">

            <!-- LOGO CSS CŨ -->

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- =================================================
         PLAYER STICKY
    ================================================== -->

    <div class="player-sticky">

        <div class="player-box">


            <div
                id="videoArea"
                class="video-area"
            >


                <video
                    id="video"
                    playsinline
                    webkit-playsinline
                    preload="auto"
                ></video>


                <!-- LOADING -->

                <div
                    id="loadingPlayer"
                    class="loading-player hidden"
                >

                    <div class="loader-ring"></div>

                    <div id="loadingText">
                        Đang kết nối nguồn...
                    </div>

                </div>


                <!-- PLAYER INFO -->

                <div class="player-info">

                    <div
                        id="playerTitle"
                        class="live-title"
                    >
                        KHANH TV
                    </div>

                    <div class="live-badge">

                        <span class="live-dot"></span>

                        LIVE

                    </div>

                </div>


                <!-- FULLSCREEN -->

                <button
                    id="fullscreenBtn"
                    class="fullscreen-btn"
                    type="button"
                    aria-label="Toàn màn hình"
                >
                    ⛶
                </button>

            </div>


            <!-- NOW PLAYING -->

            <div class="now-playing">

                <span class="now-dot"></span>

                <span
                    id="nowPlaying"
                    class="now-text"
                >
                    Chưa chọn kênh
                </span>

            </div>

        </div>

    </div>



    <!-- =================================================
         STATUS
    ================================================== -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Đang tải danh sách...
        </span>

    </div>



    <!-- =================================================
         SOURCE
    ================================================== -->

    <div
        id="sourceBox"
        class="source-box"
    >

        <select id="sourceSelect"></select>

    </div>



    <!-- =================================================
         COUNT
    ================================================== -->

    <div
        id="count"
        class="channel-count"
    >
        Đang tải danh sách...
    </div>



    <!-- =================================================
         CHANNELS
    ================================================== -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>


</main>



<!-- =====================================================
     FULLSCREEN VIEWER
===================================================== -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>


    <!-- EFFECT BACKGROUND -->

    <div class="fullscreen-bg"></div>

    <div class="fullscreen-glow"></div>


    <!-- VIDEO -->

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <!-- TOP -->

    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="fullscreen-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
        >
            ×
        </button>

    </div>


</div>



<script>

/* =========================================================
   CONFIG
========================================================= */

const M3U_URL =
    "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/vn.m3u";


const LOGO_BASE =
    "https://raw.githubusercontent.com/iptv-org/iptv/master/logos/tv/";


const DEFAULT_LOGO =
    "https://dummyimage.com/300x150/111/fff&text=TV";


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let currentSourceIndex = 0;

let hls = null;

let fullscreenHls = null;

let loadTimer = null;

let errorCount = 0;

let switching = false;

let controlsTimer = null;

let fullscreenControlsTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const fullscreenVideo =
    document.getElementById("fullscreenVideo");

const videoArea =
    document.getElementById("videoArea");

const fullscreenViewer =
    document.getElementById("fullscreenViewer");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeFullscreen =
    document.getElementById("closeFullscreen");

const channelsEl =
    document.getElementById("channels");

const countEl =
    document.getElementById("count");

const nowPlaying =
    document.getElementById("nowPlaying");

const playerTitle =
    document.getElementById("playerTitle");

const fullscreenTitle =
    document.getElementById("fullscreenTitle");

const statusEl =
    document.getElementById("status");

const searchEl =
    document.getElementById("search");

const loadingPlayer =
    document.getElementById("loadingPlayer");

const loadingText =
    document.getElementById("loadingText");

const sourceBox =
    document.getElementById("sourceBox");

const sourceSelect =
    document.getElementById("sourceSelect");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    statusEl.innerHTML = `

        <span class="status-dot"></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;
}


/* =========================================================
   LOADING
========================================================= */

function showLoading(text){

    loadingText.textContent =
        text || "Đang kết nối nguồn...";

    loadingPlayer.classList.remove(
        "hidden"
    );
}


function hideLoading(){

    loadingPlayer.classList.add(
        "hidden"
    );
}


/* =========================================================
   LOGO
========================================================= */

function getLogo(tvgId){

    if(!tvgId)
        return DEFAULT_LOGO;

    let id =
        tvgId
        .replace("@HD","")
        .replace("@SD","")
        .trim();

    return LOGO_BASE +
        id +
        ".png";
}


/* =========================================================
   LOAD M3U
========================================================= */

async function loadM3U(){

    try{

        setStatus(
            "📡 Đang tải danh sách kênh..."
        );

        const response =
            await fetch(
                M3U_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const text =
            await response.text();

        if(
            !text.includes("#EXTM3U") &&
            !text.includes("#EXTINF")
        ){

            throw new Error(
                "Dữ liệu M3U không hợp lệ"
            );

        }

        parseM3U(text);

    }

    catch(error){

        console.error(error);

        channelsEl.innerHTML = `

            <div class="error">

                ❌ Không tải được danh sách kênh

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        countEl.textContent =
            "Không tải được danh sách";

        setStatus(
            "❌ Không tải được playlist"
        );

    }

}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text){

    const lines =
        text
        .replace(/\r/g,"")
        .split("\n");

    const map =
        new Map();

    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(!line)
            continue;


        /* EXTINF */

        if(
            line.startsWith("#EXTINF:")
        ){

            info =
                parseExtinf(line);

            continue;
        }


        /* URL */

        if(
            info &&
            (
                line.startsWith("http://") ||
                line.startsWith("https://")
            )
        ){

            const id =
                info.tvgId ||
                normalizeName(
                    info.name
                );


            if(!map.has(id)){

                map.set(
                    id,
                    {

                        id:id,

                        tvgId:
                            info.tvgId,

                        name:
                            cleanName(
                                info.name
                            ),

                        logo:
                            getLogo(
                                info.tvgId
                            ),

                        sources:[]

                    }
                );

            }


            const channel =
                map.get(id);


            /* Không thêm URL trùng */

            if(
                !channel.sources.some(
                    s => s.url === line
                )
            ){

                channel.sources.push({

                    url:line,

                    name:info.name,

                    quality:
                        getQuality(
                            info.name
                        )

                });

            }

            info = null;

        }

    }


    channels =
        Array.from(
            map.values()
        );


    /* =====================================================
       VTV LÊN ĐẦU
    ===================================================== */

    channels.sort(
        (a,b)=>{

            const av =
                /^VTV\d+/i.test(
                    a.name
                );

            const bv =
                /^VTV\d+/i.test(
                    b.name
                );


            if(av && !bv)
                return -1;

            if(!av && bv)
                return 1;


            return a.name.localeCompare(
                b.name,
                "vi"
            );

        }
    );


    countEl.textContent =
        channels.length +
        " kênh";


    setStatus(
        "Đã tải " +
        channels.length +
        " kênh"
    );


    renderChannels(channels);

}


/* =========================================================
   PARSE EXTINF
========================================================= */

function parseExtinf(line){

    const tvgMatch =
        line.match(
            /tvg-id="([^"]*)"/i
        );


    const tvgId =
        tvgMatch
        ? tvgMatch[1]
        : "";


    const comma =
        line.indexOf(",");


    const name =
        comma >= 0
        ? line
            .substring(
                comma + 1
            )
            .trim()
        : line;


    return {

        tvgId:tvgId,

        name:name

    };

}


/* =========================================================
   CLEAN NAME
========================================================= */

function cleanName(name){

    return String(name)

        .replace(
            /\s*\[Geo-blocked\]/gi,
            ""
        )

        .replace(
            /\s*\[Not 24\/7\]/gi,
            ""
        )

        .trim();

}


function normalizeName(name){

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\([^)]*\)/g,
            ""
        )

        .trim();

}


function getQuality(name){

    const m =
        String(name).match(
            /\((\d+p)\)/i
        );

    return m
        ? m[1]
        : "";

}


/* =========================================================
   RENDER
========================================================= */

function renderChannels(list){

    channelsEl.innerHTML = "";


    if(!list.length){

        channelsEl.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;
    }


    list.forEach(
        (channel,index)=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.dataset.id =
                channel.id;


            if(
                currentChannel &&
                currentChannel.id ===
                channel.id
            ){

                item.classList.add(
                    "active"
                );

            }


            const delay =
                Math.min(
                    index * 0.015,
                    .4
                );


            item.style.animationDelay =
                delay + "s";


            item.innerHTML = `

                <img
                    class="channel-logo"

                    src="${escapeAttr(
                        channel.logo
                    )}"

                    loading="lazy"

                    onerror="
                        this.onerror=null;
                        this.src='${DEFAULT_LOGO}'
                    "
                >

                <div class="channel-name">

                    ${escapeHtml(
                        channel.name
                    )}

                </div>

                <div class="channel-quality">

                    ${channel.sources.length}
                    nguồn

                </div>

            `;


            item.onclick =
                () => playChannel(
                    channel
                );


            channelsEl.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel){

    currentChannel =
        channel;


    currentSourceIndex =
        0;


    errorCount =
        0;


    switching =
        false;


    nowPlaying.textContent =
        channel.name;


    playerTitle.textContent =
        channel.name;


    fullscreenTitle.textContent =
        channel.name;


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(el=>{

            el.classList.toggle(

                "active",

                el.dataset.id ===
                channel.id

            );

        });


    updateSourceSelect();


    playCurrentSource();

}


/* =========================================================
   HLS CHECK
========================================================= */

function isHLS(url){

    return (
        url.includes(".m3u8") ||
        url.includes("m3u8?")
    );

}


/* =========================================================
   DESTROY HLS
========================================================= */

function destroyHLS(){

    if(hls){

        try{
            hls.destroy();
        }
        catch(e){}

        hls = null;

    }

}


function destroyFullscreenHLS(){

    if(fullscreenHls){

        try{
            fullscreenHls.destroy();
        }
        catch(e){}

        fullscreenHls = null;

    }

}


/* =========================================================
   PLAY CURRENT SOURCE
========================================================= */

function playCurrentSource(){

    if(!currentChannel)
        return;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

        hideLoading();

        setStatus(
            "❌ Tất cả nguồn hiện tại đều lỗi"
        );

        return;

    }


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    switching =
        true;


    errorCount =
        0;


    clearTimeout(
        loadTimer
    );


    showLoading(
        `Đang kết nối nguồn ${
            currentSourceIndex + 1
        }/${
            currentChannel.sources.length
        }...`
    );


    setStatus(
        `🔄 Đang thử nguồn ${
            currentSourceIndex + 1
        }/${
            currentChannel.sources.length
        }`
    );


    destroyHLS();


    try{
        video.pause();
    }
    catch(e){}


    video.removeAttribute(
        "src"
    );

    video.load();


    /* =====================================================
       NATIVE HLS
    ===================================================== */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            source.url;


        video.onloadedmetadata =
            function(){

                switching =
                    false;


                clearTimeout(
                    loadTimer
                );


                hideLoading();


                setStatus(
                    `🟢 Đang phát nguồn ${
                        currentSourceIndex + 1
                    }/${
                        currentChannel.sources.length
                    }`
                );


                video.play()
                    .catch(()=>{});

            };


        video.onerror =
            function(){

                switchToNextSource();

            };


        loadTimer =
            setTimeout(
                ()=>{

                    if(switching){

                        switchToNextSource();

                    }

                },
                10000
            );


        return;
    }


    /* =====================================================
       HLS.JS
    ===================================================== */

    if(!Hls.isSupported()){

        hideLoading();

        setStatus(
            "❌ Trình duyệt không hỗ trợ HLS"
        );

        return;

    }


    hls =
        new Hls({

            enableWorker:true,

            lowLatencyMode:false,

            backBufferLength:30,

            maxBufferLength:20,

            maxMaxBufferLength:30,

            manifestLoadingMaxRetry:1,

            levelLoadingMaxRetry:1,

            fragLoadingMaxRetry:1,

            startLevel:-1

        });


    hls.loadSource(
        source.url
    );


    hls.attachMedia(
        video
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        ()=>{

            switching =
                false;


            clearTimeout(
                loadTimer
            );


            hideLoading();


            setStatus(
                `🟢 Đang phát nguồn ${
                    currentSourceIndex + 1
                }/${
                    currentChannel.sources.length
                }`
            );


            video.play()
                .catch(()=>{});

        }
    );


    hls.on(
        Hls.Events.ERROR,
        function(
            event,
            data
        ){

            console.warn(
                "HLS ERROR",
                data
            );


            if(data.fatal){

                switchToNextSource();

                return;

            }


            if(
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ){

                errorCount++;

                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }


            if(
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ){

                errorCount++;

                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }

        }
    );


    video.onerror =
        function(){

            switchToNextSource();

        };


    loadTimer =
        setTimeout(
            ()=>{

                if(switching){

                    switchToNextSource();

                }

            },
            10000
        );

}


/* =========================================================
   NEXT SOURCE
========================================================= */

function switchToNextSource(){

    if(!currentChannel)
        return;


    if(
        !switching
    ){

        switching = true;

    }


    clearTimeout(
        loadTimer
    );


    currentSourceIndex++;


    if(
        currentSourceIndex <
        currentChannel.sources.length
    ){

        setStatus(
            `⚠️ Nguồn lỗi → chuyển sang nguồn ${
                currentSourceIndex + 1
            }`
        );


        setTimeout(
            ()=>{

                switching =
                    false;

                playCurrentSource();

            },
            400
        );


        return;

    }


    switching =
        false;


    hideLoading();


    setStatus(
        "❌ Tất cả nguồn của kênh đều lỗi"
    );

}


/* =========================================================
   MANUAL NEXT SOURCE
========================================================= */

function nextSource(){

    if(!currentChannel)
        return;


    currentSourceIndex++;


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

    }


    switching = false;

    playCurrentSource();

}


/* =========================================================
   SOURCE SELECT
========================================================= */

function updateSourceSelect(){

    if(
        !currentChannel ||
        currentChannel.sources.length <= 1
    ){

        sourceBox.style.display =
            "none";

        return;

    }


    sourceBox.style.display =
        "block";


    sourceSelect.innerHTML =
        "";


    currentChannel.sources
        .forEach(
            (source,index)=>{

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    index;


                option.textContent =
                    `Nguồn ${
                        index + 1
                    }${
                        source.quality
                        ? " • " +
                          source.quality
                        : ""
                    }`;


                sourceSelect.appendChild(
                    option
                );

            }
        );


    sourceSelect.value =
        currentSourceIndex;


    sourceSelect.onchange =
        function(){

            currentSourceIndex =
                Number(
                    this.value
                );


            switching =
                false;


            playCurrentSource();

        };

}


/* =========================================================
   SEARCH
========================================================= */

searchEl.addEventListener(
    "input",
    function(){

        const keyword =
            this.value
            .toLowerCase()
            .trim();


        if(!keyword){

            renderChannels(
                channels
            );


            countEl.textContent =
                channels.length +
                " kênh";

            return;

        }


        const filtered =
            channels.filter(
                channel =>

                    channel.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                    ||

                    channel.tvgId
                    .toLowerCase()
                    .includes(
                        keyword
                    )
            );


        renderChannels(
            filtered
        );


        countEl.textContent =
            filtered.length +
            " kênh";

    }
);


/* =========================================================
   PLAYER CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function(){

        videoArea.classList.add(
            "controls-visible"
        );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                ()=>{

                    videoArea.classList.remove(
                        "controls-visible"
                    );

                },
                3000
            );

    }
);


/* =========================================================
   FULLSCREEN OPEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        e.stopPropagation();


        if(!currentChannel)
            return;


        openFullscreen();

    }
);


async function openFullscreen(){

    if(!currentChannel)
        return;


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    if(!source)
        return;


    /*
       Dừng player chính.
       Chỉ fullscreen video được phát.
    */

    try{
        video.pause();
    }
    catch(e){}


    destroyFullscreenHLS();


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenTitle.textContent =
        currentChannel.name;


    /*
    =====================================================
       FULLSCREEN HLS
    =====================================================
    */

    if(
        isHLS(source.url) &&
        Hls.isSupported()
    ){

        fullscreenHls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20

            });


        fullscreenHls.loadSource(
            source.url
        );


        fullscreenHls.attachMedia(
            fullscreenVideo
        );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{

                fullscreenVideo
                    .play()
                    .catch(()=>{});

            }
        );

    }

    else{

        fullscreenVideo.src =
            source.url;


        fullscreenVideo.load();


        fullscreenVideo
            .play()
            .catch(()=>{});

    }


    showFullscreenControls();


    /*
       Thử landscape
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch(e){}

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        e.stopPropagation();

        closeFullscreenViewer();

    }
);


function closeFullscreenViewer(){

    fullscreenViewer
        .classList
        .remove("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    try{
        fullscreenVideo.pause();
    }
    catch(e){}


    destroyFullscreenHLS();


    fullscreenVideo.removeAttribute(
        "src"
    );


    fullscreenVideo.load();


    /*
       Unlock orientation
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }
    catch(e){}


    /*
       Phát lại player chính
    */

    if(currentChannel){

        setTimeout(
            ()=>{

                video.play()
                    .catch(()=>{});

            },
            100
        );

    }

}


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function(e){

        /*
        Nếu click vào video
        */

        if(
            e.target ===
            fullscreenVideo
        ){

            showFullscreenControls();

        }

    }
);


function showFullscreenControls(){

    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            ()=>{

                fullscreenViewer
                    .classList
                    .add(
                        "controls-hidden"
                    );

            },
            3000
        );

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Escape" &&
            fullscreenViewer
                .classList
                .contains("active")
        ){

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   ANDROID BACK / PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            /*
               Không tự mở lại fullscreen,
               chỉ đảm bảo player chính tiếp tục.
            */

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(str){

    return String(str)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(str){

    return escapeHtml(str);

}


/* =========================================================
   START
========================================================= */

loadM3U();

</script>
