<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:#07080d;
    color:#fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{

    position:sticky;
    top:0;

    z-index:1000;

    padding:10px 14px;

    background:rgba(7,8,13,.94);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid
        rgba(255,255,255,.07);
}

.header{

    width:100%;
    max-width:1450px;

    margin:auto;

    display:flex;
    align-items:center;

    gap:14px;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    display:flex;
    align-items:center;

    gap:10px;

    min-width:max-content;
}


/*
LOGO KHANH TV
Không dùng icon.
*/

.logo{

    position:relative;

    width:42px;
    height:42px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3cff,
            #e83cff 45%,
            #ff3864
        );

    box-shadow:
        0 0 20px
        rgba(155,70,255,.35);

    overflow:hidden;
}


/*
Màn hình TV
*/

.logo::before{

    content:"";

    width:21px;
    height:15px;

    border:3px solid #fff;

    border-radius:5px;

    position:absolute;

    top:11px;
}


/*
Chân TV
*/

.logo::after{

    content:"";

    position:absolute;

    width:11px;
    height:3px;

    background:#fff;

    border-radius:10px;

    bottom:7px;
}


.brand-text{

    font-size:20px;

    font-weight:900;

    letter-spacing:.5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #a970ff,
            #ff55b8,
            #fff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleGradient 5s linear infinite;
}

@keyframes titleGradient{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:250% center;
    }

}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{

    flex:1;

    position:relative;

    min-width:0;
}

.search-icon{

    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#85899a;

    font-size:18px;

    pointer-events:none;
}

.search{

    width:100%;

    height:43px;

    padding:
        0 16px
        0 44px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:14px;

    outline:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    color:#fff;

    font-size:14px;

    transition:.2s;
}

.search::placeholder{
    color:#737788;
}

.search:focus{

    border-color:
        rgba(151,91,255,.75);

    box-shadow:
        0 0 0 3px
        rgba(126,67,255,.10),

        0 0 25px
        rgba(126,67,255,.12);
}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:100%;
    max-width:1450px;

    margin:auto;

    padding:15px;
}


/* =========================================================
   PLAYER STICKY
========================================================= */

/*
Khi kéo danh sách:
player vẫn đứng trên màn hình.
*/

.player-sticky{

    position:sticky;

    top:63px;

    z-index:500;

    padding-bottom:10px;

    background:
        linear-gradient(
            to bottom,
            #07080d 75%,
            transparent
        );
}


/* =========================================================
   PLAYER
========================================================= */

.player-box{

    width:100%;

    background:#000;

    border-radius:17px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.40);
}

.video-area{

    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    background:#000;

    overflow:hidden;
}

video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;
}


/* =========================================================
   PLAYER TOP
========================================================= */

.player-overlay{

    position:absolute;

    left:0;
    right:0;
    top:0;

    padding:14px;

    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );

    opacity:0;

    transition:.25s;

    z-index:10;
}

.video-area.controls-visible
.player-overlay{

    opacity:1;
}

.live-title{

    max-width:70%;

    font-size:14px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.live-badge{

    display:flex;

    align-items:center;

    gap:6px;

    padding:5px 9px;

    border-radius:20px;

    background:
        rgba(255,35,80,.18);

    border:
        1px solid
        rgba(255,60,100,.35);

    color:#ff6b89;

    font-size:11px;

    font-weight:800;
}

.live-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff315b;

    box-shadow:
        0 0 10px #ff315b;

    animation:livePulse 1.3s infinite;
}

@keyframes livePulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(.65);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}


/* =========================================================
   PLAYER LOADING
========================================================= */

.loading-player{

    position:absolute;

    inset:0;

    z-index:20;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(90,45,180,.20),
            rgba(0,0,0,.78)
        );

    backdrop-filter:blur(3px);

    transition:.25s;
}

.loading-player.hidden{
    display:none;
}

.loader{

    width:38px;
    height:38px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.12);

    border-top-color:#9b63ff;

    border-right-color:#ff4db8;

    animation:
        spin .75s linear infinite;

    margin-bottom:12px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.loading-text{

    color:#c9c9d5;

    font-size:13px;

    font-weight:600;
}


/* =========================================================
   CUSTOM FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{

    position:absolute;

    right:12px;
    bottom:12px;

    width:42px;
    height:42px;

    border:0;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        rgba(15,15,20,.76);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    font-size:22px;

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s,
        transform .2s,
        background .2s;

    z-index:30;
}

.video-area.controls-visible
.fullscreen-btn{

    opacity:1;

    pointer-events:auto;
}

.fullscreen-btn:hover{

    transform:scale(1.06);

    background:
        rgba(110,70,255,.82);
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{

    min-height:55px;

    padding:12px 15px;

    display:flex;

    align-items:center;

    gap:10px;

    background:
        linear-gradient(
            90deg,
            rgba(115,65,255,.13),
            rgba(255,50,150,.05)
        );

    border-top:
        1px solid
        rgba(255,255,255,.06);
}

.now-dot{

    width:8px;
    height:8px;

    flex:0 0 auto;

    border-radius:50%;

    background:#7655ff;

    box-shadow:
        0 0 12px #7655ff;

    animation:nowPulse 1.5s infinite;
}

@keyframes nowPulse{

    0%,100%{
        opacity:1;
        box-shadow:0 0 12px #7655ff;
    }

    50%{
        opacity:.5;
        box-shadow:0 0 5px #7655ff;
    }

}

.now-text{

    min-width:0;

    font-size:14px;

    font-weight:800;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   INFO
========================================================= */

.player-info{

    margin-top:8px;

    padding:12px 14px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.06);
}

.info-title{

    font-size:16px;

    font-weight:850;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.status{

    margin-top:5px;

    display:flex;

    align-items:center;

    gap:8px;

    color:#9095a7;

    font-size:12px;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#45e6a1;

    box-shadow:
        0 0 10px
        rgba(69,230,161,.7);
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

    display:flex;

    gap:8px;

    margin-top:10px;

    flex-wrap:wrap;
}

.control-btn{

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.055);

    color:#fff;

    border-radius:11px;

    padding:9px 13px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}

.control-btn:hover{

    border-color:
        rgba(135,85,255,.6);

    background:
        rgba(120,70,255,.14);

    transform:translateY(-1px);
}

.control-btn:active{
    transform:scale(.97);
}


/* =========================================================
   SOURCE
========================================================= */

.source-box{

    margin-top:9px;

    display:none;
}

.source-select{

    width:100%;

    padding:10px 12px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:#17171e;

    color:#fff;

    outline:none;
}


/* =========================================================
   CHANNEL COUNT
========================================================= */

.channel-count{

    display:flex;

    align-items:center;

    gap:8px;

    margin:
        15px 3px 10px;

    color:#8f94a6;

    font-size:13px;
}

.count-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#45e6a1;

    box-shadow:
        0 0 10px
        rgba(69,230,161,.6);
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap:11px;
}

.channel{

    min-width:0;

    padding:9px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.075);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    cursor:pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;
}

.channel:hover{

    transform:translateY(-2px);

    border-color:
        rgba(130,85,255,.65);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.22);
}

.channel.active{

    border-color:#8155ff;

    background:
        linear-gradient(
            145deg,
            rgba(125,75,255,.17),
            rgba(255,60,160,.06)
        );

    box-shadow:
        0 0 22px
        rgba(126,77,255,.16);
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo{

    width:100%;

    height:78px;

    object-fit:contain;

    display:block;

    border-radius:10px;

    background:#0b0c11;

    margin-bottom:9px;
}

.channel-name{

    font-size:13px;

    font-weight:750;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-quality{

    color:#777c8d;

    font-size:10px;

    margin-top:4px;
}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.loading,
.empty{

    grid-column:1/-1;

    text-align:center;

    padding:45px 20px;

    color:#85899a;
}

.error{

    grid-column:1/-1;

    text-align:center;

    padding:40px 20px;

    color:#ff718b;
}


/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.fullscreen-viewer{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    background:#000;

    z-index:999999;

    display:none;

    overflow:hidden;

    touch-action:manipulation;
}

.fullscreen-viewer.active{

    display:block;

    animation:
        fullscreenIn .22s ease;
}

@keyframes fullscreenIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

.fullscreen-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}


/* =========================================================
   FULLSCREEN LOADING
========================================================= */

.fullscreen-loading{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:5;

    background:
        radial-gradient(
            circle,
            rgba(70,40,150,.16),
            rgba(0,0,0,.45)
        );

    pointer-events:none;
}

.fullscreen-loading.hidden{
    display:none;
}


/* =========================================================
   FULLSCREEN TOP
========================================================= */

.fullscreen-top{

    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:
        max(14px,env(safe-area-inset-top))
        max(14px,env(safe-area-inset-right))
        20px
        max(14px,env(safe-area-inset-left));

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    z-index:20;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );

    transition:.3s;
}

.fullscreen-title{

    max-width:75%;

    font-size:15px;

    font-weight:850;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.close-fullscreen{

    width:43px;
    height:43px;

    border:0;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        rgba(20,20,25,.75);

    backdrop-filter:blur(10px);

    font-size:28px;

    cursor:pointer;

    transition:.2s;
}

.close-fullscreen:hover{

    background:
        rgba(120,70,255,.8);

    transform:scale(1.05);
}

.fullscreen-viewer.controls-hidden
.fullscreen-top{

    opacity:0;

    pointer-events:none;
}


/* =========================================================
   FULLSCREEN HINT
========================================================= */

.fullscreen-hint{

    position:absolute;

    left:50%;
    bottom:35px;

    transform:
        translateX(-50%);

    padding:8px 13px;

    border-radius:20px;

    background:
        rgba(20,20,25,.7);

    color:#bbb;

    font-size:11px;

    z-index:15;

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.fullscreen-viewer.show-hint
.fullscreen-hint{

    opacity:1;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{

        padding:9px 10px;
    }

    .header{

        gap:9px;
    }

    .logo{

        width:38px;
        height:38px;

        border-radius:11px;
    }

    .logo::before{

        width:19px;
        height:14px;

        top:10px;
    }

    .brand-text{

        font-size:17px;
    }

    .search{

        height:40px;

        border-radius:12px;

        padding-left:40px;

        font-size:13px;
    }

    .container{

        padding:10px;
    }

    /*
    Header cao khoảng 57px.
    Player nằm ngay dưới header.
    */

    .player-sticky{

        top:57px;

        padding-bottom:8px;
    }

    .player-box{

        border-radius:14px;
    }

    .video-area{

        aspect-ratio:16/9;
    }

    .channels{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }

    .channel{

        padding:7px;

        border-radius:12px;
    }

    .channel-logo{

        height:62px;
    }

    .channel-name{

        font-size:12px;
    }

    .channel-quality{

        font-size:9px;
    }

    .info-title{

        font-size:15px;
    }

}


/* =========================================================
   TABLET
========================================================= */

@media(min-width:601px)
and (max-width:900px){

    .channels{

        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}


/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media(max-width:900px)
and (orientation:landscape){

    .fullscreen-video{

        width:100vw;
        height:100dvh;

        object-fit:contain;
    }
}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:env(safe-area-inset-top)){

    .fullscreen-viewer{

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- PLAYER STICKY -->

    <div class="player-sticky">

        <div class="player-box">

            <div
                id="videoArea"
                class="video-area"
            >

                <video
                    id="video"
                    playsinline
                    webkit-playsinline
                    preload="auto"
                ></video>


                <!-- PLAYER TOP -->

                <div
                    id="playerOverlay"
                    class="player-overlay"
                >

                    <div
                        id="playerTitle"
                        class="live-title"
                    >
                        KHANH TV
                    </div>


                    <div class="live-badge">

                        <span class="live-dot"></span>

                        LIVE

                    </div>

                </div>


                <!-- LOADING -->

                <div
                    id="loadingPlayer"
                    class="loading-player hidden"
                >

                    <div class="loader"></div>

                    <div
                        id="loadingText"
                        class="loading-text"
                    >
                        Đang kết nối nguồn...
                    </div>

                </div>


                <!-- FULLSCREEN -->

                <button
                    id="fullscreenBtn"
                    class="fullscreen-btn"
                    type="button"
                    aria-label="Toàn màn hình"
                >
                    ⛶
                </button>

            </div>


            <!-- NOW PLAYING -->

            <div class="now-playing">

                <span class="now-dot"></span>

                <span
                    id="nowPlaying"
                    class="now-text"
                >
                    Chưa chọn kênh
                </span>

            </div>

        </div>


        <!-- INFO -->

        <div class="player-info">

            <div
                id="infoTitle"
                class="info-title"
            >
                KHANH TV
            </div>


            <div
                id="status"
                class="status"
            >

                <span class="status-dot"></span>

                <span>
                    Sẵn sàng
                </span>

            </div>


            <div class="controls">

                <button
                    id="nextSourceBtn"
                    class="control-btn"
                    type="button"
                >
                    🔄 Đổi nguồn
                </button>


                <button
                    id="fullscreenBtn2"
                    class="control-btn"
                    type="button"
                >
                    ⛶ Toàn màn hình
                </button>

            </div>


            <div
                id="sourceBox"
                class="source-box"
            >

                <select
                    id="sourceSelect"
                    class="source-select"
                ></select>

            </div>

        </div>

    </div>


    <!-- CHANNEL COUNT -->

    <div
        id="count"
        class="channel-count"
    >

        <span class="count-dot"></span>

        <span>
            Đang tải danh sách...
        </span>

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            📡 Đang tải danh sách kênh...
        </div>

    </div>


</main>



<!-- =====================================================
     FULLSCREEN VIEWER
===================================================== -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>


    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div
        id="fullscreenLoading"
        class="fullscreen-loading hidden"
    >

        <div class="loader"></div>

    </div>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="fullscreen-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
        >
            ×
        </button>

    </div>


    <div class="fullscreen-hint">
        Chạm màn hình để hiện điều khiển
    </div>

</div>



<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

const M3U_URL =
"https://raw.githubusercontent.com/iptv-org/iptv/master/streams/vn.m3u";

const LOGO_BASE =
"https://raw.githubusercontent.com/iptv-org/iptv/master/logos/tv/";

const DEFAULT_LOGO =
"https://dummyimage.com/300x150/111/fff&text=TV";


/* =========================================================
   ELEMENT
========================================================= */

const video =
document.getElementById("video");

const fullscreenVideo =
document.getElementById("fullscreenVideo");

const videoArea =
document.getElementById("videoArea");

const fullscreenViewer =
document.getElementById("fullscreenViewer");

const fullscreenBtn =
document.getElementById("fullscreenBtn");

const fullscreenBtn2 =
document.getElementById("fullscreenBtn2");

const closeFullscreen =
document.getElementById("closeFullscreen");

const channelsEl =
document.getElementById("channels");

const countEl =
document.getElementById("count");

const nowPlaying =
document.getElementById("nowPlaying");

const playerTitle =
document.getElementById("playerTitle");

const infoTitle =
document.getElementById("infoTitle");

const fullscreenTitle =
document.getElementById("fullscreenTitle");

const statusEl =
document.getElementById("status");

const searchEl =
document.getElementById("search");

const loadingPlayer =
document.getElementById("loadingPlayer");

const loadingText =
document.getElementById("loadingText");

const fullscreenLoading =
document.getElementById("fullscreenLoading");

const sourceBox =
document.getElementById("sourceBox");

const sourceSelect =
document.getElementById("sourceSelect");

const nextSourceBtn =
document.getElementById("nextSourceBtn");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let currentSourceIndex = 0;

let hls = null;

let fullscreenHls = null;

let loadTimer = null;

let fullscreenTimer = null;

let errorCount = 0;

let switching = false;

let fullscreenActive = false;


/* =========================================================
   LOGO
========================================================= */

function getLogo(tvgId){

    if(!tvgId)
        return DEFAULT_LOGO;

    let id =
        tvgId
        .replace("@HD","")
        .replace("@SD","")
        .trim();

    return LOGO_BASE + id + ".png";
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    statusEl.innerHTML = `

        <span class="status-dot"></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;
}


/* =========================================================
   LOADING
========================================================= */

function showLoading(text){

    loadingText.textContent =
        text || "Đang kết nối nguồn...";

    loadingPlayer.classList.remove(
        "hidden"
    );

}


function hideLoading(){

    loadingPlayer.classList.add(
        "hidden"
    );

}


function showFullscreenLoading(){

    fullscreenLoading.classList.remove(
        "hidden"
    );

}


function hideFullscreenLoading(){

    fullscreenLoading.classList.add(
        "hidden"
    );

}


/* =========================================================
   LOAD M3U
========================================================= */

async function loadM3U(){

    try{

        setStatus(
            "📡 Đang tải danh sách kênh..."
        );

        const response =
            await fetch(
                M3U_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const text =
            await response.text();

        if(
            !text.includes("#EXTINF")
        ){

            throw new Error(
                "Playlist M3U không hợp lệ"
            );

        }

        parseM3U(text);

        setStatus(
            "🟢 Sẵn sàng"
        );

    }
    catch(error){

        console.error(error);

        channelsEl.innerHTML = `

            <div class="error">

                ❌ Không tải được danh sách kênh

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

        countEl.innerHTML = `

            <span class="count-dot"></span>

            <span>
                Không tải được danh sách
            </span>

        `;

    }

}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text){

    const lines =
        text
        .replace(/\r/g,"")
        .split("\n");

    const map =
        new Map();

    let info = null;

    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();

        if(!line)
            continue;


        if(
            line.startsWith("#EXTINF:")
        ){

            info =
                parseExtinf(line);

            continue;

        }


        if(
            info &&
            (
                line.startsWith("http://") ||
                line.startsWith("https://")
            )
        ){

            const id =
                info.tvgId ||
                normalizeName(
                    info.name
                );


            if(!map.has(id)){

                map.set(
                    id,
                    {

                        id:id,

                        tvgId:
                            info.tvgId,

                        name:
                            cleanName(
                                info.name
                            ),

                        logo:
                            getLogo(
                                info.tvgId
                            ),

                        sources:[]

                    }
                );

            }


            const channel =
                map.get(id);


            if(
                !channel.sources.some(
                    s =>
                        s.url === line
                )
            ){

                channel.sources.push({

                    url:line,

                    name:info.name,

                    quality:
                        getQuality(
                            info.name
                        )

                });

            }


            info = null;

        }

    }


    channels =
        Array.from(
            map.values()
        );


    /*
    ============================================
    VTV1 → VTV10
    ============================================
    */

    channels.sort(
        (a,b)=>{

            const aNum =
                getVTVNumber(a.name);

            const bNum =
                getVTVNumber(b.name);


            /*
            Cả hai đều là VTV
            */

            if(
                aNum !== null &&
                bNum !== null
            ){

                return aNum - bNum;

            }


            /*
            VTV lên trước
            */

            if(
                aNum !== null &&
                bNum === null
            ){

                return -1;

            }


            if(
                aNum === null &&
                bNum !== null
            ){

                return 1;

            }


            /*
            Kênh còn lại
            */

            return a.name.localeCompare(
                b.name,
                "vi"
            );

        }
    );


    countEl.innerHTML = `

        <span class="count-dot"></span>

        <span>
            ${channels.length} kênh
        </span>

    `;


    renderChannels(
        channels
    );

}


/* =========================================================
   VTV NUMBER
========================================================= */

function getVTVNumber(name){

    const match =
        name.match(
            /^VTV\s*(\d+)/i
        );

    if(!match)
        return null;

    return Number(
        match[1]
    );

}


/* =========================================================
   EXTINF
========================================================= */

function parseExtinf(line){

    const tvgMatch =
        line.match(
            /tvg-id="([^"]*)"/i
        );

    const tvgId =
        tvgMatch
        ? tvgMatch[1]
        : "";


    const comma =
        line.indexOf(",");

    const name =
        comma >= 0
        ? line
            .substring(
                comma + 1
            )
            .trim()
        : line;


    return {

        tvgId:tvgId,

        name:name

    };

}


/* =========================================================
   CLEAN NAME
========================================================= */

function cleanName(name){

    return name

        .replace(
            /\s*\[Geo-blocked\]/gi,
            ""
        )

        .replace(
            /\s*\[Not 24\/7\]/gi,
            ""
        )

        .trim();

}


function normalizeName(name){

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\([^)]*\)/g,
            ""
        )

        .trim();

}


function getQuality(name){

    const m =
        name.match(
            /\((\d+p)\)/i
        );

    return m
        ? m[1]
        : "";

}


/* =========================================================
   RENDER
========================================================= */

function renderChannels(list){

    channelsEl.innerHTML = "";


    if(!list.length){

        channelsEl.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;

    }


    list.forEach(
        channel=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.dataset.id =
                channel.id;


            if(
                currentChannel &&
                currentChannel.id ===
                channel.id
            ){

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <img
                    class="channel-logo"
                    src="${escapeAttr(channel.logo)}"
                    loading="lazy"
                    onerror="
                        this.onerror=null;
                        this.src='${DEFAULT_LOGO}'
                    "
                >

                <div class="channel-name">

                    ${escapeHtml(
                        channel.name
                    )}

                </div>

                <div class="channel-quality">

                    ${channel.sources.length}
                    nguồn

                </div>

            `;


            item.addEventListener(
                "click",
                ()=>{
                    playChannel(
                        channel
                    );
                }
            );


            channelsEl.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel){

    currentChannel =
        channel;

    currentSourceIndex =
        0;

    errorCount =
        0;

    switching =
        false;


    /*
    ACTIVE
    */

    document
        .querySelectorAll(".channel")
        .forEach(el=>{

            el.classList.toggle(
                "active",
                el.dataset.id ===
                channel.id
            );

        });


    nowPlaying.textContent =
        channel.name;

    playerTitle.textContent =
        channel.name;

    infoTitle.textContent =
        channel.name;

    fullscreenTitle.textContent =
        channel.name;


    updateSourceSelect();

    playCurrentSource();

}


/* =========================================================
   PLAY SOURCE
========================================================= */

function playCurrentSource(){

    if(!currentChannel)
        return;


    if(
        !currentChannel.sources.length
    ){

        setStatus(
            "❌ Kênh không có nguồn phát"
        );

        return;

    }


    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

        hideLoading();

        setStatus(
            "❌ Tất cả nguồn đều lỗi"
        );

        return;

    }


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    switching = true;

    errorCount = 0;


    showLoading(
        `Đang kết nối nguồn ${
            currentSourceIndex + 1
        }/${
            currentChannel.sources.length
        }...`
    );


    clearTimeout(
        loadTimer
    );


    destroyNormalHls();


    try{

        video.pause();

    }catch(e){}


    video.removeAttribute(
        "src"
    );

    video.load();


    /*
    ============================================
    NATIVE HLS
    ============================================
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            source.url;


        video.onloadedmetadata =
            function(){

                if(
                    !currentChannel
                )
                    return;


                switching = false;

                clearTimeout(
                    loadTimer
                );

                hideLoading();


                setStatus(
                    `🟢 Đang phát nguồn ${
                        currentSourceIndex + 1
                    }/${
                        currentChannel.sources.length
                    }`
                );


                video.play()
                    .catch(
                        ()=>{}
                    );

            };


        video.onerror =
            function(){

                switchToNextSource();

            };


        loadTimer =
            setTimeout(
                ()=>{

                    if(switching){

                        switchToNextSource();

                    }

                },
                10000
            );


        return;

    }


    /*
    ============================================
    HLS.JS
    ============================================
    */

    if(!Hls.isSupported()){

        hideLoading();

        setStatus(
            "❌ Trình duyệt không hỗ trợ HLS"
        );

        return;

    }


    hls =
        new Hls({

            enableWorker:true,

            lowLatencyMode:false,

            backBufferLength:30,

            maxBufferLength:20,

            maxMaxBufferLength:30,

            manifestLoadingMaxRetry:1,

            levelLoadingMaxRetry:1,

            fragLoadingMaxRetry:1,

            startLevel:-1

        });


    hls.loadSource(
        source.url
    );

    hls.attachMedia(
        video
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        ()=>{

            switching = false;

            clearTimeout(
                loadTimer
            );

            hideLoading();


            setStatus(
                `🟢 Đang phát nguồn ${
                    currentSourceIndex + 1
                }/${
                    currentChannel.sources.length
                }`
            );


            video.play()
                .catch(
                    ()=>{}
                );

        }
    );


    hls.on(
        Hls.Events.ERROR,
        (event,data)=>{

            console.warn(
                "HLS:",
                data
            );


            if(data.fatal){

                switchToNextSource();

                return;

            }


            if(
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ){

                errorCount++;

                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }


            if(
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ){

                errorCount++;

                if(
                    errorCount >= 2
                ){

                    switchToNextSource();

                }

            }

        }
    );


    video.onerror =
        function(){

            switchToNextSource();

        };


    loadTimer =
        setTimeout(
            ()=>{

                if(switching){

                    switchToNextSource();

                }

            },
            12000
        );

}


/* =========================================================
   SWITCH SOURCE
========================================================= */

function switchToNextSource(){

    if(!currentChannel)
        return;


    if(!switching)
        switching = true;


    clearTimeout(
        loadTimer
    );


    currentSourceIndex++;


    if(
        currentSourceIndex <
        currentChannel.sources.length
    ){

        showLoading(
            `Nguồn lỗi — đang thử nguồn ${
                currentSourceIndex + 1
            }...`
        );


        setStatus(
            `⚠️ Chuyển sang nguồn ${
                currentSourceIndex + 1
            }`
        );


        setTimeout(
            ()=>{

                switching = false;

                updateSourceSelect();

                playCurrentSource();

            },
            450
        );


        return;

    }


    switching = false;

    hideLoading();

    setStatus(
        "❌ Tất cả nguồn của kênh đều không phát được"
    );

}


/* =========================================================
   NEXT SOURCE
========================================================= */

function nextSource(){

    if(!currentChannel)
        return;


    currentSourceIndex++;

    if(
        currentSourceIndex >=
        currentChannel.sources.length
    ){

        currentSourceIndex = 0;

    }


    switching = false;

    updateSourceSelect();

    playCurrentSource();

}


/* =========================================================
   SOURCE SELECT
========================================================= */

function updateSourceSelect(){

    if(
        !currentChannel ||
        currentChannel.sources.length <= 1
    ){

        sourceBox.style.display =
            "none";

        return;

    }


    sourceBox.style.display =
        "block";


    sourceSelect.innerHTML =
        "";


    currentChannel.sources.forEach(
        (source,index)=>{

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                `Nguồn ${index + 1}` +
                (
                    source.quality
                    ? ` • ${source.quality}`
                    : ""
                );


            sourceSelect.appendChild(
                option
            );

        }
    );


    sourceSelect.value =
        currentSourceIndex;


    sourceSelect.onchange =
        function(){

            currentSourceIndex =
                Number(
                    this.value
                );

            switching = false;

            playCurrentSource();

        };

}


/* =========================================================
   DESTROY NORMAL HLS
========================================================= */

function destroyNormalHls(){

    if(hls){

        try{
            hls.destroy();
        }
        catch(e){}

        hls = null;

    }

}


/* =========================================================
   DESTROY FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls(){

    if(fullscreenHls){

        try{
            fullscreenHls.destroy();
        }
        catch(e){}

        fullscreenHls = null;

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        openFullscreen();

    }
);


fullscreenBtn2.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        openFullscreen();

    }
);


/*
=========================================================
OPEN FULLSCREEN
=========================================================
*/

async function openFullscreen(){

    if(!currentChannel)
        return;


    /*
    Dừng player chính.
    Quan trọng:
    không để 2 video cùng phát.
    */

    try{
        video.pause();
    }
    catch(e){}


    destroyFullscreenHls();


    fullscreenActive =
        true;


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenTitle.textContent =
        currentChannel.name;


    showFullscreenLoading();


    const source =
        currentChannel
        .sources[
            currentSourceIndex
        ];


    if(!source){

        hideFullscreenLoading();

        return;

    }


    /*
    ==========================================
    NATIVE HLS
    ==========================================
    */

    if(
        fullscreenVideo.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        fullscreenVideo.src =
            source.url;


        fullscreenVideo.onloadedmetadata =
            function(){

                hideFullscreenLoading();

                fullscreenVideo
                    .play()
                    .catch(
                        ()=>{}
                    );

            };


        fullscreenVideo.onerror =
            function(){

                hideFullscreenLoading();

                /*
                Nếu fullscreen native lỗi,
                quay về player chính.
                */

                setStatus(
                    "⚠️ Không thể mở nguồn toàn màn hình"
                );

            };


        fullscreenVideo.load();

    }


    /*
    ==========================================
    HLS.JS
    ==========================================
    */

    else if(
        Hls.isSupported()
    ){

        fullscreenHls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20

            });


        fullscreenHls.loadSource(
            source.url
        );


        fullscreenHls.attachMedia(
            fullscreenVideo
        );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{

                hideFullscreenLoading();

                fullscreenVideo
                    .play()
                    .catch(
                        ()=>{}
                    );

            }
        );


        fullscreenHls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                if(data.fatal){

                    hideFullscreenLoading();

                    console.warn(
                        "Fullscreen HLS:",
                        data
                    );

                }

            }
        );

    }


    else{

        fullscreenVideo.src =
            source.url;

        fullscreenVideo.load();

        fullscreenVideo
            .play()
            .catch(
                ()=>{}
            );

        hideFullscreenLoading();

    }


    /*
    Thử giữ màn hình sáng.
    */

    requestWakeLock();


    /*
    Không bắt buộc Fullscreen API.
    Viewer tự phủ toàn màn hình.
    */

    showFullscreenControls();

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        e.stopPropagation();

        closeFullscreenViewer();

    }
);


async function closeFullscreenViewer(){

    fullscreenActive =
        false;


    fullscreenViewer
        .classList
        .remove("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo.removeAttribute(
        "src"
    );


    fullscreenVideo.load();


    releaseWakeLock();


    /*
    Chạy lại player chính.
    */

    if(currentChannel){

        setTimeout(
            ()=>{

                video.play()
                    .catch(
                        ()=>{}
                    );

            },
            80
        );

    }

}


/* =========================================================
   FULLSCREEN CLICK
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            fullscreenVideo
        ){

            showFullscreenControls();

        }

    }
);


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

function showFullscreenControls(){

    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    clearTimeout(
        fullscreenTimer
    );


    fullscreenTimer =
        setTimeout(
            ()=>{

                if(
                    fullscreenActive
                ){

                    fullscreenViewer
                        .classList
                        .add(
                            "controls-hidden"
                        );

                }

            },
            3500
        );

}


/* =========================================================
   NORMAL PLAYER CONTROLS
========================================================= */

let playerTimer = null;


videoArea.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            fullscreenBtn
        )
            return;


        videoArea
            .classList
            .add(
                "controls-visible"
            );


        clearTimeout(
            playerTimer
        );


        playerTimer =
            setTimeout(
                ()=>{

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchEl.addEventListener(
    "input",
    function(){

        const keyword =
            this.value
                .toLowerCase()
                .trim();


        if(!keyword){

            renderChannels(
                channels
            );

            countEl.innerHTML = `

                <span class="count-dot"></span>

                <span>
                    ${channels.length} kênh
                </span>

            `;

            return;

        }


        const filtered =
            channels.filter(
                channel=>
                    channel.name
                        .toLowerCase()
                        .includes(
                            keyword
                        )
            );


        renderChannels(
            filtered
        );


        countEl.innerHTML = `

            <span class="count-dot"></span>

            <span>
                ${filtered.length} kênh
            </span>

        `;

    }
);


/* =========================================================
   WAKE LOCK
========================================================= */

let wakeLock = null;


async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            wakeLock =
                await navigator
                    .wakeLock
                    .request(
                        "screen"
                    );

        }

    }
    catch(e){

        console.log(
            "WakeLock:",
            e
        );

    }

}


function releaseWakeLock(){

    if(wakeLock){

        try{

            wakeLock.release();

        }
        catch(e){}

        wakeLock = null;

    }

}


/* =========================================================
   APP QUAY LẠI FOREGROUND
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible" &&
            fullscreenActive
        ){

            requestWakeLock();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Escape" &&
            fullscreenActive
        ){

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   ANDROID BACK / POPSTATE
========================================================= */

window.addEventListener(
    "popstate",
    function(){

        if(fullscreenActive){

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(value){

    return escapeHtml(value);

}


/* =========================================================
   START
========================================================= */

loadM3U();
