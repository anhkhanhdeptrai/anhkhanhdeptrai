<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<meta name="theme-color" content="#08090f">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(
            circle at top left,
            #19162e 0%,
            #090a10 42%,
            #05060a 100%
        );
    color: #fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* =========================================================
   HEADER
========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(7, 8, 14, .88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255,255,255,.07);

    padding: 12px 16px;
}

.header-inner {
    width: 100%;
    max-width: 1450px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 18px;
}

/* =========================================================
   KHANH TV LOGO
========================================================= */

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    flex-shrink: 0;

    cursor: pointer;
    user-select: none;
}

/* Logo icon tự thiết kế */

.brand-logo {
    position: relative;

    width: 42px;
    height: 42px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #b84cff 48%,
            #ff4f9a
        );

    box-shadow:
        0 0 25px rgba(139,92,246,.28);

    display: flex;
    align-items: center;
    justify-content: center;
}

/* màn hình TV */

.brand-logo::before {
    content: "";

    width: 22px;
    height: 15px;

    border: 2px solid white;

    border-radius: 4px;

    position: absolute;
}

/* chân TV */

.brand-logo::after {
    content: "";

    position: absolute;

    width: 13px;
    height: 2px;

    background: white;

    bottom: 9px;

    border-radius: 10px;
}

.brand-name {
    font-size: 20px;
    font-weight: 900;

    letter-spacing: -.5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c7b8ff 42%,
            #ff75ad
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.brand-sub {
    font-size: 9px;
    color: #8f91a2;
    letter-spacing: 2px;
    margin-top: 1px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-wrap {
    position: relative;
    flex: 1;

    max-width: 650px;
    margin-left: auto;
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: #8f91a2;
    font-size: 17px;

    pointer-events: none;
}

.search {
    width: 100%;

    height: 44px;

    padding:
        0 18px 0 43px;

    border-radius: 14px;

    border:
        1px solid rgba(255,255,255,.08);

    outline: none;

    background:
        rgba(255,255,255,.055);

    color: white;

    font-size: 14px;

    transition: .2s;
}

.search::placeholder {
    color: #777a8c;
}

.search:focus {
    border-color: rgba(139,92,246,.7);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 0 0 3px rgba(139,92,246,.08);
}

/* =========================================================
   MAIN
========================================================= */

.container {
    width: 100%;
    max-width: 1450px;

    margin: auto;

    padding:
        18px 16px 40px;
}

/* =========================================================
   PLAYER
========================================================= */

.player-box {
    position: relative;

    width: 100%;

    background: #000;

    border-radius: 18px;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);

    margin-bottom: 16px;
}

/*
   Khi fullscreen
*/

.player-box.fullscreen {
    position: fixed;

    inset: 0;

    z-index: 99999;

    width: 100vw;
    height: 100vh;

    max-width: none;

    margin: 0;

    border: 0;

    border-radius: 0;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    display: block;

    width: 100%;

    aspect-ratio: 16 / 9;

    max-height: 76vh;

    object-fit: contain;

    background: #000;

    outline: none;
}

/* fullscreen video */

.player-box.fullscreen video {
    width: 100vw;
    height: 100vh;

    max-height: none;

    aspect-ratio: auto;

    object-fit: contain;
}

/* =========================================================
   PLAYER OVERLAY
========================================================= */

.player-controls {
    position: absolute;

    right: 14px;
    bottom: 58px;

    display: flex;

    gap: 8px;

    opacity: 0;

    pointer-events: none;

    transform: translateY(5px);

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.player-box.controls-visible
.player-controls {

    opacity: 1;

    pointer-events: auto;

    transform: translateY(0);
}

/* nút */

.control-btn {
    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 12px;

    background:
        rgba(10,10,15,.72);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    color: white;

    font-size: 19px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: .2s;
}

.control-btn:hover {
    background:
        rgba(124,92,255,.85);

    border-color:
        rgba(255,255,255,.25);
}

.control-btn:active {
    transform: scale(.94);
}

/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        15px 18px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            rgba(0,0,0,.55),
            transparent
        );

    font-size: 15px;
    font-weight: 700;

    pointer-events: none;

    padding-top: 35px;
}

/* =========================================================
   STATUS
========================================================= */

.status {
    display: flex;
    align-items: center;

    gap: 8px;

    color: #9295a8;

    font-size: 13px;

    margin:
        8px 2px 15px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #48e58c;

    box-shadow:
        0 0 10px rgba(72,229,140,.7);
}

/* =========================================================
   CHANNEL GRID
========================================================= */

.channels {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );

    gap: 12px;
}

/* =========================================================
   CHANNEL
========================================================= */

.channel {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.075);

    border-radius: 15px;

    padding: 9px;

    cursor: pointer;

    transition:
        transform .18s ease,
        border .18s ease,
        box-shadow .18s ease,
        background .18s ease;

    overflow: hidden;
}

.channel:hover {
    transform: translateY(-3px);

    border-color:
        rgba(139,92,246,.55);

    box-shadow:
        0 12px 30px rgba(0,0,0,.25);

    background:
        rgba(139,92,246,.08);
}

.channel:active {
    transform: scale(.98);
}

.channel.active {

    border-color:
        #8b6cff;

    box-shadow:
        0 0 0 1px rgba(139,108,255,.25),
        0 8px 30px rgba(116,87,255,.18);
}

/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo {
    width: 100%;
    height: 82px;

    object-fit: contain;

    background:
        linear-gradient(
            145deg,
            #101119,
            #08090e
        );

    border-radius: 10px;

    margin-bottom: 9px;

    display: block;
}

/* =========================================================
   CHANNEL NAME
========================================================= */

.channel-name {

    font-size: 13px;

    font-weight: 700;

    line-height: 18px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #f3f3f7;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty,
.loading {

    grid-column: 1 / -1;

    text-align: center;

    padding: 45px 20px;

    color: #777b8e;

    font-size: 14px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    header {
        padding: 10px;
    }

    .header-inner {
        gap: 10px;

        flex-wrap: wrap;
    }

    .brand {
        width: auto;
    }

    .brand-logo {
        width: 38px;
        height: 38px;
    }

    .brand-name {
        font-size: 18px;
    }

    .brand-sub {
        font-size: 8px;
    }

    .search-wrap {
        order: 3;

        width: 100%;

        max-width: none;
    }

    .search {
        height: 42px;
    }

    .container {
        padding:
            10px 9px 30px;
    }

    .player-box {
        border-radius: 13px;

        margin-bottom: 13px;
    }

    video {
        min-height: 210px;

        max-height: 70vh;
    }

    .channels {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .channel {
        padding: 7px;

        border-radius: 12px;
    }

    .channel-logo {
        height: 65px;

        border-radius: 8px;

        margin-bottom: 7px;
    }

    .channel-name {
        font-size: 12px;

        line-height: 17px;
    }

    .now-playing {
        font-size: 13px;

        padding:
            12px 12px 11px;

        padding-top: 30px;
    }

    .player-controls {
        right: 9px;
        bottom: 48px;
    }

    .control-btn {
        width: 38px;
        height: 38px;

        border-radius: 10px;
    }
}

/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media
(max-width: 900px)
and (orientation: landscape) {

    body {
        background: #000;
    }

    header,
    .container {
        display: none;
    }

    .player-box {
        position: fixed;

        inset: 0;

        z-index: 99999;

        width: 100vw;
        height: 100vh;

        margin: 0;

        border: 0;

        border-radius: 0;

        background: #000;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    video {
        width: 100vw;

        height: 100vh;

        max-height: none;

        aspect-ratio: auto;

        object-fit: contain;
    }

    .now-playing {
        bottom: 0;
    }

    .player-controls {
        bottom: 50px;
    }
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 1000px) {

    .player-box {
        max-width: 1100px;

        margin-left: auto;
        margin-right: auto;
    }

    .channels {
        grid-template-columns:
            repeat(
                auto-fill,
                minmax(190px, 1fr)
            );
    }
}

</style>
</head>

<body>

<!-- =======================================================
     HEADER
======================================================== -->

<header>

    <div class="header-inner">

        <div class="brand">

            <div class="brand-logo"></div>

            <div>
                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    LIVE TELEVISION
                </div>
            </div>

        </div>

        <div class="search-wrap">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                class="search"
                type="search"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<!-- =======================================================
     CONTENT
======================================================== -->

<main class="container">

    <!-- PLAYER -->

    <div
        id="playerBox"
        class="player-box"
    >

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline
            preload="metadata"
        ></video>


        <!-- CUSTOM FULLSCREEN CONTROLS -->

        <div
            id="playerControls"
            class="player-controls"
        >

            <button
                id="fullscreenBtn"
                class="control-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

            <button
                id="exitBtn"
                class="control-btn"
                type="button"
                aria-label="Thoát toàn màn hình"
                style="display:none"
            >
                ×
            </button>

        </div>


        <div
            id="nowPlaying"
            class="now-playing"
        >
            Chưa chọn kênh
        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Đang tải danh sách kênh...
        </span>

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>


<script>

/* =========================================================
   CONFIG
========================================================= */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const playerBox =
    document.getElementById("playerBox");

const playerControls =
    document.getElementById("playerControls");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const exitBtn =
    document.getElementById("exitBtn");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let hls = null;

let currentChannel = null;

let wakeLock = null;

let controlsTimer = null;


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(PLAYLIST, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "Không thể tải playlist"
            );
        }

        const text =
            await response.text();

        channels =
            parseM3U(text);

        /*
         * Đưa VTV lên đầu.
         * Các kênh khác giữ thứ tự tương đối.
         */

        channels.sort((a, b) => {

            const av =
                /^VTV\d+/i.test(a.name);

            const bv =
                /^VTV\d+/i.test(b.name);

            if (av && !bv) return -1;

            if (!av && bv) return 1;

            return 0;
        });

        statusText.innerHTML = `
            <span class="status-dot"></span>
            <span>
                Đã tải ${channels.length} kênh
            </span>
        `;

        renderChannels(channels);

    }
    catch (error) {

        console.error(error);

        statusText.innerHTML = `
            <span style="color:#ff5f6d">
                ●
            </span>
            <span>
                Không thể tải danh sách kênh
            </span>
        `;

        channelsBox.innerHTML = `
            <div class="empty">
                Không tải được playlist IPTV.
            </div>
        `;
    }
}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();

        if (
            line.startsWith("#EXTINF")
        ) {

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );

            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""
            };

        }

        else if (
            info &&
            line &&
            !line.startsWith("#")
        ) {

            result.push({

                name: info.name,

                logo: info.logo,

                id: info.id,

                url: line
            });

            info = null;
        }
    }

    return result;
}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list) {

    channelsBox.innerHTML = "";

    if (!list.length) {

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh.
            </div>
        `;

        return;
    }

    list.forEach(channel => {

        const item =
            document.createElement("div");

        item.className =
            "channel";

        if (
            currentChannel &&
            currentChannel.url === channel.url
        ) {

            item.classList.add("active");
        }

        const logo =
            document.createElement("img");

        logo.className =
            "channel-logo";

        logo.loading =
            "lazy";

        logo.alt =
            channel.name;

        if (channel.logo) {

            logo.src =
                channel.logo;

        }

        else {

            logo.style.display =
                "none";
        }

        logo.onerror =
            function() {

                this.style.display =
                    "none";
            };


        const name =
            document.createElement("div");

        name.className =
            "channel-name";

        name.textContent =
            channel.name;


        item.appendChild(logo);

        item.appendChild(name);


        item.onclick =
            () => playChannel(channel);


        channelsBox.appendChild(item);

    });
}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel) {

    currentChannel =
        channel;

    nowPlaying.textContent =
        "●  " + channel.name;


    /* Wake Lock */

    requestWakeLock();


    /* Destroy old HLS */

    if (hls) {

        try {
            hls.destroy();
        }
        catch (e) {}

        hls = null;
    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url;


    /* =====================================================
       HLS.JS
    ===================================================== */

    if (
        url.includes(".m3u8")
        &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 30,

                maxMaxBufferLength: 60

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                video.play()
                    .catch(() => {});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ) {

                console.log(
                    "HLS:",
                    data
                );

                if (
                    data.fatal
                    &&
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    setTimeout(() => {

                        try {

                            hls.startLoad();

                        }
                        catch(e) {}

                    }, 1000);
                }

            }
        );

    }


    /* =====================================================
       NATIVE HLS
    ===================================================== */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;

        video.play()
            .catch(() => {});

    }


    /* =====================================================
       OTHER
    ===================================================== */

    else {

        video.src =
            url;

        video.play()
            .catch(() => {});
    }


    renderChannels(
        filterChannels()
    );


    /*
     * Cuộn nhẹ về player khi chọn kênh
     * ở chế độ bình thường.
     *
     * Không chạy khi fullscreen.
     */

    if (
        !playerBox.classList.contains(
            "fullscreen"
        )
    ) {

        window.scrollTo({

            top: 0,

            behavior: "smooth"
        });
    }
}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();

    if (!keyword) {

        return channels;
    }

    return channels.filter(
        channel =>
            channel.name
                .toLowerCase()
                .includes(keyword)
    );
}


/* =========================================================
   WAKE LOCK
   GIỮ MÀN HÌNH SÁNG
========================================================= */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator
        ) {

            if (
                wakeLock &&
                !wakeLock.released
            ) {

                return;
            }

            wakeLock =
                await navigator.wakeLock
                    .request("screen");


            wakeLock.addEventListener(
                "release",
                function() {

                    wakeLock = null;

                }
            );

        }

    }
    catch (error) {

        console.log(
            "Wake Lock:",
            error
        );
    }
}


/* =========================================================
   KHI QUAY LẠI TAB
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
            &&
            currentChannel
        ) {

            requestWakeLock();
        }

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen() {

    requestWakeLock();


    playerBox.classList.add(
        "fullscreen"
    );


    /*
     * Fullscreen API
     */

    try {

        if (
            !document.fullscreenElement
            &&
            playerBox.requestFullscreen
        ) {

            await playerBox.requestFullscreen();

        }

    }
    catch (error) {

        console.log(
            "Fullscreen API:",
            error
        );
    }


    updateFullscreenButtons();

    showControls();

}


/* =========================================================
   EXIT FULLSCREEN
========================================================= */

async function exitFullscreen() {

    try {

        if (
            document.fullscreenElement
        ) {

            await document.exitFullscreen();

        }

    }
    catch (error) {

        console.log(error);
    }


    playerBox.classList.remove(
        "fullscreen"
    );


    updateFullscreenButtons();

    requestWakeLock();

}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateFullscreenButtons() {

    const full =
        playerBox.classList.contains(
            "fullscreen"
        );


    if (full) {

        fullscreenBtn.style.display =
            "none";

        exitBtn.style.display =
            "flex";

    }

    else {

        fullscreenBtn.style.display =
            "flex";

        exitBtn.style.display =
            "none";
    }
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        enterFullscreen();

    }
);


/* =========================================================
   EXIT BUTTON
========================================================= */

exitBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        exitFullscreen();

    }
);


/* =========================================================
   BROWSER FULLSCREEN CHANGE
========================================================= */

document.addEventListener(
    "fullscreenchange",
    function() {

        const full =
            !!document.fullscreenElement;


        if (!full) {

            /*
             * Nếu trình duyệt tự thoát fullscreen
             */

            playerBox.classList.remove(
                "fullscreen"
            );

        }

        else {

            playerBox.classList.add(
                "fullscreen"
            );

            requestWakeLock();
        }


        updateFullscreenButtons();

    }
);


/* =========================================================
   AUTO LANDSCAPE FULLSCREEN
========================================================= */

let lastOrientation =
    window.innerWidth >
    window.innerHeight
        ? "landscape"
        : "portrait";


function checkOrientation() {

    const landscape =
        window.innerWidth >
        window.innerHeight;


    /*
     * Điện thoại quay ngang
     */

    if (
        landscape
        &&
        window.innerWidth <= 900
    ) {

        playerBox.classList.add(
            "fullscreen"
        );

        updateFullscreenButtons();

        requestWakeLock();

    }


    /*
     * Quay dọc
     *
     * Nếu fullscreen API đang hoạt động
     * thì không tự thoát ở đây.
     */

    else if (
        !landscape
        &&
        !document.fullscreenElement
    ) {

        playerBox.classList.remove(
            "fullscreen"
        );

        updateFullscreenButtons();

    }

}


window.addEventListener(
    "resize",
    function() {

        checkOrientation();

        /*
         * Một số Android resize màn hình
         * sau khi xoay.
         */

        if (currentChannel) {

            setTimeout(
                requestWakeLock,
                300
            );
        }

    }
);


window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            checkOrientation,
            350
        );

        setTimeout(
            requestWakeLock,
            500
        );

    }
);


/* =========================================================
   AUTO HIDE CONTROLS
========================================================= */

function showControls() {

    playerBox.classList.add(
        "controls-visible"
    );


    clearTimeout(
        controlsTimer
    );


    controlsTimer =
        setTimeout(
            function() {

                playerBox.classList.remove(
                    "controls-visible"
                );

            },
            2000
        );
}


/* =========================================================
   CLICK / TOUCH VIDEO
========================================================= */

playerBox.addEventListener(
    "click",
    function(e) {

        /*
         * Không xử lý click vào nút
         */

        if (
            e.target.closest(
                ".control-btn"
            )
        ) {

            return;
        }


        if (
            playerBox.classList.contains(
                "fullscreen"
            )
        ) {

            if (
                playerBox.classList.contains(
                    "controls-visible"
                )
            ) {

                playerBox.classList.remove(
                    "controls-visible"
                );

            }

            else {

                showControls();

            }

        }

    }
);


/* =========================================================
   TOUCH
========================================================= */

let touchStartX = 0;
let touchStartY = 0;


playerBox.addEventListener(
    "touchstart",
    function(e) {

        if (
            e.touches &&
            e.touches.length
        ) {

            touchStartX =
                e.touches[0].clientX;

            touchStartY =
                e.touches[0].clientY;
        }

    },
    {
        passive: true
    }
);


playerBox.addEventListener(
    "touchend",
    function(e) {

        if (
            !playerBox.classList.contains(
                "fullscreen"
            )
        ) {

            return;
        }


        const x =
            e.changedTouches[0].clientX;

        const y =
            e.changedTouches[0].clientY;


        const distance =
            Math.sqrt(
                Math.pow(
                    x - touchStartX,
                    2
                )
                +
                Math.pow(
                    y - touchStartY,
                    2
                )
            );


        /*
         * Chỉ xử lý chạm,
         * không xử lý swipe.
         */

        if (distance < 30) {

            showControls();
        }

    },
    {
        passive: true
    }
);


/* =========================================================
   VIDEO PLAY
========================================================= */

video.addEventListener(
    "play",
    function() {

        requestWakeLock();

    }
);


/* =========================================================
   VIDEO PAUSE
========================================================= */

video.addEventListener(
    "pause",
    function() {

        /*
         * Không nhả Wake Lock ngay.
         *
         * Giúp tránh trường hợp Android
         * vừa fullscreen vừa pause ngắn
         * làm màn hình tắt.
         */

    }
);


/* =========================================================
   KEYBOARD FULLSCREEN PC
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "f"
            ||
            e.key === "F"
        ) {

            if (
                playerBox.classList.contains(
                    "fullscreen"
                )
            ) {

                exitFullscreen();

            }

            else {

                enterFullscreen();

            }

        }

        if (
            e.key === "Escape"
            &&
            playerBox.classList.contains(
                "fullscreen"
            )
        ) {

            exitFullscreen();

        }

    }
);


/* =========================================================
   START
========================================================= */

updateFullscreenButtons();

loadPlaylist();

</script>
