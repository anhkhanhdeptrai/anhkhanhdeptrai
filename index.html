<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #07080d;
    color: white;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 10px 14px;
    background: rgba(7,8,13,.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.header {
    width: 100%;
    max-width: 1450px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 14px;
}

/* LOGO */

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: max-content;
}

.logo {
    position: relative;

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #7c3cff,
            #e83cff 45%,
            #ff3864
        );

    box-shadow:
        0 0 20px rgba(155,70,255,.35);

    overflow: hidden;
}

.logo::before {
    content: "";

    width: 20px;
    height: 15px;

    border: 3px solid white;
    border-radius: 5px;

    position: absolute;
}

.logo::after {
    content: "";

    width: 10px;
    height: 3px;

    background: white;
    border-radius: 10px;

    position: absolute;
    bottom: 7px;
}

.brand-text {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a970ff,
            #ff55b8,
            #ffffff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: titleGradient 5s linear infinite;
}

@keyframes titleGradient {
    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 250% center;
    }
}

/* SEARCH */

.search-wrap {
    flex: 1;
    position: relative;
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);

    color: #85899a;
    font-size: 17px;

    pointer-events: none;
}

.search {
    width: 100%;

    height: 43px;

    padding: 0 16px 0 44px;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;

    outline: none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    color: white;

    font-size: 14px;

    transition: .2s;
}

.search::placeholder {
    color: #737788;
}

.search:focus {
    border-color: rgba(151,91,255,.75);

    box-shadow:
        0 0 0 3px rgba(126,67,255,.10),
        0 0 25px rgba(126,67,255,.12);
}

/* =========================
   MAIN
========================= */

.container {
    width: 100%;
    max-width: 1450px;

    margin: auto;

    padding: 15px;
}

/* =========================
   PLAYER
========================= */

.player-box {
    width: 100%;

    background: #000;

    border-radius: 17px;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    margin-bottom: 14px;
}

.video-area {
    position: relative;

    width: 100%;

    background: #000;

    aspect-ratio: 16 / 9;

    overflow: hidden;
}

video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}

/*
ẨN TOÀN BỘ CONTROL MẶC ĐỊNH
*/
video::-webkit-media-controls {
    display: none !important;
}

video::-webkit-media-controls-enclosure {
    display: none !important;
}

/* =========================
   PLAYER TOP INFO
========================= */

.player-info {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    padding: 14px;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );

    opacity: 0;

    transition: .25s;

    z-index: 5;
}

.video-area.controls-visible .player-info {
    opacity: 1;
}

.live-title {
    font-size: 14px;
    font-weight: 800;

    max-width: 70%;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.live-badge {
    display: flex;
    align-items: center;
    gap: 6px;

    padding: 5px 9px;

    border-radius: 20px;

    background: rgba(255,35,80,.18);

    border: 1px solid rgba(255,60,100,.35);

    color: #ff6b89;

    font-size: 11px;
    font-weight: 800;
}

.live-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff315b;

    box-shadow:
        0 0 10px #ff315b;
}

/* =========================
   CUSTOM FULLSCREEN BUTTON
========================= */

.fullscreen-btn,
.close-fullscreen {
    position: absolute;

    width: 40px;
    height: 40px;

    border: 0;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    background: rgba(15,15,20,.72);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    cursor: pointer;

    font-size: 21px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s,
        transform .2s,
        background .2s;

    z-index: 20;
}

.fullscreen-btn {
    right: 12px;
    bottom: 12px;
}

.close-fullscreen {
    top: 14px;
    right: 14px;

    font-size: 26px;
}

.fullscreen-btn:hover,
.close-fullscreen:hover {
    background: rgba(110,70,255,.75);
    transform: scale(1.05);
}

.video-area.controls-visible .fullscreen-btn {
    opacity: 1;
    pointer-events: auto;
}

/* =========================
   NOW PLAYING
========================= */

.now-playing {
    min-height: 54px;

    padding: 12px 15px;

    display: flex;
    align-items: center;
    gap: 10px;

    background:
        linear-gradient(
            90deg,
            rgba(115,65,255,.12),
            rgba(255,50,150,.05)
        );

    border-top: 1px solid rgba(255,255,255,.06);
}

.now-dot {
    width: 8px;
    height: 8px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: #7655ff;

    box-shadow:
        0 0 12px #7655ff;
}

.now-text {
    min-width: 0;

    font-size: 14px;
    font-weight: 800;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* =========================
   STATUS
========================= */

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    margin: 5px 2px 13px;

    color: #8f94a6;

    font-size: 13px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #45e6a1;

    box-shadow:
        0 0 10px rgba(69,230,161,.7);
}

/* =========================
   CHANNEL GRID
========================= */

.channels {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(175px, 1fr));

    gap: 11px;
}

.channel {
    min-width: 0;

    padding: 9px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.075);

    border-radius: 15px;

    cursor: pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;
}

.channel:hover {
    transform: translateY(-2px);

    border-color:
        rgba(130,85,255,.65);

    box-shadow:
        0 10px 25px rgba(0,0,0,.22);
}

.channel.active {
    border-color: #8155ff;

    background:
        linear-gradient(
            145deg,
            rgba(125,75,255,.16),
            rgba(255,60,160,.06)
        );

    box-shadow:
        0 0 20px rgba(126,77,255,.15);
}

.channel-logo {
    width: 100%;
    height: 78px;

    object-fit: contain;

    display: block;

    border-radius: 10px;

    background: #0b0c11;

    margin-bottom: 9px;
}

.channel-name {
    font-size: 13px;
    font-weight: 750;

    line-height: 1.3;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.channel-quality {
    color: #777c8d;

    font-size: 10px;

    margin-top: 4px;
}

/* =========================
   LOADING / EMPTY
========================= */

.loading,
.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 45px 20px;

    color: #85899a;
}

/* =========================
   FULLSCREEN VIEWER
========================= */

/*
Không dùng Fullscreen API cho video.
Tạo viewer phủ toàn bộ viewport.
*/

.fullscreen-viewer {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    background: #000;

    z-index: 999999;

    display: none;

    overflow: hidden;

    touch-action: manipulation;
}

.fullscreen-viewer.active {
    display: block;
}

.fullscreen-video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}

/* fullscreen video không hiện control */

.fullscreen-video::-webkit-media-controls {
    display: none !important;
}

.fullscreen-video::-webkit-media-controls-enclosure {
    display: none !important;
}

.fullscreen-top {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    padding: 15px;

    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            transparent
        );

    opacity: 1;

    transition: opacity .3s;

    pointer-events: none;
}

.fullscreen-top .live-title {
    pointer-events: none;
}

.close-fullscreen {
    pointer-events: auto;

    opacity: 1;
}

.fullscreen-viewer.controls-hidden .fullscreen-top {
    opacity: 0;
    pointer-events: none;
}

.fullscreen-viewer.controls-hidden .close-fullscreen {
    pointer-events: none;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 600px) {

    header {
        padding: 9px 10px;
    }

    .header {
        gap: 9px;
    }

    .logo {
        width: 38px;
        height: 38px;

        border-radius: 11px;
    }

    .brand-text {
        font-size: 17px;
    }

    .search {
        height: 40px;
        border-radius: 12px;

        padding-left: 40px;

        font-size: 13px;
    }

    .container {
        padding: 10px;
    }

    .player-box {
        border-radius: 14px;
    }

    .video-area {
        aspect-ratio: 16 / 9;
    }

    .channels {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .channel {
        padding: 7px;

        border-radius: 12px;
    }

    .channel-logo {
        height: 62px;
    }

    .channel-name {
        font-size: 12px;
    }
}

/* =========================
   FULLSCREEN PORTRAIT
========================= */

@media (orientation: portrait) {

    .fullscreen-viewer {
        width: 100vw;
        height: 100dvh;
    }

    .fullscreen-video {
        width: 100vw;
        height: 100dvh;
        object-fit: contain;
    }
}

/* =========================
   FULLSCREEN LANDSCAPE
========================= */

@media (orientation: landscape) {

    .fullscreen-viewer {
        width: 100vw;
        height: 100dvh;
    }

    .fullscreen-video {
        width: 100vw;
        height: 100dvh;

        object-fit: contain;
    }

    .fullscreen-top {
        padding:
            max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            12px
            max(12px, env(safe-area-inset-left));
    }
}

/* =========================
   SAFE AREA
========================= */

@supports (padding: env(safe-area-inset-top)) {

    .fullscreen-viewer {
        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>

        <div class="search-wrap">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <div class="player-box">

        <div
            id="videoArea"
            class="video-area"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>


            <div class="player-info">

                <div
                    id="playerTitle"
                    class="live-title"
                >
                    KHANH TV
                </div>

                <div class="live-badge">
                    <span class="live-dot"></span>
                    LIVE
                </div>

            </div>


            <!-- CHỈ CÓ 1 NÚT FULLSCREEN TỰ TẠO -->

            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

        </div>


        <div class="now-playing">

            <span class="now-dot"></span>

            <span
                id="nowPlaying"
                class="now-text"
            >
                Chưa chọn kênh
            </span>

        </div>

    </div>


    <div
        id="status"
        class="status"
    >
        <span class="status-dot"></span>
        <span>Đang tải danh sách...</span>
    </div>


    <div
        id="channels"
        class="channels"
    >
        <div class="loading">
            Đang tải kênh...
        </div>
    </div>

</main>


<!-- =========================
     FULLSCREEN VIEWER
========================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="live-title"
        >
            KHANH TV
        </div>

        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
            aria-label="Đóng"
        >
            ×
        </button>

    </div>

</div>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const fullscreenVideo =
    document.getElementById("fullscreenVideo");

const videoArea =
    document.getElementById("videoArea");

const fullscreenViewer =
    document.getElementById("fullscreenViewer");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeFullscreen =
    document.getElementById("closeFullscreen");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const playerTitle =
    document.getElementById("playerTitle");

const fullscreenTitle =
    document.getElementById("fullscreenTitle");

const searchInput =
    document.getElementById("search");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let hls = null;

let fullscreenHls = null;

let wakeLock = null;

let controlsTimer = null;

let fullscreenControlsTimer = null;


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(PLAYLIST, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        channels =
            parseM3U(text);


        /*
         * ĐƯA VTV LÊN ĐẦU
         */

        channels.sort((a, b) => {

            const av =
                /^VTV\d+/i.test(a.name);

            const bv =
                /^VTV\d+/i.test(b.name);

            if (av && !bv) return -1;

            if (!av && bv) return 1;

            return 0;

        });


        setStatus(
            "Đã tải " +
            channels.length +
            " kênh"
        );

        renderChannels(channels);


    } catch (error) {

        console.error(error);

        setStatus(
            "Không thể tải danh sách kênh"
        );

        channelsBox.innerHTML = `
            <div class="empty">
                ❌ Không tải được playlist IPTV.
                <br><br>
                Hãy kiểm tra kết nối mạng.
            </div>
        `;
    }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusText.innerHTML = `
        <span class="status-dot"></span>
        <span>${escapeHtml(text)}</span>
    `;
}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;

    for (let i = 0; i < lines.length; i++) {

        const line =
            lines[i].trim();

        if (
            line.startsWith("#EXTINF")
        ) {

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );

            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );

            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : "",

                group:
                    groupMatch
                    ? groupMatch[1]
                    : "",

                id:
                    idMatch
                    ? idMatch[1]
                    : ""
            };

        }

        else if (
            info &&
            line &&
            !line.startsWith("#")
        ) {

            result.push({

                name: info.name,

                logo: info.logo,

                group: info.group,

                id: info.id,

                url: line

            });

            info = null;
        }
    }

    return result;
}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list) {

    channelsBox.innerHTML = "";

    if (!list.length) {

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh.
            </div>
        `;

        return;
    }


    list.forEach(channel => {

        const item =
            document.createElement("div");

        item.className =
            "channel";


        if (
            currentChannel &&
            currentChannel.url === channel.url
        ) {

            item.classList.add(
                "active"
            );
        }


        const logoHTML =
            channel.logo

            ?

            `
            <img
                class="channel-logo"
                src="${escapeAttribute(channel.logo)}"
                loading="lazy"
                onerror="
                    this.style.display='none'
                "
            >
            `

            :

            `
            <div
                class="channel-logo"
            ></div>
            `;


        item.innerHTML = `

            ${logoHTML}

            <div class="channel-name">
                ${escapeHtml(channel.name)}
            </div>

            <div class="channel-quality">
                ${channel.group || "IPTV"}
            </div>

        `;


        item.addEventListener(
            "click",
            () => playChannel(channel)
        );


        channelsBox.appendChild(item);

    });
}


/* =========================================================
   PLAY NORMAL VIDEO
========================================================= */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    playerTitle.innerText =
        channel.name;


    fullscreenTitle.innerText =
        channel.name;


    destroyNormalHls();


    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url;


    if (
        isHLS(url) &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 20

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .catch(() => {});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (event, data) => {

                console.log(
                    "HLS:",
                    data
                );

            }
        );

    }

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;

        video.play()
            .catch(() => {});

    }

    else {

        video.src =
            url;

        video.play()
            .catch(() => {});

    }


    renderChannels(
        filterChannels()
    );
}


/* =========================================================
   HLS CHECK
========================================================= */

function isHLS(url) {

    return (
        url.includes(".m3u8") ||
        url.includes("m3u8?")
    );
}


/* =========================================================
   NORMAL HLS DESTROY
========================================================= */

function destroyNormalHls() {

    if (hls) {

        try {
            hls.destroy();
        }
        catch(e) {}

        hls = null;
    }
}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();

        if (!currentChannel) {

            return;
        }


        await openFullscreen();

    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen() {

    if (!currentChannel) {
        return;
    }


    /*
     * Dừng video chính.
     * Không tạo audio/video thứ hai cùng phát.
     */

    video.pause();


    destroyFullscreenHls();


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove("controls-hidden");


    fullscreenTitle.innerText =
        currentChannel.name;


    const url =
        currentChannel.url;


    /*
     * PLAY STREAM TRÊN VIEWER
     */

    if (
        isHLS(url) &&
        Hls.isSupported()
    ) {

        fullscreenHls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 20

            });


        fullscreenHls.loadSource(
            url
        );

        fullscreenHls.attachMedia(
            fullscreenVideo
        );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                fullscreenVideo
                    .play()
                    .catch(() => {});

            }
        );

    }

    else {

        fullscreenVideo.src =
            url;

        fullscreenVideo
            .load();

        fullscreenVideo
            .play()
            .catch(() => {});
    }


    /*
     * CỐ GẮNG GIỮ MÀN HÌNH SÁNG
     */

    await requestWakeLock();


    /*
     * Cố xoay ngang nếu trình duyệt cho phép.
     * Không ép nếu trình duyệt không hỗ trợ.
     */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch(e) {

        console.log(
            "Orientation lock không được hỗ trợ"
        );

    }


    showFullscreenControls();

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();

        await closeFullscreenViewer();

    }
);


/* =========================================================
   CLOSE FUNCTION
========================================================= */

async function closeFullscreenViewer() {

    fullscreenViewer
        .classList
        .remove("active");


    fullscreenViewer
        .classList
        .remove("controls-hidden");


    fullscreenVideo.pause();

    destroyFullscreenHls();

    fullscreenVideo.removeAttribute(
        "src"
    );

    fullscreenVideo.load();


    releaseWakeLock();


    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    }
    catch(e) {}


    /*
     * Chạy lại video chính.
     */

    if (currentChannel) {

        video.play()
            .catch(() => {});

    }
}


/* =========================================================
   DESTROY FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls() {

    if (fullscreenHls) {

        try {
            fullscreenHls.destroy();
        }
        catch(e) {}

        fullscreenHls = null;
    }
}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator
        ) {

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );


            wakeLock.addEventListener(
                "release",
                () => {

                    console.log(
                        "Wake Lock released"
                    );

                }
            );

        }

    }
    catch(error) {

        console.log(
            "Wake Lock:",
            error
        );

    }
}


/* =========================================================
   RE-REQUEST WAKE LOCK
   khi app quay lại foreground
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible" &&
            fullscreenViewer
                .classList
                .contains("active")
        ) {

            await requestWakeLock();

        }

    }
);


/* =========================================================
   RELEASE WAKE LOCK
========================================================= */

function releaseWakeLock() {

    if (wakeLock) {

        try {
            wakeLock.release();
        }
        catch(e) {}

        wakeLock = null;
    }
}


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function() {

        showFullscreenControls();

    }
);


function showFullscreenControls() {

    fullscreenViewer
        .classList
        .remove("controls-hidden");


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            () => {

                fullscreenViewer
                    .classList
                    .add(
                        "controls-hidden"
                    );

            },
            3000
        );
}


/* =========================================================
   VIDEO AREA CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function() {

        videoArea
            .classList
            .add("controls-visible");


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                () => {

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;

    }


    return channels.filter(
        channel => {

            return (
                channel.name
                    .toLowerCase()
                    .includes(keyword)

                ||

                channel.group
                    .toLowerCase()
                    .includes(keyword)

                ||

                channel.id
                    .toLowerCase()
                    .includes(keyword)
            );

        }
    );
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(value) {

    return escapeHtml(value);

}


/* =========================================================
   BACK BUTTON AND ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" &&
            fullscreenViewer
                .classList
                .contains("active")
        ) {

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   ANDROID BACK BUTTON
   pageshow / orientation handling
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            fullscreenViewer
                .classList
                .contains("active")
        ) {

            /*
             * Sau khi xoay màn hình,
             * đảm bảo viewer vẫn phủ toàn viewport.
             */

            fullscreenViewer.style.width =
                window.innerWidth + "px";

            fullscreenViewer.style.height =
                window.innerHeight + "px";

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>
