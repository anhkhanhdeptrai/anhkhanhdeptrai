<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #08090d;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px;
    background: rgba(8,9,13,.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.header {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: max-content;
}

/* LOGO TỰ THIẾT KẾ */

.logo-mark {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(135deg,#7c3cff,#00d9ff,#ff2ea6);
    box-shadow:
        0 0 18px rgba(124,60,255,.4);
}

.logo-mark::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px solid white;
    border-radius: 8px;
}

.logo-mark::after {
    content: "";
    position: absolute;
    width: 11px;
    height: 11px;
    left: 15px;
    top: 15px;
    background: white;
    clip-path: polygon(
        0 0,
        100% 50%,
        0 100%
    );
}

.brand-name {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: .5px;

    background:
        linear-gradient(
            90deg,
            #8b5cff,
            #00d9ff,
            #ff3da7,
            #8b5cff
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: titleMove 5s linear infinite;
}

@keyframes titleMove {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 300% 50%;
    }
}

/* SEARCH */

.search-wrap {
    flex: 1;
    position: relative;
}

.search {
    width: 100%;
    height: 44px;
    padding: 0 17px 0 45px;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;

    outline: none;
    color: white;

    background: rgba(255,255,255,.07);

    font-size: 15px;

    transition: .2s;
}

.search:focus {
    border-color: #7c5cff;
    box-shadow: 0 0 0 3px rgba(124,92,255,.12);
}

.search-icon {
    position: absolute;
    left: 16px;
    top: 12px;
    color: #999;
    font-size: 17px;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1400px;
    margin: auto;
    padding: 18px;
}

/* =========================
   PLAYER
========================= */

.player-box {
    background: #000;
    border-radius: 17px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    margin-bottom: 16px;
}

.video-area {
    position: relative;
    background: #000;
    width: 100%;
}

#video {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    background: #000;

    /* Không dùng object-fit cover để tránh mất hình */
    object-fit: contain;
}

/*
   ẨN NÚT FULLSCREEN MẶC ĐỊNH
   Vì ta dùng nút riêng.
*/
video::-webkit-media-controls-fullscreen-button {
    display: none !important;
}

/* Firefox */
video::-moz-media-controls-fullscreen-button {
    display: none !important;
}

/* =========================
   CUSTOM BUTTON
========================= */

.fullscreen-button {
    position: absolute;
    right: 12px;
    bottom: 12px;

    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 12px;

    color: white;
    background: rgba(0,0,0,.65);

    backdrop-filter: blur(10px);

    font-size: 22px;

    cursor: pointer;

    z-index: 20;

    opacity: 0;
    transform: translateY(6px);

    transition:
        opacity .2s,
        transform .2s;
}

.video-area:hover .fullscreen-button,
.video-area:focus-within .fullscreen-button {
    opacity: 1;
    transform: translateY(0);
}

/* Khi chạm điện thoại */

.video-area.show-controls .fullscreen-button {
    opacity: 1;
    transform: translateY(0);
}

/* =========================
   NOW PLAYING
========================= */

.now-playing {
    padding: 13px 15px;

    background:
        linear-gradient(
            90deg,
            rgba(124,60,255,.12),
            rgba(0,217,255,.06)
        );

    font-size: 15px;
    font-weight: 700;
}

.now-playing span {
    color: #9b8cff;
}

/* =========================
   STATUS
========================= */

.status {
    margin: 12px 2px;

    color: #9b9ca5;
    font-size: 14px;
}

/* =========================
   CHANNEL GRID
========================= */

.channels {
    display: grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap: 12px;
}

.channel {
    background: #11131a;

    border: 1px solid rgba(255,255,255,.07);

    border-radius: 14px;

    padding: 10px;

    cursor: pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s;
}

.channel:hover {
    transform: translateY(-2px);

    background: #171923;

    border-color: rgba(124,92,255,.7);
}

.channel.active {
    border-color: #7c5cff;

    box-shadow:
        0 0 0 1px rgba(124,92,255,.15),
        0 0 20px rgba(124,92,255,.12);
}

.channel-logo {
    width: 100%;
    height: 78px;

    display: block;

    object-fit: contain;

    background: #0a0b10;

    border-radius: 10px;

    margin-bottom: 9px;
}

.channel-name {
    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty,
.loading {
    grid-column: 1 / -1;

    text-align: center;

    padding: 45px;

    color: #777;
}

/* =========================
   CUSTOM FULLSCREEN
========================= */

/*
   Đây KHÔNG phải fullscreen của video.
   Đây là fullscreen riêng của web.
*/

#customFullscreen {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    background: #000;

    z-index: 999999;

    display: none;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    touch-action: manipulation;
}

#customFullscreen.active {
    display: flex;
}

/*
   Video trong fullscreen
*/

#fullscreenVideo {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: block;
}

/* =========================
   FULLSCREEN CLOSE
========================= */

.close-fullscreen {
    position: absolute;

    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));

    width: 43px;
    height: 43px;

    border: 0;
    border-radius: 13px;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 27px;
    line-height: 40px;

    cursor: pointer;

    z-index: 1000000;

    opacity: 0;

    transition: opacity .25s;
}

/*
   Khi chạm vào fullscreen:
   nút hiện ra một lúc rồi tự ẩn.
*/

#customFullscreen.show-controls .close-fullscreen {
    opacity: 1;
}

/* Thông tin kênh */

.fullscreen-title {
    position: absolute;

    left: 15px;
    bottom: max(15px, env(safe-area-inset-bottom));

    padding: 8px 12px;

    border-radius: 10px;

    background: rgba(0,0,0,.55);

    backdrop-filter: blur(10px);

    font-size: 14px;
    font-weight: bold;

    z-index: 1000000;

    opacity: 0;

    transition: opacity .25s;
}

#customFullscreen.show-controls .fullscreen-title {
    opacity: 1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    header {
        padding: 9px;
    }

    .header {
        gap: 9px;
    }

    .logo-mark {
        width: 38px;
        height: 38px;
        border-radius: 11px;
    }

    .brand-name {
        font-size: 18px;
    }

    .search {
        height: 40px;
        font-size: 14px;
    }

    .container {
        padding: 9px;
    }

    .player-box {
        border-radius: 13px;
    }

    #video {
        aspect-ratio: 16 / 9;
    }

    .channels {
        grid-template-columns: repeat(2,1fr);
        gap: 8px;
    }

    .channel {
        padding: 8px;
        border-radius: 12px;
    }

    .channel-logo {
        height: 64px;
    }
}

/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) {

    #customFullscreen {
        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;
    }

    #fullscreenVideo {
        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

        object-fit: contain;
    }
}

/* =========================
   HIDE SCROLLBAR
========================= */

body.fullscreen-open {
    overflow: hidden !important;
    touch-action: none;
}
</style>
</head>

<body>

<header>
    <div class="header">

        <div class="brand">

            <div class="logo-mark"></div>

            <div class="brand-name">
                KHANH TV
            </div>

        </div>

        <div class="search-wrap">

            <div class="search-icon">⌕</div>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Tìm kiếm kênh..."
                autocomplete="off"
            >

        </div>

    </div>
</header>


<main class="container">

    <!-- PLAYER -->

    <div class="player-box">

        <div
            class="video-area"
            id="videoArea"
        >

            <video
                id="video"
                controls
                playsinline
                preload="none"
            ></video>

            <!-- CHỈ CÓ 1 NÚT FULLSCREEN RIÊNG -->

            <button
                id="fullscreenButton"
                class="fullscreen-button"
                type="button"
                aria-label="Xem toàn màn hình"
            >⛶</button>

        </div>

        <div
            class="now-playing"
            id="nowPlaying"
        >
            Chưa chọn kênh
        </div>

    </div>


    <div
        class="status"
        id="status"
    >
        Đang tải danh sách kênh...
    </div>


    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải...
        </div>

    </div>

</main>


<!-- =================================================
     CUSTOM FULLSCREEN
================================================= -->

<div
    id="customFullscreen"
    aria-hidden="true"
>

    <!--
       Video riêng cho fullscreen.
       KHÔNG dùng video chính ở đây.
    -->

    <video
        id="fullscreenVideo"
        playsinline
        preload="none"
    ></video>


    <button
        id="closeFullscreen"
        class="close-fullscreen"
        type="button"
        aria-label="Thoát toàn màn hình"
    >×</button>


    <div
        id="fullscreenTitle"
        class="fullscreen-title"
    >
        KHANH TV
    </div>

</div>


<script>

/* =================================================
   CONFIG
================================================= */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =================================================
   ELEMENTS
================================================= */

const video =
    document.getElementById("video");

const fullscreenVideo =
    document.getElementById("fullscreenVideo");

const videoArea =
    document.getElementById("videoArea");

const fullscreen =
    document.getElementById("customFullscreen");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const closeFullscreen =
    document.getElementById("closeFullscreen");

const fullscreenTitle =
    document.getElementById("fullscreenTitle");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");


/* =================================================
   VARIABLES
================================================= */

let channels = [];

let currentChannel = null;

let hls = null;

let fullscreenHls = null;

let wakeLock = null;

let wakeLockTimer = null;

let fullscreenOpen = false;

let hideTimer = null;


/* =================================================
   LOAD PLAYLIST
================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(PLAYLIST);

        if (!response.ok) {
            throw new Error(
                "Không tải được playlist"
            );
        }

        const text =
            await response.text();

        channels =
            parseM3U(text);

        /*
         * ĐƯA TOÀN BỘ VTV LÊN ĐẦU
         */

        channels.sort((a,b) => {

            const av =
                /^VTV/i.test(a.name);

            const bv =
                /^VTV/i.test(b.name);

            if (av && !bv) return -1;

            if (!av && bv) return 1;

            return 0;
        });

        statusText.innerText =
            `Đã tải ${channels.length} kênh`;

        renderChannels(channels);

    } catch(error) {

        console.error(error);

        statusText.innerText =
            "❌ Không thể tải danh sách kênh";

        channelsBox.innerHTML = `
            <div class="empty">
                Không tải được playlist IPTV.
            </div>
        `;
    }
}


/* =================================================
   PARSE M3U
================================================= */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;

    for (let i = 0; i < lines.length; i++) {

        const line =
            lines[i].trim();

        if (line.startsWith("#EXTINF")) {

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : ""
            };

        }

        else if (
            info &&
            line &&
            !line.startsWith("#")
        ) {

            result.push({

                name: info.name,

                logo: info.logo,

                url: line

            });

            info = null;
        }
    }

    return result;
}


/* =================================================
   RENDER CHANNELS
================================================= */

function renderChannels(list) {

    channelsBox.innerHTML = "";

    if (!list.length) {

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh
            </div>
        `;

        return;
    }

    list.forEach(channel => {

        const item =
            document.createElement("div");

        item.className = "channel";

        if (
            currentChannel &&
            currentChannel.url === channel.url
        ) {

            item.classList.add("active");
        }

        if (channel.logo) {

            const img =
                document.createElement("img");

            img.className =
                "channel-logo";

            img.src =
                channel.logo;

            img.loading =
                "lazy";

            img.onerror =
                function() {
                    this.style.display =
                        "none";
                };

            item.appendChild(img);

        } else {

            const logo =
                document.createElement("div");

            logo.className =
                "channel-logo";

            item.appendChild(logo);
        }

        const name =
            document.createElement("div");

        name.className =
            "channel-name";

        name.textContent =
            channel.name;

        item.appendChild(name);

        item.onclick =
            () => playChannel(channel);

        channelsBox.appendChild(item);
    });
}


/* =================================================
   DESTROY MAIN HLS
================================================= */

function destroyMainHls() {

    if (hls) {

        hls.destroy();

        hls = null;
    }
}


/* =================================================
   PLAY MAIN VIDEO
================================================= */

function playChannel(channel) {

    currentChannel =
        channel;

    nowPlaying.innerHTML =
        `<span>ĐANG PHÁT</span> · ${
            escapeHtml(channel.name)
        }`;

    destroyMainHls();

    video.pause();

    video.removeAttribute("src");

    video.load();

    const url =
        channel.url;

    if (
        url.includes(".m3u8") &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30
            });

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                video.play()
                    .catch(() => {});

            }
        );

        hls.on(
            Hls.Events.ERROR,
            function(event,data) {

                console.log(
                    "HLS:",
                    data
                );
            }
        );

    }

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;

        video.play()
            .catch(() => {});

    }

    else {

        video.src =
            url;

        video.play()
            .catch(() => {});
    }

    renderChannels(
        filterChannels()
    );
}


/* =================================================
   SEARCH
================================================= */

searchInput.addEventListener(
    "input",
    function() {

        renderChannels(
            filterChannels()
        );
    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();

    if (!keyword) {
        return channels;
    }

    return channels.filter(
        channel =>
            channel.name
                .toLowerCase()
                .includes(keyword)
    );
}


/* =================================================
   CUSTOM FULLSCREEN
================================================= */

fullscreenButton.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();

        event.stopPropagation();

        if (!currentChannel) {
            return;
        }

        await openCustomFullscreen();
    }
);


/* =================================================
   OPEN CUSTOM FULLSCREEN
================================================= */

async function openCustomFullscreen() {

    if (!currentChannel) {
        return;
    }

    fullscreenOpen =
        true;

    document.body.classList.add(
        "fullscreen-open"
    );

    fullscreen.classList.add(
        "active"
    );

    fullscreen.setAttribute(
        "aria-hidden",
        "false"
    );

    fullscreenTitle.textContent =
        currentChannel.name;

    /*
     * QUAN TRỌNG:
     * Lấy URL hiện tại.
     */

    const url =
        currentChannel.url;


    /*
     * Dừng video chính.
     * Chỉ fullscreenVideo phát.
     * Không bị 2 tiếng.
     */

    video.pause();


    /*
     * Xóa HLS fullscreen cũ
     */

    if (fullscreenHls) {

        fullscreenHls.destroy();

        fullscreenHls = null;
    }

    fullscreenVideo.pause();

    fullscreenVideo.removeAttribute(
        "src"
    );

    fullscreenVideo.load();


    /*
     * PHÁT VIDEO FULLSCREEN
     */

    if (
        url.includes(".m3u8") &&
        Hls.isSupported()
    ) {

        fullscreenHls =
            new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30
            });

        fullscreenHls.loadSource(
            url
        );

        fullscreenHls.attachMedia(
            fullscreenVideo
        );

        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                fullscreenVideo
                    .play()
                    .catch(() => {});

            }
        );

    }

    else {

        fullscreenVideo.src =
            url;

        fullscreenVideo
            .play()
            .catch(() => {});
    }


    /*
     * ÉP MÀN HÌNH KHÔNG SLEEP
     */

    await requestWakeLock();

    /*
     * Cố gắng xoay ngang trên thiết bị
     * hỗ trợ Screen Orientation API.
     */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation
                .lock("landscape")
                .catch(() => {});
        }

    } catch(e) {}


    showFullscreenControls();

    /*
     * Không dùng video.requestFullscreen()
     *
     * Vì đây là fullscreen riêng.
     */
}


/* =================================================
   WAKE LOCK
================================================= */

async function requestWakeLock() {

    if (!fullscreenOpen) {
        return;
    }

    /*
     * Trình duyệt không hỗ trợ
     */

    if (!("wakeLock" in navigator)) {

        console.log(
            "Thiết bị không hỗ trợ Wake Lock"
        );

        return;
    }

    try {

        if (
            wakeLock &&
            !wakeLock.released
        ) {

            return;
        }

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

        console.log(
            "Wake Lock: ON"
        );


        wakeLock.addEventListener(
            "release",
            function() {

                wakeLock = null;

                /*
                 * Tự xin lại.
                 */

                if (fullscreenOpen) {

                    setTimeout(
                        requestWakeLock,
                        500
                    );
                }
            }
        );

    } catch(error) {

        console.log(
            "Wake Lock lỗi:",
            error
        );

        /*
         * Thử lại sau.
         */

        if (fullscreenOpen) {

            setTimeout(
                requestWakeLock,
                2000
            );
        }
    }
}


/* =================================================
   GIỮ WAKE LOCK ĐỊNH KỲ
================================================= */

function startWakeLockKeepAlive() {

    clearInterval(
        wakeLockTimer
    );

    wakeLockTimer =
        setInterval(
            function() {

                if (
                    fullscreenOpen &&
                    (
                        !wakeLock ||
                        wakeLock.released
                    )
                ) {

                    requestWakeLock();
                }

            },
            5000
        );
}

startWakeLockKeepAlive();


/* =================================================
   TAB QUAY LẠI
================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (fullscreenOpen) {

                requestWakeLock();

                /*
                 * Đảm bảo video vẫn chạy.
                 */

                if (
                    fullscreenVideo.paused
                ) {

                    fullscreenVideo
                        .play()
                        .catch(() => {});
                }
            }
        }
    }
);


/* =================================================
   CLOSE FULLSCREEN
================================================= */

closeFullscreen.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();

        closeCustomFullscreen();
    }
);


/* =================================================
   CLOSE
================================================= */

async function closeCustomFullscreen() {

    fullscreenOpen =
        false;

    clearTimeout(
        hideTimer
    );

    /*
     * Tắt Wake Lock
     */

    if (wakeLock) {

        try {

            await wakeLock.release();

        } catch(e) {}

        wakeLock = null;
    }


    /*
     * Hủy HLS fullscreen
     */

    if (fullscreenHls) {

        fullscreenHls.destroy();

        fullscreenHls = null;
    }


    /*
     * Dừng video fullscreen
     */

    fullscreenVideo.pause();

    fullscreenVideo.removeAttribute(
        "src"
    );

    fullscreenVideo.load();


    /*
     * Đóng giao diện
     */

    fullscreen.classList.remove(
        "active"
    );

    fullscreen.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.classList.remove(
        "fullscreen-open"
    );


    /*
     * Mở khóa xoay nếu trình duyệt hỗ trợ
     */

    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();
        }

    } catch(e) {}


    /*
     * Quay lại video chính.
     */

    if (currentChannel) {

        playChannel(
            currentChannel
        );
    }
}


/* =================================================
   CHẠM FULLSCREEN
================================================= */

fullscreen.addEventListener(
    "click",
    function(event) {

        /*
         * Nếu chạm vào nền,
         * hiện/ẩn nút ×.
         */

        if (
            event.target === fullscreen ||
            event.target === fullscreenVideo
        ) {

            showFullscreenControls();
        }
    }
);


/* =================================================
   HIỆN NÚT × TẠM THỜI
================================================= */

function showFullscreenControls() {

    fullscreen.classList.add(
        "show-controls"
    );

    clearTimeout(
        hideTimer
    );

    hideTimer =
        setTimeout(
            function() {

                if (fullscreenOpen) {

                    fullscreen.classList.remove(
                        "show-controls"
                    );
                }

            },
            2500
        );
}


/* =================================================
   ESC / BACK
================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            fullscreenOpen
        ) {

            closeCustomFullscreen();
        }
    }
);


/*
 * Android back gesture/browser back:
 * nếu trang đang fullscreen thì đóng.
 */

window.addEventListener(
    "popstate",
    function() {

        if (fullscreenOpen) {

            closeCustomFullscreen();
        }
    }
);


/* =================================================
   ESCAPE HTML
================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =================================================
   VIDEO TOUCH
================================================= */

let touchTimer = null;

videoArea.addEventListener(
    "touchstart",
    function() {

        videoArea.classList.add(
            "show-controls"
        );

        clearTimeout(
            touchTimer
        );

        touchTimer =
            setTimeout(
                function() {

                    videoArea.classList.remove(
                        "show-controls"
                    );

                },
                2500
            );
    },
    {
        passive: true
    }
);


/* =================================================
   START
================================================= */

loadPlaylist();

</script>
