<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(105,65,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(255,50,160,.09),
            transparent 28%
        ),
        #06070c;

    color: #fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {

    position: sticky;

    top: 0;

    z-index: 1000;

    padding:
        10px
        14px;

    background:
        rgba(6,7,12,.82);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.18);
}

.header {

    width: 100%;

    max-width: 1450px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 13px;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 9px;

    flex-shrink: 0;

    min-width: max-content;
}

.logo {

    width: 42px;
    height: 42px;

    border-radius: 13px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #6b35ff,
            #a83cff 45%,
            #ff3c91
        );

    box-shadow:
        0 0 25px
        rgba(135,65,255,.4);

    overflow: hidden;
}

.logo::before {

    content: "";

    width: 21px;
    height: 15px;

    border:
        3px solid white;

    border-radius: 5px;

    position: absolute;
}

.logo::after {

    content: "";

    width: 9px;
    height: 3px;

    background: white;

    border-radius: 10px;

    position: absolute;

    bottom: 7px;
}

.brand-text {

    font-size: 19px;

    font-weight: 950;

    letter-spacing: .5px;

    white-space: nowrap;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #b78aff,
            #ff65bd,
            #ffffff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGradient
        5s linear infinite;
}

@keyframes titleGradient {

    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 250% center;
    }
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap {

    flex: 1;

    position: relative;

    min-width: 0;
}

.search-icon {

    position: absolute;

    left: 15px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #85899b;

    font-size: 18px;

    pointer-events: none;

    z-index: 2;
}

.search {

    width: 100%;

    height: 43px;

    padding:
        0
        15px
        0
        43px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 14px;

    outline: none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    color: white;

    font-size: 14px;

    transition:
        .25s;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);
}

.search::placeholder {
    color: #737789;
}

.search:focus {

    border-color:
        rgba(145,95,255,.75);

    background:
        rgba(25,21,38,.9);

    box-shadow:
        0 0 0 3px
        rgba(126,67,255,.1),

        0 0 28px
        rgba(126,67,255,.14);
}


/* =========================================================
   MAIN
========================================================= */

.container {

    width: 100%;

    max-width: 1450px;

    margin: auto;

    padding:
        15px;
}


/* =========================================================
   PLAYER FIXED WHEN SCROLLING
========================================================= */

.player-box {

    width: 100%;

    background:
        rgba(5,5,9,.95);

    border-radius: 18px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.45),

        0 0 40px
        rgba(100,50,255,.07);

    margin-bottom: 13px;

    /*
       QUAN TRỌNG:
       PLAYER LUÔN CỐ ĐỊNH KHI VUỐT
       DANH SÁCH KÊNH.
    */

    position: sticky;

    top: 70px;

    z-index: 900;
}


/* =========================================================
   VIDEO
========================================================= */

.video-area {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}

video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}


/* HIDE NATIVE CONTROLS */

video::-webkit-media-controls {
    display: none !important;
}

video::-webkit-media-controls-enclosure {
    display: none !important;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info {

    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    padding: 14px;

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.78),
            transparent
        );

    opacity: 0;

    transition:
        opacity .25s;

    z-index: 5;
}

.video-area.controls-visible
.player-info {

    opacity: 1;
}

.live-title {

    max-width: 70%;

    font-size: 14px;

    font-weight: 850;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   LIVE BADGE
========================================================= */

.live-badge {

    display: flex;

    align-items: center;

    gap: 6px;

    padding:
        5px
        9px;

    border-radius: 20px;

    background:
        rgba(255,35,80,.14);

    border:
        1px solid
        rgba(255,60,100,.35);

    color: #ff718d;

    font-size: 10px;

    font-weight: 900;

    box-shadow:
        0 0 15px
        rgba(255,40,90,.1);
}

.live-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff315b;

    box-shadow:
        0 0 10px
        #ff315b;

    animation:
        livePulse
        1.2s infinite;
}

@keyframes livePulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .45;
        transform: scale(.7);
    }
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn,
.close-fullscreen {

    width: 40px;
    height: 40px;

    border: 0;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    background:
        rgba(15,15,22,.75);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    cursor: pointer;

    font-size: 21px;

    transition:
        .2s;
}

.fullscreen-btn {

    position: absolute;

    right: 12px;
    bottom: 12px;

    opacity: 0;

    pointer-events: none;

    z-index: 20;
}

.video-area.controls-visible
.fullscreen-btn {

    opacity: 1;

    pointer-events: auto;
}

.fullscreen-btn:hover,
.close-fullscreen:hover {

    background:
        rgba(115,70,255,.8);

    transform:
        scale(1.05);
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing {

    min-height: 58px;

    padding:
        10px
        15px;

    display: flex;

    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            90deg,
            rgba(110,60,255,.15),
            rgba(255,45,155,.07),
            rgba(0,0,0,.1)
        );

    border-top:
        1px solid
        rgba(255,255,255,.07);
}

.now-dot {

    width: 9px;
    height: 9px;

    flex: 0 0 auto;

    border-radius: 50%;

    background:
        #8255ff;

    box-shadow:
        0 0 14px
        #8255ff;

    animation:
        nowPulse
        1.5s infinite;
}

@keyframes nowPulse {

    0%,
    100% {
        box-shadow:
            0 0 5px
            #8255ff;
    }

    50% {
        box-shadow:
            0 0 18px
            #c06cff;
    }
}

.now-label {

    color:
        #a98cff;

    font-size:
        10px;

    font-weight:
        900;

    letter-spacing:
        .8px;

    white-space:
        nowrap;
}

.now-text {

    min-width: 0;

    font-size:
        14px;

    font-weight:
        850;

    overflow:
        hidden;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: flex;

    align-items: center;

    gap: 8px;

    margin:
        7px
        2px
        13px;

    color:
        #8d92a4;

    font-size:
        12px;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #45e6a1;

    box-shadow:
        0 0 10px
        rgba(69,230,161,.8);
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap: 11px;

    padding-bottom: 30px;
}


/* =========================================================
   CHANNEL CARD
========================================================= */

.channel {

    min-width: 0;

    padding: 9px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.075);

    cursor: pointer;

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s,
        background .2s;

    position: relative;

    overflow: hidden;
}

.channel::before {

    content: "";

    position: absolute;

    left: -100%;

    top: 0;

    width: 100%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #9c6cff,
            #ff5db8,
            transparent
        );

    transition:
        left .5s;
}

.channel:hover::before {
    left: 100%;
}

.channel:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(135,85,255,.65);

    box-shadow:
        0 12px 28px
        rgba(0,0,0,.28);
}


/* =========================================================
   ACTIVE CHANNEL
========================================================= */

.channel.active {

    border-color:
        #8b5cff;

    background:
        linear-gradient(
            145deg,
            rgba(126,75,255,.19),
            rgba(255,55,160,.07)
        );

    box-shadow:
        0 0 0 1px
        rgba(145,90,255,.15),

        0 0 25px
        rgba(126,77,255,.18);
}

.channel.active::after {

    content:
        "ĐANG XEM";

    position: absolute;

    top: 8px;

    right: 8px;

    padding:
        4px
        7px;

    border-radius: 7px;

    background:
        linear-gradient(
            135deg,
            #7548ff,
            #c33cff
        );

    color:
        white;

    font-size:
        8px;

    font-weight:
        950;

    letter-spacing:
        .4px;

    box-shadow:
        0 0 14px
        rgba(135,70,255,.45);

    animation:
        activeBadge
        2s infinite;
}

@keyframes activeBadge {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .65;
    }
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo {

    width: 100%;

    height: 78px;

    object-fit: contain;

    display: block;

    border-radius: 10px;

    background:
        radial-gradient(
            circle,
            #171821,
            #0a0b10
        );

    margin-bottom: 9px;

    transition:
        transform .25s;
}

.channel:hover .channel-logo {
    transform:
        scale(1.025);
}


/* =========================================================
   CHANNEL NAME
========================================================= */

.channel-name {

    font-size:
        13px;

    font-weight:
        800;

    line-height:
        1.3;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}

.channel-quality {

    color:
        #777c8d;

    font-size:
        10px;

    margin-top:
        4px;
}


/* =========================================================
   EMPTY
========================================================= */

.loading,
.empty {

    grid-column:
        1 / -1;

    text-align:
        center;

    padding:
        50px
        20px;

    color:
        #85899a;
}


/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.fullscreen-viewer {

    position:
        fixed;

    inset:
        0;

    width:
        100vw;

    height:
        100dvh;

    background:
        #000;

    z-index:
        999999;

    display:
        none;

    overflow:
        hidden;

    touch-action:
        manipulation;
}

.fullscreen-viewer.active {
    display:
        block;
}

.fullscreen-video {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

    background:
        #000;
}

.fullscreen-video::-webkit-media-controls {
    display:
        none !important;
}

.fullscreen-video::-webkit-media-controls-enclosure {
    display:
        none !important;
}


/* =========================================================
   FULLSCREEN TOP
========================================================= */

.fullscreen-top {

    position:
        absolute;

    left:
        0;

    right:
        0;

    top:
        0;

    padding:
        15px;

    z-index:
        10;

    display:
        flex;

    align-items:
        flex-start;

    justify-content:
        space-between;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent
        );

    opacity:
        1;

    transition:
        opacity .3s;

    pointer-events:
        none;
}

.fullscreen-top .live-title {
    pointer-events:
        none;
}

.close-fullscreen {

    pointer-events:
        auto;

    opacity:
        1;

    font-size:
        26px;
}

.fullscreen-viewer.controls-hidden
.fullscreen-top {

    opacity:
        0;

    pointer-events:
        none;
}

.fullscreen-viewer.controls-hidden
.close-fullscreen {

    pointer-events:
        none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    header {

        padding:
            8px
            9px;
    }

    .header {

        gap:
            8px;
    }

    .brand {

        gap:
            7px;
    }

    .logo {

        width:
            37px;

        height:
            37px;

        border-radius:
            11px;
    }

    .brand-text {

        font-size:
            16px;
    }

    .search {

        height:
            39px;

        border-radius:
            12px;

        padding-left:
            39px;

        font-size:
            12px;
    }

    .search-icon {

        left:
            13px;

        font-size:
            16px;
    }

    .container {

        padding:
            9px;
    }

    /*
       PLAYER CỐ ĐỊNH NGAY DƯỚI HEADER
    */

    .player-box {

        top:
            55px;

        border-radius:
            14px;

        margin-bottom:
            11px;
    }

    .video-area {

        aspect-ratio:
            16 / 9;
    }

    .now-playing {

        min-height:
            52px;

        padding:
            9px
            11px;
    }

    .now-label {

        font-size:
            9px;
    }

    .now-text {

        font-size:
            12px;
    }

    .channels {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

        gap:
            8px;
    }

    .channel {

        padding:
            7px;

        border-radius:
            12px;
    }

    .channel-logo {

        height:
            62px;

        border-radius:
            8px;

        margin-bottom:
            7px;
    }

    .channel-name {

        font-size:
            11px;
    }

    .channel-quality {

        font-size:
            9px;
    }

    .channel.active::after {

        top:
            6px;

        right:
            6px;

        padding:
            3px
            5px;

        font-size:
            7px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px) {

    .brand-text {
        display:
            none;
    }

    .logo {
        width:
            36px;

        height:
            36px;
    }

    .player-box {
        top:
            53px;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media(orientation:landscape) {

    .fullscreen-viewer {

        width:
            100vw;

        height:
            100dvh;
    }

    .fullscreen-video {

        width:
            100vw;

        height:
            100dvh;

        object-fit:
            contain;
    }

    .fullscreen-top {

        padding:
            max(
                12px,
                env(safe-area-inset-top)
            )
            max(
                12px,
                env(safe-area-inset-right)
            )
            12px
            max(
                12px,
                env(safe-area-inset-left)
            );
    }
}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(
    padding:
    env(safe-area-inset-top)
) {

    .fullscreen-viewer {

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


    <!-- PLAYER -->

    <div class="player-box">

        <div
            id="videoArea"
            class="video-area"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>


            <div class="player-info">

                <div
                    id="playerTitle"
                    class="live-title"
                >
                    KHANH TV
                </div>


                <div class="live-badge">

                    <span
                        class="live-dot"
                    ></span>

                    LIVE

                </div>

            </div>


            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

        </div>


        <!-- NOW PLAYING -->

        <div class="now-playing">

            <span class="now-dot"></span>

            <span class="now-label">
                ĐANG XEM
            </span>

            <span
                id="nowPlaying"
                class="now-text"
            >
                Chưa chọn kênh
            </span>

        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Đang tải danh sách...
        </span>

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>



<!-- =======================================================
     FULLSCREEN
======================================================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="live-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
            aria-label="Đóng"
        >
            ×
        </button>

    </div>

</div>



<script>

/* =========================================================
   VTV API BẠN CUNG CẤP
========================================================= */

const VTV_CHANNELS = [

    {
        name: "VTV1 HD",
        id: "VTV1.vn@HD",
        group: "VTV",
        url: "https://dethich.pw/vtv1/index.m3u8"
    },

    {
        name: "VTV2 HD",
        id: "VTV2.vn@HD",
        group: "VTV",
        url: "https://dethich.pw/vtv2/index.m3u8"
    },

    {
        name: "VTV3 HD",
        id: "VTV3.vn@HD",
        group: "VTV",
        url: "https://dethich.pw/vtv3/index.m3u8"
    },

    {
        name: "VTV4 HD",
        id: "VTV4.vn@HD",
        group: "VTV",
        url: "https://dethich.pw/vtv4/index.m3u8"

/* =========================================================

/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist() {

    try {

        /*
         * Lấy playlist IPTV chính
         */

        const response =
            await fetch(
                "https://iptv-org.github.io/iptv/languages/vie.m3u",
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const text =
            await response.text();


        let onlineChannels =
            parseM3U(text);


        /*
         * Xóa VTV từ playlist cũ
         * để dùng API mới
         */

        onlineChannels =
            onlineChannels.filter(
                channel =>
                    !/^VTV\d+/i.test(
                        channel.name
                    )
            );


        /*
         * Gộp:
         * VTV mới + kênh khác
         */

        channels = [
            ...VTV_CHANNELS,
            ...OTHER_CHANNELS,
            ...onlineChannels
        ];


        /*
         * Xóa URL trùng
         */

        const seen =
            new Set();

        channels =
            channels.filter(
                channel => {

                    if (
                        seen.has(
                            channel.url
                        )
                    ) {

                        return false;
                    }

                    seen.add(
                        channel.url
                    );

                    return true;
                }
            );


        setStatus(
            "Đã tải " +
            channels.length +
            " kênh"
        );


        renderChannels(
            channels
        );


    }
    catch(error) {

        console.error(error);


        /*
         * Nếu playlist chính lỗi,
         * vẫn hiển thị VTV + kênh
         * bạn cung cấp.
         */

        channels = [
            ...VTV_CHANNELS,
            ...OTHER_CHANNELS
        ];


        setStatus(
            "Đang sử dụng danh sách kênh dự phòng"
        );


        renderChannels(
            channels
        );
    }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusText.innerHTML = `

        <span
            class="status-dot"
        ></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;
}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith(
                "#EXTINF"
            )
        ) {

            const nameMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : "",

                group:
                    groupMatch
                    ? groupMatch[1]
                    : "",

                id:
                    idMatch
                    ? idMatch[1]
                    : ""
            };
        }


        else if (
            info &&
            line &&
            !line.startsWith("#")
        ) {

            result.push({

                name:
                    info.name,

                logo:
                    info.logo,

                group:
                    info.group,

                id:
                    info.id,

                url:
                    line
            });


            info = null;
        }
    }


    return result;
}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (!list.length) {

        channelsBox.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>
        `;

        return;
    }


    list.forEach(
        channel => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            if (
                currentChannel &&
                currentChannel.url ===
                    channel.url
            ) {

                item.classList.add(
                    "active"
                );
            }


            let logoHTML;


            if (channel.logo) {

                logoHTML = `

                    <img
                        class="channel-logo"
                        src="${escapeAttribute(channel.logo)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none'
                        "
                    >

                `;

            }
            else {

                logoHTML = `

                    <div
                        class="channel-logo"
                    ></div>

                `;
            }


            item.innerHTML = `

                ${logoHTML}

                <div
                    class="channel-name"
                >
                    ${escapeHtml(
                        channel.name
                    )}
                </div>

                <div
                    class="channel-quality"
                >
                    ${escapeHtml(
                        channel.group ||
                        "IPTV"
                    )}
                </div>

            `;


            item.addEventListener(
                "click",
                () =>
                    playChannel(
                        channel
                    )
            );


            channelsBox.appendChild(
                item
            );
        }
    );
}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    playerTitle.innerText =
        channel.name;


    fullscreenTitle.innerText =
        channel.name;


    /*
     * Hủy HLS cũ
     */

    destroyNormalHls();


    video.pause();


    video.removeAttribute(
        "src"
    );


    video.load();


    const url =
        channel.url;


    /*
     * HLS
     */

    if (
        isHLS(url) &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker:
                    true,

                lowLatencyMode:
                    false,

                backBufferLength:
                    30,

                maxBufferLength:
                    20,

                maxMaxBufferLength:
                    30

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );
            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.log(
                    "HLS ERROR:",
                    data
                );
            }
        );
    }


    /*
     * Safari / native HLS
     */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;

        video
            .play()
            .catch(
                () => {}
            );
    }


    /*
     * Stream khác
     */

    else {

        video.src =
            url;

        video
            .play()
            .catch(
                () => {}
            );
    }


    /*
     * Cập nhật active
     * nhưng KHÔNG scroll lên
     */

    renderChannels(
        filterChannels()
    );
}


/* =========================================================
   HLS CHECK
========================================================= */

function isHLS(url) {

    return (
        url.includes(".m3u8") ||
        url.includes("m3u8?")
    );
}


/* =========================================================
   DESTROY NORMAL HLS
========================================================= */

function destroyNormalHls() {

    if (hls) {

        try {

            hls.destroy();

        }
        catch(e) {}

        hls = null;
    }
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (!currentChannel) {

            return;
        }


        await openFullscreen();
    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen() {

    if (!currentChannel) {

        return;
    }


    video.pause();


    destroyFullscreenHls();


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenTitle.innerText =
        currentChannel.name;


    const url =
        currentChannel.url;


    /*
     * HLS
     */

    if (
        isHLS(url) &&
        Hls.isSupported()
    ) {

        fullscreenHls =
            new Hls({

                enableWorker:
                    true,

                lowLatencyMode:
                    false,

                backBufferLength:
                    30,

                maxBufferLength:
                    20
            });


        fullscreenHls
            .loadSource(url);


        fullscreenHls
            .attachMedia(
                fullscreenVideo
            );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                fullscreenVideo
                    .play()
                    .catch(
                        () => {}
                    );
            }
        );
    }


    else {

        fullscreenVideo.src =
            url;


        fullscreenVideo.load();


        fullscreenVideo
            .play()
            .catch(
                () => {}
            );
    }


    await requestWakeLock();


    /*
     * Xoay ngang nếu hỗ trợ
     */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );
        }

    }
    catch(e) {}


    showFullscreenControls();
}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();

        await closeFullscreenViewer();
    }
);


/* =========================================================
   CLOSE VIEWER
========================================================= */

async function closeFullscreenViewer() {

    fullscreenViewer
        .classList
        .remove(
            "active"
        );


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo
        .removeAttribute(
            "src"
        );


    fullscreenVideo.load();


    releaseWakeLock();


    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();
        }

    }
    catch(e) {}


    /*
     * Chạy lại player chính
     */

    if (currentChannel) {

        video
            .play()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   DESTROY FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls() {

    if (fullscreenHls) {

        try {

            fullscreenHls.destroy();

        }
        catch(e) {}

        fullscreenHls = null;
    }
}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator
        ) {

            wakeLock =
                await navigator.wakeLock
                    .request(
                        "screen"
                    );


            wakeLock.addEventListener(
                "release",
                () => {

                    console.log(
                        "Wake Lock released"
                    );
                }
            );
        }

    }
    catch(error) {

        console.log(
            "Wake Lock:",
            error
        );
    }
}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function() {

        if (
            document.visibilityState ===
                "visible" &&

            fullscreenViewer
                .classList
                .contains("active")
        ) {

            await requestWakeLock();
        }
    }
);


/* =========================================================
   RELEASE WAKE LOCK
========================================================= */

function releaseWakeLock() {

    if (wakeLock) {

        try {

            wakeLock.release();

        }
        catch(e) {}

        wakeLock = null;
    }
}


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function() {

        showFullscreenControls();
    }
);


function showFullscreenControls() {

    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            () => {

                fullscreenViewer
                    .classList
                    .add(
                        "controls-hidden"
                    );

            },
            3000
        );
}


/* =========================================================
   PLAYER CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function() {

        videoArea
            .classList
            .add(
                "controls-visible"
            );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                () => {

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );
    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        renderChannels(
            filterChannels()
        );
    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;
    }


    return channels.filter(
        channel => {

            return (

                channel.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.group
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.id
                    .toLowerCase()
                    .includes(
                        keyword
                    )
            );
        }
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(value) {

    return escapeHtml(
        value
    );
}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" &&

            fullscreenViewer
                .classList
                .contains(
                    "active"
                )
        ) {

            closeFullscreenViewer();
        }
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            fullscreenViewer
                .classList
                .contains(
                    "active"
                )
        ) {

            fullscreenViewer.style.width =
                window.innerWidth +
                "px";

            fullscreenViewer.style.height =
                window.innerHeight +
                "px";
        }
    }
);


/* =========================================================
   START
========================================================= */

loadPlaylist();
