<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:#07070b;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =====================================================
   HEADER
===================================================== */

header{

    position:sticky;

    top:0;

    z-index:1000;

    padding:10px 14px;

    background:
        rgba(8,8,13,.94);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

}


/* =====================================================
   HEADER CONTENT
===================================================== */

.header{

    max-width:1400px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:14px;

}


/* =====================================================
   KHANH TV LOGO
===================================================== */

.brand{

    display:flex;

    align-items:center;

    gap:10px;

    flex-shrink:0;

}


/* Logo */

.logo{

    position:relative;

    width:44px;

    height:44px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #6253ff 0%,
            #8b55ff 45%,
            #ff4e9c 100%
        );

    box-shadow:
        0 8px 28px
        rgba(106,82,255,.35);

    overflow:hidden;

}


/* Logo màn hình */

.logo::before{

    content:"";

    position:absolute;

    left:9px;

    top:9px;

    width:25px;

    height:18px;

    border:
        2px solid
        rgba(255,255,255,.95);

    border-radius:6px;

}


/* Logo chân */

.logo::after{

    content:"";

    position:absolute;

    left:14px;

    bottom:8px;

    width:15px;

    height:2px;

    border-radius:5px;

    background:#fff;

}


/* =====================================================
   BRAND TEXT
===================================================== */

.brand-text{

    display:flex;

    flex-direction:column;

}

.brand-name{

    font-size:20px;

    font-weight:900;

    line-height:1;

    letter-spacing:-.7px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c7c0ff 50%,
            #ff9bc8
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.brand-sub{

    margin-top:5px;

    font-size:8px;

    letter-spacing:2px;

    color:#777783;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

    position:relative;

    flex:1;

    max-width:620px;

    margin-left:auto;

}

.search{

    width:100%;

    height:45px;

    padding:
        0 45px
        0 17px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:14px;

    outline:none;

    background:
        rgba(255,255,255,.055);

    color:#fff;

    font-size:14px;

    transition:
        border .2s,
        box-shadow .2s,
        background .2s;

}

.search::placeholder{

    color:#777783;

}

.search:focus{

    background:
        rgba(255,255,255,.075);

    border-color:#7161ff;

    box-shadow:
        0 0 0 4px
        rgba(113,97,255,.10);

}

.search-icon{

    position:absolute;

    right:15px;

    top:50%;

    transform:
        translateY(-50%);

    color:#898996;

    font-size:20px;

    pointer-events:none;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    max-width:1400px;

    margin:auto;

    padding:18px;

}


/* =====================================================
   PLAYER
===================================================== */

.player-wrapper{

    margin-bottom:18px;

}

.player-box{

    position:relative;

    overflow:hidden;

    background:#000;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.45);

}

.video-container{

    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    background:#000;

    overflow:hidden;

}

video{

    display:block;

    width:100%;

    height:100%;

    object-fit:contain;

    background:#000;

}


/* =====================================================
   CONTROLS
===================================================== */

.video-controls{

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    z-index:20;

    display:flex;

    justify-content:flex-end;

    align-items:center;

    padding:
        45px 12px
        12px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.82)
        );

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease;

}


/* Hiện control */

.video-container.show-controls
.video-controls,

.video-container:hover
.video-controls{

    opacity:1;

    pointer-events:auto;

}


/* =====================================================
   FULLSCREEN BUTTON
===================================================== */

.control-button{

    width:44px;

    height:44px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:12px;

    background:
        rgba(0,0,0,.65);

    color:#fff;

    font-size:21px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    transition:.18s;

}

.control-button:hover{

    background:#6655ff;

    transform:
        scale(1.05);

}


/* =====================================================
   FULLSCREEN API
===================================================== */

.video-container:fullscreen{

    width:100vw;

    height:100vh;

    background:#000;

}

.video-container:-webkit-full-screen{

    width:100vw;

    height:100vh;

    background:#000;

}

.video-container:fullscreen video{

    width:100%;

    height:100%;

    object-fit:contain;

}

.video-container:-webkit-full-screen video{

    width:100%;

    height:100%;

    object-fit:contain;

}


/* =====================================================
   FALLBACK FULLSCREEN
===================================================== */

.player-wrapper.fallback-fullscreen{

    position:fixed;

    left:0;

    top:0;

    width:100vw;

    height:100vh;

    z-index:999999;

    margin:0;

    background:#000;

}

.player-wrapper.fallback-fullscreen
.player-box{

    width:100%;

    height:100%;

    border:0;

    border-radius:0;

    box-shadow:none;

}

.player-wrapper.fallback-fullscreen
.video-container{

    width:100%;

    height:100%;

    aspect-ratio:auto;

}


/* =====================================================
   NOW PLAYING
===================================================== */

.now-playing{

    min-height:50px;

    display:flex;

    align-items:center;

    padding:
        10px 15px;

    background:#15151d;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    font-size:14px;

    font-weight:bold;

}

.now-dot{

    width:8px;

    height:8px;

    margin-right:9px;

    border-radius:50%;

    flex-shrink:0;

    background:#55ff93;

    box-shadow:
        0 0 10px
        rgba(85,255,147,.8);

}


/* =====================================================
   STATUS
===================================================== */

.status{

    margin:
        0 2px
        14px;

    color:#858592;

    font-size:13px;

}


/* =====================================================
   CHANNEL GRID
===================================================== */

.channels{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );

    gap:12px;

}


/* =====================================================
   CHANNEL
===================================================== */

.channel{

    position:relative;

    padding:10px;

    border-radius:14px;

    background:#15151d;

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor:pointer;

    overflow:hidden;

    transition:.18s;

}

.channel:hover{

    transform:
        translateY(-3px);

    border-color:#7565ff;

    background:#1b1b25;

}

.channel.active{

    border-color:#7868ff;

    box-shadow:
        0 0 0 1px
        rgba(120,104,255,.2),

        0 8px 25px
        rgba(90,70,255,.15);

}


/* =====================================================
   VTV LABEL
===================================================== */

.channel.vtv::before{

    content:"VTV";

    position:absolute;

    right:8px;

    top:8px;

    z-index:5;

    padding:
        3px 6px;

    border-radius:6px;

    background:
        linear-gradient(
            135deg,
            #6655ff,
            #a452ff
        );

    font-size:8px;

    font-weight:bold;

}


/* =====================================================
   CHANNEL LOGO
===================================================== */

.channel-logo{

    display:block;

    width:100%;

    height:80px;

    padding:7px;

    margin-bottom:9px;

    object-fit:contain;

    border-radius:9px;

    background:#0d0d12;

}


/* =====================================================
   CHANNEL NAME
===================================================== */

.channel-name{

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty,
.loading{

    grid-column:
        1 / -1;

    text-align:center;

    padding:50px 20px;

    color:#777783;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    header{

        padding:
            9px 10px;

    }

    .header{

        flex-wrap:wrap;

        gap:9px;

    }

    .logo{

        width:39px;

        height:39px;

        border-radius:12px;

    }

    .logo::before{

        left:8px;

        top:8px;

        width:22px;

        height:16px;

    }

    .logo::after{

        left:12px;

        bottom:7px;

        width:14px;

    }

    .brand-name{

        font-size:18px;

    }

    .brand-sub{

        font-size:7px;

        letter-spacing:1.7px;

    }

    .search-box{

        order:3;

        flex-basis:100%;

        max-width:none;

    }

    .search{

        height:42px;

        border-radius:13px;

    }

    .container{

        padding:9px;

    }

    .player-box{

        border-radius:14px;

    }

    .channels{

        grid-template-columns:
            repeat(2,1fr);

        gap:8px;

    }

    .channel{

        padding:8px;

        border-radius:12px;

    }

    .channel-logo{

        height:64px;

    }

    .channel-name{

        font-size:12px;

    }

}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    orientation:landscape
) and (max-width:900px){

    /*
       Không dùng fixed ở đây.
       JS sẽ gọi Fullscreen API.
    */

    .player-wrapper{

        margin:0;

    }

    /*
       Khi video đã fullscreen
       thì trình duyệt tự xử lý
       toàn màn hình.
    */

}


/* =====================================================
   SAFE AREA
===================================================== */

@supports(
    padding:max(0px)
){

    .video-controls{

        padding-bottom:
            max(
                12px,
                env(safe-area-inset-bottom)
            );

    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header">


        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">

                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    VIETNAM LIVE TV
                </div>

            </div>

        </div>


        <div class="search-box">

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

            <div class="search-icon">
                ⌕
            </div>

        </div>


    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">


    <!-- PLAYER -->

    <div
        id="playerWrapper"
        class="player-wrapper"
    >

        <div class="player-box">


            <div
                id="videoContainer"
                class="video-container"
            >


                <video
                    id="video"
                    controls
                    playsinline
                    webkit-playsinline
                    preload="metadata"
                ></video>


                <!-- CUSTOM CONTROL -->

                <div
                    id="videoControls"
                    class="video-controls"
                >

                    <button
                        id="fullscreenButton"
                        class="control-button"
                        type="button"
                    >
                        ⛶
                    </button>

                </div>


            </div>


            <!-- NOW PLAYING -->

            <div
                id="nowPlaying"
                class="now-playing"
            >

                <span
                    class="now-dot"
                ></span>

                Chưa chọn kênh

            </div>


        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >
        Đang tải danh sách kênh...
    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải...
        </div>

    </div>


</div>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );

const playerWrapper =
    document.getElementById(
        "playerWrapper"
    );

const videoContainer =
    document.getElementById(
        "videoContainer"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );

const channelsBox =
    document.getElementById(
        "channels"
    );

const statusText =
    document.getElementById(
        "status"
    );

const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );

const searchInput =
    document.getElementById(
        "search"
    );


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];

let hls = null;

let currentChannel = null;

let wakeLock = null;

let manualFullscreen = false;

let controlsTimer = null;


/* =====================================================
   WAKE LOCK
===================================================== */

async function requestWakeLock(){

    if(
        !("wakeLock" in navigator)
    ){

        return;

    }

    try{

        if(wakeLock){

            return;

        }

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        wakeLock.addEventListener(
            "release",
            function(){

                wakeLock = null;

            }
        );


    }catch(error){

        console.log(
            "Wake Lock:",
            error
        );

    }

}


/* =====================================================
   GIỮ MÀN HÌNH SÁNG
===================================================== */

setInterval(
    async function(){

        if(
            !video.paused &&
            !video.ended
        ){

            if(!wakeLock){

                await requestWakeLock();

            }

        }

    },
    2000
);


/* =====================================================
   KHI QUAY LẠI TRANG
===================================================== */

document.addEventListener(
    "visibilitychange",
    async function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            if(
                !video.paused &&
                !video.ended
            ){

                wakeLock = null;

                await requestWakeLock();

            }

        }

    }
);


/* =====================================================
   VIDEO PLAY
===================================================== */

video.addEventListener(
    "play",
    function(){

        requestWakeLock();

    }
);


/* =====================================================
   VIDEO PAUSE
===================================================== */

video.addEventListener(
    "pause",
    async function(){

        if(wakeLock){

            try{

                await wakeLock.release();

            }catch(e){}

            wakeLock = null;

        }

    }
);


/* =====================================================
   CONTROL AUTO HIDE
===================================================== */

function showControls(){

    videoContainer.classList.add(
        "show-controls"
    );


    clearTimeout(
        controlsTimer
    );


    controlsTimer =
        setTimeout(
            function(){

                videoContainer.classList.remove(
                    "show-controls"
                );

            },
            2200
        );

}


/* =====================================================
   CHẠM VIDEO
===================================================== */

videoContainer.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            fullscreenButton
        ){

            return;

        }

        showControls();

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

async function enterFullscreen(){

    manualFullscreen = true;


    try{

        if(
            videoContainer.requestFullscreen
        ){

            await videoContainer.requestFullscreen();

        }

        else if(
            videoContainer.webkitRequestFullscreen
        ){

            videoContainer.webkitRequestFullscreen();

        }

        else{

            playerWrapper.classList.add(
                "fallback-fullscreen"
            );

        }

    }
    catch(error){

        console.log(
            "Fullscreen:",
            error
        );


        playerWrapper.classList.add(
            "fallback-fullscreen"
        );

    }


    fullscreenButton.innerHTML =
        "✕";


    await requestWakeLock();

    showControls();

}


/* =====================================================
   EXIT FULLSCREEN
===================================================== */

async function exitFullscreen(){

    manualFullscreen = false;


    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }

        else if(
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

    }
    catch(error){}


    playerWrapper.classList.remove(
        "fallback-fullscreen"
    );


    fullscreenButton.innerHTML =
        "⛶";


    showControls();

}


/* =====================================================
   FULLSCREEN BUTTON
===================================================== */

fullscreenButton.addEventListener(
    "click",
    async function(event){

        event.preventDefault();

        event.stopPropagation();


        if(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            manualFullscreen
        ){

            await exitFullscreen();

        }
        else{

            await enterFullscreen();

        }

    }
);


/* =====================================================
   FULLSCREEN CHANGE
===================================================== */

document.addEventListener(
    "fullscreenchange",
    function(){

        if(
            !document.fullscreenElement
        ){

            if(!manualFullscreen){

                playerWrapper.classList.remove(
                    "fallback-fullscreen"
                );

                fullscreenButton.innerHTML =
                    "⛶";

            }

        }

    }
);


/* =====================================================
   WEBKIT FULLSCREEN CHANGE
===================================================== */

document.addEventListener(
    "webkitfullscreenchange",
    function(){

        if(
            !document.webkitFullscreenElement
        ){

            manualFullscreen = false;

            playerWrapper.classList.remove(
                "fallback-fullscreen"
            );

            fullscreenButton.innerHTML =
                "⛶";

        }

    }
);


/* =====================================================
   XOAY NGANG
===================================================== */

async function checkOrientation(){

    const isMobile =
        window.innerWidth <= 900;


    if(!isMobile){

        return;

    }


    const landscape =
        window.matchMedia(
            "(orientation: landscape)"
        ).matches;


    if(landscape){

        /*
           Xoay ngang:
           gọi fullscreen thật.
        */

        if(
            !document.fullscreenElement &&
            !document.webkitFullscreenElement
        ){

            try{

                if(
                    videoContainer.requestFullscreen
                ){

                    await videoContainer.requestFullscreen();

                }

                else if(
                    videoContainer.webkitRequestFullscreen
                ){

                    videoContainer.webkitRequestFullscreen();

                }

                else{

                    playerWrapper.classList.add(
                        "fallback-fullscreen"
                    );

                }

            }
            catch(error){

                playerWrapper.classList.add(
                    "fallback-fullscreen"
                );

            }

        }


        await requestWakeLock();


        /*
           Ẩn control khi vừa xoay.
        */

        videoContainer.classList.remove(
            "show-controls"
        );

    }

    else{

        /*
           Xoay dọc:
           chỉ thoát fullscreen tự động
           nếu người dùng không bấm nút.
        */

        if(!manualFullscreen){

            try{

                if(
                    document.fullscreenElement
                ){

                    await document.exitFullscreen();

                }

                else if(
                    document.webkitFullscreenElement
                ){

                    document.webkitExitFullscreen();

                }

            }
            catch(e){}


            playerWrapper.classList.remove(
                "fallback-fullscreen"
            );

        }

        showControls();

    }

}


/* =====================================================
   ORIENTATION CHANGE
===================================================== */

window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            checkOrientation,
            500
        );

    }
);


window.addEventListener(
    "resize",
    function(){

        setTimeout(
            checkOrientation,
            250
        );

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            if(
                manualFullscreen
            ){

                manualFullscreen =
                    false;

            }

        }

    }
);


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist(){

    try{

        const response =
            await fetch(
                PLAYLIST
            );


        if(!response.ok){

            throw new Error(
                "Không thể tải playlist"
            );

        }


        const text =
            await response.text();


        channels =
            parseM3U(text);


        /*
           Đưa VTV lên đầu.
        */

        channels.sort(
            function(a,b){

                const av =
                    isVTV(a)
                    ? 0
                    : 1;

                const bv =
                    isVTV(b)
                    ? 0
                    : 1;

                return av - bv;

            }
        );


        statusText.innerText =
            "Đã tải "
            + channels.length
            + " kênh";


        renderChannels(
            channels
        );


    }
    catch(error){

        console.error(
            error
        );


        statusText.innerText =
            "❌ Không thể tải danh sách kênh";


        channelsBox.innerHTML = `

            <div class="empty">

                Không tải được playlist IPTV.

            </div>

        `;

    }

}


/* =====================================================
   CHECK VTV
===================================================== */

function isVTV(channel){

    return (

        channel.name
            .toUpperCase()
            .includes("VTV")

        ||

        channel.id
            .toUpperCase()
            .includes("VTV")

    );

}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text){

    const lines =
        text.split(/\r?\n/);


    const result = [];

    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(
            line.startsWith(
                "#EXTINF"
            )
        ){

            const nameMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""

            };

        }

        else if(
            info &&
            line &&
            !line.startsWith("#")
        ){

            result.push({

                name:
                    info.name,

                logo:
                    info.logo,

                id:
                    info.id,

                url:
                    line

            });


            info = null;

        }

    }


    return result;

}


/* =====================================================
   RENDER CHANNELS
===================================================== */

function renderChannels(list){

    channelsBox.innerHTML = "";


    if(!list.length){

        channelsBox.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;

    }


    list.forEach(
        function(channel){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            if(
                isVTV(channel)
            ){

                item.classList.add(
                    "vtv"
                );

            }


            if(
                currentChannel &&
                currentChannel.url ===
                channel.url
            ){

                item.classList.add(
                    "active"
                );

            }


            let logo;


            if(channel.logo){

                logo = `

                    <img
                        class="channel-logo"
                        src="${escapeHtml(
                            channel.logo
                        )}"
                        loading="lazy"
                        onerror="
                            this.style.display='none'
                        "
                    >

                `;

            }
            else{

                logo = `

                    <div
                        class="channel-logo"
                    ></div>

                `;

            }


            item.innerHTML = `

                ${logo}

                <div class="channel-name">

                    ${escapeHtml(
                        channel.name
                    )}

                </div>

            `;


            item.onclick =
                function(){

                    playChannel(
                        channel
                    );

                };


            channelsBox.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel){

    currentChannel =
        channel;


    nowPlaying.innerHTML = `

        <span class="now-dot"></span>

        ${escapeHtml(
            channel.name
        )}

    `;


    const url =
        channel.url;


    /*
       Hủy HLS cũ.
    */

    if(hls){

        hls.destroy();

        hls = null;

    }


    /*
       Dừng video cũ.
    */

    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    /*
       HLS.js
    */

    if(
        url.includes(".m3u8") &&
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:20

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            async function(){

                try{

                    await video.play();

                    await requestWakeLock();

                }
                catch(error){

                    console.log(
                        "Play:",
                        error
                    );

                }

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                console.log(
                    "HLS error:",
                    data
                );


                if(
                    data.fatal
                ){

                    if(
                        data.type ===
                        Hls.ErrorTypes
                            .NETWORK_ERROR
                    ){

                        hls.startLoad();

                    }

                    else if(
                        data.type ===
                        Hls.ErrorTypes
                            .MEDIA_ERROR
                    ){

                        hls.recoverMediaError();

                    }

                }

            }
        );

    }


    /*
       Native HLS
       Safari / iOS
    */

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            async function nativePlay(){

                video.removeEventListener(
                    "loadedmetadata",
                    nativePlay
                );


                try{

                    await video.play();

                    await requestWakeLock();

                }
                catch(error){

                    console.log(
                        error
                    );

                }

            }
        );

    }


    /*
       Stream khác
    */

    else{

        video.src =
            url;


        video.play()
            .then(
                requestWakeLock
            )
            .catch(
                function(error){

                    console.log(
                        error
                    );

                }
            );

    }


    /*
       Cập nhật active.
    */

    renderChannels(
        filterChannels()
    );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if(!keyword){

        return channels;

    }


    return channels.filter(
        function(channel){

            return channel.name
                .toLowerCase()
                .includes(
                    keyword
                );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
