<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHANH HTML → APK</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    padding:15px;
    background:#09090d;
    color:#fff;
    font-family:Arial,sans-serif;
}

.box{
    width:100%;
    max-width:800px;
    margin:auto;
    background:#141419;
    border:1px solid #292930;
    border-radius:20px;
    padding:20px;
}

h1{
    text-align:center;
    margin:5px 0;
}

.sub{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-bottom:20px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin:12px 0 6px;
}

input,textarea{
    width:100%;
    border:1px solid #33333c;
    border-radius:10px;
    background:#0c0c10;
    color:#fff;
    outline:none;
}

input{
    height:44px;
    padding:0 12px;
}

textarea{
    min-height:400px;
    padding:12px;
    resize:vertical;
    font-family:monospace;
    font-size:13px;
}

input:focus,
textarea:focus{
    border-color:#7569ff;
}

button{
    width:100%;
    height:48px;
    margin-top:12px;
    border:0;
    border-radius:11px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#796bff,#5141d9);
}

button:disabled{
    opacity:.5;
}

.preview{
    width:100%;
    height:300px;
    margin-top:12px;
    border:1px solid #333;
    border-radius:10px;
    background:white;
    display:none;
}

.progress{
    display:none;
    margin-top:20px;
}

.bar{
    height:7px;
    background:#292930;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    width:0;
    height:100%;
    background:#7569ff;
}

.status{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:8px;
}

.download{
    display:none;
    text-align:center;
    margin-top:20px;
    padding:13px;
    border-radius:10px;
    background:#22a85a;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:600px){
    .row{
        grid-template-columns:1fr;
    }

    .box{
        padding:15px;
    }

    textarea{
        min-height:300px;
    }
}
</style>
</head>

<body>

<div class="box">

<h1>📦 HTML → APK</h1>

<div class="sub">
Dán mã HTML → Build APK Android
</div>

<div class="row">

<div>
<label>Tên ứng dụng</label>

<input
id="appName"
value="KHANH TV"
>
</div>

<div>
<label>Package Name</label>

<input
id="packageName"
value="com.khanhtv.app"
>
</div>

</div>

<label>Mã HTML</label>

<textarea
id="code"
placeholder="Dán toàn bộ mã HTML vào đây..."
></textarea>

<button onclick="preview()">
👁️ XEM TRƯỚC
</button>

<iframe
id="preview"
class="preview"
sandbox="allow-scripts allow-forms allow-same-origin">
</iframe>

<button
id="build"
onclick="buildAPK()">
🚀 BUILD APK
</button>

<div
id="progress"
class="progress">

<div class="bar">
<div
id="fill"
class="fill">
</div>
</div>

<div
id="status"
class="status">
Đang chuẩn bị...
</div>

</div>

<a
id="download"
class="download">

📥 TẢI APK

</a>

</div>


<script>

const API = "/api";


function preview(){

    const code =
        document.getElementById("code").value;

    if(!code.trim()){

        alert("Hãy dán HTML!");

        return;
    }

    const frame =
        document.getElementById("preview");

    frame.style.display="block";

    frame.srcdoc=code;
}


async function buildAPK(){

    const code =
        document.getElementById("code").value;

    const appName =
        document.getElementById("appName").value.trim();

    const packageName =
        document.getElementById("packageName").value.trim();


    if(!code.trim()){

        alert("Bạn chưa dán mã HTML!");

        return;
    }


    if(!appName){

        alert("Chưa nhập tên app!");

        return;
    }


    const button =
        document.getElementById("build");

    const progress =
        document.getElementById("progress");

    const fill =
        document.getElementById("fill");

    const status =
        document.getElementById("status");

    const download =
        document.getElementById("download");


    button.disabled=true;

    progress.style.display="block";

    download.style.display="none";


    try{

        status.innerText=
            "Đang gửi mã HTML...";

        fill.style.width="15%";


        /*
         * H2APK API
         */

        const response =
            await fetch(
                API + "/build",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        mode:"html",

                        appName:appName,

                        packageName:packageName,

                        html:code

                    })
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );
        }


        const data =
            await response.json();


        /*
         * API trả ID build
         */

        const id =
            data.id ||
            data.buildId;


        if(!id){

            throw new Error(
                "Server không trả build ID"
            );
        }


        fill.style.width="30%";

        status.innerText=
            "Đang build APK...";


        await checkStatus(id);


    }
    catch(error){

        console.error(error);

        status.innerText=
            "❌ Build thất bại";

        alert(
            "Không thể kết nối server build:\n\n"
            + error.message
        );

        button.disabled=false;
    }
}


async function checkStatus(id){

    const fill =
        document.getElementById("fill");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("build");

    const download =
        document.getElementById("download");


    const timer =
        setInterval(
            async()=>{

                try{

                    const response =
                        await fetch(
                            API +
                            "/status/" +
                            id
                        );


                    const data =
                        await response.json();


                    if(
                        data.status ===
                        "building"
                    ){

                        fill.style.width="60%";

                        status.innerText=
                            "⚙️ Đang tạo APK...";

                    }


                    if(
                        data.status ===
                        "done"
                        ||
                        data.status ===
                        "completed"
                    ){

                        clearInterval(timer);


                        fill.style.width="100%";

                        status.innerText=
                            "✅ Build hoàn tất";


                        download.href =
                            API +
                            "/download/" +
                            id;


                        download.style.display=
                            "block";


                        button.disabled=false;

                    }


                    if(
                        data.status ===
                        "failed"
                    ){

                        clearInterval(timer);

                        status.innerText=
                            "❌ Build thất bại";


                        button.disabled=false;

                    }

                }
                catch(error){

                    console.error(error);

                }

            },
            1500
        );
}

</script>

</body>
</html>
