<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top,
        #17172a 0,
        #0b0b10 40%,
        #07070a 100%);
    color: #fff;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

header {

    position: sticky;
    top: 0;

    z-index: 1000;

    background:
        rgba(10,10,15,.88);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);

    padding: 12px 15px;
}

.header {

    max-width: 1400px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 18px;
}


/* =====================================================
   KHANH TV LOGO
===================================================== */

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

    flex-shrink: 0;
}

.logo-icon {

    width: 42px;
    height: 42px;

    border-radius: 13px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #6d5cff,
            #9b4dff 55%,
            #ff4da6
        );

    box-shadow:
        0 8px 25px
        rgba(121,80,255,.35);

    overflow: hidden;
}


/* logo màn hình */

.logo-icon::before {

    content: "";

    width: 24px;
    height: 18px;

    border:
        2px solid white;

    border-radius: 5px;

    position: absolute;

    top: 9px;
    left: 9px;
}


/* chân logo */

.logo-icon::after {

    content: "";

    width: 12px;
    height: 2px;

    background: white;

    position: absolute;

    left: 15px;
    bottom: 8px;

    border-radius: 5px;

    box-shadow:
        0 0 0 0 white;
}

.brand-text {

    display: flex;

    flex-direction: column;

    line-height: 1;
}

.brand-name {

    font-size: 20px;

    font-weight: 900;

    letter-spacing: -.5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #b8adff,
            #ff8ac5
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}

.brand-sub {

    font-size: 9px;

    color: #777789;

    margin-top: 5px;

    letter-spacing: 2px;

    font-weight: 600;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

    flex: 1;

    position: relative;

    max-width: 600px;

    margin-left: auto;
}

.search {

    width: 100%;

    height: 46px;

    border: 1px solid
        rgba(255,255,255,.09);

    border-radius: 15px;

    outline: none;

    background:
        rgba(255,255,255,.055);

    color: white;

    padding:
        0 48px 0 18px;

    font-size: 14px;

    transition: .25s;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.03);
}

.search::placeholder {
    color: #777785;
}

.search:focus {

    border-color:
        rgba(132,111,255,.75);

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 0 4px
        rgba(111,91,255,.09);
}

.search-icon {

    position: absolute;

    right: 16px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #858598;

    pointer-events: none;

    font-size: 18px;
}


/* =====================================================
   MAIN
===================================================== */

.container {

    max-width: 1400px;

    margin: auto;

    padding: 18px;
}


/* =====================================================
   PLAYER
===================================================== */

.player-wrapper {

    position: sticky;

    top: 72px;

    z-index: 900;

    margin-bottom: 18px;
}

.player-box {

    background: #000;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);
}

.video-container {

    position: relative;

    width: 100%;

    background: #000;

    aspect-ratio: 16 / 9;
}

video {

    width: 100%;

    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}


/* =====================================================
   NOW PLAYING
===================================================== */

.now-playing {

    min-height: 50px;

    display: flex;

    align-items: center;

    padding:
        12px 16px;

    background:
        linear-gradient(
            90deg,
            #15151d,
            #111117
        );

    font-size: 15px;

    font-weight: 700;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}

.now-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #65ff9a;

    margin-right: 10px;

    box-shadow:
        0 0 10px
        rgba(101,255,154,.7);
}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: flex;

    align-items: center;

    gap: 8px;

    margin:
        5px 2px 14px;

    color: #898995;

    font-size: 13px;
}


/* =====================================================
   CHANNEL GRID
===================================================== */

.channels {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );

    gap: 12px;
}


/* =====================================================
   CHANNEL CARD
===================================================== */

.channel {

    position: relative;

    background:
        rgba(22,22,30,.9);

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius: 15px;

    padding: 10px;

    cursor: pointer;

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;

    overflow: hidden;
}

.channel:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(120,103,255,.7);

    background:
        #1a1a24;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.25);
}

.channel:active {

    transform:
        scale(.98);
}

.channel.active {

    border-color:
        #7968ff;

    box-shadow:
        0 0 0 1px
        rgba(121,104,255,.2),
        0 10px 30px
        rgba(90,70,255,.18);
}


/* VTV badge */

.channel.vtv::before {

    content: "VTV";

    position: absolute;

    top: 8px;
    right: 8px;

    z-index: 2;

    padding:
        3px 6px;

    border-radius: 6px;

    font-size: 9px;

    font-weight: 800;

    background:
        rgba(100,80,255,.9);

    color: white;
}


/* =====================================================
   LOGO CHANNEL
===================================================== */

.channel-logo {

    width: 100%;

    height: 80px;

    object-fit: contain;

    display: block;

    background:
        radial-gradient(
            circle,
            #181820,
            #0d0d12
        );

    border-radius: 10px;

    margin-bottom: 9px;

    padding: 7px;
}

.channel-name {

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #eeeef3;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty,
.loading {

    grid-column:
        1 / -1;

    text-align: center;

    padding: 50px 20px;

    color: #777784;
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 901px) {

    .player-wrapper {

        top: 71px;

        width: 72%;

        margin-left: auto;

        margin-right: auto;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    header {

        padding: 9px 10px;
    }

    .header {

        gap: 9px;

        flex-wrap: wrap;
    }

    .brand {

        width: auto;
    }

    .logo-icon {

        width: 38px;
        height: 38px;

        border-radius: 11px;
    }

    .logo-icon::before {

        width: 21px;
        height: 16px;

        left: 8px;
        top: 8px;
    }

    .logo-icon::after {

        left: 13px;
        bottom: 7px;
    }

    .brand-name {

        font-size: 18px;
    }

    .brand-sub {

        font-size: 8px;
    }

    .search-box {

        order: 3;

        flex-basis: 100%;

        max-width: none;
    }

    .search {

        height: 42px;

        border-radius: 13px;
    }

    .container {

        padding: 9px;
    }

    .player-wrapper {

        top: 106px;

        margin-left: -9px;

        margin-right: -9px;
    }

    .player-box {

        border-radius: 0;

        border-left: 0;

        border-right: 0;
    }

    .video-container {

        aspect-ratio: 16 / 9;
    }

    .now-playing {

        padding:
            10px 13px;

        min-height: 45px;

        font-size: 14px;
    }

    .channels {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 8px;
    }

    .channel {

        padding: 8px;

        border-radius: 12px;
    }

    .channel-logo {

        height: 64px;

        border-radius: 8px;

        margin-bottom: 7px;
    }

    .channel-name {

        font-size: 12px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 380px) {

    .brand-name {

        font-size: 16px;
    }

    .channels {

        gap: 6px;
    }

    .channel-logo {

        height: 58px;
    }

}


/* =====================================================
   FULLSCREEN
===================================================== */

video:fullscreen {

    width: 100vw;

    height: 100vh;

    background: #000;

    object-fit: contain;
}

video:-webkit-full-screen {

    width: 100vw;

    height: 100vh;

    background: #000;

    object-fit: contain;
}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo-icon"></div>

            <div class="brand-text">

                <div class="brand-name">
                    KHANH TV
                </div>

                <div class="brand-sub">
                    VIETNAM LIVE TV
                </div>

            </div>

        </div>


        <div class="search-box">

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

            <div class="search-icon">
                ⌕
            </div>

        </div>

    </div>

</header>



<!-- =====================================================
     CONTENT
===================================================== -->

<div class="container">


    <!-- PLAYER -->

    <div class="player-wrapper">

        <div class="player-box">

            <div
                id="videoContainer"
                class="video-container"
            >

                <video
                    id="video"
                    controls
                    playsinline
                    webkit-playsinline
                    preload="metadata"
                ></video>

            </div>


            <div
                id="nowPlaying"
                class="now-playing"
            >

                <span class="now-dot"></span>

                Chưa chọn kênh

            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        Đang tải danh sách kênh...

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải...
        </div>

    </div>


</div>



<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");


/* =====================================================
   VARIABLES
===================================================== */

let channels = [];

let hls = null;

let currentChannel = null;

let wakeLock = null;


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist() {

    try {

        const response =
            await fetch(PLAYLIST);

        if (!response.ok) {

            throw new Error(
                "Không thể tải playlist"
            );

        }

        const text =
            await response.text();

        channels =
            parseM3U(text);


        /*
         * Đưa toàn bộ VTV lên đầu
         */

        channels.sort(
            (a, b) => {

                const av =
                    isVTV(a) ? 0 : 1;

                const bv =
                    isVTV(b) ? 0 : 1;

                return av - bv;

            }
        );


        statusText.innerText =
            `Đã tải ${channels.length} kênh`;

        renderChannels(channels);


    } catch (error) {

        console.error(error);

        statusText.innerText =
            "❌ Không thể tải danh sách kênh";

        channelsBox.innerHTML = `

            <div class="empty">

                Không tải được playlist IPTV.

            </div>

        `;

    }

}


/* =====================================================
   CHECK VTV
===================================================== */

function isVTV(channel) {

    return (

        channel.name
            .toUpperCase()
            .includes("VTV")

        ||

        channel.id
            .toUpperCase()
            .includes("VTV")

    );

}


/* =====================================================
   PARSE M3U
===================================================== */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith("#EXTINF")
        ) {

            const nameMatch =
                line.match(/,(.*)$/);


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""

            };

        }


        else if (

            info &&

            line &&

            !line.startsWith("#")

        ) {

            result.push({

                name:
                    info.name,

                logo:
                    info.logo,

                id:
                    info.id,

                url:
                    line

            });

            info = null;

        }

    }


    return result;

}


/* =====================================================
   RENDER CHANNELS
===================================================== */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (!list.length) {

        channelsBox.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;

    }


    list.forEach(channel => {


        const item =
            document.createElement("div");


        item.className =
            "channel";


        if (isVTV(channel)) {

            item.classList.add("vtv");

        }


        if (

            currentChannel &&

            currentChannel.url ===
            channel.url

        ) {

            item.classList.add("active");

        }


        const logo =
            channel.logo
            ?

            `

            <img

                class="channel-logo"

                src="${escapeHtml(
                    channel.logo
                )}"

                loading="lazy"

                onerror="
                    this.style.display='none'
                "

            >

            `

            :

            `

            <div
                class="channel-logo"
            ></div>

            `;


        item.innerHTML = `

            ${logo}

            <div class="channel-name">

                ${escapeHtml(
                    channel.name
                )}

            </div>

        `;


        item.onclick = () => {

            playChannel(channel);

        };


        channelsBox.appendChild(item);

    });

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerHTML = `

        <span class="now-dot"></span>

        ${escapeHtml(channel.name)}

    `;


    const url =
        channel.url;


    /*
     * Hủy HLS cũ
     */

    if (hls) {

        hls.destroy();

        hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    /*
     * HLS.JS
     */

    if (

        url.includes(".m3u8") &&

        Hls.isSupported()

    ) {


        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: true,

                backBufferLength: 30,

                maxBufferLength: 20

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                try {

                    await video.play();

                    await requestWakeLock();

                }

                catch (error) {

                    console.log(
                        "Autoplay:",
                        error
                    );

                }

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.log(
                    "HLS ERROR:",
                    data
                );


                /*
                 * Thử tải lại nếu lỗi
                 */

                if (
                    data.fatal
                ) {

                    switch (
                        data.type
                    ) {

                        case Hls.ErrorTypes
                            .NETWORK_ERROR:

                            console.log(
                                "Thử tải lại stream..."
                            );

                            hls.startLoad();

                            break;


                        case Hls.ErrorTypes
                            .MEDIA_ERROR:

                            hls.recoverMediaError();

                            break;


                        default:

                            hls.destroy();

                            break;

                    }

                }

            }
        );

    }


    /*
     * Native HLS
     */

    else if (

        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )

    ) {

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            async function playNative() {

                video.removeEventListener(
                    "loadedmetadata",
                    playNative
                );


                try {

                    await video.play();

                    await requestWakeLock();

                }

                catch (error) {

                    console.log(error);

                }

            }
        );

    }


    /*
     * Stream khác
     */

    else {

        video.src =
            url;


        video.play()
            .then(
                requestWakeLock
            )
            .catch(
                error =>
                    console.log(error)
            );

    }


    /*
     * Cập nhật active
     */

    renderChannels(
        filterChannels()
    );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;

    }


    return channels.filter(
        channel =>

            channel.name
                .toLowerCase()
                .includes(keyword)

    );

}


/* =====================================================
   WAKE LOCK
   GIỮ MÀN HÌNH SÁNG
===================================================== */

async function requestWakeLock() {

    try {

        if (
            !("wakeLock" in navigator)
        ) {

            console.log(
                "Trình duyệt không hỗ trợ Wake Lock"
            );

            return;

        }


        if (wakeLock) {

            return;

        }


        wakeLock =
            await navigator.wakeLock
                .request("screen");


        console.log(
            "Wake Lock: ON"
        );


        wakeLock.addEventListener(
            "release",
            () => {

                console.log(
                    "Wake Lock: RELEASED"
                );

                wakeLock =
                    null;

            }
        );


    }

    catch (error) {

        console.log(
            "Wake Lock error:",
            error
        );

        wakeLock =
            null;

    }

}


/* =====================================================
   RELEASE WAKE LOCK
===================================================== */

async function releaseWakeLock() {

    try {

        if (wakeLock) {

            await wakeLock.release();

            wakeLock =
                null;

        }

    }

    catch (error) {

        console.log(error);

        wakeLock =
            null;

    }

}


/* =====================================================
   VIDEO PLAY
===================================================== */

video.addEventListener(
    "play",
    async () => {

        await requestWakeLock();

    }
);


/* =====================================================
   VIDEO PAUSE
===================================================== */

video.addEventListener(
    "pause",
    async () => {

        await releaseWakeLock();

    }
);


/* =====================================================
   VIDEO ENDED
===================================================== */

video.addEventListener(
    "ended",
    async () => {

        await releaseWakeLock();

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

document.addEventListener(
    "fullscreenchange",
    async () => {

        if (!video.paused) {

            await requestWakeLock();

        }

    }
);


document.addEventListener(
    "webkitfullscreenchange",
    async () => {

        if (!video.paused) {

            await requestWakeLock();

        }

    }
);


/* =====================================================
   KHI QUAY LẠI TRANG
===================================================== */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (

            document.visibilityState
            === "visible"

            &&

            !video.paused

        ) {

            /*
             * Android có thể tự release
             * Wake Lock khi fullscreen.
             */

            wakeLock =
                null;

            await requestWakeLock();

        }

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadPlaylist();

</script>

</body>
</html>
