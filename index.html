<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 15% -10%,
            rgba(112, 67, 255, .18),
            transparent 35%
        ),
        radial-gradient(
            circle at 95% 10%,
            rgba(255, 40, 150, .13),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #050509 0%,
            #080810 45%,
            #050508 100%
        );

    color: white;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {

    position: sticky;

    top: 0;

    z-index: 1000;

    width: 100%;

    padding:
        9px
        max(12px, env(safe-area-inset-right))
        9px
        max(12px, env(safe-area-inset-left));

    background:
        linear-gradient(
            180deg,
            rgba(5,5,11,.97),
            rgba(7,7,14,.90)
        );

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.header {

    width: 100%;

    max-width: 1450px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 12px;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 8px;

    min-width: max-content;

    flex-shrink: 0;

    user-select: none;
}

.logo {

    position: relative;

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #5425ff 0%,
            #8d32ff 42%,
            #ff3183 100%
        );

    box-shadow:
        0 0 0 1px rgba(255,255,255,.12) inset,
        0 8px 30px rgba(116,49,255,.35),
        0 0 30px rgba(255,43,137,.10);

    overflow: hidden;
}

.logo::before {

    content: "";

    width: 21px;
    height: 15px;

    border:
        3px solid white;

    border-radius: 5px;

    position: absolute;

    box-shadow:
        0 0 10px rgba(255,255,255,.35);
}

.logo::after {

    content: "";

    width: 10px;
    height: 3px;

    background: white;

    border-radius: 20px;

    position: absolute;

    bottom: 7px;
}

.brand-text {

    font-size: 19px;

    font-weight: 950;

    letter-spacing: .5px;

    white-space: nowrap;

    background:
        linear-gradient(
            90deg,
            #ffffff 0%,
            #b58aff 25%,
            #ff5cb2 50%,
            #9f75ff 75%,
            #ffffff 100%
        );

    background-size: 300% auto;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        titleGradient 5s linear infinite;

    text-shadow:
        0 0 20px rgba(149,90,255,.15);
}

@keyframes titleGradient {

    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 300% center;
    }
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap {

    flex: 1;

    min-width: 0;

    position: relative;
}

.search-icon {

    position: absolute;

    left: 14px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #9698ad;

    font-size: 19px;

    line-height: 1;

    pointer-events: none;

    z-index: 2;
}

.search {

    width: 100%;

    height: 43px;

    padding:
        0 15px 0 42px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 14px;

    outline: none;

    color: white;

    font-size: 13px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 5px 20px rgba(0,0,0,.15);

    transition:
        .25s ease;
}

.search::placeholder {
    color: #777a8e;
}

.search:focus {

    border-color:
        rgba(145,91,255,.85);

    background:
        linear-gradient(
            135deg,
            rgba(130,75,255,.10),
            rgba(255,255,255,.04)
        );

    box-shadow:
        0 0 0 3px rgba(115,61,255,.10),
        0 0 30px rgba(122,70,255,.16);
}


/* =========================================================
   MAIN
========================================================= */

.container {

    width: 100%;

    max-width: 1450px;

    margin: auto;

    padding:
        15px
        max(15px, env(safe-area-inset-right))
        45px
        max(15px, env(safe-area-inset-left));
}


/* =========================================================
   PLAYER - STICKY
========================================================= */

.player-box {

    position: sticky;

    top: 68px;

    z-index: 500;

    width: 100%;

    margin-bottom: 15px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(2,2,7,.95);

    border:
        1px solid rgba(255,255,255,.09);

    box-shadow:
        0 20px 55px rgba(0,0,0,.50),
        0 0 40px rgba(93,45,255,.06);

    backdrop-filter: blur(22px);

    -webkit-backdrop-filter: blur(22px);
}


/* =========================================================
   VIDEO
========================================================= */

.video-area {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #171827,
            #000 70%
        );
}

video {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}

video::-webkit-media-controls {
    display: none !important;
}

video::-webkit-media-controls-enclosure {
    display: none !important;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info {

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    padding: 14px;

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.78),
            rgba(0,0,0,.25),
            transparent
        );

    opacity: 0;

    transition:
        opacity .25s;

    z-index: 5;
}

.video-area.controls-visible .player-info {
    opacity: 1;
}

.live-title {

    max-width: 70%;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 14px;

    font-weight: 850;

    text-shadow:
        0 2px 12px #000;
}

.live-badge {

    display: flex;

    align-items: center;

    gap: 6px;

    padding:
        6px 10px;

    border-radius: 20px;

    background:
        rgba(255,40,80,.14);

    border:
        1px solid rgba(255,70,110,.32);

    color: #ff7691;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: .4px;

    backdrop-filter: blur(10px);
}

.live-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #ff315b;

    box-shadow:
        0 0 12px #ff315b;

    animation:
        livePulse 1.4s infinite;
}

@keyframes livePulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .4;
        transform: scale(.75);
    }
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn,
.close-fullscreen {

    position: absolute;

    width: 42px;

    height: 42px;

    border: 0;

    border-radius: 13px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    background:
        rgba(15,15,24,.78);

    border:
        1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(14px);

    -webkit-backdrop-filter: blur(14px);

    cursor: pointer;

    font-size: 21px;

    opacity: 0;

    pointer-events: none;

    transition:
        .2s ease;

    z-index: 20;
}

.fullscreen-btn {

    right: 12px;

    bottom: 12px;
}

.close-fullscreen {

    top: 14px;

    right: 14px;

    font-size: 27px;
}

.fullscreen-btn:hover,
.close-fullscreen:hover {

    background:
        linear-gradient(
            135deg,
            #6539ff,
            #e73591
        );

    box-shadow:
        0 8px 25px rgba(105,54,255,.30);

    transform:
        scale(1.05);
}

.fullscreen-btn:active,
.close-fullscreen:active {

    transform:
        scale(.93);
}

.video-area.controls-visible .fullscreen-btn {

    opacity: 1;

    pointer-events: auto;
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing {

    min-height: 55px;

    padding:
        11px 15px;

    display: flex;

    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            90deg,
            rgba(101,54,255,.16),
            rgba(255,40,150,.07),
            rgba(255,255,255,.015)
        );

    border-top:
        1px solid rgba(255,255,255,.065);
}

.now-dot {

    width: 8px;

    height: 8px;

    flex: 0 0 auto;

    border-radius: 50%;

    background:
        #8a62ff;

    box-shadow:
        0 0 13px #8a62ff;

    animation:
        nowPulse 1.8s infinite;
}

@keyframes nowPulse {

    0%,
    100% {
        box-shadow:
            0 0 7px #8a62ff;
    }

    50% {
        box-shadow:
            0 0 20px #a984ff;
    }
}

.now-text {

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;

    font-weight: 850;

    color: #f5f3ff;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: flex;

    align-items: center;

    gap: 8px;

    margin:
        7px 2px 13px;

    color: #9195a9;

    font-size: 12px;

    font-weight: 600;
}

.status-dot {

    width: 7px;

    height: 7px;

    flex: 0 0 auto;

    border-radius: 50%;

    background:
        #45e6a1;

    box-shadow:
        0 0 11px rgba(69,230,161,.75);
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(175px, 1fr));

    gap: 11px;

    position: relative;

    z-index: 1;
}


/* =========================================================
   CHANNEL
========================================================= */

.channel {

    position: relative;

    min-width: 0;

    padding: 9px;

    overflow: hidden;

    cursor: pointer;

    border-radius: 16px;

    border:
        1px solid rgba(255,255,255,.075);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.022)
        );

    box-shadow:
        0 5px 18px rgba(0,0,0,.12);

    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.channel::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(120,70,255,.14),
            transparent 45%,
            rgba(255,40,150,.08)
        );

    opacity: 0;

    transition:
        opacity .2s;

    pointer-events: none;
}

.channel:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(139,91,255,.72);

    box-shadow:
        0 14px 32px rgba(0,0,0,.30),
        0 0 30px rgba(113,62,255,.10);
}

.channel:hover::before {
    opacity: 1;
}

.channel:active {
    transform:
        scale(.975);
}

.channel.active {

    border-color:
        #8b5cff;

    background:
        linear-gradient(
            145deg,
            rgba(115,65,255,.22),
            rgba(255,45,145,.08)
        );

    box-shadow:
        0 0 0 1px rgba(135,91,255,.15) inset,
        0 0 30px rgba(117,67,255,.20);
}

.channel.active::after {

    content:
        "● ĐANG XEM";

    position: absolute;

    top: 8px;

    right: 8px;

    padding:
        4px 7px;

    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #6940ff,
            #a43cff
        );

    color: white;

    font-size: 8px;

    font-weight: 900;

    letter-spacing: .2px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.30);
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo {

    width: 100%;

    height: 78px;

    display: block;

    object-fit: contain;

    margin-bottom: 9px;

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #10111a,
            #08090e
        );

    border:
        1px solid rgba(255,255,255,.045);

    transition:
        transform .2s,
        filter .2s;
}

.channel:hover .channel-logo {

    transform:
        scale(1.025);

    filter:
        brightness(1.08);
}

.channel-name {

    font-size: 13px;

    font-weight: 800;

    line-height: 1.3;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #f3f2fa;
}

.channel-quality {

    margin-top: 4px;

    color: #777b8e;

    font-size: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   LOADING / EMPTY
========================================================= */

.loading,
.empty {

    grid-column: 1 / -1;

    padding:
        50px 20px;

    text-align: center;

    color: #85899d;

    border:
        1px solid rgba(255,255,255,.055);

    border-radius: 18px;

    background:
        rgba(255,255,255,.025);
}


/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.fullscreen-viewer {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100dvh;

    display: none;

    overflow: hidden;

    background: #000;

    z-index: 999999;

    touch-action: manipulation;
}

.fullscreen-viewer.active {
    display: block;
}

.fullscreen-video {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    background: #000;
}

.fullscreen-video::-webkit-media-controls {
    display: none !important;
}

.fullscreen-video::-webkit-media-controls-enclosure {
    display: none !important;
}

.fullscreen-top {

    position: absolute;

    left: 0;

    right: 0;

    top: 0;

    padding: 15px;

    z-index: 10;

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.72),
            transparent
        );

    opacity: 1;

    transition:
        opacity .3s;

    pointer-events: none;
}

.fullscreen-top .live-title {
    pointer-events: none;
}

.close-fullscreen {

    pointer-events: auto;

    opacity: 1;
}

.fullscreen-viewer.controls-hidden .fullscreen-top {

    opacity: 0;

    pointer-events: none;
}

.fullscreen-viewer.controls-hidden .close-fullscreen {

    pointer-events: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 600px) {

    header {

        padding:
            7px
            max(8px, env(safe-area-inset-right))
            7px
            max(8px, env(safe-area-inset-left));
    }

    .header {

        gap: 7px;
    }

    .brand {

        gap: 6px;
    }

    .logo {

        width: 36px;

        height: 36px;

        border-radius: 11px;
    }

    .brand-text {

        display: block;

        font-size: 15px;

        letter-spacing: .25px;
    }

    .search {

        height: 39px;

        padding-left: 37px;

        font-size: 12px;

        border-radius: 12px;
    }

    .search-icon {

        left: 12px;

        font-size: 17px;
    }


    /* PLAYER */

    .container {

        padding:
            9px
            max(9px, env(safe-area-inset-right))
            30px
            max(9px, env(safe-area-inset-left));
    }

    .player-box {

        top: 52px;

        border-radius: 15px;

        margin-bottom: 11px;

        box-shadow:
            0 15px 40px rgba(0,0,0,.55);
    }

    .video-area {

        aspect-ratio: 16 / 9;
    }

    .now-playing {

        min-height: 48px;

        padding:
            9px 11px;
    }

    .now-text {

        font-size: 11.5px;
    }

    .status {

        margin:
            5px 2px 10px;

        font-size: 10.5px;
    }


    /* CHANNEL */

    .channels {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .channel {

        padding: 7px;

        border-radius: 13px;
    }

    .channel-logo {

        height: 62px;

        border-radius: 9px;

        margin-bottom: 7px;
    }

    .channel-name {

        font-size: 11.5px;
    }

    .channel-quality {

        font-size: 9px;

        margin-top: 3px;
    }

    .channel.active::after {

        top: 6px;

        right: 6px;

        padding:
            3px 5px;

        font-size: 7px;
    }
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width: 380px) {

    /*
       KHÔNG ẨN KHANH TV
    */

    .brand-text {

        display: block;

        font-size: 13px;

        letter-spacing: 0;
    }

    .logo {

        width: 34px;

        height: 34px;

        border-radius: 10px;
    }

    .brand {

        gap: 5px;
    }

    .header {

        gap: 6px;
    }

    .search {

        height: 37px;

        padding-left: 35px;

        font-size: 11px;
    }

    .search-icon {

        left: 10px;

        font-size: 16px;
    }

    .channels {

        gap: 7px;
    }

    .channel-logo {

        height: 58px;
    }
}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media(max-width: 330px) {

    .brand-text {
        font-size: 11px;
    }

    .logo {
        width: 31px;
        height: 31px;
    }

    .search {
        font-size: 10px;
    }
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width: 601px) {

    .channels {

        grid-template-columns:
            repeat(auto-fill, minmax(190px, 1fr));
    }
}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media(min-width: 1100px) {

    .channels {

        grid-template-columns:
            repeat(auto-fill, minmax(205px, 1fr));
    }
}


/* =========================================================
   FULLSCREEN PORTRAIT
========================================================= */

@media(orientation: portrait) {

    .fullscreen-viewer {

        width: 100vw;

        height: 100dvh;
    }

    .fullscreen-video {

        width: 100vw;

        height: 100dvh;

        object-fit: contain;
    }
}


/* =========================================================
   FULLSCREEN LANDSCAPE
========================================================= */

@media(orientation: landscape) {

    .fullscreen-viewer {

        width: 100vw;

        height: 100dvh;
    }

    .fullscreen-video {

        width: 100vw;

        height: 100dvh;

        object-fit: contain;
    }

    .fullscreen-top {

        padding:
            max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            12px
            max(12px, env(safe-area-inset-left));
    }
}


/* =========================================================
   SAFE AREA
========================================================= */

@supports (padding: env(safe-area-inset-top)) {

    .fullscreen-viewer {

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }
}

</style>
</head>

<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>


        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


    <!-- PLAYER -->

    <div class="player-box">

        <div
            id="videoArea"
            class="video-area"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>


            <div class="player-info">

                <div
                    id="playerTitle"
                    class="live-title"
                >
                    KHANH TV
                </div>


                <div class="live-badge">

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>


            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

        </div>


        <div class="now-playing">

            <span class="now-dot"></span>

            <span
                id="nowPlaying"
                class="now-text"
            >
                Chưa chọn kênh
            </span>

        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Đang tải danh sách...
        </span>

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>


<!-- =========================================================
     FULLSCREEN VIEWER
========================================================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="live-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
            aria-label="Đóng"
        >
            ×
        </button>

    </div>

</div>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const fullscreenVideo =
    document.getElementById("fullscreenVideo");

const videoArea =
    document.getElementById("videoArea");

const fullscreenViewer =
    document.getElementById("fullscreenViewer");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeFullscreen =
    document.getElementById("closeFullscreen");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const playerTitle =
    document.getElementById("playerTitle");

const fullscreenTitle =
    document.getElementById("fullscreenTitle");

const searchInput =
    document.getElementById("search");


/* =========================================================
   VARIABLES
========================================================= */

let channels = [];

let currentChannel = null;

let hls = null;

let fullscreenHls = null;

let wakeLock = null;

let controlsTimer = null;

let fullscreenControlsTimer = null;


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(
                PLAYLIST,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        channels =
            parseM3U(text);


        /* VTV LÊN ĐẦU */

        channels.sort((a, b) => {

            const av =
                /^VTV\d+/i.test(a.name);

            const bv =
                /^VTV\d+/i.test(b.name);

            if (av && !bv)
                return -1;

            if (!av && bv)
                return 1;

            return 0;

        });


        setStatus(
            "Đã tải " +
            channels.length +
            " kênh"
        );


        renderChannels(
            channels
        );


    }
    catch (error) {

        console.error(error);

        setStatus(
            "Không thể tải danh sách kênh"
        );


        channelsBox.innerHTML = `

            <div class="empty">

                ❌ Không tải được playlist IPTV.

                <br><br>

                Hãy kiểm tra kết nối mạng.

            </div>

        `;
    }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusText.innerHTML = `

        <span class="status-dot"></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;
}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text) {

    const lines =
        text.split(/\r?\n/);

    const result = [];

    let info = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            line.startsWith("#EXTINF")
        ) {

            const nameMatch =
                line.match(/,(.*)$/);


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ? nameMatch[1].trim()
                    : "Kênh không tên",

                logo:
                    logoMatch
                    ? logoMatch[1]
                    : "",

                group:
                    groupMatch
                    ? groupMatch[1]
                    : "",

                id:
                    idMatch
                    ? idMatch[1]
                    : ""

            };

        }


        else if (
            info &&
            line &&
            !line.startsWith("#")
        ) {

            result.push({

                name:
                    info.name,

                logo:
                    info.logo,

                group:
                    info.group,

                id:
                    info.id,

                url:
                    line

            });


            info = null;
        }
    }


    return result;
}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list) {

    channelsBox.innerHTML = "";


    if (!list.length) {

        channelsBox.innerHTML = `

            <div class="empty">

                Không tìm thấy kênh.

            </div>

        `;

        return;
    }


    list.forEach(channel => {

        const item =
            document.createElement("div");


        item.className =
            "channel";


        if (
            currentChannel &&
            currentChannel.url === channel.url
        ) {

            item.classList.add(
                "active"
            );
        }


        const logoHTML =
            channel.logo

            ?

            `

            <img
                class="channel-logo"
                src="${escapeAttribute(channel.logo)}"
                loading="lazy"
                onerror="
                    this.style.display='none'
                "
            >

            `

            :

            `

            <div
                class="channel-logo"
            ></div>

            `;


        item.innerHTML = `

            ${logoHTML}

            <div class="channel-name">

                ${escapeHtml(channel.name)}

            </div>

            <div class="channel-quality">

                ${escapeHtml(
                    channel.group || "IPTV"
                )}

            </div>

        `;


        item.addEventListener(
            "click",
            () => playChannel(channel)
        );


        channelsBox.appendChild(
            item
        );

    });
}


/* =========================================================
   PLAY NORMAL VIDEO
========================================================= */

function playChannel(channel) {

    currentChannel =
        channel;


    nowPlaying.innerText =
        channel.name;


    playerTitle.innerText =
        channel.name;


    fullscreenTitle.innerText =
        channel.name;


    destroyNormalHls();


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    const url =
        channel.url;


    if (
        isHLS(url) &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker:
                    true,

                lowLatencyMode:
                    false,

                backBufferLength:
                    30,

                maxBufferLength:
                    20

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (event, data) => {

                console.log(
                    "HLS:",
                    data
                );

            }
        );

    }


    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;

        video
            .play()
            .catch(
                () => {}
            );

    }


    else {

        video.src =
            url;

        video
            .play()
            .catch(
                () => {}
            );

    }


    renderChannels(
        filterChannels()
    );
}


/* =========================================================
   HLS CHECK
========================================================= */

function isHLS(url) {

    return (

        url.includes(".m3u8") ||

        url.includes("m3u8?")

    );
}


/* =========================================================
   NORMAL HLS DESTROY
========================================================= */

function destroyNormalHls() {

    if (hls) {

        try {

            hls.destroy();

        }
        catch(e) {}

        hls = null;
    }
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (!currentChannel) {

            return;
        }


        await openFullscreen();

    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen() {

    if (!currentChannel) {

        return;
    }


    video.pause();


    destroyFullscreenHls();


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenTitle.innerText =
        currentChannel.name;


    const url =
        currentChannel.url;


    if (
        isHLS(url) &&
        Hls.isSupported()
    ) {

        fullscreenHls =
            new Hls({

                enableWorker:
                    true,

                lowLatencyMode:
                    false,

                backBufferLength:
                    30,

                maxBufferLength:
                    20

            });


        fullscreenHls.loadSource(
            url
        );


        fullscreenHls.attachMedia(
            fullscreenVideo
        );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                fullscreenVideo
                    .play()
                    .catch(
                        () => {}
                    );

            }
        );

    }


    else {

        fullscreenVideo.src =
            url;

        fullscreenVideo.load();

        fullscreenVideo
            .play()
            .catch(
                () => {}
            );
    }


    await requestWakeLock();


    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );
        }

    }
    catch(e) {

        console.log(
            "Orientation lock không được hỗ trợ"
        );

    }


    showFullscreenControls();
}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    async function(e) {

        e.preventDefault();

        e.stopPropagation();

        await closeFullscreenViewer();

    }
);


/* =========================================================
   CLOSE FUNCTION
========================================================= */

async function closeFullscreenViewer() {

    fullscreenViewer
        .classList
        .remove("active");


    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo
        .removeAttribute(
            "src"
        );


    fullscreenVideo.load();


    releaseWakeLock();


    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    }
    catch(e) {}


    if (currentChannel) {

        video
            .play()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   DESTROY FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls() {

    if (fullscreenHls) {

        try {

            fullscreenHls.destroy();

        }
        catch(e) {}

        fullscreenHls = null;
    }
}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator
        ) {

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );


            wakeLock.addEventListener(
                "release",
                () => {

                    console.log(
                        "Wake Lock released"
                    );

                }
            );
        }

    }
    catch(error) {

        console.log(
            "Wake Lock:",
            error
        );

    }
}


/* =========================================================
   VISIBILITY CHANGE
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (

            document.visibilityState ===
            "visible"

            &&

            fullscreenViewer
                .classList
                .contains("active")

        ) {

            await requestWakeLock();

        }

    }
);


/* =========================================================
   RELEASE WAKE LOCK
========================================================= */

function releaseWakeLock() {

    if (wakeLock) {

        try {

            wakeLock.release();

        }
        catch(e) {}

        wakeLock = null;
    }
}


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function() {

        showFullscreenControls();

    }
);


function showFullscreenControls() {

    fullscreenViewer
        .classList
        .remove(
            "controls-hidden"
        );


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            () => {

                fullscreenViewer
                    .classList
                    .add(
                        "controls-hidden"
                    );

            },
            3000
        );
}


/* =========================================================
   VIDEO CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function() {

        videoArea
            .classList
            .add(
                "controls-visible"
            );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                () => {

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels() {

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        return channels;
    }


    return channels.filter(
        channel => {

            return (

                channel.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.group
                    .toLowerCase()
                    .includes(
                        keyword
                    )

                ||

                channel.id
                    .toLowerCase()
                    .includes(
                        keyword
                    )

            );

        }
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(value) {

    return escapeHtml(value);

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (

            e.key === "Escape"

            &&

            fullscreenViewer
                .classList
                .contains("active")

        ) {

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (

            fullscreenViewer
                .classList
                .contains("active")

        ) {

            fullscreenViewer.style.width =
                window.innerWidth + "px";

            fullscreenViewer.style.height =
                window.innerHeight + "px";

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>

</body>
</html>
