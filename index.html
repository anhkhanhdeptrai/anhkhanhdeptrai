<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#07070b">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07070b;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================
   BODY
========================= */

body{
    overflow-x:hidden;
}

body.no-scroll{
    overflow:hidden;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    background:
        linear-gradient(
            180deg,
            rgba(11,11,18,.98),
            rgba(8,8,13,.96)
        );

    border-bottom:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.header-inner{
    width:min(1400px,100%);
    margin:auto;

    padding:12px 16px;

    display:flex;
    align-items:center;
    gap:18px;
}

/* =========================
   LOGO
========================= */

.brand{
    position:relative;

    min-width:max-content;

    font-size:25px;
    font-weight:900;
    letter-spacing:-1.3px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #8b7cff,
            #00e5ff,
            #ff4fd8,
            #ffffff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:logoColor 7s linear infinite;
}

@keyframes logoColor{

    0%{
        background-position:0% center;
    }

    50%{
        background-position:100% center;
    }

    100%{
        background-position:0% center;
    }

}

.brand::after{

    content:"";

    position:absolute;

    left:0;
    bottom:-4px;

    width:42%;

    height:3px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #7c5cff,
            #00e5ff,
            #ff4fd8
        );

    box-shadow:
        0 0 12px rgba(124,92,255,.7);
}

/* =========================
   SEARCH
========================= */

.search-wrap{
    position:relative;
    flex:1;

    max-width:650px;
    margin-left:auto;
}

.search-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    width:17px;
    height:17px;

    border:2px solid #777;
    border-radius:50%;

    pointer-events:none;
}

.search-icon::after{

    content:"";

    position:absolute;

    width:7px;
    height:2px;

    background:#777;

    right:-5px;
    bottom:-3px;

    transform:rotate(45deg);

    border-radius:3px;
}

.search{

    width:100%;

    padding:
        13px
        16px
        13px
        45px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.09);

    outline:none;

    color:#fff;

    font-size:15px;

    background:
        rgba(255,255,255,.055);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03);

    transition:.25s;
}

.search::placeholder{
    color:#777;
}

.search:focus{

    border-color:
        rgba(125,100,255,.7);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 0 0 3px rgba(124,92,255,.10),
        0 0 25px rgba(124,92,255,.10);
}

/* =========================
   MAIN
========================= */

.container{

    width:min(1400px,100%);

    margin:auto;

    padding:16px;
}

/* =========================
   PLAYER AREA
========================= */

.player-area{

    position:sticky;

    top:70px;

    z-index:900;

    margin-bottom:16px;
}

/* =========================
   PLAYER
========================= */

.player-box{

    position:relative;

    width:100%;

    background:#000;

    border-radius:18px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);

    isolation:isolate;
}

/* =========================
   VIDEO
========================= */

video{

    display:block;

    width:100%;

    aspect-ratio:16 / 9;

    background:#000;

    object-fit:contain;

    outline:none;

    /*
       KHÔNG dùng controls.
       Chỉ dùng nút riêng bên dưới.
    */

}

/* =========================
   PLAYER EMPTY
========================= */

.player-empty{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:8px;

    color:#777;

    pointer-events:none;
}

.player-empty-title{

    font-size:17px;
    font-weight:700;
    color:#aaa;
}

.player-empty-text{

    font-size:13px;
    color:#666;
}

/* =========================
   PLAYER TOP GRADIENT
========================= */

.player-gradient{

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:90px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.7),
            transparent
        );

    pointer-events:none;

    opacity:0;

    transition:.3s;
}

.player-box.controls-visible .player-gradient{
    opacity:1;
}

/* =========================
   CUSTOM CONTROLS
========================= */

.custom-controls{

    position:absolute;

    top:12px;
    right:12px;

    display:flex;

    gap:8px;

    opacity:0;

    transform:translateY(-5px);

    transition:
        opacity .25s,
        transform .25s;

    z-index:20;
}

.player-box.controls-visible .custom-controls{

    opacity:1;

    transform:translateY(0);

}

/* =========================
   CONTROL BUTTON
========================= */

.control-btn{

    width:42px;
    height:42px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.15);

    background:
        rgba(12,12,18,.72);

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:22px;

    cursor:pointer;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);

    transition:.2s;
}

.control-btn:hover{

    background:
        rgba(80,70,130,.85);

    transform:scale(1.05);
}

.control-btn:active{

    transform:scale(.93);

}

/* =========================
   FULLSCREEN PLAYER
========================= */

.player-box.is-fullscreen{

    position:fixed !important;

    inset:0 !important;

    z-index:999999 !important;

    width:100vw !important;
    height:100vh !important;

    max-width:none !important;

    margin:0 !important;

    border-radius:0 !important;

    background:#000 !important;
}

.player-box.is-fullscreen video{

    width:100vw;
    height:100vh;

    aspect-ratio:auto;

    object-fit:contain;

}

/* =========================
   NOW PLAYING
========================= */

.now-playing{

    margin-top:10px;

    padding:12px 15px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.07);

    background:
        linear-gradient(
            135deg,
            rgba(124,92,255,.10),
            rgba(0,229,255,.04)
        );

    display:flex;

    align-items:center;

    gap:10px;

    min-height:48px;
}

.live-dot{

    width:9px;
    height:9px;

    flex:none;

    border-radius:50%;

    background:#ff315d;

    box-shadow:
        0 0 0 4px rgba(255,49,93,.12),
        0 0 14px rgba(255,49,93,.8);

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.45;
        transform:scale(.8);
    }

}

.now-text{
    overflow:hidden;
}

.now-label{

    font-size:11px;

    color:#888;

    text-transform:uppercase;

    letter-spacing:.8px;

}

.now-name{

    margin-top:2px;

    font-size:15px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* =========================
   STATUS
========================= */

.status{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin:18px 2px 12px;

    color:#888;

    font-size:13px;
}

.channel-count{
    color:#777;
}

/* =========================
   CHANNEL GRID
========================= */

.channels{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );

    gap:12px;

    padding-bottom:30px;
}

/* =========================
   CHANNEL
========================= */

.channel{

    position:relative;

    background:
        linear-gradient(
            145deg,
            #14141c,
            #101016
        );

    border:1px solid rgba(255,255,255,.07);

    border-radius:15px;

    padding:10px;

    cursor:pointer;

    overflow:hidden;

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s,
        background .2s;
}

.channel:hover{

    transform:translateY(-3px);

    border-color:
        rgba(124,92,255,.55);

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);
}

.channel:active{

    transform:scale(.98);

}

.channel.active{

    border-color:
        rgba(124,92,255,.9);

    box-shadow:
        0 0 0 1px rgba(124,92,255,.25),
        0 10px 35px rgba(124,92,255,.13);
}

/* active bar */

.channel.active::before{

    content:"";

    position:absolute;

    top:0;
    left:15px;
    right:15px;

    height:2px;

    background:
        linear-gradient(
            90deg,
            #7c5cff,
            #00e5ff,
            #ff4fd8
        );

    border-radius:0 0 10px 10px;
}

/* =========================
   CHANNEL LOGO
========================= */

.channel-logo{

    width:100%;

    height:82px;

    object-fit:contain;

    background:#09090d;

    border-radius:10px;

    display:block;

    margin-bottom:9px;
}

.channel-name{

    font-size:14px;

    font-weight:750;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    color:#eee;
}

.channel-sub{

    margin-top:4px;

    color:#666;

    font-size:11px;

}

/* =========================
   EMPTY / LOADING
========================= */

.empty,
.loading{

    grid-column:1/-1;

    text-align:center;

    padding:50px 20px;

    color:#666;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header-inner{

        padding:10px 12px;

        gap:10px;

        flex-wrap:wrap;
    }

    .brand{

        font-size:22px;

        width:auto;
    }

    .search-wrap{

        order:3;

        width:100%;

        max-width:none;
    }

    .container{

        padding:10px;
    }

    .player-area{

        top:92px;

        margin-left:-10px;
        margin-right:-10px;

        margin-bottom:12px;
    }

    .player-box{

        border-radius:0;

        border-left:0;
        border-right:0;
    }

    video{

        aspect-ratio:16/9;

    }

    .now-playing{

        margin:8px 0 0;

        border-radius:12px;
    }

    .channels{

        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap:8px;
    }

    .channel{

        padding:8px;

        border-radius:12px;
    }

    .channel-logo{

        height:65px;

        border-radius:8px;
    }

    .channel-name{

        font-size:13px;
    }

}

/* =========================
   LANDSCAPE PHONE
========================= */

@media(max-height:600px) and (orientation:landscape){

    .player-area{

        position:fixed;

        inset:0;

        top:0;

        z-index:99999;

        background:#000;

        margin:0;

    }

    .player-box{

        width:100vw;
        height:100vh;

        border:0;

        border-radius:0;

    }

    .player-box video{

        width:100vw;
        height:100vh;

        aspect-ratio:auto;

        object-fit:contain;

    }

    .now-playing{

        display:none;
    }

}

/* =========================
   SAFE AREA
========================= */

@supports(padding:max(0px)){

    .header-inner{

        padding-left:
            max(12px,env(safe-area-inset-left));

        padding-right:
            max(12px,env(safe-area-inset-right));
    }

}

/* =========================
   HIDE SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:7px;
}

::-webkit-scrollbar-track{
    background:#08080c;
}

::-webkit-scrollbar-thumb{

    background:#292932;

    border-radius:10px;
}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="brand">
            KHANH TV
        </div>

        <div class="search-wrap">

            <span class="search-icon"></span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>


<main class="container">


    <!-- =========================
         PLAYER
    ========================== -->

    <div class="player-area">

        <div
            id="playerBox"
            class="player-box"
        >

            <div class="player-gradient"></div>

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="none"
                disablepictureinpicture
            ></video>


            <div
                id="playerEmpty"
                class="player-empty"
            >

                <div class="player-empty-title">
                    KHANH TV
                </div>

                <div class="player-empty-text">
                    Chọn một kênh để bắt đầu xem
                </div>

            </div>


            <!-- CHỈ 2 NÚT RIÊNG -->

            <div
                id="customControls"
                class="custom-controls"
            >

                <button
                    id="fullscreenBtn"
                    class="control-btn"
                    type="button"
                    aria-label="Toàn màn hình"
                >
                    ⛶
                </button>

                <button
                    id="closeBtn"
                    class="control-btn"
                    type="button"
                    aria-label="Thoát toàn màn hình"
                >
                    ×
                </button>

            </div>

        </div>


        <div class="now-playing">

            <span class="live-dot"></span>

            <div class="now-text">

                <div class="now-label">
                    ĐANG PHÁT
                </div>

                <div
                    id="nowPlaying"
                    class="now-name"
                >
                    Chưa chọn kênh
                </div>

            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div class="status">

        <span id="status">
            Đang tải danh sách...
        </span>

        <span
            id="channelCount"
            class="channel-count"
        ></span>

    </div>


    <!-- CHANNELS -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>


<script>

/* =========================================================
   KHANH TV
   IPTV PLAYER
========================================================= */


/* =========================
   PLAYLIST
========================= */

const PLAYLIST =
    "https://iptv-org.github.io/iptv/languages/vie.m3u";


/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const playerBox =
    document.getElementById("playerBox");

const playerEmpty =
    document.getElementById("playerEmpty");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const channelCount =
    document.getElementById("channelCount");

const nowPlaying =
    document.getElementById("nowPlaying");

const searchInput =
    document.getElementById("search");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeBtn =
    document.getElementById("closeBtn");


/* =========================
   VARIABLES
========================= */

let channels = [];

let hls = null;

let currentChannel = null;

let wakeLock = null;

let controlsTimer = null;


/* =========================================================
   WAKE LOCK
   GIỮ MÀN HÌNH KHÔNG TẮT
========================================================= */

async function requestWakeLock(){

    try{

        if(
            !("wakeLock" in navigator)
        ){

            console.log(
                "Thiết bị/trình duyệt không hỗ trợ Wake Lock"
            );

            return;

        }

        if(
            document.visibilityState !== "visible"
        ){

            return;

        }

        if(wakeLock){

            if(!wakeLock.released){

                return;

            }

        }

        wakeLock =
            await navigator.wakeLock.request("screen");

        console.log(
            "Wake Lock: ON"
        );


        wakeLock.addEventListener(
            "release",
            () => {

                console.log(
                    "Wake Lock đã bị release"
                );

                wakeLock = null;

            }
        );

    }
    catch(error){

        console.log(
            "Wake Lock error:",
            error
        );

    }

}


/* =========================
   RELEASE WAKE LOCK
========================= */

async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock = null;

        }

    }
    catch(error){

        console.log(error);

    }

}


/* =========================================================
   QUAN TRỌNG:
   KHI QUAY LẠI APP / QUAY MÀN HÌNH / FULLSCREEN
   GỌI LẠI WAKE LOCK
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if(
            document.visibilityState === "visible"
            &&
            currentChannel
            &&
            !video.paused
        ){

            setTimeout(
                () => {

                    requestWakeLock();

                },
                300
            );

        }

    }
);


/* =========================
   FULLSCREEN CHANGE
========================= */

document.addEventListener(
    "fullscreenchange",
    () => {

        updateFullscreenUI();

        setTimeout(
            () => {

                if(
                    currentChannel
                ){

                    requestWakeLock();

                }

            },
            300
        );

    }
);


/* =========================
   WEBKIT FULLSCREEN
========================= */

document.addEventListener(
    "webkitfullscreenchange",
    () => {

        updateFullscreenUI();

        setTimeout(
            () => {

                requestWakeLock();

            },
            300
        );

    }
);


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist(){

    try{

        statusText.innerText =
            "Đang tải danh sách kênh...";


        const response =
            await fetch(PLAYLIST);


        if(!response.ok){

            throw new Error(
                "Không tải được playlist"
            );

        }


        const text =
            await response.text();


        channels =
            parseM3U(text);


        /*
         * ĐƯA VTV LÊN ĐẦU
         */

        channels.sort(
            (a,b) => {

                const av =
                    getVTVNumber(a.name);

                const bv =
                    getVTVNumber(b.name);


                if(av !== null && bv !== null){

                    return av - bv;

                }


                if(av !== null){

                    return -1;

                }


                if(bv !== null){

                    return 1;

                }


                return 0;

            }
        );


        statusText.innerText =
            "Danh sách kênh";


        channelCount.innerText =
            `${channels.length} kênh`;


        renderChannels(channels);

    }
    catch(error){

        console.error(error);

        statusText.innerText =
            "Không thể tải danh sách";

        channelsBox.innerHTML = `
            <div class="empty">
                Không tải được playlist IPTV
            </div>
        `;

    }

}


/* =========================================================
   LẤY SỐ VTV
========================================================= */

function getVTVNumber(name){

    const match =
        name.match(
            /^VTV(\d+)\b/i
        );


    if(!match){

        return null;

    }


    return parseInt(
        match[1],
        10
    );

}


/* =========================================================
   PARSE M3U
========================================================= */

function parseM3U(text){

    const lines =
        text.split(/\r?\n/);


    const result = [];

    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(
            line.startsWith("#EXTINF")
        ){

            const nameMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            const idMatch =
                line.match(
                    /tvg-id="([^"]*)"/
                );


            info = {

                name:
                    nameMatch
                    ?
                    nameMatch[1].trim()
                    :
                    "Kênh không tên",

                logo:
                    logoMatch
                    ?
                    logoMatch[1]
                    :
                    "",

                id:
                    idMatch
                    ?
                    idMatch[1]
                    :
                    ""

            };

        }
        else if(
            info
            &&
            line
            &&
            !line.startsWith("#")
        ){

            result.push({

                name:info.name,

                logo:info.logo,

                id:info.id,

                url:line

            });


            info = null;

        }

    }


    return result;

}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels(list){

    channelsBox.innerHTML = "";


    if(!list.length){

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh
            </div>
        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    list.forEach(
        channel => {

            const item =
                document.createElement("div");


            item.className =
                "channel";


            if(
                currentChannel
                &&
                currentChannel.url === channel.url
            ){

                item.classList.add(
                    "active"
                );

            }


            const logo =
                channel.logo
                ?
                `
                <img
                    class="channel-logo"
                    src="${escapeHtml(channel.logo)}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="this.style.display='none'"
                >
                `
                :
                `
                <div
                    class="channel-logo"
                ></div>
                `;


            item.innerHTML = `

                ${logo}

                <div class="channel-name">
                    ${escapeHtml(channel.name)}
                </div>

                <div class="channel-sub">
                    Truyền hình trực tiếp
                </div>

            `;


            item.addEventListener(
                "click",
                () => {

                    playChannel(channel);

                }
            );


            fragment.appendChild(item);

        }
    );


    channelsBox.appendChild(
        fragment
    );

}


/* =========================================================
   PLAY CHANNEL
========================================================= */

async function playChannel(channel){

    currentChannel =
        channel;


    playerEmpty.style.display =
        "none";


    nowPlaying.innerText =
        channel.name;


    /* =========================
       WAKE LOCK NGAY KHI CHỌN
    ========================= */

    await requestWakeLock();


    /* =========================
       DESTROY HLS CŨ
    ========================= */

    if(hls){

        hls.destroy();

        hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url;


    /* =========================
       HLS.JS
    ========================= */

    if(
        url.includes(".m3u8")
        &&
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:30,

                liveSyncDurationCount:3

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                try{

                    await video.play();

                }
                catch(error){

                    console.log(
                        "Autoplay:",
                        error
                    );

                }


                await requestWakeLock();

                showControlsTemporarily();

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.log(
                    "HLS ERROR:",
                    data
                );


                if(
                    data.fatal
                ){

                    switch(
                        data.type
                    ){

                        case Hls.ErrorTypes.NETWORK_ERROR:

                            console.log(
                                "Retry network..."
                            );

                            hls.startLoad();

                            break;


                        case Hls.ErrorTypes.MEDIA_ERROR:

                            hls.recoverMediaError();

                            break;


                        default:

                            hls.destroy();

                            break;

                    }

                }

            }
        );

    }

    /* =========================
       NATIVE HLS
    ========================= */

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            async function nativePlay(){

                video.removeEventListener(
                    "loadedmetadata",
                    nativePlay
                );


                try{

                    await video.play();

                }
                catch(error){

                    console.log(error);

                }


                await requestWakeLock();

            }
        );

    }

    /* =========================
       OTHER STREAM
    ========================= */

    else{

        video.src =
            url;


        try{

            await video.play();

        }
        catch(error){

            console.log(error);

        }


        await requestWakeLock();

    }


    renderChannels(
        filterChannels()
    );


    /*
     * KHÔNG scroll xuống danh sách
     */

    window.scrollTo({
        top:window.scrollY,
        behavior:"instant"
    });

}


/* =========================================================
   VIDEO PLAY
========================================================= */

video.addEventListener(
    "play",
    () => {

        requestWakeLock();

        showControlsTemporarily();

    }
);


/* =========================================================
   VIDEO PAUSE
========================================================= */

video.addEventListener(
    "pause",
    () => {

        /*
         * Nếu đang fullscreen
         * vẫn giữ sáng
         */

        if(
            playerBox.classList.contains(
                "is-fullscreen"
            )
        ){

            requestWakeLock();

        }

    }
);


/* =========================================================
   USER INTERACTION
========================================================= */

playerBox.addEventListener(
    "click",
    () => {

        showControlsTemporarily();

    }
);


/* =========================================================
   SHOW CONTROLS
========================================================= */

function showControlsTemporarily(){

    playerBox.classList.add(
        "controls-visible"
    );


    clearTimeout(
        controlsTimer
    );


    controlsTimer =
        setTimeout(
            () => {

                /*
                 * Chỉ ẩn khi đang xem
                 */

                if(
                    !video.paused
                ){

                    playerBox.classList.remove(
                        "controls-visible"
                    );

                }

            },
            3000
        );

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen(){

    /*
     * QUAN TRỌNG:
     * Xin Wake Lock trước khi fullscreen
     */

    await requestWakeLock();


    /*
     * Ưu tiên Fullscreen API
     */

    try{

        if(
            playerBox.requestFullscreen
        ){

            await playerBox.requestFullscreen();

        }

        else if(
            playerBox.webkitRequestFullscreen
        ){

            playerBox.webkitRequestFullscreen();

        }


        playerBox.classList.add(
            "is-fullscreen"
        );


        /*
         * Khóa xoay ngang nếu trình duyệt hỗ trợ.
         * Nếu không hỗ trợ thì không làm gì.
         */

        try{

            if(
                screen.orientation
                &&
                screen.orientation.lock
            ){

                await screen.orientation.lock(
                    "landscape"
                );

            }

        }
        catch(error){

            console.log(
                "Orientation lock không hỗ trợ:",
                error
            );

        }


        /*
         * Xin Wake Lock lại sau fullscreen
         */

        setTimeout(
            () => {

                requestWakeLock();

            },
            500
        );

    }
    catch(error){

        console.log(
            "Fullscreen error:",
            error
        );


        /*
         * Fallback fullscreen CSS
         */

        playerBox.classList.add(
            "is-fullscreen"
        );


        setTimeout(
            () => {

                requestWakeLock();

            },
            300
        );

    }


    showControlsTemporarily();

}


/* =========================================================
   EXIT FULLSCREEN
========================================================= */

async function exitFullscreen(){

    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }

        else if(
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

    }
    catch(error){

        console.log(error);

    }


    playerBox.classList.remove(
        "is-fullscreen"
    );


    try{

        if(
            screen.orientation
            &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }
    catch(error){

        console.log(error);

    }


    /*
     * Vẫn giữ sáng khi quay về bình thường
     */

    if(
        currentChannel
        &&
        !video.paused
    ){

        setTimeout(
            () => {

                requestWakeLock();

            },
            300
        );

    }


    showControlsTemporarily();

}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async (event) => {

        event.stopPropagation();

        await enterFullscreen();

    }
);


/* =========================================================
   CLOSE BUTTON
========================================================= */

closeBtn.addEventListener(
    "click",
    async (event) => {

        event.stopPropagation();

        await exitFullscreen();

    }
);


/* =========================================================
   UPDATE FULLSCREEN UI
========================================================= */

function updateFullscreenUI(){

    const fullscreen =
        !!(
            document.fullscreenElement
            ||
            document.webkitFullscreenElement
        );


    if(fullscreen){

        playerBox.classList.add(
            "is-fullscreen"
        );

    }
    else{

        playerBox.classList.remove(
            "is-fullscreen"
        );

    }


    /*
     * LUÔN xin Wake Lock lại
     */

    if(
        currentChannel
        &&
        !video.paused
    ){

        setTimeout(
            () => {

                requestWakeLock();

            },
            250
        );

    }

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    async event => {

        if(
            event.key === "Escape"
        ){

            if(
                playerBox.classList.contains(
                    "is-fullscreen"
                )
            ){

                await exitFullscreen();

            }

        }

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if(!keyword){

        return channels;

    }


    return channels.filter(
        channel =>
            channel.name
                .toLowerCase()
                .includes(keyword)
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();


        if(
            now - lastTouchEnd <= 300
        ){

            event.preventDefault();

        }


        lastTouchEnd =
            now;

    },
    {
        passive:false
    }
);


/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>
