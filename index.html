<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>KHANH TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#06070c;
    color:#fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{

    position:sticky;
    top:0;

    z-index:1000;

    width:100%;

    padding:
        10px
        14px;

    background:
        rgba(6,7,12,.88);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 8px 35px
        rgba(0,0,0,.22);
}

.header{

    width:100%;
    max-width:1450px;

    margin:auto;

    display:flex;
    align-items:center;

    gap:14px;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    display:flex;
    align-items:center;

    gap:10px;

    flex-shrink:0;
}

.logo{

    position:relative;

    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #653cff,
            #b83cff 45%,
            #ff397c
        );

    box-shadow:
        0 0 25px
        rgba(145,70,255,.35);

    overflow:hidden;
}

.logo::before{

    content:"";

    width:21px;
    height:15px;

    border:
        3px solid
        white;

    border-radius:5px;

    position:absolute;
}

.logo::after{

    content:"";

    width:10px;
    height:3px;

    background:white;

    border-radius:10px;

    position:absolute;

    bottom:7px;
}

.brand-text{

    font-size:20px;

    font-weight:950;

    letter-spacing:.7px;

    white-space:nowrap;

    background:
        linear-gradient(
            90deg,
            #fff,
            #b68aff,
            #ff65c8,
            #fff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        brandGradient
        5s linear infinite;
}

@keyframes brandGradient{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:250% center;
    }
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{

    position:relative;

    flex:1;

    min-width:0;
}

.search-icon{

    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    color:#8d91a4;

    font-size:18px;

    pointer-events:none;
}

.search{

    width:100%;

    height:44px;

    padding:
        0 16px 0 44px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:14px;

    outline:none;

    color:#fff;

    font-size:14px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);

    transition:.25s;
}

.search::placeholder{
    color:#737789;
}

.search:focus{

    border-color:
        rgba(151,91,255,.8);

    box-shadow:
        0 0 0 3px
        rgba(126,67,255,.11),

        0 0 25px
        rgba(126,67,255,.15);
}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:100%;

    max-width:1450px;

    margin:auto;

    padding:
        15px;
}


/* =========================================================
   PLAYER
   QUAN TRỌNG:
   PLAYER KHÔNG NẰM TRONG LIST SCROLL
========================================================= */

.player-box{

    position:relative;

    width:100%;

    background:#000;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:19px;

    overflow:hidden;

    box-shadow:
        0 18px 55px
        rgba(0,0,0,.4);

    margin-bottom:14px;

    isolation:isolate;
}


/* =========================================================
   VIDEO
========================================================= */

.video-area{

    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    background:#000;

    overflow:hidden;
}

video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;
}

video::-webkit-media-controls{
    display:none!important;
}

video::-webkit-media-controls-enclosure{
    display:none!important;
}


/* =========================================================
   VIDEO TOP
========================================================= */

.player-info{

    position:absolute;

    left:0;
    right:0;
    top:0;

    z-index:5;

    padding:14px;

    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );

    opacity:0;

    transition:.25s;
}

.video-area.controls-visible
.player-info{
    opacity:1;
}

.live-title{

    max-width:70%;

    font-size:14px;

    font-weight:850;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.live-badge{

    display:flex;

    align-items:center;

    gap:6px;

    padding:
        5px 9px;

    border-radius:20px;

    color:#ff718e;

    font-size:10px;

    font-weight:900;

    background:
        rgba(255,35,80,.16);

    border:
        1px solid
        rgba(255,60,100,.35);

    box-shadow:
        0 0 18px
        rgba(255,30,80,.08);
}

.live-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff315b;

    box-shadow:
        0 0 10px
        #ff315b;

    animation:
        livePulse 1.3s infinite;
}

@keyframes livePulse{

    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.45);
        opacity:.65;
    }
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn,
.close-fullscreen{

    position:absolute;

    width:42px;
    height:42px;

    border:0;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        rgba(15,15,22,.72);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    cursor:pointer;

    font-size:22px;

    transition:.2s;

    z-index:20;
}

.fullscreen-btn{

    right:12px;
    bottom:12px;

    opacity:0;

    pointer-events:none;
}

.video-area.controls-visible
.fullscreen-btn{

    opacity:1;

    pointer-events:auto;
}

.fullscreen-btn:hover,
.close-fullscreen:hover{

    background:
        linear-gradient(
            135deg,
            #7045ff,
            #c03cff
        );

    transform:scale(1.05);
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{

    position:relative;

    min-height:58px;

    padding:
        11px 15px;

    display:flex;
    align-items:center;

    gap:10px;

    background:
        linear-gradient(
            90deg,
            rgba(112,65,255,.14),
            rgba(255,48,150,.07)
        );

    border-top:
        1px solid
        rgba(255,255,255,.06);
}

.now-playing::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(130,85,255,.7),
            transparent
        );
}

.now-dot{

    width:8px;
    height:8px;

    flex:0 0 auto;

    border-radius:50%;

    background:#805cff;

    box-shadow:
        0 0 14px
        #805cff;

    animation:
        nowPulse 1.5s infinite;
}

@keyframes nowPulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.55;
        transform:scale(.75);
    }
}

.now-label{

    color:#8d91a5;

    font-size:11px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.5px;

    flex-shrink:0;
}

.now-text{

    min-width:0;

    font-size:14px;

    font-weight:850;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    display:flex;

    align-items:center;

    gap:8px;

    margin:
        6px 2px 13px;

    color:#969bad;

    font-size:12px;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#42e49d;

    box-shadow:
        0 0 11px
        rgba(66,228,157,.75);
}


/* =========================================================
   CHANNEL SECTION
========================================================= */

.channel-section-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:
        0 2px 11px;
}

.channel-heading{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:17px;

    font-weight:900;
}

.heading-icon{

    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #7045ff,
            #e43cff
        );

    box-shadow:
        0 0 16px
        rgba(125,70,255,.25);

    font-size:15px;
}

.channel-count{

    padding:
        5px 9px;

    border-radius:20px;

    color:#aaaec0;

    font-size:11px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.06);
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap:11px;

    /*
     * Không đặt overflow / height ở đây.
     * Vì vậy khi vuốt danh sách,
     * PLAYER phía trên không bị cuộn riêng.
     */
}


/* =========================================================
   CHANNEL CARD
========================================================= */

.channel{

    position:relative;

    min-width:0;

    padding:9px;

    cursor:pointer;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.075);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s,
        background .2s;
}

.channel:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(133,87,255,.6);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.3);
}

.channel:active{

    transform:
        scale(.98);
}


/* ACTIVE */

.channel.active{

    border-color:
        rgba(136,88,255,.95);

    background:
        linear-gradient(
            145deg,
            rgba(117,70,255,.22),
            rgba(255,54,160,.08)
        );

    box-shadow:
        0 0 0 1px
        rgba(126,75,255,.12),

        0 0 25px
        rgba(126,77,255,.2);
}

.channel.active::before{

    content:"";

    position:absolute;

    left:0;
    top:12px;
    bottom:12px;

    width:3px;

    border-radius:0 4px 4px 0;

    background:
        linear-gradient(
            #7045ff,
            #ff48b7
        );

    box-shadow:
        0 0 12px
        #814dff;
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo-wrap{

    position:relative;

    width:100%;

    height:78px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.06),
            rgba(5,6,10,.95)
        );

    overflow:hidden;

    margin-bottom:9px;
}

.channel-logo{

    width:86%;

    height:86%;

    object-fit:contain;

    display:block;

    transition:
        transform .25s;
}

.channel:hover
.channel-logo{

    transform:
        scale(1.04);
}


/* =========================================================
   ACTIVE BADGE
========================================================= */

.playing-badge{

    position:absolute;

    top:7px;
    right:7px;

    display:none;

    align-items:center;

    gap:4px;

    padding:
        4px 7px;

    border-radius:20px;

    background:
        rgba(113,67,255,.9);

    font-size:9px;

    font-weight:900;

    box-shadow:
        0 0 14px
        rgba(125,70,255,.35);
}

.channel.active
.playing-badge{

    display:flex;
}

.playing-badge span{

    width:5px;
    height:5px;

    border-radius:50%;

    background:#fff;

    animation:
        livePulse 1s infinite;
}


/* =========================================================
   CHANNEL TEXT
========================================================= */

.channel-name{

    font-size:13px;

    font-weight:850;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-quality{

    margin-top:4px;

    color:#777d91;

    font-size:10px;
}


/* =========================================================
   LOADING
========================================================= */

.loading,
.empty{

    grid-column:
        1 / -1;

    text-align:center;

    padding:
        50px 20px;

    color:#858a9d;
}

.loading::before{

    content:"";

    display:block;

    width:28px;
    height:28px;

    margin:
        0 auto 14px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.08);

    border-top-color:#895cff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   FULLSCREEN
========================================================= */

.fullscreen-viewer{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    background:#000;

    z-index:999999;

    display:none;

    overflow:hidden;

    touch-action:manipulation;
}

.fullscreen-viewer.active{

    display:block;
}

.fullscreen-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}

.fullscreen-video::-webkit-media-controls{
    display:none!important;
}

.fullscreen-video::-webkit-media-controls-enclosure{
    display:none!important;
}

.fullscreen-top{

    position:absolute;

    left:0;
    right:0;
    top:0;

    z-index:10;

    padding:15px;

    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent
        );

    opacity:1;

    transition:.3s;

    pointer-events:none;
}

.close-fullscreen{

    position:relative;

    top:auto;
    right:auto;

    pointer-events:auto;

    opacity:1;

    font-size:27px;
}

.fullscreen-viewer.controls-hidden
.fullscreen-top{

    opacity:0;
    pointer-events:none;
}

.fullscreen-viewer.controls-hidden
.close-fullscreen{

    pointer-events:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{

        padding:
            8px 9px;
    }

    .header{

        gap:8px;
    }

    .logo{

        width:37px;
        height:37px;

        border-radius:11px;
    }

    .brand-text{

        font-size:16px;

        letter-spacing:.3px;
    }

    .search{

        height:39px;

        border-radius:12px;

        padding-left:39px;

        font-size:12px;
    }

    .search-icon{

        left:13px;

        font-size:16px;
    }

    .container{

        padding:
            10px;
    }

    .player-box{

        border-radius:15px;

        margin-bottom:12px;
    }

    .video-area{

        aspect-ratio:16 / 9;
    }

    .now-playing{

        min-height:54px;

        padding:
            10px 12px;
    }

    .now-label{

        display:none;
    }

    .now-text{

        font-size:13px;
    }

    .channel-section-title{

        margin-bottom:9px;
    }

    .channel-heading{

        font-size:15px;
    }

    .heading-icon{

        width:27px;
        height:27px;

        border-radius:8px;
    }

    .channels{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }

    .channel{

        padding:7px;

        border-radius:13px;
    }

    .channel-logo-wrap{

        height:62px;

        border-radius:9px;

        margin-bottom:7px;
    }

    .channel-name{

        font-size:11.5px;
    }

    .channel-quality{

        font-size:9px;
    }

    .playing-badge{

        top:5px;
        right:5px;

        padding:
            3px 5px;

        font-size:8px;
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media(max-width:360px){

    .brand-text{
        display:none;
    }

    .header{
        gap:8px;
    }

    .channels{

        gap:6px;
    }

    .channel{

        padding:6px;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media(
    orientation:landscape
) and (max-height:600px){

    .fullscreen-top{

        padding:
            max(12px,env(safe-area-inset-top))
            max(12px,env(safe-area-inset-right))
            12px
            max(12px,env(safe-area-inset-left));
    }
}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(
    padding:env(safe-area-inset-top)
){

    .fullscreen-viewer{

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header">

        <div class="brand">

            <div class="logo"></div>

            <div class="brand-text">
                KHANH TV
            </div>

        </div>

        <div class="search-wrap">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                class="search"
                type="text"
                autocomplete="off"
                placeholder="Tìm kiếm kênh..."
            >

        </div>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


    <!-- ===================================================
         PLAYER
    =================================================== -->

    <div class="player-box">

        <div
            id="videoArea"
            class="video-area"
        >

            <video
                id="video"
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>


            <div class="player-info">

                <div
                    id="playerTitle"
                    class="live-title"
                >
                    KHANH TV
                </div>

                <div class="live-badge">

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>


            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                aria-label="Toàn màn hình"
            >
                ⛶
            </button>

        </div>


        <div class="now-playing">

            <span class="now-dot"></span>

            <span class="now-label">
                ĐANG XEM
            </span>

            <span
                id="nowPlaying"
                class="now-text"
            >
                Chưa chọn kênh
            </span>

        </div>

    </div>



    <!-- ===================================================
         STATUS
    =================================================== -->

    <div
        id="status"
        class="status"
    >

        <span class="status-dot"></span>

        <span>
            Sẵn sàng
        </span>

    </div>



    <!-- ===================================================
         CHANNEL TITLE
    =================================================== -->

    <div class="channel-section-title">

        <div class="channel-heading">

            <div class="heading-icon">
                📺
            </div>

            <span>
                Danh sách kênh
            </span>

        </div>

        <div
            id="channelCount"
            class="channel-count"
        >
            0 kênh
        </div>

    </div>



    <!-- ===================================================
         CHANNELS
    =================================================== -->

    <div
        id="channels"
        class="channels"
    >

        <div class="loading">
            Đang tải kênh...
        </div>

    </div>

</main>



<!-- =======================================================
     FULLSCREEN VIEWER
======================================================= -->

<div
    id="fullscreenViewer"
    class="fullscreen-viewer"
>

    <video
        id="fullscreenVideo"
        class="fullscreen-video"
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <div class="fullscreen-top">

        <div
            id="fullscreenTitle"
            class="live-title"
        >
            KHANH TV
        </div>


        <button
            id="closeFullscreen"
            class="close-fullscreen"
            type="button"
            aria-label="Đóng"
        >
            ×
        </button>

    </div>

</div>



<script>

/* =========================================================
   KHANH TV
   CHỈ DÙNG CÁC STREAM NGƯỜI DÙNG CUNG CẤP
========================================================= */


/* =========================================================
   CHANNEL DATA
========================================================= */

const channels = [

    {

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const fullscreenVideo =
    document.getElementById("fullscreenVideo");

const videoArea =
    document.getElementById("videoArea");

const fullscreenViewer =
    document.getElementById("fullscreenViewer");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const closeFullscreen =
    document.getElementById("closeFullscreen");

const channelsBox =
    document.getElementById("channels");

const statusText =
    document.getElementById("status");

const nowPlaying =
    document.getElementById("nowPlaying");

const playerTitle =
    document.getElementById("playerTitle");

const fullscreenTitle =
    document.getElementById("fullscreenTitle");

const searchInput =
    document.getElementById("search");

const channelCount =
    document.getElementById("channelCount");


/* =========================================================
   VARIABLES
========================================================= */

let currentChannel = null;

let hls = null;

let fullscreenHls = null;

let wakeLock = null;

let controlsTimer = null;

let fullscreenControlsTimer = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    statusText.innerHTML = `

        <span class="status-dot"></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;
}


/* =========================================================
   RENDER
========================================================= */

function renderChannels(list){

    channelsBox.innerHTML = "";

    channelCount.textContent =
        list.length + " kênh";


    if(!list.length){

        channelsBox.innerHTML = `
            <div class="empty">
                Không tìm thấy kênh.
            </div>
        `;

        return;
    }


    list.forEach(channel => {

        const item =
            document.createElement("div");

        item.className =
            "channel";


        if(
            currentChannel &&
            currentChannel.url === channel.url
        ){

            item.classList.add("active");
        }


        item.innerHTML = `

            <div class="channel-logo-wrap">

                <img
                    class="channel-logo"
                    src="${escapeAttribute(channel.logo)}"
                    loading="lazy"
                    alt=""
                    onerror="
                        this.style.display='none';
                    "
                >

                <div class="playing-badge">

                    <span></span>

                    ĐANG XEM

                </div>

            </div>


            <div class="channel-name">

                ${escapeHtml(channel.name)}

            </div>


            <div class="channel-quality">

                ${escapeHtml(channel.group)}
                •
                ${escapeHtml(channel.quality)}

            </div>

        `;


        item.addEventListener(
            "click",
            () => playChannel(channel)
        );


        channelsBox.appendChild(item);

    });

}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel){

    currentChannel =
        channel;


    nowPlaying.textContent =
        channel.name;


    playerTitle.textContent =
        channel.name;


    fullscreenTitle.textContent =
        channel.name;


    destroyNormalHls();


    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url;


    setStatus(
        "Đang phát " +
        channel.name
    );


    if(
        isHLS(url) &&
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20,

                maxMaxBufferLength:30,

                startLevel:-1

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video
                    .play()
                    .catch(()=>{});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (event,data) => {

                console.log(
                    "HLS ERROR",
                    data
                );

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;

        video
            .play()
            .catch(()=>{});

    }

    else{

        video.src =
            url;

        video
            .play()
            .catch(()=>{});

    }


    /*
     * CHỈ RENDER LẠI GRID.
     * PLAYER KHÔNG BỊ DI CHUYỂN.
     */

    renderChannels(
        filterChannels()
    );

}


/* =========================================================
   HLS CHECK
========================================================= */

function isHLS(url){

    return (
        url.includes(".m3u8") ||
        url.includes("m3u8?")
    );

}


/* =========================================================
   DESTROY NORMAL HLS
========================================================= */

function destroyNormalHls(){

    if(hls){

        try{
            hls.destroy();
        }
        catch(e){}

        hls = null;
    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function(e){

        e.preventDefault();

        e.stopPropagation();

        if(!currentChannel)
            return;

        await openFullscreen();

    }
);


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

async function openFullscreen(){

    if(!currentChannel)
        return;


    video.pause();


    destroyFullscreenHls();


    fullscreenViewer
        .classList
        .add("active");


    fullscreenViewer
        .classList
        .remove("controls-hidden");


    fullscreenTitle.textContent =
        currentChannel.name;


    const url =
        currentChannel.url;


    if(
        isHLS(url) &&
        Hls.isSupported()
    ){

        fullscreenHls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                backBufferLength:30,

                maxBufferLength:20

            });


        fullscreenHls
            .loadSource(url);


        fullscreenHls
            .attachMedia(
                fullscreenVideo
            );


        fullscreenHls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                fullscreenVideo
                    .play()
                    .catch(()=>{});

            }
        );

    }

    else{

        fullscreenVideo.src =
            url;

        fullscreenVideo.load();

        fullscreenVideo
            .play()
            .catch(()=>{});

    }


    await requestWakeLock();


    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch(e){}


    showFullscreenControls();

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

closeFullscreen.addEventListener(
    "click",
    async function(e){

        e.preventDefault();

        e.stopPropagation();

        await closeFullscreenViewer();

    }
);


async function closeFullscreenViewer(){

    fullscreenViewer
        .classList
        .remove("active");


    fullscreenViewer
        .classList
        .remove("controls-hidden");


    fullscreenVideo.pause();


    destroyFullscreenHls();


    fullscreenVideo.removeAttribute(
        "src"
    );


    fullscreenVideo.load();


    releaseWakeLock();


    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }
    catch(e){}


    if(currentChannel){

        video
            .play()
            .catch(()=>{});

    }

}


/* =========================================================
   FULLSCREEN HLS
========================================================= */

function destroyFullscreenHls(){

    if(fullscreenHls){

        try{
            fullscreenHls.destroy();
        }
        catch(e){}

        fullscreenHls = null;
    }

}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock(){

    try{

        if("wakeLock" in navigator){

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

        }

    }
    catch(error){

        console.log(
            "WakeLock:",
            error
        );

    }

}


function releaseWakeLock(){

    if(wakeLock){

        try{
            wakeLock.release();
        }
        catch(e){}

        wakeLock = null;

    }

}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function(){

        if(
            document.visibilityState ===
            "visible" &&

            fullscreenViewer
                .classList
                .contains("active")
        ){

            await requestWakeLock();

        }

    }
);


/* =========================================================
   FULLSCREEN CONTROLS
========================================================= */

fullscreenViewer.addEventListener(
    "click",
    function(){

        showFullscreenControls();

    }
);


function showFullscreenControls(){

    fullscreenViewer
        .classList
        .remove("controls-hidden");


    clearTimeout(
        fullscreenControlsTimer
    );


    fullscreenControlsTimer =
        setTimeout(
            function(){

                fullscreenViewer
                    .classList
                    .add(
                        "controls-hidden"
                    );

            },
            3000
        );

}


/* =========================================================
   NORMAL PLAYER CONTROLS
========================================================= */

videoArea.addEventListener(
    "click",
    function(){

        videoArea
            .classList
            .add(
                "controls-visible"
            );


        clearTimeout(
            controlsTimer
        );


        controlsTimer =
            setTimeout(
                function(){

                    videoArea
                        .classList
                        .remove(
                            "controls-visible"
                        );

                },
                3000
            );

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function(){

        renderChannels(
            filterChannels()
        );

    }
);


function filterChannels(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if(!keyword){

        return channels;

    }


    return channels.filter(
        channel => {

            return (

                channel.name
                    .toLowerCase()
                    .includes(keyword)

                ||

                channel.group
                    .toLowerCase()
                    .includes(keyword)

                ||

                channel.id
                    .toLowerCase()
                    .includes(keyword)

            );

        }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHtml(value);

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Escape" &&
            fullscreenViewer
                .classList
                .contains("active")
        ){

            closeFullscreenViewer();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        if(
            fullscreenViewer
                .classList
                .contains("active")
        ){

            fullscreenViewer.style.width =
                window.innerWidth + "px";

            fullscreenViewer.style.height =
                window.innerHeight + "px";

        }

    }
);


/* =========================================================
   START
========================================================= */

setStatus(
    "Đã sẵn sàng • " +
    channels.length +
    " kênh"
);

renderChannels(channels);

   AUTO PLAY KÊNH ĐẦU TIÊN

========================================================= */
